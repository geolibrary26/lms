<!DOCTYPE html>

<title>Trợ giảng kiểm tra miệng Địa lí</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1d2733;--mu:#667;--pr:#1f6feb;--bd:#dde3ea;--ok:#1a7f37;--w:#b26a00;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e6ebf1;--mu:#9aa6b2;--bd:#2c3642;--pr:#5aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Segoe UI",sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 14px}h2{font-size:18px;margin:0 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
input{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;width:100%}
label{font-size:14px;color:var(--mu);display:block;margin:8px 0 4px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:inherit;cursor:pointer;font-weight:600}button.s{background:var(--bd);color:var(--tx)}
.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}.r button{background:var(--bd);color:var(--tx)}.r button.on{background:var(--pr);color:#fff}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--bd);margin-right:6px}
.q{font-size:20px;font-weight:700}.t{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}.a{white-space:pre-line;border-left:4px solid var(--pr);padding-left:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.mu{color:var(--mu);font-size:14px}

<script>
const CATS={TN:"Tự nhiên Việt Nam",DC:"Dân cư",KT:"Kinh tế ngành N-L-TS & CN"};
const Q=[
["TN","Trình bày đặc điểm vị trí địa lí Việt Nam.","- Trung tâm Đông Nam Á, phía đông bán đảo Đông Dương, biển Đông thông ra TBD.\n- Nội chí tuyến Bắc bán cầu; khu vực gió mùa châu Á điển hình.\n- Cầu nối ĐNÁ lục địa và hải đảo; gần ngã tư hàng hải - hàng không quốc tế.\n- Trên đường di lưu, di cư của sinh vật; nơi giao thoa 2 vành đai sinh khoáng TBD và Địa Trung Hải.\n- Nhiều thiên tai, chịu tác động mạnh của biến đổi khí hậu."],
["TN","Phân tích ảnh hưởng của vị trí địa lí và phạm vi lãnh thổ đến khí hậu nước ta.","- Nội chí tuyến, gió tín phong + gió mùa → nhiệt đới ẩm gió mùa (>20°C, ẩm >80%, mưa 1500-2000mm); không hoang mạc hóa như Bắc Phi, Tây Nam Á cùng vĩ độ.\n- Biển Đông: tăng ẩm, biến tính khối khí, dịu mát mùa hạ, bớt hanh khô mùa đông.\n- Lãnh thổ dài, hẹp ngang + địa hình + khối khí → phân hóa Bắc-Nam, Tây-Đông, theo mùa.\n- Gây bão, áp thấp nhiệt đới, hạn hán, xâm nhập mặn."],
["TN","Nêu các đặc điểm chung của địa hình Việt Nam.","- Đồi núi chiếm 3/4 diện tích, chủ yếu đồi núi thấp (<1000m: 85%); đồng bằng 1/4.\n- Được tân kiến tạo nâng thành nhiều bậc kế tiếp; hướng nghiêng TB-ĐN; hướng núi TB-ĐN và vòng cung.\n- Chịu tác động mạnh của thiên nhiên nhiệt đới ẩm gió mùa: phong hóa, xâm thực, xói mòn, cacxtơ, bồi tụ đồng bằng.\n- Chịu tác động mạnh của con người (tích cực và tiêu cực: phá rừng → sạt lở, lũ quét)."],
["TN","So sánh địa hình vùng núi Tây Bắc và Đông Bắc.","- Tây Bắc: giữa sông Hồng - sông Cả; núi cao, đồ sộ nhất (>1500m; Phan-xi-păng 3147m); hướng TB-ĐN, 3 mạch song song; cắt xẻ mạnh, đỉnh nhọn, sườn dốc, thung lũng sâu hẹp; cánh đồng giữa núi.\n- Đông Bắc: từ dãy Con Voi đến Quảng Ninh; núi thấp <1000m; hướng vòng cung (4 cánh cung: Sông Gâm, Ngân Sơn, Bắc Sơn, Đông Triều) chụm ở Tam Đảo; đỉnh tròn, sườn thoải, thung lũng rộng; có đồi bát úp, cacxtơ."],
["TN","Trình bày tính chất nhiệt đới ẩm gió mùa của khí hậu Việt Nam và nguyên nhân.","- Nhiệt đới: nhiệt độ TB >20°C, nắng 1400-3000 giờ/năm, cán cân bức xạ dương (do nội chí tuyến, 2 lần Mặt Trời lên thiên đỉnh).\n- Ẩm: mưa 1500-2000mm, độ ẩm >80% (biển Đông, gió mùa, bão, ATNĐ).\n- Gió mùa: mùa đông (ĐB, tháng 11-4, từ cao áp Xibia, lạnh), mùa hạ (TN, tháng 5-10, nóng ẩm, mưa nhiều; phơn Tây Nam)."],
["TN","Chứng minh khí hậu nước ta phân hóa đa dạng.","- Bắc-Nam: ranh giới dãy Bạch Mã (16°B). Miền Bắc nhiệt đới ẩm gió mùa có mùa đông lạnh; miền Nam cận xích đạo gió mùa, mùa mưa-khô; ven biển Trung Bộ mưa thu-đông.\n- Tây-Đông: biển - đồng bằng - miền núi phía Tây.\n- Độ cao: 3 đai (nhiệt đới <600-700m/900-1000m; cận nhiệt đến 2600m; ôn đới >2600m).\n- Theo mùa. Thất thường do gió mùa, địa hình, bão, El Nino, La Nina."],
["TN","Đặc điểm chung của mạng lưới sông ngòi nước ta và giải thích.","- Dày đặc, rộng khắp (2360 sông >10km), chủ yếu nhỏ, ngắn, dốc.\n- Hướng TB-ĐN và vòng cung.\n- 2 mùa: lũ 70-80%, cạn 20-30% lưu lượng.\n- Nhiều nước, giàu phù sa (800 tỉ m³, 200 triệu tấn/năm).\n- Giải thích: ¾ đồi núi, mưa nhiều theo mùa, lãnh thổ hẹp ngang, núi ăn sát biển."],
["TN","Phân tích chế độ nước của sông Hồng, Thu Bồn và Mê Công (Cửu Long).","- Sông Hồng: lũ T6-10 (đỉnh T8, 75-80%); cạn T11-5; mạng nan quạt hội tụ Việt Trì → lũ nhanh, thất thường.\n- Thu Bồn: lũ lệch thu-đông T9-12 (đỉnh T11, 65%), cạn 8 tháng; sông ngắn, dốc → lũ lên nhanh, đột ngột.\n- Mê Công: lũ T7-11 (đỉnh T9, 80%), cạn T12-6; hình lông chim, độ dốc nhỏ, có Biển Hồ điều tiết → lũ lên nhanh, rút chậm, điều hòa."],
["TN","Đặc điểm và giá trị sử dụng của đất feralit.","- ~65% diện tích, trung du miền núi, dưới 1600-1700m; màu đỏ vàng (oxit sắt, nhôm); chua, nghèo base và mùn.\n- 3 nhóm: trên đá vôi (Bắc, Bắc Trung Bộ, màu mỡ), trên bazan (Tây Nguyên, ĐNB, phì cao), đá khác.\n- Giá trị: rừng sản xuất (thông, keo...), cây CN lâu năm (chè, cà phê, cao su, hồ tiêu), cây ăn quả, dược liệu; không hợp trồng lúa."],
["TN","Trình bày và giải thích đặc điểm chung của tài nguyên khoáng sản nước ta.","- Phong phú, đa dạng (>5000 mỏ, ~60 loại; 3 nhóm: năng lượng, kim loại, phi kim loại).\n- Phần lớn mỏ vừa và nhỏ; trữ lượng lớn: than, dầu khí, bô-xít...\n- Phân bố rộng khắp, tập trung Đông Bắc, Bắc Trung Bộ, Tây Nguyên, thềm lục địa.\n- Giải thích: giao thoa 2 vành đai sinh khoáng; lịch sử địa chất lâu dài, phức tạp (nội sinh, ngoại sinh)."],
["TN","Vì sao bảo tồn đa dạng sinh học ở Việt Nam là cấp thiết? Nêu biện pháp.","- Suy giảm số lượng loài, hệ sinh thái (70% rừng tự nhiên là rừng nghèo/mới phục hồi), nguồn gen.\n- Nguyên nhân: biến đổi khí hậu; khai thác quá mức, phá rừng, ô nhiễm, loài ngoại lai.\n- Biện pháp: khu bảo tồn, vườn quốc gia; trồng và bảo vệ rừng; chống săn bắt, đánh bắt quá mức; xử lí chất thải; nâng cao ý thức."],
["TN","Trình bày các bộ phận vùng biển Việt Nam.","Đường cơ sở → nội thủy (phía trong, là lãnh thổ) → lãnh hải (12 hải lí) → tiếp giáp lãnh hải (12 hải lí) → đặc quyền kinh tế (cùng lãnh hải rộng 200 hải lí) → thềm lục địa (đáy biển, lòng đất, đến mép rìa lục địa, tối đa 350 hải lí). Diện tích biển ~1 triệu km²; tiếp giáp biển Đông với 8 nước."],
["DC","Trình bày sự phân bố các dân tộc ở Việt Nam.","- 54 dân tộc, cùng sinh sống rộng khắp.\n- Kinh >85%, đồng bằng, ven biển, trung du.\n- Dân tộc thiểu số >15%: trung du miền núi phía Bắc (Thái, Tày, Nùng, Mông), Tây Nguyên (Ê-đê, Gia-rai, Ba-na), ven biển Nam Bộ và ĐBSCL (Khmer, Chăm, Hoa).\n- Phân bố thay đổi theo thời gian, không gian, xu hướng đan xen.\n- Người Việt ở nước ngoài >5 triệu, là bộ phận không tách rời."],
["DC","Trình bày quy mô dân số và gia tăng dân số nước ta.","- Quy mô: 2021 ≈ 98,5 triệu; 2024 ≈ 100,3 triệu (101,1 triệu theo ghi chú); thứ 16 thế giới, thứ 3 Đông Nam Á.\n- Tỉ lệ gia tăng tự nhiên = (sinh - tử)/10 (%).\n- Gia tăng nhanh từ nửa sau TK20; những năm gần đây giảm (2021: 0,94%) nhưng quy mô lớn nên mỗi năm vẫn tăng ~1 triệu người; khác biệt giữa vùng, thành thị - nông thôn."],
["DC","Ảnh hưởng của dân số đông và tăng nhanh đến phát triển kinh tế - xã hội.","- Tích cực: nguồn lao động dồi dào, bổ sung hằng năm lớn (~1 triệu); thị trường tiêu thụ rộng.\n- Tiêu cực: kinh tế - tốc độ phát triển, mâu thuẫn tích lũy - tiêu dùng, chậm chuyển dịch cơ cấu; xã hội - chất lượng cuộc sống, áp lực nhà ở, giáo dục, y tế, việc làm, thất nghiệp; môi trường - ô nhiễm, suy giảm tài nguyên."],
["DC","Phân tích sự thay đổi cơ cấu dân số theo nhóm tuổi.","- Dân số vàng và xu hướng già hóa.\n- Dưới 15 tuổi: tỉ trọng cao nhưng giảm (24,1%).\n- 15-64 tuổi: tỉ trọng lớn nhất, tăng (67,6%).\n- Từ 65 tuổi: nhỏ nhưng tăng (8,3%).\n- Nguyên nhân: kinh tế - xã hội phát triển, kế hoạch hóa gia đình, y tế tiến bộ → tỉ suất sinh giảm, tuổi thọ tăng."],
["DC","Trình bày đặc điểm phân bố dân cư nước ta.","- Mật độ cao (2024 ≈ 305 người/km²), thứ 3 Đông Nam Á.\n- Không đều: đồng bằng (ĐBSH 1091) >> miền núi, cao nguyên (Tây Bắc, Trung du miền núi phía Bắc 136); nông thôn 62,9% - thành thị 37,1% (2021); HN, TP.HCM cao nhất.\n- Thay đổi theo thời gian, ngày càng hợp lí hơn: mật độ tăng, tỉ lệ dân thành thị tăng."],
["DC","Giải thích vì sao ĐBSH có mật độ dân số cao nhất cả nước.","Tổng hợp nhân tố: địa hình bằng phẳng, đất phù sa màu mỡ, khí hậu nhiệt đới ẩm gió mùa, nguồn nước dồi dào; kinh tế - xã hội phát triển, cơ sở hạ tầng đồng bộ, công nghiệp - dịch vụ phát triển hàng đầu, thu hút dân cư, lao động; lịch sử khai thác và định cư lâu đời."],
["DC","Hậu quả của phân bố dân cư không đều và biện pháp giải quyết.","- Đồng bằng: dân đông, lao động dư thừa, thất nghiệp, áp lực nhà ở, y tế, giáo dục, môi trường.\n- Miền núi: thưa dân (3/4 diện tích, 1/4 dân), thiếu lao động, tài nguyên chưa khai thác, hạ tầng khó phát triển.\n- Giải pháp: phát triển công nghiệp, dịch vụ nông thôn; đô thị hóa; phân bố lại dân cư - lao động; xuất khẩu lao động; thực hiện kế hoạch hóa gia đình."],
["DC","Trình bày đặc điểm nguồn lao động nước ta (ưu điểm và hạn chế).","- Ưu: dồi dào (lực lượng lao động 2021 ≈ 50,6 triệu), tăng ~1 triệu/năm; chất lượng ngày càng cao (đào tạo 26,2% - 2021); cần cù, sáng tạo, nhiều kinh nghiệm N-L-TS, tiểu thủ công nghiệp.\n- Hạn chế: phân bố chưa đều, thừa ở đồng bằng - thiếu ở miền núi; thể lực yếu, tác phong công nghiệp chưa cao; chưa đáp ứng CNH-HĐH; thiếu cán bộ giỏi, công nhân kĩ thuật."],
["DC","Vì sao tỉ lệ gia tăng dân số tự nhiên giảm nhưng quy mô dân số vẫn tăng?","- Tỉ lệ gia tăng giảm do thực hiện tốt chính sách dân số kế hoạch hóa gia đình, tỉ suất sinh giảm (kinh tế phát triển, nhận thức tăng, y tế tốt).\n- Tỉ lệ gia tăng vẫn cao (0,94%) và quy mô dân số lớn (~101 triệu) nên mỗi năm dân số vẫn tăng ~1 triệu người."],
["DC","Vì sao tỉ lệ dân thành thị nước ta tăng?","Do công nghiệp hóa, hiện đại hóa, đô thị hóa: chuyển dịch cơ cấu kinh tế theo hướng tăng công nghiệp - dịch vụ, giảm nông nghiệp; công nghiệp, dịch vụ phát triển cần nhiều lao động, thu hút dân cư về đô thị; mật độ dân số tăng do hút lao động (19,5% năm 1990 → 37,1% năm 2021)."],
["DC","Trình bày thực trạng và giải pháp vấn đề việc làm.","- Thực trạng: 2021 có 49 triệu lao động có việc làm; thất nghiệp 3,2% (thành thị 4,3%, nông thôn 2,5%), thiếu việc làm 2,52% (nông thôn 2,94%); việc làm giản đơn, năng suất thấp phổ biến.\n- Giải pháp: hoàn thiện chính sách; đào tạo, dạy nghề; phát triển ngành cần nhiều lao động; thị trường lao động; xuất khẩu lao động; bảo hiểm thất nghiệp; phân bố lại dân cư, lao động."],
["DC","So sánh quần cư nông thôn và quần cư thành thị.","- Mật độ: nông thôn thấp - thành thị cao.\n- Hoạt động kinh tế: nông thôn nông nghiệp là chủ yếu, đang chuyển sang dịch vụ, công nghiệp; thành thị công nghiệp - dịch vụ.\n- Chức năng: nông thôn hành chính, văn hóa, xã hội (đang thay đổi); thành thị đa chức năng (kinh tế, văn hóa, chính trị, đổi mới sáng tạo).\n- Cấu trúc: nông thôn làng, xóm, bản, thôn; thành thị phường, thị trấn, nhà ở dày đặc."],
["KT","Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố sản xuất lúa.","- Tự nhiên: đồng bằng châu thổ, đất phù sa; khí hậu nhiệt đới ẩm → 2-3 vụ/năm; nước dồi dào; nhiều giống lúa tốt. Khó khăn: đất nhiễm mặn, phèn, cát bay, bình quân đất thấp; thiên tai, sâu bệnh, biến đổi khí hậu.\n- Kinh tế - xã hội: lao động kinh nghiệm; KHCN; thủy lợi, chế biến; chính sách; thị trường (gạo ST25...).\n- Khó khăn: cơ sở vật chất kĩ thuật chưa đồng bộ, thị trường biến động, liên kết còn hạn chế."],
["KT","Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố cây công nghiệp.","- Tự nhiên: vị trí; đồi núi, đất feralit (trung du miền núi Bắc Bộ, Tây Nguyên) - cây lâu năm, đồng bằng - cây ngắn ngày; khí hậu nhiệt đới + phân hóa (có cây cận nhiệt như chè); nước; giống tốt. Khó khăn: xói mòn, bạc màu, thiên tai, sâu bệnh, đất hẹp.\n- Kinh tế - xã hội: lao động có kinh nghiệm; KHCN; thủy lợi, chế biến; chính sách; thị trường."],
["KT","Phân tích điều kiện phát triển ngành chăn nuôi nước ta.","- Cơ sở thức ăn (đồng cỏ, phụ phẩm trồng trọt, thủy sản, công nghiệp chế biến) có ý nghĩa hàng đầu.\n- Khí hậu nhiệt đới ẩm thuận lợi; giống bản địa và nhập ngoại, lai tạo.\n- Cơ sở vật chất: chuồng trại, thú y, nghiên cứu giống.\n- Dân cư, thị trường tiêu thụ lớn; chính sách khuyến khích.\n- Khó khăn: dịch bệnh (cúm gà, dịch tả lợn Châu Phi), thức ăn chưa đảm bảo, hình thức còn lạc hậu."],
["KT","Phân tích điều kiện tự nhiên và kinh tế - xã hội phát triển ngành thủy sản.","- Tự nhiên: biển Đông rộng (1 triệu km²), bờ biển dài 3260km, 4 ngư trường trọng điểm; nhiều đảo, vũng, vịnh, đầm phá, rừng ngập mặn; sông ngòi, ao hồ dày đặc; nguồn lợi phong phú. Khó khăn: bão, ATNĐ; khai thác quá mức; ô nhiễm biển.\n- KT-XH: lao động, thị trường, chính sách, cơ sở hạ tầng (cảng cá), KHCN."],
["KT","Trình bày vai trò của cây lúa.","- Kinh tế: cung cấp lương thực chính; nguyên liệu cho chế biến; xuất khẩu (Việt Nam thuộc nhóm đầu thế giới), thu ngoại tệ; phụ phẩm làm thức ăn chăn nuôi.\n- Xã hội: đảm bảo an ninh lương thực; tạo việc làm, tăng thu nhập, nâng cao chất lượng cuộc sống."],
["KT","Trình bày sự phát triển và phân bố ngành công nghiệp sản xuất điện.","- Phát triển: sản lượng tăng liên tục (244,9 tỉ kWh năm 2021); cơ cấu đa dạng: thủy điện, nhiệt điện (than, khí), điện tái tạo (gió, mặt trời), điện rác; xu hướng tăng điện gió, mặt trời.\n- Phân bố: thủy điện ở miền núi, sông có tiềm năng (Hòa Bình, Sơn La, Ya-ly); nhiệt điện than Quảng Ninh, Vũng Áng; nhiệt điện khí Bà Rịa-Vũng Tàu, Cà Mau; điện gió ở Duyên hải Nam Trung Bộ, Tây Nguyên, ĐBSCL; điện mặt trời ở DHNTB, Tây Nguyên."],
["KT","Trình bày sự phát triển và phân bố ngành công nghiệp dệt may và giày dép.","- Phát triển: ngành thế mạnh, truyền thống (lao động dồi dào, thị trường lớn); chiếm 11,1% giá trị sản xuất công nghiệp (2021); sản lượng tăng nhanh; xuất khẩu chủ lực (vải, quần, áo, giày, dép); chất lượng nâng cao nhờ KHCN; hướng chuyển từ gia công sang thiết kế, thời trang.\n- Phân bố: rộng khắp, tập trung Đông Nam Bộ và ĐBSH; mạnh ở các đô thị lớn (Hà Nội, TP.HCM, Hải Phòng, Đà Nẵng, Cần Thơ, Huế)."],
["KT","Trình bày sự phát triển và phân bố ngành sản xuất sản phẩm điện tử, máy vi tính.","- Phát triển: ngành mới, hàm lượng công nghệ cao, tăng nhanh; chiếm 25,3% giá trị sản xuất công nghiệp; sản phẩm chính: máy tính, linh kiện điện tử, điều hòa, tivi; đóng góp 32,2% giá trị xuất khẩu.\n- Phân bố: ĐBSH, Đông Nam Bộ (lao động chất lượng, hạ tầng, vốn đầu tư nước ngoài): Hà Nội, Bắc Ninh, Thái Nguyên, Bắc Giang, TP.HCM, Đồng Nai, Bình Dương."],
["KT","Trình bày sự phát triển và phân bố công nghiệp chế biến thực phẩm và đồ uống.","- Phát triển: lâu đời, dựa trên nguyên liệu từ nông nghiệp - thủy sản, lao động, thị trường; giá trị tăng nhưng tỉ trọng giảm (12,6% năm 2021); cơ cấu: xay xát gạo, đường, chế biến thịt - sữa - thủy sản, thức ăn chăn nuôi, nước giải khát, rượu bia...; xu hướng: phát triển vùng nguyên liệu, thương hiệu.\n- Phân bố: rộng khắp, tập trung Đông Nam Bộ, ĐBSH, ĐBSCL."],
["KT","Giải thích vì sao phải đẩy mạnh công nghiệp xanh.","- Khái niệm: dùng công nghệ tiên tiến, sản xuất thân thiện môi trường, tiết kiệm năng lượng, tái sử dụng chất thải.\n- Hiện nay sản xuất còn bất cập về xử lí chất thải, khí thải gây ô nhiễm.\n- Ý nghĩa: giảm chất thải, ô nhiễm; tạo sản phẩm đạt chuẩn khắt khe của thị trường (Hoa Kì, Nhật Bản, EU), thuế thấp; tiết kiệm chi phí, nguyên liệu, năng lượng."],
["KT","Trình bày đặc điểm ngành thủy sản nước ta (nuôi trồng, khai thác và phân bố).","- Nguồn lợi phong phú (>2000 loài cá, 100 loài tôm...); 4 ngư trường trọng điểm.\n- Sản lượng 2021: 8,81 triệu tấn; nuôi trồng nhanh hơn khai thác (nuôi 55,4%, khai thác 44,6%).\n- Khai thác: Bắc Trung Bộ - DHNTB cao nhất (42,7%); Kiên Giang, Bà Rịa-Vũng Tàu, Cà Mau, Bình Định.\n- Nuôi trồng: ĐBSCL lớn nhất (69,8%); An Giang, Đồng Tháp, Quảng Ninh, Hải Phòng."],
["KT","Trình bày đặc điểm tài nguyên rừng và sự phát triển ngành lâm nghiệp.","- 2021: rừng 14,7 triệu ha (tự nhiên 69%, trồng 31%), độ che phủ 42%; rừng tự nhiên tập trung Trung du miền núi Bắc Bộ; rừng phòng hộ, đặc dụng, sản xuất.\n- Trồng rừng được đẩy mạnh (~200 nghìn ha mới/năm); sản lượng gỗ khai thác tăng (12 triệu m³, gấp 4,6 lần 2010); vùng gỗ lớn: TDMNBB, Bắc Trung Bộ, DHNTB, Tây Nguyên."],
["KT","Vì sao cây công nghiệp phát triển mạnh trong những năm gần đây?","Vai trò quan trọng (nguyên liệu chế biến, xuất khẩu, tạo việc làm, bảo vệ môi trường); điều kiện tự nhiên (đồi núi, đất feralit, khí hậu nhiệt đới, nước, giống); lao động dồi dào, kinh nghiệm; thị trường trong và ngoài nước mở rộng; chính sách hỗ trợ; ứng dụng KHCN; cơ sở vật chất kĩ thuật (thủy lợi, chế biến, kho bãi, vận chuyển)."]
];
const LV=["Chưa học","Chưa học kĩ","Đã học","Đã học kĩ"];
const CM={TN:["chưa nắm được kiến thức Địa lí tự nhiên, cần học lại từ đầu","còn nhớ rời rạc, thiếu giải thích nguyên nhân, cần ôn kĩ hơn","nắm được ý chính, cần củng cố số liệu và giải thích","nắm chắc, trình bày đầy đủ"],DC:["chưa học phần Dân cư","học chưa kĩ, thiếu số liệu và giải thích","nắm được ý chính","nắm chắc, có số liệu và giải thích tốt"],KT:["chưa học phần Kinh tế ngành","học chưa kĩ, thiếu hệ thống các nhân tố","nắm được ý chính nhưng cần thêm ví dụ, số liệu","nắm chắc, phân tích có hệ thống"]};
let S={hist:[],cur:null,win:null,tm:null},A=document.getElementById("app");
const $=(h)=>{A.innerHTML=h};
function sh(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function home(){clearInterval(S.tm);
 $(`<h1>👩‍🏫 Trợ giảng kiểm tra miệng Địa lí</h1><div class="c"><h2>Mở lượt kiểm tra mới</h2><div class="g"><div><label>Tên học sinh</label><input id="n"></div><div><label>Ca</label><input id="ca" placeholder="VD: Ca 1"></div><div><label>Thời gian kiểm tra</label><input id="gio" placeholder="VD: 14:30 17/11"></div></div><p class="mu">Mỗi HS 5 câu hỏi ngẫu nhiên từ 3 phạm trù (Tự nhiên, Dân cư, Kinh tế ngành), mỗi câu có 5 phút suy nghĩ. Khi bắt đầu sẽ mở cửa sổ phụ để chia sẻ màn hình cho HS (hãy cho phép cửa sổ bật lên).</p><button onclick="start()">Bắt đầu kiểm tra</button></div>
 <div class="c"><h2>Các lượt đã kiểm tra (${S.hist.length})</h2>${S.hist.length?`<table><tr><th>HS</th><th>Ca</th><th>Giờ</th><th>Kết quả</th></tr>${S.hist.map((h,i)=>`<tr><td>${h.n}</td><td>${h.ca}</td><td>${h.gio}</td><td><a href="#" onclick="sum(${i});return false">Xem</a></td></tr>`).join("")}</table>`:'<span class="mu">Chưa có lượt nào.</span>'}</div>`)}
function pick(){let by={TN:[],DC:[],KT:[]};sh(Q).forEach(q=>by[q[0]].push(q));let p=[by.TN[0],by.DC[0],by.KT[0]],ex=sh(Object.keys(by))[0],ex2=sh(Object.keys(by))[1];p.push(by[ex][1]);p.push(by[ex2][ex2==ex?2:1]);return sh(p)}
function start(){let n=document.getElementById("n").value.trim();if(!n){alert("Nhập tên học sinh");return}
 S.cur={n,ca:document.getElementById("ca").value||"-",gio:document.getElementById("gio").value||new Date().toLocaleString("vi-VN"),qs:pick(),i:0,r:[],t:300,run:false};
 S.win=window.open("","hs_view","width=900,height=600");if(!S.win){alert("Trình duyệt chặn cửa sổ bật lên. Hãy cho phép rồi thử lại.");return}
 S.win.document.open();S.win.document.write(`<title>Màn hình học sinh</title><body style="font-family:system-ui,sans-serif;background:#0f2742;color:#fff;margin:0;padding:5vw;text-align:center"><div id=h style="opacity:.7;font-size:20px"></div><div id=q style="font-size:34px;font-weight:700;margin:6vh 0"></div><div id=t style="font-size:90px;font-weight:800"></div><div id=m style="font-size:22px;opacity:.8"></div></body>`);S.win.document.close();q()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function ch(){let c=S.cur,w=S.win;if(!w||w.closed)return;let g=id=>w.document.getElementById(id);if(!g("q"))return;g("h").textContent=`${c.n} • Câu ${c.i+1}/5`;g("q").textContent=c.qs[c.i][1];g("t").textContent=fmt(c.t);g("m").textContent=c.t>0?(c.run?"Thời gian suy nghĩ":"Chuẩn bị..."):"Hết giờ - mời em trả lời"}
function q(){clearInterval(S.tm);let c=S.cur;c.t=300;c.run=false;let x=c.qs[c.i];
 $(`<div class="row"><h1>${c.n} — Câu ${c.i+1}/5</h1><button class="s" onclick="if(confirm('Dừng lượt kiểm tra?'))home()">Thoát</button></div><div class="c"><span class="tag">${CATS[x[0]]}</span><div class="q" style="margin:8px 0">${x[1]}</div><div class="row"><div class="t" id="tt">05:00</div><div><button id="bt" onclick="run()">▶ Bắt đầu tính giờ</button> <button class="s" onclick="c0()">Bỏ qua thời gian</button></div></div></div>
 <div class="c"><h2>Đáp án (chỉ trợ giảng thấy)</h2><div class="a">${x[2].replace(/</g,"&lt;")}</div></div>
 <div class="c"><h2>Nhận định phạm vi học của HS</h2><div class="r">${LV.map((l,k)=>`<button onclick="rate(${k},this)">${l}</button>`).join("")}</div><div style="margin-top:12px"><button id="nx" onclick="next()" disabled>${c.i<4?"Câu tiếp theo →":"Tổng kết"}</button></div></div>`);ch()}
function tick(){let c=S.cur;if(c.t>0)c.t--;let e=document.getElementById("tt");if(e)e.textContent=fmt(c.t);if(c.t<=0)clearInterval(S.tm);ch()}
function run(){let c=S.cur;if(c.run){clearInterval(S.tm);c.run=false;document.getElementById("bt").textContent="▶ Tiếp tục"}else{c.run=true;document.getElementById("bt").textContent="⏸ Tạm dừng";S.tm=setInterval(tick,1000)}ch()}
function c0(){clearInterval(S.tm);S.cur.t=0;S.cur.run=true;tick()}
function rate(k,b){S.cur.r[S.cur.i]=k;document.querySelectorAll(".r button").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById("nx").disabled=false}
function next(){let c=S.cur;c.i++;if(c.i<5)q();else{clearInterval(S.tm);if(S.win&&!S.win.closed)S.win.close();S.hist.push({n:c.n,ca:c.ca,gio:c.gio,qs:c.qs,r:c.r});sum(S.hist.length-1)}}
function sum(i){let h=S.hist[i],o="";
 Object.keys(CATS).forEach(k=>{let id=h.qs.map((x,j)=>x[0]==k?j:-1).filter(j=>j>=0);if(!id.length)return;let avg=id.reduce((s,j)=>s+h.r[j],0)/id.length,lv=Math.min(3,Math.round(avg));
 o+=`<div class="c"><h2>${CATS[k]} <span class="tag">${LV[lv]}</span></h2><p>Nhận xét: HS ${CM[k][lv]}.</p><ul>${id.map(j=>`<li>${h.qs[j][1]} — <b>${LV[h.r[j]]}</b></li>`).join("")}</ul></div>`});
 let all=h.r.reduce((a,b)=>a+b,0)/5;$(`<div class="row"><h1>Tổng kết: ${h.n}</h1><div><button class="s" onclick="window.print()">In</button> <button onclick="home()">Về trang chính</button></div></div><p class="mu">${h.ca} • ${h.gio}</p><div class="c"><h2>Đánh giá chung: ${LV[Math.min(3,Math.round(all))]}</h2><p class="mu">Điểm mức học trung bình ${all.toFixed(1)}/3</p></div>${o}`)}
home();
</script></body></html>
