<style>
:root{--bg:#eaf4f4;--tx:#12303a;--mu:#6a808a;--pr:#0f766e;--pr2:#0e7490;--ac:#f97316;--bd:#d6e6e8;--sh:0 10px 30px rgba(14,80,95,.10)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.6 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 420px at 0 -5%,#c7ecee,transparent 60%),radial-gradient(800px 380px at 100% 0,#fde7d3,transparent 55%),var(--bg);background-attachment:fixed}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.hero{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px;padding:22px 26px;border-radius:24px;color:#fff;background:linear-gradient(120deg,#0b3b4a,#0f766e 60%,#14a3a3);box-shadow:var(--sh)}
.hero h1{margin:0;font-size:24px}.hero p{margin:2px 0 0;opacity:.85;font-size:14px}
.c{background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:18px 22px;margin-bottom:16px;box-shadow:var(--sh)}
h2{font-size:18px;margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
input,textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:12px;background:#f8fcfc;color:var(--tx);font:inherit}
input:focus,textarea:focus,select:focus{outline:3px solid #99e0dc;border-color:var(--pr)}
textarea{margin-top:10px;resize:vertical}
label{font-size:13px;color:var(--mu);display:block;margin:8px 0 4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button{padding:11px 18px;border:0;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;background:#e3eff0;color:var(--tx);transition:transform .12s}
button:hover:not(:disabled){transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.b{background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff}
button.dg{background:#fee2e2;color:#b91c1c}
.hero button{background:rgba(255,255,255,.18);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 12px;border-radius:99px;background:#e3eff0}
.tag.bad{background:#fee2e2;color:#b91c1c}.tag.wn{background:#fef3c7;color:#b45309}.tag.pr{background:#dbeafe;color:#1d4ed8}.tag.ok{background:#dcfce7;color:#15803d}
.steps{display:flex;gap:8px;margin:0 0 16px}.steps i{flex:1;text-align:center;font-style:normal;font-weight:700;padding:6px 0;border-radius:12px;background:#fff;border:1.5px solid var(--bd);color:var(--mu)}
.steps i.dn{background:#dcfce7;color:#15803d;border-color:#86efac}.steps i.sk{background:#fef3c7;color:#b45309;border-color:#fde68a}.steps i.cur{background:var(--pr);color:#fff;border-color:var(--pr)}
.q{font-size:22px;font-weight:800;margin:10px 0 14px;line-height:1.4}
.rg{position:relative;width:150px;height:150px}.rg svg{width:100%;transform:rotate(-90deg)}
.rb{fill:none;stroke:#dcebec;stroke-width:9}.rf{fill:none;stroke-width:9;stroke-linecap:round}
.rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-variant-numeric:tabular-nums}
.bt{display:flex;gap:10px;flex-wrap:wrap}
.a{white-space:pre-line;border-left:5px solid var(--pr);padding:4px 0 4px 14px;font-size:15.5px}
.ans{background:linear-gradient(#f2fbfa,#fff)}
.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.lv{background:#fff;border:2px solid var(--bd);line-height:1.35;padding:12px 6px}
.lv.bad{border-color:#fecaca}.lv.wn{border-color:#fde68a}.lv.pr{border-color:#bfdbfe}.lv.ok{border-color:#bbf7d0}
.lv.bad.on{background:#ef4444;color:#fff}.lv.wn.on{background:#f59e0b;color:#fff}.lv.pr.on{background:#3b82f6;color:#fff}.lv.ok.on{background:#16a34a;color:#fff}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.nav button{padding:14px 22px}
.ban{display:flex;gap:18px;align-items:center;border-radius:24px;padding:22px 26px;color:#fff;margin-bottom:16px;box-shadow:var(--sh)}
.ban.ok{background:linear-gradient(120deg,#15803d,#22c55e)}.ban.wn{background:linear-gradient(120deg,#d97706,#fbbf24)}.ban.bad{background:linear-gradient(120deg,#dc2626,#f97316)}
.em{font-size:52px;line-height:1}.vt{font-size:26px;font-weight:800}.ban>div:last-child{flex:1}
.bar{height:10px;background:rgba(255,255,255,.35);border-radius:9px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.qi{padding:10px 0;border-top:1px dashed var(--bd)}details{margin-top:6px}summary{cursor:pointer;color:var(--pr);font-weight:600;font-size:14px}
.ta{background:#fff7ed;border-left:5px solid var(--ac);border-radius:10px;padding:10px 14px;margin-top:10px}
.li{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--bd)}
.li:first-child{border-top:0}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;margin-top:8px}.chip.ok{background:#dcfce7;color:#15803d}.chip.bad{background:#fee2e2;color:#b91c1c}
.hsb{margin:0;min-height:100vh;color:#fff;background:linear-gradient(160deg,#0b3b4a,#0f766e)}
.hsw{text-align:center;padding:5vh 5vw}.hsh{opacity:.8;font-size:22px}.hsq{font-size:clamp(26px,3.6vw,46px);font-weight:800;margin:4vh auto;max-width:900px;line-height:1.35}
.hsw .rg{width:240px;height:240px;margin:0 auto}.hsw .rg b{font-size:56px;color:#fff}.hsw .rb{stroke:rgba(255,255,255,.2)}.hsm{font-size:22px;opacity:.9;margin-top:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#12303a;color:#fff;padding:10px 20px;border-radius:99px;z-index:9}
/* ===== Bố cục mới: thanh bên trái + vùng làm việc toàn chiều rộng ===== */
.sh{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.sd{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;color:#fff;background:radial-gradient(300px 200px at 0 0,#14a3a3 0,transparent 70%),linear-gradient(180deg,#0b3b4a,#082a37 65%,#06202a)}
.lg{display:flex;gap:12px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.14)}
.lg img{width:56px;height:56px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.3)}.lg b{display:block;font-size:16px;line-height:1.25}.lg small{opacity:.75;font-size:12.5px}
.nv{display:flex;flex-direction:column;gap:6px;margin:16px 0;flex:1}
.nv button{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:transparent;color:#cfe6ea;padding:13px 14px;border-radius:14px}
.nv button span.i{font-size:20px;width:26px;text-align:center}.nv button:hover{background:rgba(255,255,255,.1);transform:none}
.nv button.on{background:linear-gradient(120deg,#14b8a6,#0e7490);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.bd{margin-left:auto;background:var(--ac);color:#fff;font-size:12px;padding:1px 9px;border-radius:99px}
.us{background:rgba(255,255,255,.08);border-radius:16px;padding:12px 14px;font-size:13.5px}.us b{display:block}
.us button{margin-top:8px;width:100%;background:rgba(255,255,255,.15);color:#fff;padding:8px}
.mn{padding:26px 32px 70px;min-width:0}
.ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.ph h1{margin:0;font-size:28px;line-height:1.2}.ph p{margin:4px 0 0}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st{border-radius:20px;padding:14px 18px;color:#fff;box-shadow:var(--sh)}.st b{display:block;font-size:34px;line-height:1.1}.st span{font-size:13.5px;opacity:.92}
.s0{background:linear-gradient(120deg,#0f766e,#14a3a3)}.s1{background:linear-gradient(120deg,#15803d,#22c55e)}.s2{background:linear-gradient(120deg,#2563eb,#60a5fa)}.s3{background:linear-gradient(120deg,#d97706,#fbbf24)}
.ex{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.ex .ans{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.lgn{max-width:460px;margin:8vh auto;text-align:center}.lgn img{width:150px;border-radius:36px;box-shadow:var(--sh)}.lgn h1{margin:14px 0 4px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media print{.np,.sd{display:none!important}.sh{display:block}.mn{padding:0}body{background:#fff}}
@media(max-width:1000px){.ex,.two{grid-template-columns:1fr}.ex .ans{position:static;max-height:none}}
@media(max-width:860px){.sh{grid-template-columns:1fr}.sd{position:static;height:auto;padding:12px}.nv{flex-direction:row;overflow-x:auto;margin:10px 0}.nv button{width:auto;white-space:nowrap;padding:10px 14px}.us{display:none}.mn{padding:16px 14px 60px}}
@media(max-width:560px){.ban{flex-direction:column;text-align:center}.hero h1{font-size:20px}.ph h1{font-size:22px}}

<script>
const CATS={TN:"Tự nhiên Việt Nam",DC:"Dân cư",KT:"Kinh tế ngành N-L-TS & CN"};
/* ===== DÁN NGUYÊN MẢNG Q TỪ FILE CŨ VÀO ĐÂY (từ dòng "const Q=[" đến dấu "];") — xóa dòng const Q=[]; bên dưới ===== */
const Q=[
["TN", "Trình bày đặc điểm vị trí địa lí, hình dáng lãnh thổ.", "- Khái quát chung:\n+ Việt Nam nằm ở trung tâm khu vực Đông Nam Á.\n+ Nằm ở phía đông của bán đảo Đông Dương, có biển Đông thông ra Thái Bình Dương.\n- Tiếp giáp:\n+ Phía Bắc: Giáp Trung Quốc có đường biên giới dài 1400km.\n+ Phía Tây: Giáp Lào (đường biên giới dài 2100km), Campuchia (đường biên giới dài 1100km).\n+ Phía Đông, Nam: Giáp biển Đông.\n- Hình dáng lãnh thổ và tọa độ địa lí:\n+ Trên đất liền: Trải dài, hẹp ngang\n❖ Cực Bắc: Lũng Cú - Tuyên Quang (Hà Giang cũ) tại tọa độ 23°23'B.\n❖ Cực Nam: Xóm Mũi - Cà Mau tại tọa độ 8°34'B.\n❖ Cực Tây: Apachải - Điện Biên tại tọa độ 102°08'Đ.\n❖ Cực Đông: Bán đảo Hòn Gốm - Khánh Hòa tại tọa độ 109°27'Đ (Vạn Ninh - Vạn Hạnh - Khánh Hòa).\n⇒ Trải dài 15° vĩ tuyến, rộng 7° kinh tuyến.\n+ Trên biển: cong hình chữ S. Kéo dài tới khoảng 6°50'B và từ 101°Đ đến 117°20'Đ (Từ Móng Cái - Quảng Ninh đến Hà Tiên - An Giang).\n- Đặc điểm của vị trí địa lí:\n+ VN có vị trí ở nội chí tuyến Bắc bán cầu.\n+ Nằm ở trong khu vực hoạt động điển hình của gió mùa châu Á.\n+ Là cầu nối giữa Đông Nam Á đất liền với Đông Nam Á hải đảo.\n+ Nằm gần ngã tư hàng hải - hàng không quốc tế.\n+ Nằm trên đường di lưu và di cư của nhiều loài sinh vật trên đất liền và trên biển.\n+ Nằm ở nơi giao thoa giữa 2 vành đai sinh khoáng lớn là Thái Bình Dương và Địa Trung Hải.\n+ Nằm trong khu vực có nhiều thiên tai và chịu ảnh hưởng mạnh mẽ của biến đổi khí hậu toàn cầu."],
["TN", "Trình bày đặc điểm phạm vi lãnh thổ.", "* Lãnh thổ nước ta là một thể thống nhất và toàn vẹn, gồm 3 bộ phận là vùng đất, vùng trời và vùng biển.\n- Vùng đất:\n+ Là toàn bộ vùng đất liền và đảo, quần đảo trên biển Đông.\n+ Diện tích: 311344 km², đứng thứ 58 trên thế giới.\n+ Đường biên giới trên đất liền khoảng gần 5000km, tiếp giáp với 3 quốc gia là Trung Quốc, Lào và Campuchia.\n+ Đảo: VN có hàng nghìn đảo, trong đó có 2 quần đảo lớn nhất là Hoàng Sa (Đà Nẵng) và Trường Sa (Khánh Hòa).\n- Vùng biển:\n+ Diện tích: khoảng 1 triệu km².\n+ Chiều dài vùng biển dài 3260 km từ Móng Cái (Quảng Ninh) đến Hà Tiên (An Giang)\n+ Tiếp giáp: VN chung biển Đông với 8 quốc gia (Trung Quốc, Philippines, Indonesia, Brunei, Malaysia, Singapore, Thái Lan, Campuchia).\n+ Có 5 bộ phận vùng biển: Nội thủy, lãnh hải, tiếp giáp lãnh hải, đặc quyền kinh tế, thềm lục địa.\n- Vùng trời:\n+ Rất rộng lớn, là không gian bao trùm phía trên toàn bộ lãnh thổ nước ta (Không gian bao trùm vùng đất và vùng biển).\n+ Bao gồm không gian trên đất liền được xác định bằng biên giới, trên biển là ranh giới phía ngoài của lãnh hải và không gian trên các đảo, quần đảo."],
["TN", "Trình bày ảnh hưởng của vị trí địa lí và phạm vi lãnh thổ đến sự hình thành các đặc điểm địa lí tự nhiên Việt Nam.", "điểm địa lí tự nhiên Việt Nam\n—— Đối với Khí hậu:\n- Việt Nam nằm trong vành đai nội chí tuyến Bắc bán cầu, trong khu vực hoạt động điển hình của gió tín phong và gió mùa châu Á.\n- Tiếp giáp với biển Đông nên khí hậu nước ta có tính chất nhiệt đới ẩm gió mùa với nhiệt độ trung bình năm cao >20°C (trừ vùng núi cao), độ ẩm 80%, lượng mưa trung bình từ 1500-2000mm/năm.\n⇒ Do đó, VN không bị hoang mạc hóa như các quốc gia cùng vĩ độ ở Bắc Phi, Tây Nam Á.\n- Trong năm, nước ta chịu ảnh hưởng của gió mùa và gió Tín Phong nên khí hậu chia làm 2 mùa rõ rệt:\n+ Miền Bắc: Chia làm 2 mùa đông - hạ. Mùa đông: Đầu mùa lạnh khô, mưa ít. Giữa và cuối mùa lạnh ẩm, mưa phùn. Mùa hạ: Nóng, ẩm, mưa nhiều.\n+ Miền Nam: Chia làm 2 mùa mưa - khô phân hóa rõ rệt.\n- VN giáp biển Đông nên là vùng dự trữ ẩm dồi dào. Hơn nữa, lãnh thổ trải dài, hẹp ngang nên khí hậu nước ta chịu ảnh hưởng sâu sắc của biển Đông. Biển Đông làm tăng cường tính chất ẩm và biến tính các khối khí trước khi thổi vào phần lãnh thổ đất liền VN, làm dịu mát vào mùa hạ, giảm bớt tính chất hanh khô cho mùa đông.\n- Đặc điểm lãnh thổ trải dài, hẹp ngang kết hợp với sự phân bố địa hình và hoạt động của các khối khí làm khí hậu nước ta phân hóa đa dạng theo chiều Bắc-Nam, Tây-Đông, phân hóa theo mùa.\n- VTĐL làm nước ta chịu ảnh hưởng của nhiều thiên tai và biến đổi khí hậu như bão, áp thấp nhiệt đới, hạn hán, xâm nhập mặn,...\n—— Đối với Sinh vật và đất:\n- VN nằm ở vị trí di lưu, di cư của nhiều loài sinh vật, nằm ở nơi tiếp xúc của các luồng gió mùa nên có nguồn tài nguyên sinh vật phong phú, đa dạng.\n+) Ngoài các sinh vật nhiệt đới còn có các sinh vật cận nhiệt và ôn đới từ Hoa Nam - Trung Quốc, Himalaya, Ấn Độ, Myanmar xuống, từ Malaysia và Indonesia lên.\n- Hệ sinh thái rừng nhiệt đới gió mùa phát triển trên đất feralit tạo nên cảnh quan tiêu biểu của thiên nhiên nước ta.\n- Biển Đông nằm trong vùng nhiệt đới nên có nhiệt độ nước biển trên mặt cao, có các dòng biển di chuyển theo mùa nên sinh vật phong phú, đa dạng.\n—— Đối với Khoáng sản: VN nằm ở nơi giao thoa giữa 2 vành đai sinh khoáng lớn là Thái Bình Dương và Địa Trung Hải nên có nguồn tài nguyên phong phú, đa dạng."],
["TN", "Trình bày đặc điểm chung địa hình Việt Nam (phần 1: địa hình đồi núi chiếm ưu thế; được tân kiến tạo nâng lên thành nhiều bậc).", "a) Địa hình đồi núi chiếm ưu thế\n- Đồi núi chiếm ¾ lãnh thổ VN, trải dài 1400km từ biên giới Việt-Trung (vùng núi Tây Bắc) đến bán bình nguyên Đông Nam Bộ, phân bố chủ yêu ở phái Bắc và phía Tây.\n+ Địa hình <1000m : chiếm 85% diện tích lãnh thổ\n+ Địa hình núi từ 1000m-2000m: chiếm 14% diện tích lãnh thổ\n+ Địa hình > 2000m: chiếm 1% diện tích lãnh thổ\n- Địa hình đồng bằng chiếm ¼ diện tích lãnh thổ, phân bố chủ yêu ở phía Đông và phía Nam.\n+ ĐBSH: 15.000km2\n+ ĐBSCL: 40.000km2\n⇒ Hai đồng bằng này có bề mặt tương đối rộng lớn và bằng phẳng, thấp\n+ ĐBDHMT: 15000km2 (gồm nhiều đồng bằng nhỏ hẹp và bị chia cắt bởi các dãy núi ăn sát ra biển\nb) Địa hình nước ta được tân kiến tạo nâng lên thành nhiều bậc kế tiếp nhau\n- Kết thúc giai đoạn cổ kiến tạo, địa hình nước ta chịu tác động mạnh mẽ của ngoại lực tạo nên các bề mặt san bằng, thấp và thoải\n- Đến giai đoạn tân kiến tạo: địa hình nước ta được nâng lên thành nhiều bậc kế tiếp nhau (Núi - đồi - đồng bằng - bờ biển và thềm lục địa)\n⇒ Tạo nên hướng nghiêng địa hình là TB-ĐN\n- Núi có hai hướng chính là Tây Bắc-Đông Nam và vòng cung\n+ TB-ĐN: dãy Hoàng Liên Sơn, dãy Con Voi, dãy Trường Sơn Bắc,...\n+ Vòng cung: 4 cánh cung ở Đông Bắc\n+ Ngoài ra còn có hướng Tây Đông: dãy Bạch Mã, dãy Hoành Sơn,...\n+ Có các bậc thềm sông, bậc thềm biển, các cao nguyên xếp tầng"],
["TN", "Trình bày đặc điểm chung địa hình Việt Nam (phần 2: chịu tác động mạnh mẽ của thiên nhiên nhiệt đới ẩm gió mùa và của con người).", "c) Địa hình nước ta chịu tác động mạnh mẽ của thiên nhiên NĐẨGM\n- Trong điều kiện nhiệt đới ẩm gió mùa với nhiệt độ cao trên 20 độ C, độ ẩm lớn trên 80%, lượng mưa lớn và tập trung theo mùa (1500-2000mm/năm) đã làm quá trình phong hóa diễn ra mạnh mẽ, tạo nên lớp vỏ phong hóa dày, dễ thấm nước và vụn bở.\n- Khí hậu nhiệt đới ẩm gió mùa với lượng mưa lớn và tập trung theo mùa đã làm địa hình nước ta bị xâm thực, xói mòn mạnh.\n- Tại các vùng núi đá vôi, lượng mưa lớn làm cho quá trình hòa tan đá vôi diễn ra mạnh mẽ, tạo nên dạng địa hình cacxtơ độc đáo, nước ngầm xâm thực sâu vào lòng núi đá, tạo nên (hình thành) các hang động lớn như : Phong Nha kẻ Bàng, hang Sơn Đoòng,...\n- Các quá trình như xâm thực, xói mòn, rửa trôi đã bồi tụ nên các đồng bằng châu thổ (ĐBSH, ĐBSCL), làm thay đổi bề mặt địa hình.\n- Ở các vùng núi dốc, đặc biệt là những nơi bị mất thảm thực vật, vào mùa mưa thường xảy ra các hiện tượng như lũ quét, xâm thực, xói mòn, rửa trôi, làm thay đổi bề mặt địa hình.\nd) Địa hình nước ta chịu tác động mạnh mẽ của con người\n- Tích cực: Các tác động tích cực của con người góp phần bảo vệ địa hình, tạo cảnh quan đẹp, nâng cao chất lượng cuộc sống. Sự xuất hiện ngày càng nhiều các kiến trúc đô thị như: hầm mỏ, đê, làm địa hình trở nên đa dạng\n- Tiêu cực: Tuy nhiên, con người cũng có các tác động tiêu cực làm thay đổi bề mặt địa hình, gây ảnh hưởng nghiêm trọng. VD: Việc chặt phá rừng gây sạt lở và lũ quét ở miền núi, ngập lụt ở đồng bằng"],
["TN", "So sánh và nêu đặc điểm địa hình vùng núi Tây Bắc và Đông Bắc.", "* So sánh địa hình Tây Bắc và Đông Bắc\nTiêu chí | Tây Bắc | Đông Bắc\n1) Vị trí - giới hạn | Từ sông Hồng đến sông Cả | Từ dãy Con Voi đến vùng núi ven biển Quảng Ninh\n2) Độ cao | Chủ yếu là núi cao và trung bình >1500m. Đây là vùng núi cao và đồ sộ nhất VN | Chủ yếu là núi thấp <1000m. Địa hình núi trung bình tập trung ở phía Bắc\n3) Một số đỉnh núi | N. Phan-xi-pang: 3147m N. Phu Hoạt: 2452m NN Pu Si Lung: 3076m | N. Tây. Con Lĩnh: 2419m N.Pu Tha Ca: 2274m N. Kiều Liêu Ti: 2402m\n4) Hường nghiêng | Tây Bắc - Đông Nam | Tây Bắc - Đông Nam\n5) Hướng núi | Tây Bắc - Đông Nam. Có 3 mạch núi, chạy song song, so le nhau theo hướng Tây Bắc - Đông Nam: + Phía Đông: D. Hoàng Liên Sơn + Ở giữa: Cao nguyên Sín Chải, Sơn La, Mộc Châu + Phía Tây: D.Pu Đen Đinh, D. Pu Sam Sao | - Tây Bắc - Đông Nam: D. Con Voi - Vòng cung: CC. Sông Gâm, CC. Ngân Sơn, CC. Bắc Sơn, CC. Đông Triều. - Mở rộng về phía Bắc, quay về lồi ra ở phía Đông chụm lai ở Tam Đảo.\n6) Đặc điểm | - Địa hình núi cao nên độ cắt xẻ mạnh với nhiều đỉnh núi nhọn sườn dốc, thung lũng sâu và hẹp. | - Địa hình núi thấp nên độ cắt xẻ không mạnh với nhiều đỉnh núi tròn, sườn thoải, thung lũng nông và rộng. - Địa hình chuyển tiếp là dạng địa hình đồi bát úp ở rìa đồng bằng sông Hồng.\n| - Có các cánh đồng quan núi - Địa hình cacxtơ như Than Uyên, Nghĩa Lộ, Điện Biên |"],
["TN", "So sánh và nêu đặc điểm địa hình vùng núi Trường Sơn Bắc và Trường Sơn Nam.", "* So sánh địa hình Trường Sơn Bắc và Trường Sơn Nam\nTiêu chí | Trường Sơn Bắc | Trường Sơn Nam\n1) Vị trí - giới hạn | Từ phía Nam sông cả đến dãy Bạch Mã | Phía Nam dãy Bạch Mã đến khối núi 11 độ Bắc\n2) Độ cao | Chủ yếu là núi thấp <1000m, cao ở hai đầu, thấp ở giữa | Là các cao nguyên xếp tầng với độ cao khác nhau (từ 500-1000-1500m)\n3) Một số đỉnh núi | Pu xa Lai Leng: 2711m Rào Cỏ: 2286m | Ngọc Linh: 2598m Chư Yang Sin: 2405m\n4) Hường nghiêng | Tây Bắc - Đông Nam | Không xác định, phức tạp\n5) Hướng núi | - Các dãy núi chạy song song, so le nhau theo hướng TB-ĐN: | Vòng cung\n| Trường Sơn Bắc. - Hướng Tây - Đông: Dãy Hoành Sơn, Bạch Mã |\n6) Đặc điểm | - Địa hình núi thấp nên độ cắt xẻ không mạnh. - Hai sườn không cân xứng: + Sườn Tây rộng và thoải, + Sườn Đông hẹp và dốc. - Địa hình cao ở hai đầu, thấp ở giữa. | - 2 sườn không cân xứng: + Sườn Đông: núi lan ra sát biển + Sườn Tây: Cao nguyên xếp tầng - Giữa TN và ĐB là ĐH bán bình nguyên Đông Nam Bộ, có các bậc thềm phù sa cổ. - Các cao nguyên xếp tầng với bề mặt bằng phẳng, rộng lớn."],
["TN", "Trình bày đặc điểm địa hình đồng bằng sông Hồng.", "- Diện tích: 15.000 km².\n- Nguồn gốc: bồi đắp phù sa của hệ thống sông Hồng và sông Thái Bình.\n- Hướng nghiêng địa hình: Tây Bắc - Đông Nam.\n- Hình dạng: tam giác cân.\n- Đặc điểm:\n● ĐH tương đối thấp và bằng phẳng. Độ cao trung bình từ 8-20m, vùng trung tâm đồng bằng cao khoảng 2-4m.\n● Phía Bắc có nhiều núi sót.\n● Phía Nam có nhiều ô trũng.\n● Ven biển có hệ thống đê ngăn nước mặn xâm nhập vào đồng bằng.\n● Đồng bằng sông Hồng có hệ thống đê lớn: 2500km đê sông, chia làm 2 bộ phận:\n❖ Trong đê: không được bồi đắp phù sa hàng năm nên đất bị thoái hóa, bạc màu.\n❖ Ngoài đê: được bồi đắp phù sa hàng năm nên đất màu mơ nhưng diện tích nhỏ."],
["TN", "Trình bày đặc điểm địa hình đồng bằng sông Cửu Long và đồng bằng duyên hải miền Trung.", "- Diện tích: 40.000 km².\n- Nguồn gốc: bồi đắp phù sa sông Mê Công.\n- Hướng nghiêng địa hình: Tây Bắc - Đông Nam.\n- Hình dạng: hình thang/tứ giác.\n- Đặc điểm:\n● ĐH thấp và bằng phẳng. Độ cao trung bình từ 3-7m, hạ lưu cao khoảng 2-3m so với mực nước biển.\n● Mạng lưới sông ngòi, kênh rạch chằng chịt.\n● Chịu ảnh hưởng thường xuyên của thủy triều.\n\n- Diện tích: 15.000 km².\n- Nguồn gốc: do sự bồi đắp của phù sa biển và phù sa sông.\n- Hướng nghiêng địa hình: Tây - Đông.\n- Hình dạng: trải dài, hẹp ngang.\n- Đặc điểm:\n● Hầu hết các đồng bằng trong khu vực nhỏ, hẹp ngang và dốc vì bị chia cắt bởi các dãy núi hướng Tây - Đông.\n● Có nhiều cồn cát dọc ven biển, đất đai ít màu mỡ do có nguồn gốc bồi đắp từ phù sa biển.\n● Có một số đồng bằng lớn như: ĐB Thanh Hóa (3100km²), ĐB Nghệ Tĩnh (Nghệ An - Hà Tĩnh)."],
["TN", "Trình bày đặc điểm địa hình bờ biển và thềm lục địa.", "* Bờ biển:\n- Dài 3200km từ Móng Cái (Quảng Ninh) đến Hà Tiên (An Giang).\n- Địa hình bờ biển của nước ta rất đa dạng, có 2 kiểu là bồi tụ và mài mòn.\n+ Bờ biển bồi tụ: tại châu thổ sông Hồng và sông Cửu Long, nhiều bãi bùn và rừng ngập mặn phát triển, thuận lợi nuôi trồng thủy sản.\n+ Bờ biển mài mòn: tại các vùng chân núi và hải đảo như bờ biển từ Đà Nẵng đến TP Hồ Chí Minh rất khúc khuỷu, nhiều vũng vịnh, kín gió, nhiều bãi cát,...\n* Thềm lục địa:\n- Vùng biển Bắc Bộ và Nam Bộ: nông và mở rộng.\n- Vùng biển miền Trung: sâu và hẹp."],
["TN", "Trình bày ảnh hưởng của địa hình Việt Nam đến sự phân hóa tự nhiên.", "—— Ảnh hưởng của sự phân địa hình đến sự phân hóa tự nhiên\n* Độ cao địa hình ảnh hưởng đến sự phân hóa tự nhiên theo đai cao\n- Do nước ta chủ yếu là đồi núi thấp nên tính nhiệt đới được bảo toàn trên toàn bộ lãnh thổ\n- Ở các vùng núi, thiên nhiên có sự phân hóa theo đai cao có:\n+ Ở độ cao <600-700m (Miền Nam 900-1000m) .\n❖ Khí hậu: nhiệt đới ẩm gió mùa\n❖ Sinh vật: rừng mưa nhiệt đới, rừng nhiệt đới gió mùa phát triển trên đất feralit\n❖ Đất: feralit\n+ Ở độ cao 600-700m đến 2600m (Miền Nam: 900-1000m đến 2600m)\n❖ Khí hậu: Cận nhiệt gió mùa trên núi\n❖ Sinh vật: rừng lá rộng cận nhiệt đới (rừng lá kim) phát triển trên đất feralit giàu mùn\n+ Ở độ cao >2600m\n❖ Khí hậu: Ôn đới gió mùa trên núi\n❖ Sinh vật: pơ mu, sa mu, đỗ quyên\n❖ Đất: mùn thô\n* Một số dãy núi có vai trò là bức chắn địa hình tạo nên sự phân hóa thiên nhiên giữa hai sườn núi\n- Các cánh cung ở Đông Bắc (4CC) có tác động đón gió mùa Đông Bắc, làm cho mùa đông nơi đây đến sớm và kết thúc muộn, mùa đông lạnh và dài nhất vn\n- Dãy Hoàng Liên sơn chạy theo hướng TB-ĐN có tác động chắn gió mùa đông bắc, làm cho gió mùa đông bắc trở nên suy yếu và khiến cho mùa đông ở TB đến muộn kết thúc sớm, mùa đông ngắn và ít lạnh hơn ĐB\n- Dãy Trường Sơn gây nên hiệu ứng phơn, tạo nên sự khác biệt về thời gian mùa mưa giữa hai sườn núi\n- Dãy Bạch Mã ngăn cản ảnh hưởng của mùa đông xuống phía Nam, đây là ranh giới tự nhiên giữa hai miền khí hậu (miền Bắc có mùa đông. Miền Nam không có mùa đông). Chính vì vậy tự nhiên của 2 miền có sự khác biệt.\n* Sự phân bố của địa hình: núi và cao nguyên phân bố ở phía Tây, Bắc. Đồng bằng và thềm lục địa phân bố chủ yêu ở phía Đông, Nam nên thiên nhiên có sự phân hóa từ Tây sang Đông."],
["TN", "Trình bày ảnh hưởng của địa hình Việt Nam đối với khai thác kinh tế.", "—— Ảnh hưởng của sự phân địa hình đối với khai thác kinh tế\n* Đối với nông nghiệp:\n- Ở miền núi:\n+ Thổ nhưỡng và khí hậu thích hợp cho trồng cây công nghiệp lâu năm, cây ăn quả,...\n+ Có nguồn lâm sản phong phú thuận lợi phát triển ngành lâm nghiệp\n+ Các đồng cỏ tự nhiên rộng lớn tạo điều kiện phát triển chăn nuôi gia súc lớn như trâu, bò,...\n+ VD: vùng Tây Bắc, Đông Bắc, Tây Nguyên\n- Ở đồng bằng:\n+ Có địa hình đồng bằng, đất màu mỡ thuận lợi cho trồng trọt các cây lương thực, thực phẩm, cây ăn quả.\n+ CÓ địa hình bằng phẳng tạo điều kiện thuận lợi cho việc chăn nuôi các loại gia súc nhỏ (lợn) và gia cầm.\n* Đối với lâm nghiệp: Ở miền núi có nguồn lâm sản phong phú → thuận lợi phát triển ngành lâm nghiệp.\n* Đối với thủy sản: Ở khu vực đồng bằng có nguồn nước dồi dào, dân cư đông đúc → là vùng đánh bắt và nuôi trồng thủy sản chủ yếu của cả nước.\n* Đối với công nghiệp:\n- Ở khu vực đồi núi:\n+ Có nguồn tài nguyên khoáng sản phong phú, đa dạng → tạo điều kiện thuận lợi phát triển các ngành công nghiệp khai thác khoáng sản, luyện kim,...\n+ Sông ngòi chảy qua địa hình miền núi, nhiều thác ghềnh (sông Đà, Sê San, Sre Pôk) → có tiềm năng thủy điện rất lớn.\n- Ở khu vực đồng bằng: Do có nguồn nguyên liệu dồi dào, nguồn lao động đông, vị trí địa lí nhiều thuận lợi, cơ sở hạ tầng hiện đại nên phát triển công nghiệp chế biến.\n* Đối với xây dựng: Ở khu vực đồng bằng, địa hình bằng phẳng thuận lợi cho xây dựng cơ sở hạ tầng và cư trú → hình thành nhiều trung tâm kinh tế lớn như Hà Nội, Đà Nẵng, TP Hồ Chí Minh, Cần Thơ,...\n* Hạn chế:\n- Ở khu vực đồi núi: ĐH chia cắt mạnh gây khó khăn cho giao thông và cần chú ý đến công tác phòng, chống thiên tai như lũ quét, sạt lở,...\n- Ở khu vực đồng bằng: lịch sử khai thác lâu đời và dân cư tập trung đông đúc nên tài nguyên bị khai thác quá mức, môi trường một số nơi bị suy thoái."],
["TN", "Trình bày và giải thích đặc điểm chung của tài nguyên khoáng sản.", "- Cơ cấu: tài nguyên khoáng sản nước ta khá phong phú, đa dạng trên lãnh thổ VN:\n+ đã thăm dò được trên 5000 mỏ và điểm quặng của khoảng 60 loại khoáng sản. Trong đó có nhiều loại đã và đang được khai thác.\n+ Có 3 nhóm khoáng sản chính: KS năng lượng (than, dầu mỏ, khí tự nhiên); KS kim loại (sắt, đồng) và KS phi kim loại: apatít, đá vôi,...\n- Trữ lượng: phần lớn các mỏ khoáng sản nước ta có trữ lượng vừa và nhỏ, không thuận lợi cho việc khai thác và quản lí tài nguyên KS. Một số khoáng sản có trữ lượng lớn là than, dầu mỏ, khí tự nhiên. Một số loại KS có giá trị kinh tế cao như dầu mỏ, vàng, thiếc. Nguồn tài nguyên KS nước ta được khai thác để phục vụ cho sự phát triển kinh tế đất nước và tạo mặt hàng kinh tế xuất khẩu.\n- Phân bố:\n+ Rộng khắp cả nước, phân bố từ Bắc vào Nam, miền núi - đồng bằng, ven biển và thềm lụa địa.\n+ Phân bố ở nhiều núi (như than, sắt, thiếc) nhưng tập trung chủ yếu ở Đông Bắc, Bắc Trung Bộ (đá vôi, xi-măng, crôm,...) và phía Tây của vùng Duyên hải Nam Trung Bộ và Tây Nguyên (Tây Nguyên) như bô-xít,...\n- Nguyên nhân (Giải thích): KS VN được hình thành do sự tác động của nhiều nhân tố như VTĐL, địa chất nên có những đặc điểm trên.\n+ Sự phong phú, đa dạng của tài nguyên KS do nước ta có vị trí nằm ở nơi giao thoa giữa hai vành đai sinh khoáng lớn là Thái Bình Dương và Địa Trung Hải.\n+ Nước ta có lịch sử phát triển địa chất lâu dài và phức tạp, trải qua nhiều chu kì kiến tạo, mỗi chu kì có một hệ KS đặc trưng.\n❖ Các mỏ nội sinh thường hình thành ở các vùng có đứt gãy sâu, uốn nếp mạnh, có hoạt động mắc ma xâm nhập hoặc phun trào như vùng núi Đông Bắc, Tây Bắc, dãy Trường Sơn…\n❖ Các mỏ ngoại sinh hình thành từ quá trình trầm tích tại các vùng biển nông, vùng bờ biển hoặc các vùng trũng được bồi đắp, lắng đọng vật liệu từ các vùng uốn nếp cổ có chứa quặng…"],
["TN", "Trình bày đặc điểm phân bố của các loại khoáng sản chủ yếu.", "- Sự phân bố khoáng sản ở nước ta có liên quan mật thiết với sự phân hóa phức tạp đa dạng của các hoạt động địa chất nội sinh và ngoại sinh.\n+ Các mỏ khoáng sản nội sinh thường tập trung tại các đứt gãy sâu với hoạt động uốn nếp và mác-ma diễn ra mạnh mẽ.\n+ Các mỏ khoáng sản ngoại sinh tập trung chủ yếu ở vùng biển nông, thềm lục địa hoặc vùng trũng nội địa.\n- Khoáng sản phân bố ở hầu khắp cả nước:\n+ Than đá: tổng trữ lượng khoảng 7 tỉ tấn, phân bố ở một số nơi, lớn nhất là Quảng Ninh.\n+ Than nâu: phân bố nhiều ở Đồng bằng sông Hồng.\n+ Dầu mỏ và khí tự nhiên: tổng trữ lượng khoảng 10 tỉ tấn dầu quy đổi, phân bố chủ yếu ở thềm lục địa, lớn nhất là thềm lục địa phía đông nam.\n+ Bô-xít: tổng trữ lượng khoảng 9,6 tỉ tấn, phân bố nhiều ở các tỉnh thuộc phía Tây của DHNTB&TN (Tây Nguyên) như Lâm Đồng, Gia Lai, Quảng Ngãi; ngoài ra còn có ở một số tỉnh phía Bắc (Lạng Sơn, Cao Bằng, Tuyên Quang,...)\n+ A-pa-tít: tổng trữ lượng khoảng 2 tỉ tấn, phân bố nhiều ở tỉnh Lào Cai.\n+ Đá vôi: tổng trữ lượng lên đến 8 tỉ tấn, phân bố ở vùng núi phía Bắc và Bắc Trung Bộ.\n+ Sắt: tổng trữ lượng khoảng 1,1 tỉ tấn, phân bố chủ yếu ở khu vực Đông Bắc (Thái Nguyên, Lào Cai, Tuyên Quang,...) và Bắc Trung Bộ (Hà Tĩnh).\n+ Ti-tan: tổng trữ lượng khoảng 663 triệu tấn, phân bố rải rác ở ven biển từ Quảng Ninh đến TP Hồ Chí Minh."],
["TN", "Trình bày vấn đề sử dụng hợp lí nguồn tài nguyên khoáng sản.", "* Việc sử dụng hợp lí tài nguyên khoáng sản có ý nghĩa quan trọng vì:\n- KS có vai trò quan trọng đối với sự phát triển kinh tế - xã hội của đất nước, cung cấp nhiên liệu cho đời sống và sản xuất, cung cấp nguyên liệu cho nhiều ngành công nghiệp.\n- KS không phải là tài nguyên vô tận. Quá trình hình thành khoáng sản cần phải trải qua hàng triệu năm.\n- Việc khai thác và sử dụng KS còn chưa hợp lí gây lãng phí và ảnh hưởng tới môi trường và sự phát triển bền vững.\n* Một số giải pháp nhằm sử dụng hợp lí tài nguyên khoáng sản:\n- Phát triển các hoạt động điều tra, thăm dò, khai thác, chế biến, giảm thiểu các tác động tiêu cực đến môi trường sinh thái và cảnh quan.\n- Đẩy mạnh đầu tư, hình thành ngành khai thác, chế biến đồng bộ, hiệu quả với công nghệ tiên tiến, thiết bị hiện đại.\n- Hạn chế xuất khẩu khoáng sản thô, đẩy mạnh phát triển chế biến khoáng sản.\n- Bảo vệ khoáng sản chưa khai thác và sử dụng tiết kiệm tài nguyên khoáng sản.\n- Tăng cường tổ chức tuyên truyền, phổ biến, giáo dục pháp luật trong hoạt động khai thác và sử dụng khoáng sản."],
["TN", "Phân tích tính chất nhiệt đới và tính chất ẩm của khí hậu Việt Nam.", "a) Tính chất nhiệt đới\n- Biểu hiện:\n+ Nhiệt độ trung bình cao trên 20°C (trừ vùng núi cao), tăng dần từ Bắc vào Nam.\n+ Tổng số giờ nắng từ 1400-3000 giờ/năm.\n+ Biên độ nhiệt giảm dần từ Bắc vào Nam.\n+ Cán cân bức xạ luôn dương (từ 70-100 kcal/cm²/năm).\n+ Tổng lượng bức xạ từ 110-160 kcal/cm²/năm.\n⇒ Nguyên nhân: Do nước ta nằm trong khu vực nội chí tuyến Bắc bán cầu. Trong năm có 2 lần mặt trời lên thiên đỉnh nên chịu bức xạ lớn của Mặt trời → nhiệt độ cao.\nb) Tính chất ẩm\n- Biểu hiện:\n+ Lượng mưa trung bình lớn, từ 1500-2000mm/năm (những nơi đón gió có lượng mưa trung bình trên 3000mm/năm như Lũng Cú - Tuyên Quang, Huế. + Độ ẩm không khí cao trên 80%. + Cân bằng độ ẩm luôn dương. ⇒ Nguyên nhân: - Việt Nam nằm trong khu vực có khí hậu NĐẨGM với nhiệt độ cao trên 20°C, lượng mưa lớn từ 1500-2000mm/năm, độ ẩm cao trên 80%. - Việt Nam nằm tiếp giáp biển Đông là vùng dự trữ nhiệt ẩm dồi dào. Hơn nữa, lãnh thổ trải dài, hẹp ngang → khí hậu nước ta chịu ảnh hưởng sâu sắc của biển Đông. Biển Đông làm tăng cường tính chất ẩm và biến tính các khối khí trước khi thổi vào lãnh thổ đất liền VN, làm dịu mát vào mùa hạ và giảm tính chất hanh khô cho mùa đông. - Lãnh thổ trải dài, hẹp ngang kết hợp với sự phân bố địa hình: đồi núi phân bố chủ yếu ở phía Tây và phía Bắc. Vì vậy, gió thổi từ biển dễ dàng thâm nhập sâu vào đất liền. - Gió mùa và gió Tín Phong mang đến một lượng mưa lớn cho lãnh thổ Việt Nam. - Bão và áp thấp nhiệt đới gây mưa lớn."],
["TN", "Phân tích tính chất gió mùa của khí hậu Việt Nam.", "c) Tính chất gió mùa\n- Trong năm, VN chịu ảnh hưởng của gió mùa và gió Tín Phong.\n+ Gió mùa: do VN nằm ở khu vực hoạt động điển hình của gió mùa châu Á (Đông Nam Á)\n+ Gió Tín Phong: do VN nằm trong vành đai nhiệt đới nội chí tuyến Bắc bán cầu.\n- Các loại gió mùa:\nTính chất | Gió mùa mùa Đông (Gió mùa Đông Bắc)\nNguồn gốc | Cao áp xibia (khối khí lạnh phương Bắc thổi đến nước ta)\nThời gian | Tháng 11 → tháng 4 năm sau\nHướng | Đông Bắc\nPhạm vi | Miền Bắc\nTính chất | - Nửa đầu: lạnh, khô, mưa ít - Nửa sau: lạnh, ẩm, mưa phùn\n⇒ Viết bài | GMĐB hoạt động mạnh mẽ ở miền Bắc nước ta, gây một mùa đông lạnh cho miền Bắc. Càng vào Nam, GMĐB càng suy yếu và bị chặn lại tại dãy Bạch Mã. Từ phía Nam của dãy Bạch Mã không chịu ảnh hưởng của GMĐB nhưng do gió Tín Phong Đông Bắc bán cầu hoạt động mạnh mang đến một mùa khô sâu sắc và kéo dài cho Nam Bộ.\nTính chất | Gió mùa mùa Hạ (Gió mùa Tây Nam)\nNguồn gốc | - Đầu mùa: cao áp Bắc Ấn Độ Dương - Giữa và cuối mùa: cao áp cận chí tuyến Nam bán cầu.\nThời gian | Tháng 5 → tháng 10\nTính chất | Gió mùa mùa Hạ (Gió mùa Tây Nam)\nHướng | Tây Nam (Đông Nam ở miền Bắc)\nPhạm vi | Cả nước\nTính chất | - Đầu mùa hạ, GMTN xuất phát từ Bắc Ấn Độ Dương di chuyển vào nước ta theo hướng TN có tính chất nóng ẩm nên khi gặp ĐH đón gió gây mưa lớn cho Nam Bộ và Tây Nguyên. Khi vượt dãy Trường Sơn và khối núi dọc biên giới Việt Lào tạo hiệu ứng gió phơn Tây Nam khô, nóng do ĐBDHMT và phía Nam của Tây Bắc. - Giữa và cuối mùa hạ: GMTN xuất phát từ cao áp chí tuyến Nam bán cầu, vượt qua Xích đạo, di chuyển vào nước ta theo hướng Tây Nam với tính chất nóng ẩm, gây mưa lớn cho ĐH đón gió ở Tây Nguyên và Nam Bộ. Đặc biệt kết hợp với dải hội tụ nhiệt đới gây thời tiết nóng, ẩm, mưa nhiều cho toàn bộ 2 miền Bắc - Nam. Riêng đồng bằng Bắc Bộ do chịu ảnh hưởng của áp thấp Bắc Bộ nên GMTN đổi hướng thành GM Đông Nam. Đây cũng là thời kì có nhiều bão và các hiện tượng thời tiết cực đoan như giông, lốc."],
["TN", "Chứng minh khí hậu Việt Nam đa dạng (phân hóa theo Bắc - Nam, Tây - Đông).", "★ Khí hậu nước ta phân hóa đa dạng theo thời gian (mùa) và không gian (Chiều Bắc - Nam, Tây - Đông, độ cao).\n* Phân hóa theo chiều Bắc - Nam: Khí hậu nước ta phân làm 2 miền khí hậu:\n+ Miền KH phía Bắc: nằm ở phía Bắc của dãy Bạch Mã (từ vĩ tuyến 16°B trở ra) có khí hậu NĐẨGM, nhiệt độ trung bình năm trên 20°C. Trong năm chia làm 2 mùa là mùa đông và mùa hạ. Mùa đông lạnh, đầu mùa đông có thời tiết lạnh, khô, mưa ít; cuối mùa đông có thời tiết lạnh, ẩm, mưa phùn; mùa hạ nóng, ẩm, mưa nhiều.\n+ Miền KH phía Nam: nằm ở phía Nam dãy Bạch Mã trở vào có khí hậu cận xích đạo gió mùa (nhiệt độ cao quanh năm, nhiệt độ trung bình năm trên 25°C - không có tháng nào dưới 20°C, biên độ nhiệt nhỏ). Trong năm chia làm 2 mùa là mùa mưa và mùa khô tương phản nhau sâu sắc.\n+ Riêng khu vực ven biển miền Trung (từ 11°B - mũi Dinh đến 18°B - dãy Hoành Sơn) có mùa mưa lệch về thu-đông.\n* Phân hóa theo chiều Tây - Đông: Từ Tây sang Đông, KH nước ta có sự phân hóa giữa vùng biển và đất liền, giữa vùng đồng bằng ở phía Đông và vùng núi ở phía Tây (do ảnh hưởng của địa hình và hoạt động của các khối khí).\n+ Vùng biển: có khí hậu ôn hòa hơn trong đất liền.\n+ Vùng đồng bằng ven biển: có khí hậu nhiệt đới ẩm gió mùa.\n+ Vùng đồi núi phía Tây: có khí hậu phân hóa theo đai cao, do tác động của gió mùa và hướng của các dãy núi nên khí hậu phân hóa phức tạp."],
["TN", "Chứng minh khí hậu Việt Nam đa dạng (phân hóa theo độ cao, theo mùa) và thất thường.", "* Phân hóa theo độ cao: Ở các khu vực địa hình núi, khí hậu VN có sự phân hóa từ thấp đến cao. Có 3 đai khí hậu:\n+ Đai NĐẨGM: ở phía Bắc có độ cao dưới 600-700m, ở phía Nam là dưới 900-1000m. Đai NĐẨGM là KH thể hiện rõ tính chất NĐẨ, mùa hạ nóng, nhiệt độ trung bình đều trên 25°C. Độ ẩm và lượng mưa thay đổi tùy nơi.\n+ Đai cận nhiệt gió mùa trên núi: ở phía Bắc là từ 600-700m đến dưới 2600m, ở phía Nam từ 900-1000m đến dưới 2600m. Khí hậu mát mẻ, mưa nhiều, nhiệt độ trung bình các tháng đều dưới 25°C, lượng mưa và độ ẩm tăng lên.\n+ Đai ôn đới gió mùa trên núi: trên 2600m, khí hậu mang tính chất ôn đới, nhiệt độ quanh năm không vượt qua 15°C, mùa đông nhiệt độ hạ thấp, có thể có tuyết rơi.\n* Phân hóa theo mùa: Sự phân hóa của các loại gió mùa mùa hạ và mùa đông tạo nên 2 mùa đông - hạ sâu sắc ở miền Bắc, mùa khô - mưa tương phản rõ rệt ở miền Nam.\n★ Khí hậu nước ta thất thường thể hiện: có năm rét sớm, có năm rét muộn, có năm mưa lớn, có năm khô hạn, năm ít bão, năm nhiều bão. Do đó, công tác dự báo thời tiết và xác định thời vụ gặp nhiều khó khăn.\n⇒ Giải thích:\n- Do tác động tổng hợp của nhiều nhân tố như vị trí địa lí, hoàn lưu gió mùa, địa hình và các nhân tố khác…\n- Sự đa dạng của địa hình, nhất là độ cao và hướng núi.\n- Hoạt động của gió mùa, dải hội tụ nhiệt đới, bão,...\n- Tác động của các hiện tượng El nino, La nina."],
["TN", "Trình bày ảnh hưởng của khí hậu đến sản xuất nông nghiệp.", "a) Đối với sản xuất nông nghiệp:\n- Khí hậu nhiệt đới ẩm gió mùa tạo điều kiện để phát triển một nền nông nghiệp nhiệt đới có giá trị kinh tế cao: khí hậu nhiệt đới ẩm gió mùa (với nền nhiệt cao trên 20°C, độ ẩm lớn trên 80%, lượng mưa trung bình từ 1500-2000mm/năm) đã tạo điều kiện thuận lợi để cây trồng, vật nuôi sinh trưởng, phát triển quanh năm. Từ đó cho năng suất cao, tạo nên các sản phẩm nông nghiệp nhiệt đới có giá trị xuất khẩu cao như lúa gạo, cà phê, cao su, tiêu, điều, hoa quả nhiệt đới đặc trưng của Việt Nam.\n- Sự phân hóa khí hậu (theo chiều B-N, T-Đ, theo độ cao, theo mùa) đã tạo nên sự khác biệt về cơ cấu mùa vụ giữa các vùng, các địa phương giúp đa dạng sản phẩm nông nghiệp trên cả nước.\n+ Mỗi vùng có những thế mạnh riêng, tạo điều kiện để nước ta hình thành các vùng chuyên canh với nhiều loại cây trồng, vật nuôi khác nhau.\n+ Các khu vực địa hình núi và cao nguyên, khí hậu mát mẻ và sự phân hóa theo đai cao nên ngoài các cây trồng, vật nuôi nhiệt đới nước ta còn phát triển các loại cây trồng, vật nuôi có nguồn gốc cận nhiệt và ôn đới như chè, đào, lê, táo, mận,...\n+ Ngoài ra, sự phân hóa khí hậu từ Bắc vào Nam, từ Tây sang Đông và chịu tác động của gió mùa nên nước ta có cơ cấu sản phẩm nông nghiệp rất đa dạng và phong phú.\n- Tuy nhiên, khí hậu nước ta cũng gây nhiều khó khăn cho sản xuất nông nghiệp. Khí hậu nước ta có nhiều thiên tai như bão, giông, lũ, hạn hán, rét đậm rét hại, sương muối, biến đổi khí hậu,... làm thiệt hại cho sản xuất nông nghiệp. Môi trường nóng ẩm tạo điều kiện thuận lợi để sâu bệnh phát triển, ảnh hưởng tới năng suất và chất lượng nông sản."],
["TN", "Trình bày ảnh hưởng của khí hậu đến du lịch.", "b) Đối với du lịch:\n- KH có vai trò quan trọng đối với sự phát triển du lịch. Hoạt động du lịch nước ta có thể diễn ra quanh năm tùy vào điều kiện khí hậu trong từng khu vực. Khí hậu làm ảnh hưởng tới một số loại hình như: du lịch biển, du lịch nghỉ dưỡng, du lịch khám phá tự nhiên,...\n- Khí hậu nhiệt đới ẩm gió mùa có sự phân hóa đa dạng theo mùa và theo độ cao đã tác động trực tiếp đến sự hình thành các đặc điểm du lịch, loại hình du lịch,...\n+ Khí hậu đồi núi có khí hậu mát mẻ quanh năm, không khí trong lành thuận lợi phát triển các loại hình du lịch: nghỉ dưỡng, tham quan, khám phá,...\n+ Sự phân hóa khí hậu giữa 2 miền Bắc Nam ảnh hưởng đến mùa vụ du lịch của 2 miền. Ở miền Bắc do có mùa đông lạnh nên hoạt động du lịch biển thường diễn ra vào mùa hạ như: Sầm Sơn, Cửa Lò, Lăng Cô,... Ở vùng núi cao vào mùa đông, nhiệt độ giảm mạnh, có thể có tuyết rơi như Sapa (Lào Cai), Mẫu Sơn (Lạng Sơn),...\n+ Miền Nam quanh năm nóng, có nhiệt độ cao nên hoạt động du lịch diễn ra quanh năm như Phú Quốc, Nha Trang,...\n- Tuy nhiên, sự phân hóa mùa sâu sắc và các hiện tượng thời tiết thất thường như mưa lớn, bão, sạt lở,... là trở ngại lớn cho phát triển du lịch."],
["TN", "Trình bày ảnh hưởng của biến đổi khí hậu đối với yếu tố khí hậu.", "Biến đổi khí hậu đã và đang tác động đến khí hậu, tác động trực tiếp đến nhiệt độ, lượng mưa và các hiện tượng thời tiết cực đoan:\n- Nhiệt độ nước ta liên tục tăng (nhiệt độ trung bình tăng 0,89°C từ năm 1958 đến 2018).\n- Tổng lượng mưa có sự biến động từ 1958-2018.\n- Gia tăng các hiện tượng thời tiết cực đoan:\n+ Nhiệt độ buổi tối cao, số giờ nắng tăng trên cả nước.\n+ Số ngày rét đậm, rét hại có xu hướng giảm ở miền Bắc nhưng các đợt rét đậm, rét hại kỷ lục có xu hướng tăng, đặc biệt ở vùng núi phía Bắc.\n+ Số lượng bão và áp thấp nhiệt đới tăng, thất thường về cường độ và thời gian hoạt động.\n+ Vào mùa mưa có nhiều trận mưa lớn, kéo dài gây ngập úng, lũ quét, sạt lở,...\n⇒ Biến đổi khí hậu khiến thời tiết nước ta trở nên khắc nghiệt."],
["TN", "Trình bày đặc điểm chung của thủy văn Việt Nam.", "* Nước ta có mạng lưới sông ngòi dày đặc, phân bố rộng khắp cả nước:\n- Có tổng 2360 con sông, suối có chiều dài >10km.\n- Mật độ: 0,6 con sông, suối/km², đi dọc bờ biển 20km sẽ có 1 cửa sông.\n- Chủ yếu là các con sông nhỏ, ngắn, dốc.\n- Có 2 hệ thống sông lớn là sông Hồng và sông Mê Công nhưng chỉ có phần trung lưu và hạ lưu chảy trên lãnh thổ VN.\n⇒ Giải thích:\n+ Do có ĐH đồi núi chiếm ưu thế (¾ diện tích lãnh thổ) kết hợp với mưa nhiều, tập trung theo mùa nên nước ta có mạng lưới sông ngòi dày đặc.\n+ Chủ yếu ngắn, dốc, nhỏ do lãnh thổ hẹp ngang, địa hình dốc, núi ăn sát ra biển.\n* Sông ngòi nước ta chảy theo hai hướng chính là Tây Bắc - Đông Nam và vòng cung\n- Hướng Tây Bắc - Đông Nam: Sông Hồng, sông Cỏ, sông Tiền,...\n- Hướng vòng cung: sông Gâm, sông Thương, sông Cầu,...\n- Ngoài ra có một số sông chảy theo hướng Tây - Đông.\n⇒ Giải thích: do địa hình nước ta chủ yếu là đồi núi chạy theo hướng TB-ĐN và vòng cung.\n* Sông ngòi nước ta có chế độ dòng chảy phân thành 2 mùa rõ rệt là mùa lũ và mùa cạn\n- Mùa lũ: 70-80% lưu lượng nước cả năm.\n- Mùa cạn: 20-30% lưu lượng nước cả năm.\n⇒ Giải thích: VN có khí hậu mang tính chất NĐẨGM nên KH chia làm 2 mùa mưa - khô rõ rệt. Do đó, mùa mưa trùng với mùa lũ, mùa khô trùng với mùa cạn.\n* Sông ngòi nước ta nhiều nước, giàu phù sa\n- Tổng lượng nước cả năm của nước ta hơn 800 tỉ m³.\n- Lượng phù sa lớn, khoảng 200 triệu tấn/năm (riêng sông Hồng là 80 triệu tấn/năm, sông Cửu Long là 100 triệu tấn/năm).\n⇒ Giải thích: Do ¾ diện tích là đồi núi, dốc, mưa nhiều, tập trung theo mùa. Từ đó làm mất thảm thực vật, mưa lớn kéo theo lượng phù sa và lượng nước lớn bồi tụ tạo nên các con sông."],
["TN", "Trình bày đặc điểm sông Hồng.", "* Hệ thống sông Hồng:\n- Các con sông: sông Hồng, sông Đà, sông Lô, sông Gâm, sông Đáy,...\n- Hướng: Tây Bắc - Đông Nam.\n- Đặc điểm mạng lưới sông:\n+ Là hệ thống sông lớn thứ hai cả nước sau sông Mê Công.\n+ Chiều dài dòng chảy chính trên lãnh thổ nước ta dài 556km.\n+ Có trên 600 phụ lưu, trong đó có 2 phụ lưu chính là sông Đà và sông Lô.\n+ Tất cả các phụ lưu lớn hợp với dòng chảy chính tạo thành mạng lưới sông dạng nan quạt, hợp tại Việt Trì (Phú Thọ).\n- Đặc điểm chế độ nước sông: chia làm 2 mùa\n+ Mùa lũ bắt đầu từ tháng 6 → tháng 10, đỉnh lũ vào tháng 8, chiếm khoảng 75-80% tổng lượng nước cả năm.\n+ Mùa cạn bắt đầu từ tháng 11 đến tháng 5 năm sau, chiếm 20-25% tổng lượng nước cả năm.\n+ Chế độ sông thất thường, dễ gây lũ lụt.\n⇒ Giải thích: Do mạng lưới sông có hình nan quạt, sông dốc, nước chảy xiết, tụ về Việt Trì (Phú Thọ), thời gian mùa lũ và mùa mưa lại trùng nhau nên nước lũ tập trung nhanh, thất thường."],
["TN", "Trình bày đặc điểm sông Thu Bồn và sông Mê Công.", "* Hệ thống sông Thu Bồn:\n- Các con sông: sông Thu Bồn, sông Tranh, sông Cái, sông Vu Gia.\n- Hướng: Tây Nam - Đông Bắc.\n- Đặc điểm mạng lưới sông:\n+ Tổng chiều dài dòng chảy chính là 205km.\n+ Có khoảng 80 phụ lưu dài trên 10km.\n+ Các sông suối thường ngắn, dốc, phân thành nhiều khu vực độc lập.\n+ Mạng lưới sông hình nan quạt.\n- Đặc điểm chế độ nước sông:\n+ Mùa lũ lệch về thu-đông, mùa lũ dài 4 tháng (từ tháng 9 → tháng 12), chiếm 65% tổng lượng nước cả năm, đỉnh lũ vào tháng 11.\n+ Mùa cạn vào xuân và hạ, dài 8 tháng (từ tháng 1 → tháng 8), chiếm 35% lưu lượng nước cả năm.\n+ Lũ lên nhanh và đột ngột.\n⇒ Giải thích: do địa hình dốc, hẹp ngang, núi thấp dần ra biển, mạng lưới sông dạng nan quạt, chịu tác động mạnh của mưa và bão từ biển đổ vào.\n* Hệ thống sông Mê Công:\n- Các con sông: sông Tiền, sông Hậu,...\n- Hướng: Tây Bắc - Đông Nam\n- Đặc điểm mạng lưới sông:\n+ Là một trong những hệ thống sông lớn nhất trên thế giới, chảy qua 6 quốc gia, phần hạ lưu chảy trên lãnh thổ nước ta dài 230km.\n+ Có 286 phụ lưu (lớn nhất là sông Srê-Pôk).\n+ Hai chi lưu lớn nhất ở VN là sông Tiền và sông Hậu, được chia thành nhiều sông nhỏ với hệ thống kênh rạch chằng chịt.\n+ Mạng lưới sông có hình lông chim.\n- Đặc điểm chế độ nước sông:\n+ Mùa lũ từ tháng 7 → tháng 11, đỉnh lũ vào tháng 9, chiếm khoảng 80% lưu lượng nước cả năm.\n+ Mùa cạn từ tháng 12 → tháng 6 năm sau, chiếm khoảng 20% tổng lưu lượng nước cả năm.\n+ Lũ lên nhanh và rút chậm, tương đối điều hòa.\n⇒ Giải thích: do diện tích khu vực sông lớn, độ dốc nhỏ, sông có dạng hình lông chim và được điều tiết bởi hồ Tonlé Sap (Campuchia)."],
["TN", "Trình bày vai trò của hồ, đầm, nước ngầm.", "a) Hồ, đầm\n* VN có nhiều hồ, đầm phân bố rộng khắp cả nước.\n* Các hồ, đầm có sự khác nhau về nguồn gốc, tính chất, diện tích.\n+ Hồ, đầm có nguồn gốc tự nhiên: Hồ Tây - Hồ Gươm (Hà Nội), Đầm Thị Nại,...\n+ Hồ, đầm có nguồn gốc nhân tạo: hồ thủy điện Hòa Bình, Hồ Ba Bể.\n* Hồ, đầm đóng vai trò quan trọng trong sản xuất và sinh hoạt hằng ngày.\n- Đối với sản xuất:\n+ Nông nghiệp: Các hồ, đầm nước ngọt là nguồn cung cấp nước cho trồng trọt và chăn nuôi. Hồ, đầm là mặt nước tự nhiên để nuôi trồng, đánh bắt thủy sản nước ngọt, nước lợ, nước mặn.\n+ Công nghiệp: các hồ thủy điện (Hòa Bình, Sơn La,...) là nơi lưu trữ nước cho nhà máy thủy điện, cung cấp nước cho các ngành công nghiệp như: chế biến lương thực - thực phẩm, khai khoáng.\n+ Dịch vụ: một số hồ, đầm với các sông, biển có giá trị về giao thông. Nhiều hồ, đầm có cảnh quan đẹp, hệ sinh thái và tính đa dạng sinh học cao. Khí hậu trong lành được khai thác để phát triển du lịch (hồ Tơ Nưng - Gia Lai, hồ Ba Bể - Thái nguyên),\n- Đối với sinh hoạt:\n+ Phục vụ nhu cầu sinh hoạt, nguồn dự trữ nước ngọt lớn.\n+ Đóng vai trò đảm bảo an ninh nguồn nước, nhất là các khu vực có mùa khô sâu sắc.\nb) Nước ngầm\n* VN có nhiều nguồn nước ngầm khá phong phú, phân bố khắp cả nước.\n* Nước ngầm có vai trò quan trọng đối với sản xuất và sinh hoạt của con người:\n- Đối với sản xuất:\n+ Nông nghiệp: nước ngầm cung cấp nước cho sản xuất nông nghiệp (trồng trọt, chăn nuôi, nuôi trồng thủy sản), đặc biệt với những vùng khan hiếm nước như vùng DHNTB&TN.\n+ Công nghiệp: nước ngầm được sử dụng trong ngành chăn nuôi như chế biến lương thực, thực phẩm, sản xuất giấy,...\n+ Dịch vụ: một số nguồn nước nóng, nước khoáng được khai thác để chữa bệnh và phát triển du lịch nghỉ dưỡng.\n- Đối với sinh hoạt: nước ngầm là nguồn nước quan trọng trong phục vụ sinh hoạt của người dân, đặc biệt là khu vực đông dân, thành phố lớn.\n* Ngoài ra, ở một số tỉnh có nguồn nước khoáng, nước nóng như Vĩnh Hảo (Lâm Đồng), Kim Bôi (Phú Thọ),... có tác dụng tốt đối với sức khỏe nên có thể khai thác."],
["TN", "Chứng minh tầm quan trọng của việc sử dụng tổng hợp tài nguyên nước đối với sản xuất và sinh hoạt.", "với sản xuất và sinh hoạt\n* Vai trò của sông ngòi:\n+ Cung cấp nước cho sản xuất công nghiệp, nuôi trồng thủy sản và sinh hoạt của người dân.\n+ Phát triển giao thông đường sông.\n+ Phát triển thủy điện.\n+ Cung cấp thực phẩm.\n+ Phát triển các ngành du lịch.\n* Hiện trạng tài nguyên nước: nước ở một số lưu vực sông chưa được sử dụng hiệu quả dẫn đến lãng phí và ô nhiễm nguồn nước.\n* Ý nghĩa:\n- Sử dụng tổng hợp tài nguyên nước sông sẽ mang lại hiệu quả kinh tế cao, đáp ứng nhu cầu sử dụng nước của các ngành kinh tế.\n- Hạn chế lãng phí nước và bảo vệ tài nguyên nước, hệ sinh thái ở lưu vực sông.\n- Góp phần làm chống thiên tai: bão, lũ trong bối cảnh biến đổi khí hậu."],
["TN", "Trình bày ảnh hưởng của biến đổi khí hậu đối với yếu tố thủy văn.", "Thủy văn nước ta chịu tác động mạnh mẽ bởi biến đổi khí hậu: làm thay đổi chế độ dòng chảy, gia tăng thiên tai và hiện tượng nước biển dâng.\n- Biến động của lượng mưa khiến chế độ dòng chảy sông nước ta có sự biến đổi mạnh và bất thường:\n+ Mùa lũ: lũ lên nhanh, bất thường, mực nước sông dâng cao.\n+ Mùa cạn: dòng chảy sông giảm mạnh, mực nước sông hạ thấp gây thiếu nước cho sản xuất và sinh hoạt.\n⇒ Chế độ dòng chảy có sự chênh lệch giữa các mùa và các hệ sống sông.\n- Làm gia tăng các hiện tượng như lũ lụt, sạt lở, hạn hán,...\n- Biến đổi khí hậu gây tình trạng nước biển dâng. Mực nước tại các trạm hải văn ven biển nước ta đã tăng trung bình 2,75mm/năm."],
["TN", "Trình bày tính chất nhiệt đới ẩm gió mùa của lớp phủ thổ nhưỡng.", "Lớp phủ thổ nhưỡng phản ánh đặc điểm chung của tự nhiên Việt Nam. Khí hậu nhiệt đới ẩm gió mùa khiến quá trình phong hóa đá mẹ diễn ra mạnh mẽ tạo nên lớp phủ thổ nhưỡng dày.\n- Quá trình feralit là quá trình hình thành đặc trưng của vùng nhiệt đới ẩm gió mùa.\n- Khí hậu NĐẨGM (với nhiệt độ cao trên 20 độ C, độ ẩm >80%, lượng mưa trung bình từ 1500-2000mm) kết hợp với địa hình dốc, lượng mưa lớn, tập trung theo mùa (mùa mưa kéo dài từ 4-5 tháng) làm rửa trôi các base và tích tụ các oxide sắt, oxide nhôm tạo nên đất feralit điển hình của thổ nhưỡng Việt Nam, phân bố nhiều nơi trên cả nước (vùng Duyên hải Nam Trung Bộ và Tây Nguyên, duyên hải miền Trung, Bắc Bộ).\n- Trong điều kiện nhiệt độ cao và độ ẩm lớn, độ mưa theo mùa đã đẩy mạnh xói mòn, rửa trôi. Đặc biệt ở các vùng núi bị mất thảm thực vật, quá trình này đã làm mỏng tầng đất ở đỉnh, sườn núi và tích lũy vật chất ở chân đồi núi.\n- Đất bị xói mòn và rửa trôi sẽ theo các dòng chảy ra sông ngòi và bồi tụ ở vùng đồng bằng, hình thành nên đất phù sa tại các khu vực chuyển tiếp địa hình giữa đồi và đồng bằng, quá trình đá ong hóa làm cho đất bị suy thoái và bạc màu.\n- Ở các vùng trũng do nước bị ứ đọng nên hình thành đất gây khó khăn trong việc sản xuất."],
["TN", "Trình bày đặc điểm và phân bố đất feralit. Giá trị sử dụng của đất feralit.", "* Đặc điểm và phân bố:\n- Đất feralit phân bố rộng khắp cả nước, chiếm khoảng 65% diện tích đất tự nhiên, phân bố ở các tỉnh trung du và miền núi, từ độ cao khoảng 1600-1700 mm trở xuống.\n- Đất feralit chứa nhiều oxide sắt và oxide nhôm nên có màu đỏ vàng đặc trưng. Các hợp chất này tích tụ thành kết von hoặc thành đá ong nằm cách mặt đất khá sâu từ 0,5m đến 1m. Khi đá ong bị mất lớp phủ thực vật và lộ thiên thì khô cứng lại, đất bị xấu đi nhanh chóng và không thể canh tác, trồng trọt được.\n- Đặc tính của đất: lớp vỏ phong hóa dày, thoáng khí, dễ thoát nước, đất chua, nghèo các chất base và mùn.\n- Đất feralit bao gồm 3 nhóm chính hình thành trên đá vôi, trên đá bazan và các loại đá khác.\n+ Đất feralit hình thành trên đá vôi: phân bố tại vùng Trung du và miền núi phía Bắc và Bắc Trung Bộ, đất rất màu mỡ, tầng đất dày.\n+ Đất feralit hình thành trên đá bazan: phân bố tại phía Tây của Duyên hải Nam Trung Bộ và Tây Nguyên (Tây Nguyên) và Đông Nam Bộ. Đất có độ phì cao, tầng đất mỏng.\n→ Đất feralit hình thành trên đá vôi và đá bazan có độ phì cao nên có giá trị kinh tế cao, thích hợp để trồng rừng, cây công nghiệp lâu năm, trồng cỏ.\n+ Đất feralit hình thành trên các loại đá khác: phân bố rộng khắp cả nước.\n* Giá trị sử dụng:\n- Trong lâm nghiệp: một trong số loại rừng sản xuất với các loại cây như thông, bạch đàn, xà cừ, keo,... cung cấp nguyên liệu cho ngành khai thác và chế biến gỗ.\n- Trong nông nghiệp: đất feralit được khai thác và sử dụng chủ yếu để trồng các cây công nghiệp lâu năm như chè, cà phê, cao su, hồ tiêu,...; cây ăn quả như xoài, sầu riêng, cam, cam, đào, lê,...; cây dược liệu như hồi, quế, sâm,..."],
["TN", "Trình bày đặc điểm và phân bố đất phù sa. Giá trị sử dụng của đất phù sa.", "* Đặc điểm và phân bố:\n- Đất phù sa chiếm khoảng 24% diện tích đất tự nhiên, phân bố nhiều ở các vùng trũng thấp, chủ yếu ở đồng bằng sông Hồng, đồng bằng sông Cửu Long, đồng bằng duyên hải miền Trung.\n- Đất phù sa ở đồng bằng sông Hồng: ít chua, tơi xốp, giàu chất dinh dưỡng.\n+ Đất ngoài đê (đất bãi bồi): được bồi đắp phù sa hằng năm.\n+ Đất trong đê: không được bồi đắp phù sa hằng năm.\n- Đất phù sa ở đồng bằng sông Cửu Long:\n+ Đất phù sa ngọt có độ phì cao, phân bố thành một dải dọc sông Tiền và sông Hậu\n+ Đất phèn phân bố tập trung ở Đồng Tháp Mười, tứ giác Long Xuyên, vùng trung tâm bán đảo Cà Mau.\n+ Đất mặn phân bố thành một dải ven biển.\n- Đất phù sa ở đồng bằng ven biển miền Trung: có độ phì thấp hơn, nhiều cát, ít phù sa sông do biển đóng vai trò chủ yếu trong quá trình hình thành.\n* Giá trị sử dụng:\n- Trong nông nghiệp: phù hợp để sản xuất cây lương thực (ngô, lúa,...), cây công nghiệp hằng năm (dâu tằm, thuốc lá,...) và cây ăn quả.\n- Trong thủy sản: đất phù sa ở các vùng cửa sông ven biển có nhiều thuận lợi để phát triển ngành thủy sản. Vùng đất phèn, đất mặn tạo điều kiện thuận lợi cho việc đánh bắt thủy sản như tôm, cua, cá. Ở các rừng ngập mặn ven biển, các bãi triều ngập nước và ở cửa sông lớn thuận lợi cho nuôi trồng nhiều loại thủy sản nước lợ và nước mặn khác, nhiều nhất là cá và tôm."],
["TN", "Trình bày đặc điểm và phân bố đất mùn núi cao. Giá trị sử dụng của đất mùn núi cao.", "* Đặc điểm và phân bố:\n- Đất mùn núi cao chiếm khoảng 11% diện tích đất tự nhiên.\n- Đất mùn trên núi phân bố rải rác ở các vùng núi có độ cao từ 1600-1700m trở lên.\n- Đất mùn trên núi được hình thành trong điều kiện khí hậu cận nhiệt và ôn đới, núi cao. Càng lên cao, nhiệt độ không khí giảm dần, đất feralit chuyển sang các loại đất mùn feralit và đất mùn núi cao.\n- Nhiệt độ thấp nên quá trình phân hóa, phân giải các chất hữu cơ diễn ra chậm nên đất giàu mùn, thường có màu đen, màu nâu đen; địa hình cao, dốc lớn nên tầng đất mỏng.\n* Giá trị sử dụng:\n- Đất mùn trên núi phù hợp phát triển cây công nghiệp cận nhiệt như: chè, dược liệu, hồi quế,...; cây ăn quả ôn đới: đào, lê, táo, mận,...\n- Ngoài ra còn phù hợp trồng rừng đầu nguồn."],
["TN", "Trình bày tính cấp thiết của vấn đề chống thoái hóa đất.", "- Quá trình thoái hóa đất xảy ra nhanh do chịu ảnh hưởng của khí hậu NĐẨGM, tác động của biến đổi khí hậu, việc sử dụng đất chưa hợp lí gây tình trạng mất rừng và các hoạt động kinh tế - xã hội. Do đó làm giảm khả năng sản xuất nông nghiệp, lâm nghiệp, thủy sản → gây áp lực lên việc sử dụng tài nguyên đất. Diện tích đất bị thoái hóa ở Việt Nam là 10 triệu ha và chiếm khoảng 30% diện tích đất cả nước.\n+ Diện tích đất ở trung du và miền núi bị rửa trôi, xói mòn, bạc màu trở nên khô cằn, nghèo dinh dưỡng.\n+ Nguy cơ hoang mạc hóa ở khu vực duyên hải miền Trung.\n+ Mặn hóa, phèn hóa ở các vùng cửa sông, ven biển đồng bằng sông Cửu Long.\n+ Ô nhiễm đất ở các thành phố.\n+ Đất canh tác, nhất là đất trồng trọt bị suy thoái, giảm độ phì, bạc màu do khai thác quá mức và sử dụng nhiều phân hóa học.\n+ Diện tích đất phèn, đất mặn có xu hướng ngày càng tăng.\n- Nguyên nhân do tự nhiên và tác động của con người:\n+ Tự nhiên: nước ta có ¾ diện tích đất ở vùng đồi núi, có độ dốc cao, lượng mưa lớn và tập trung theo mùa nên gây xói mòn, rửa trôi đất.\n+ Biến đổi khí hậu làm gia tăng tình trạng hạn hán, ngập lụt, nước biển dâng nên đất nhiều nơi bị thoái hóa do nhiễm phèn, nhiễm mặn, ngập úng.\n+ Tác động của con người: nạn phá rừng để lấy gỗ, đất rừng làm nương rẫy gây nên xói mòn và rửa trôi lớp đất mặn làm cho đất trở nên bạc màu.\n+ Sử dụng để sản xuất nông nghiệp, chưa quan tâm đến cải tạo đất, lạm dụng các chất hóa học sản xuất làm cho đất bị thoái hóa, suy giảm độ phì.\n- Biện pháp:\n+ Bảo vệ rừng, trồng rừng, phục hồi rừng, tạo lớp phủ bảo vệ.\n+ Củng cố và hoàn thiện cơ sở hạ tầng để duy trì nước ngọt, hạn chế tối đa tình trạng khô hạn, mặn hóa,...; các hạ tầng đê ven biển, hạ tầng công trình thủy lợi.\n+ Bổ sung các chất hữu cơ cho đất.\n+ Thực hiện các biện pháp canh tác bền vững trên đất dốc.\n+ Thực hiện nghiêm luật đất đai do nhà nước ban hành.\n+ Thay thế dần các loại phân bón, thuốc trừ sâu hóa học bằng các loại phân bón và thuốc trừ sâu vi sinh có loại cho đất và làm tăng độ phì của đất.\n+ Kiểm soát nguồn rác thải ra môi trường.\n+ Tuyên truyền, nâng cao ý thức của người dân trong việc bảo vệ tài nguyên."],
["TN", "Chứng minh sự đa dạng sinh vật ở Việt Nam.", "Sự phong phú và đa dạng của sinh vật Việt Nam thể hiện ở sự đa dạng về thành phần loài, gen di truyền và hệ sinh thái.\n* Đa dạng về hệ sinh thái: Các hệ sinh thái ở nước ta rất phong phú và đa dạng, bao gồm các hệ sinh thái tự nhiên trên cạn, hệ sinh thái tự nhiên dưới nước và hệ sinh thái nhân tạo.\n- Hệ sinh thái tự nhiên trên cạn: là các hệ sinh thái rừng khác nhau, phổ biến nhất là rừng mưa nhiệt đới và rừng nhiệt đới gió mùa với lớp phủ thực vật rậm rạp, nhiều tầng tán, thành phần loài phong phú. Ngoài ra còn có các hệ sinh thái rừng cận nhiệt, rừng ôn đới núi cao, cây cỏ - cây bụi, rừng thưa,...\n- Hệ sinh thái dưới nước: là các hệ sinh thái nước mặn, nước ngọt, nước lợ. Các hệ sinh thái nước mặn, nước lợ điển hình là rừng ngập mặn, cỏ biển, rạn san hô, đầm phá ven biển,... và hệ sinh thái biển chia thành các vùng nước theo độ sâu. Các hệ sinh thái nước ngọt ở sông, suối, ao, hồ,...\n- Hệ sinh thái nhân tạo: hình thành do hoạt động sản xuất nông - lâm - thủy sản cũng rất đa dạng như: hệ sinh thái đồng ruộng, vườn làng, hệ sinh thái nuôi trồng thủy sản, rừng trồng,... Các hệ sinh thái nhân tạo ngày càng mở rộng.\n* Đa dạng về thành phần loài: Có hơn 50.000 loài sinh vật, trong đó có nhiều loài sinh vật quý hiếm (sâm Ngọc Linh, trầm hương,...) và động vật quý hiếm (sala, bò tót, trì, cóng,...). VN là một trong 16 quốc gia sở hữu sự đa dạng sinh học cao nhất thế giới.\n* Đa dạng về nguồn gen di truyền: Ở nước ta, số lượng cá thể trong mỗi loài động vật, thực vật, vi sinh vật và nấm tương đối lớn đã tạo nên sự đa dạng nguồn gen di truyền. Trong đó có nhiều nguồn gen quý đã tạo nên sự đa dạng và giàu có của sinh vật Việt Nam."],
["TN", "Trình bày tính cấp thiết của vấn đề bảo tồn đa dạng sinh học ở Việt Nam (biểu hiện suy giảm).", "Tính đa dạng sinh học ở nước ta đang ngày càng bị suy giảm nghiêm trọng, nên việc bảo tồn đa dạng sinh học đã trở thành vấn đề cấp thiết ở nước ta hiện nay.\n* Biểu hiện:\n- Suy giảm số lượng cá thể, loài sinh vật: Số lượng cá thể các loài thực vật, động vật hoang dã suy giảm nghiêm trọng. Một số loài động vật và thực vật có nguy cơ tuyệt chủng như nhiều loại gỗ quý (đinh, lim, sến,...); nhiều loài động vật hoang dã quý hiếm (vai, hổ, sao la,...). Theo tổ chức liên minh bảo tồn thiên nhiên quốc tế (IUCN), năm 2020, VN có nhiều loài động vật bị đe dọa tuyệt chủng như loài lưỡng cư (53 loài), thú (75 loài), bò sát (75 loài), cá (136 loài).\n- Suy giảm hệ sinh thái: Các hệ sinh thái rừng nguyên sinh bị phá hoại gần hết, chỉ còn chủ yếu là rừng thứ sinh, các hệ sinh thái rừng ngập mặn, các hệ sinh thái biển cũng đứng trước nguy cơ bị tàn phá bởi con người. VN hiện nay có khoảng 70% diện tích rừng tự nhiên là rừng nghèo và rừng mới phục hồi. Sự biến đổi các hệ sinh thái rừng tự nhiên làm cho các loài sinh vật hoang dã mất môi trường sông.\n- Suy giảm về nguồn gen: Sự suy giảm các hệ sinh thái tự nhiên và thành phần loài sinh vật làm cạn kiệt và biến mất một số nguồn gen tự nhiên, nhiều nguồn gen bị suy giảm, trong đó có nhiều giống bản địa quý hiếm."],
["TN", "Nêu nguyên nhân suy giảm đa dạng sinh học và các biện pháp bảo tồn ở Việt Nam.", "* Nguyên nhân: do cả yếu tố tự nhiên và hoạt động của con người.\n- Do tự nhiên: biến đổi khí hậu với những hệ quả như bão, lũ lụt, hạn hán, cháy rừng,... làm suy giảm đa dạng sinh học nhanh hơn, trầm trọng hơn, nhất là các hệ sinh thái rừng và hệ sinh thái ven biển.\n- Do hoạt động của con người như: khai thác lâm sản, đốt rừng làm nương rẫy, du canh du cư, sử dụng động - thực vật hoang dã cho nhu cầu đời sống, đánh bắt thủy sản quá mức, ô nhiễm môi trường do chất thải sinh hoạt và sản xuất, sự xâm nhập các loài ngoại lai.\n* Biện pháp:\n- Xây dựng các khu bảo tồn thiên nhiên và vườn quốc gia nhằm bảo vệ và khôi phục một số hệ sinh thái tự nhiên, rừng nguyên sinh và động - thực vật quý hiếm.\n- Tăng cường trồng rừng và bảo vệ rừng tự nhiên - nơi sinh sống của nhiều loài sinh vật.\n- Ngăn chặn nạn phá rừng, săn bắt động vật hoang dã trái phép, khai thác và đánh bắt thủy sản quá mức.\n- Xử lí các chất thải công nghiệp, nông nghiệp và sinh hoạt nhằm giảm thiểu ô nhiễm môi trường sống của các loài sinh vật.\n- Nâng cao ý thức của người dân về bảo vệ đa dạng sinh học."],
["TN", "Trình bày khái quát đặc điểm biển Đông.", "- Diện tích: 3,44 triệu km² (lớn thứ 2 TBD, thứ 3 thế giới). Trong đó, diện tích biển của VN là 1 triệu km² (chiếm khoảng 30% diện tích biển Đông).\n- Tọa độ ĐL:\n+ Vĩ độ: 26°B → 3°N.\n+ Kinh độ: 100°Đ → 121°Đ.\n+ Biển Việt Nam: kéo dài từ 6°50’B và từ 101°Đ → 117°20’Đ.\n- Các nước chung biển Đông: Trung Quốc, Thái Lan, Campuchia, Malaysia, Indonesia, Singapore, Brunei, Philippines.\n- Đặc điểm chung: Biển Đông là vùng biển tương đối kín, được bao bọc bởi đất liền và các đảo, quần đảo, có khí hậu nhiệt đới gió mùa hải dương (nhiệt đới ẩm gió mùa)"],
["TN", "Trình bày các bộ phận vùng biển của Việt Nam: đường cơ sở, nội thủy, lãnh hải, vùng tiếp giáp lãnh hải.", "- Đường cơ sở là căn cứ để xác định phạm vi, chiều rộng lãnh hải của lục địa VN và các vùng biển khác. Đường cơ sở để tính chiều rộng lãnh hải của lục địa VN, là đường thẳng gãy khúc nối liền các điểm từ 0 đến A11.\n- Nội thủy là vùng nước tiếp giáp với bờ biển ở phía trong đường cơ sở và là bộ phận của lãnh thổ VN.\n- Lãnh hải là vùng biển có chiều rộng 12 hải lí tính từ đường cơ sở ra phía biển. Ranh giới ngoài của lãnh hải là đường biên giới quốc gia trên biển của VN.\n- Vùng tiếp giáp lãnh hải là vùng biển tiếp liền và nằm ngoài lãnh hải VN, có chiều rộng 12 hải lí tính từ ranh giới phía ngoài của lãnh hải ra phía biển.\n→ Nhà nước có quyền thực hiện các biện pháp để bảo vệ an ninh quốc phòng, kiểm soát thuế quan, quy định về y tế, môi trường nhập cư."],
["TN", "Trình bày các bộ phận vùng biển của Việt Nam: vùng đặc quyền kinh tế, thềm lục địa và tọa độ các điểm đường cơ sở.", "- Vùng đặc quyền kinh tế là vùng biển tiếp liền và nằm ngoài lãnh hải của VN, hợp với lãnh hải thành một vùng biển có chiều rộng 200 hải lí tính từ đường cơ sở ra phía biển.\n- Thềm lục địa là đáy biển và lòng đất dưới đáy biển, tiếp liền và nằm ngoài lãnh hải VN, trên toàn bộ phần kéo dài tự nhiên của lãnh thổ đất liền, các đảo và quần đảo của VN đến mép ngoài của rìa lục địa.\n+ [Miền Trung]: Trong trường hợp mép ngoài của rìa lục địa này cách đường cơ sở chưa đủ 200 hải lí thì thềm lục địa nơi đó được kéo dài đến 200 hải lí tính từ đường cơ sở.\n+ [Miền Bắc, Nam]: Trong trường hợp mép ngoài của rìa lục địa này vượt quá 200 hải lí tính từ đường cơ sở thì thềm lục địa ở nơi đó được kéo dài không quá 350 hải lí tính từ đường cơ sở hoặc không quá 100 hải lí tính từ đường đẳng sâu 2500m.\n→ Nhà nước có chủ quyền hoàn toàn về mặt thăm dò, khai thác và bảo vệ, quản lí tài nguyên thiên nhiên ở thềm lục địa Việt Nam.\nTỌA ĐỘ CÁC ĐIỂM ĐƯỜNG CƠ SỞ DÙNG ĐỂ TÍNH CHIỀU RỘNG LÃNH HẢI CỦA LỤC ĐỊA VIỆT NAM TRÊN BIỂN ĐÔNG\n- Mốc 0 - ranh giới phía Tây Nam của vùng nước lịch sử của nước Cộng hòa xã hội chủ nghĩa Việt Nam và Cộng hòa nhân dân Campuchia.\n- Mốc A1 - hòn Nhạn, quần đảo Thổ Chu, tỉnh An Giang.\n- Mốc A2 - hòn Đá Lẻ ở Đông Nam Hòn Khoai, tỉnh Cà Mau.\n- Mốc A3 - hòn Tài Lớn, Côn Đảo (TP Hồ Chí Minh).\n- Mốc A4 - hòn Bông Lang, Côn Đảo (TP Hồ Chí Minh).\n- Mốc A5 - hòn Bảy Cạnh, Côn Đảo (TP Hồ Chí Minh).\n- Mốc A6 - hòn Hải (nhóm đảo Phú Quý), tỉnh Lâm Đồng.\n- Mốc A7 - hòn Đôi, tỉnh Khánh Hòa.\n- Mốc A8 - mũi Đại Lãnh, tỉnh Khánh Hòa.\n- Mốc A9 - hòn Ông Căn, tỉnh Gia Lai.\n- Mốc A10 - đảo Lý Sơn, tỉnh Quảng Ngãi.\n- Mốc A11 - đảo Cồn Cỏ, tỉnh Quảng Trị."],
["TN", "Trình bày đặc điểm địa hình của vùng biển - đảo Việt Nam.", "* Địa hình:\n- Địa hình ven biển rất đa dạng, bao gồm các dạng địa hình: mài mòn, bờ biển bồi tụ, cồn cát, vũng vịnh, đầm phá, vùng nước sâu, tam giác châu,...\n- Địa hình thềm lục địa: là vùng thềm lục địa được tiếp nối với địa hình trên đất liền, tạo nên sự thống nhất về tự nhiên giữa đất liền và vùng biển Việt Nam.\n+ Bắc Bộ và Nam Bộ: Thềm lục địa nông và rộng, có 2 vịnh là vịnh Thái Lan và vịnh Bắc Bộ.\n+ Trung Bộ: thềm lục địa sâu và hẹp.\n- Đảo: Việt Nam có hàng nghìn đảo và quần đảo, phân bố rộng khắp lãnh thổ. Trong đó có 2 quần đảo lớn nhất là Hoàng Sa (Đà Nẵng) và Trường Sa (Khánh Hòa); 2 đảo lớn nhất là đảo Phú Quốc (An Giang) và Cát Bà (Hải Phòng). Các đảo ven bờ của nước ta tập trung chủ yếu ở vùng biển phía Bắc (Hải Phòng, Quảng Ninh,...) và vùng biển phía Nam (TP.Hồ Chí Minh, Khánh Hòa, An Giang,...).\n+ Khái quát chung: Các đảo, quần đảo của nước ta có độ cao không lớn, một số đảo thường bị thủy triều làm ngập.\n+ Phía Bắc: có các đảo, quần đảo có nguồn gốc hình thành từ đá vôi, có dạng địa hình cacxtơ (karst), tiêu biểu là vùng biển Hải Phòng, Quảng Ninh: Vịnh Hạ Long.\n+ Phía Nam: nhiều đảo, quần đảo có nguồn gốc từ san hô."],
["TN", "Trình bày đặc điểm khí hậu và hải văn của vùng biển - đảo Việt Nam.", "* Khí hậu: Mang tính chất Nhiệt đới gió mùa hải dương (Nhiệt đới ẩm gió mùa).\n- Nhiệt độ:\n+ Nhiệt độ trung bình của nước biển tầng mặt là >23°C/năm.\n+ Nhiệt độ trung bình năm của vùng biển là 23-28°C.\n+ Mùa hè nhiệt độ cao, ít chênh lệch giữa các vùng biển.\n+ Mùa đông nhiệt độ tăng dần từ Bắc vào Nam.\n+ Biên độ nhiệt năm của vùng biển, đảo thấp hơn trên đất liền.\n- Hướng gió:\n+ Từ tháng 10 → tháng 4 năm sau: có gió mùa Đông Bắc và gió Tín Phong Đông Bắc chiếm ưu thế.\n+ Từ tháng 5 → tháng 9 có gió mùa Tây Nam chiếm ưu thế, riêng vịnh Bắc Bộ, gió chủ yếu có hướng Đông Nam.\n+ Gió trên biển mạnh hơn nhiều so với trên đất liền.\n- Lượng mưa: Lượng mưa trên biển thấp hơn trên đất liền, chỉ khoảng 1100mm/năm. Lượng mưa trên các đảo, quần đảo lớn hơn trên biển và trên đất liền.\n- Khó khăn: Vùng biển nước ta chịu nhiều thiên tai như bão, áp thấp nhiệt đới, dông, lốc,... Trung bình mỗi năm có từ 5-6 cơn bão đổ bộ vào nước ta.\n* Hải văn:\n- Độ muối trung bình từ 32-33‰ (mùa hạ mặn hơn), có sự thay đổi theo mùa, theo khu vực và độ sâu.\n- Dòng biển:\n+ Cường độ dòng biển thay đổi theo mùa. Dòng biển mùa đông chảy mạnh hơn dòng biển mùa hạ\n+ Vào mùa đông, dòng biển có hướng Đông Bắc - Tây Nam. Vào mùa hạ, dòng biển có hướng Tây Nam - Đông Bắc.\n+ Ngoài ra còn có các trồi nước lạnh, vận động lên xuống theo chiều thẳng đứng, kéo theo dinh dưỡng cho các sinh vật biển.\n- Chế độ thủy triều đa dạng: nhật triều đều, nhật triều không đều, bán nhật triều đều, bán nhật triều không đều."],
["TN", "Trình bày đặc điểm môi trường biển đảo.", "Môi trường biển đảo có liên quan mật thiết và ảnh hưởng đến cuộc sống con người. Đặc điểm môi trường biển đảo khác trên đất liền.\n- Môi trường biển không thể chia cắt. Môi trường biển không giống trên đất liền, rất dễ bị phá vỡ. Các sự cố làm ô nhiễm nước biển rất khó để xử lí (chỉ cần một vùng nước nhỏ bị ô nhiễm có thể gây thiệt hại cho cả vùng nước và ven bờ, trên đảo do tính chất lan).\n- Môi trường đảo thay đổi nhanh khi có tác động của con người. Đảo thường có diện tích nhỏ, biệt lập với đất liền nên chỉ cần một tác động nhỏ của con người có thể gây chuỗi biến động và phá vỡ cân bằng sinh thái rất nhanh."],
["TN", "Trình bày vấn đề bảo vệ môi trường biển đảo.", "* Vai trò của biển, đảo:\n- Vùng ven biển và hải đảo là nơi cư trú và diễn ra các hoạt động sản xuất của nười dân.\n- Nhiều hoạt động kinh tế biển đã góp phần đáng kể vào GDP của nước ta (Giao thông vận tải biển, du lịch biển, khai thác và nuôi trồng thủy sản, khai thác khoáng sản biển).\n- Hệ thống các đảo tiền tiêu (đảo quân sự) có ý nghĩa đặc biệt quan trọng trong xây dựng và bảo vệ Tổ quốc.\n* Hiện trạng biển đảo: Chất lượng môi trường biển nước ta có xu hướng giảm do chịu tác động mạnh của các hoạt động kinh tế - xã hội trong khu vực ven bờ và tình trạng biến đổi khí hậu, xâm thực bờ biển ngày càng phổ biến.\n* Giải pháp bảo vệ môi trường biển đảo:\n- Xây dựng cơ chế chính sách, luật bảo vệ môi trường biển đảo.\n- Áp dụng các thành tựu khoa học công nghệ để kiểm soát và xử lí các vấn đề môi trường biển đảo.\n- Tuyên truyền và nâng cao nhận thức của người dân để bảo vệ và cải thiện môi trường biển đảo,..."],
["TN", "Trình bày tài nguyên biển và thềm lục địa Việt Nam.", "* Tài nguyên du lịch:\n- Bờ biển dài 3260km trải dài từ Móng Cái (Quảng Ninh) đến Hà Tiên (An Giang) nên có nhiều bãi cát, vịnh, hang động đẹp, nước biển trong xanh, hệ sinh thái biển phong phú, khung cảnh thiên nhiên các đảo đa dạng là điều kiện thuận lợi để phát triển du lịch biển.\n- Nước ta có hàng nghìn đảo và quần đảo, cảnh quan thiên nhiên đẹp thuận lợi phát triển kết hợp du lịch biển - đảo.\n- Một số địa điểm du lịch thu hút khách du lịch ở nước ta như Hạ Long, Phú Quốc, Cát Bà,...\n* Tài nguyên khoáng sản:\n- Dầu mỏ và khí đốt tập trung chủ yếu ở các thềm lục địa phía Nam: bể sông Hồng, Cửu Long, Côn Sơn, nhóm bể quần đảo Hoàng Sa - Trường Sa.\n- Các khoáng sản biển khác nhau gồm 35 loại, phân bố dọc ven biển, sườn bờ và đáy biển. Trong đó, có giá trị nhất là titan, cát thủy tinh, muối,...\n- Ngoài ra, băng cháy cũng là khoáng sản có tiềm năng lớn để sử dụng trong tương lai.\n⇒ Việt Nam có nguồn tài nguyên khoáng sản biển phong phú, đa dạng tạo điều kiện thuận lợi để phát triển ngành khai thác và chế biến khoáng sản biển.\n* Vùng biển VN có nhiều vũng vịnh, tạo điều kiện thuận lợi để xây dựng các cảng nước sâu và giao thông vận tải biển.\n* Tài nguyên sinh vật biển:\n- Sinh vật vùng biển nước ta phong phú, có tính đa dạng sinh học cao:\n+ Có hơn 200 loại cá, trong đó có khoảng 110 loại có giá trị kinh tế cao như cá ngừ, cá thu,...\n+ Có các loại động vật giáp xác, thân mềm, nhiều loài là thực phẩm được ưa thích, giàu dinh dưỡng: tôm, mực,... (có hơn 100 loài tôm).\n+ Vùng triều ven bờ có nhiều loài rong biển (hơn 1600 loài) được sử dụng trong công nghiệp chế biến thực phẩm và sản xuất.\n+ Vùng biển nước ta có nhiều đặc sản như: bào ngư, vi cá mập, sò huyết, hải sâm,...\n+ Các đảo ven bờ có nhiều chim yến.\n+ Việt Nam có diện tích rừng ngập mặn lớn, đứng thứ hai trên thế giới.\n- Năm 2019, vùng biển nước ta có trữ lượng thủy sản là 3,87 triệu tấn và khả năng khai thác bền vững là 1,65 triệu tấn.\n⇒ Việt Nam có nguồn tài nguyên sinh vật biển phong phú, đa dạng tạo điều kiện thuận lợi để phát triển ngành khai thác và nuôi trồng thủy sản."],
["DC", "Trình bày sự phân bố các dân tộc ở Việt Nam.", "- Nước ta có 54 dân tộc anh em cùng sinh sống rộng khắp lãnh thổ: Kinh, Thái, Mường, Tày, Khmer,...\n* Các dân tộc ở VN sinh sống rộng khắp trên toàn lãnh thổ\n- Dân tộc Kinh chiếm tỉ trọng lớn nhất, hơn 85% dân số cả nước, phân bố rộng khắp cả nước, nhưng tập trung cư trú ở đồng bằng, ven biển và trung du.\n- Dân tộc thiểu số chiếm >15%, tỉ trọng nhỏ, phân bố tập trung cư trú ở đồi núi và cao nguyên.\n+ Trung du miền núi phía Bắc: Thái, Tày, Nùng, Hmông,...\n+ Phía Tây Nam Trung Bộ: Ê đê, Gia-rai, Ba-na,...\n+ Đồng bằng ven biển Phía Nam và ĐBSCL: Khmer, Chăm, Hoa,...\n* Phân bố các dân tộc VN có sự thay đổi theo thời gian và không gian\n- Cùng với quá trình phát triển kinh tế - xã hội ở các vùng trung du và miền núi, phân bố dân tộc có sự thay đổi về không gian, phân bố ngày càng đan xen với nhau trên lãnh thổ VN.\n+ Từ năm 1960 - 1990, nhà nước triển khai chính sách phát triển kinh tế ở các vùng kinh tế khác nhau. Dân cư từ ĐBSH lên Tây Nguyên và miền núi phía Bắc, từ ĐBSH và Bắc Trung Bộ xuống Nam Trung Bộ và Nam Bộ đã làm thay đổi bức tranh phân bố dân cư dân tộc của nước ta.\n+ Từ 1990 đến nay: nhu cầu việc làm và phát triển kinh tế tăng nên sự phân bố dân cư và dân tộc vẫn tiếp tục thay đổi (từ Tây Nguyên xuống đồng bằng, từ nông thôn lên thành thị) đã tạo nên bức tranh phân bố dân cư và dân tộc nước ta đa dạng.\n- Các vùng Trung du miền núi phía Bắc, Nam Trung Bộ có nhiều dân tộc cùng sinh sống.\n* Người VN ở nước ngoài là một bộ phận của dân tộc VN\n- Có > 5 triệu người sinh sống, làm việc, học tập ở nước ngoài, là bộ phận quan trọng, không thể tách rời của cộng đồng dân tộc VN, luôn hướng về Tổ quốc, có đóng góp tích cực trong việc xây dựng, phát triển, bảo vệ và hội nhập quốc tế."],
["DC", "Trình bày quy mô dân số và gia tăng dân số nước ta.", "- Quy mô dân số: đông; 2021 ≈ 98,5 triệu người, 2024 ≈ 100,3 triệu người (thứ 16 thế giới, thứ 3 Đông Nam Á).\n- Tỉ lệ gia tăng dân số tự nhiên = Sinh - Tử: S > T → gia tăng (+); S = T → 0; S < T (-).\n- VN có quy mô dân số đông, năm 2024 dân số nước ta là khoảng 101,1 triệu người, đứng thứ 16 thế giới, đứng thứ 3 Đông Nam Á sau Indonesia và Philippines.\n- Dân số nước ta có sự gia tăng khác nhau qua các giai đoạn:\n+ Dân số nước ta tăng nhanh từ thập kỉ 60 - thập kỉ 80 của thế kỉ XX\n+ Trong vài thập kỉ gần đây, tỉ lệ gia tăng dân số của nước ta có xu hướng giảm, năm 2021 là 0,94%. Tuy nhiên, do quy mô dân số đã lớn nên hằng năm dân số nước ta vẫn tăng khoảng 1 triệu người.\n- Tỉ lệ gia tăng dân số có sự khác nhau giữa các vùng, giữa thành thị và nông thôn."],
["DC", "Ảnh hưởng của dân số đông và tăng nhanh đến phát triển kinh tế - xã hội.", "* Tích cực\n- Nước ta có dân số đông (2024: 101,1 triệu người), tạo ra nguồn lao động dồi dào, nguồn lao động bổ sung hằng năm lớn (mỗi năm tăng trung bình 1 triệu lao động). Do đó, cung cấp nguồn lao động cho các ngành kinh tế, đặc biệt là những ngành cần nhiều lao động như: CN dệt may, CN chế biến lương thực - thực phẩm, nông nghiệp,...\n- Tạo ra thị trường tiêu thụ rộng lớn.\n* Tiêu cực\n- Kinh tế:\n+ Ảnh hưởng đến tốc độ phát triển kinh tế\n+ Mâu thuẫn giữa tích lũy và tiêu dùng\n+ Làm chậm quá trình chuyển dịch cơ cấu kinh tế\n- Xã hội:\n+ Ảnh hưởng đến chất lượng cuộc sống của người dân, khó được cải thiện\n+ Gây sức ép lên vấn đề nhà ở, giáo dục, y tế, việc làm, môi trường,...\n+ Làm tăng tỷ lệ thất nghiệp, sức ép đến vấn đề việc làm và giải quyết việc làm ở nước ta.\n- Môi trường:\n+ Ô nhiễm môi trường: khí, tiếng ồn, nước, đất...\n+ Suy giảm tài nguyên thiên nhiên"],
["DC", "Phân tích sự thay đổi cơ cấu dân số theo nhóm tuổi.", "* Đặc điểm\n- VN đang ở trong thời kì dân số vàng và có xu hướng già hoá\n- Cơ cấu dân số đang có sự thay đổi:\n+ Nhóm <15 tuổi: chiếm tỉ lệ cao (24,1%), có xu hướng giảm\n+ Nhóm 15 - 64 tuổi: chiếm tỉ trọng cao nhất (67,6%), có xu hướng tăng\n+ Nhóm >65 tuổi: chiếm tỉ trọng nhỏ nhất (8,3%), có xu hướng tăng\nLưu ý: - Số liệu năm 2021, đi thi phải xét theo bảng số liệu theo đề bài cho\n* Giải thích\n- Do sự phát triển của kinh tế - xã hội, mức sống của người dân tăng lên, nhận thức thay đổi, trình độ dân trí của người dân tăng lên\n- Thực hiện tốt chính sách dân số kế hoạch hoá gia đình\n- Do áp dụng sự phát triển của KHCN, kĩ thuật tiên tiến vào y tế, được chăm sóc sức khoẻ, y tế được cải thiện, tỉ lệ trẻ sơ sinh tử vong giảm\n→ Tỉ suất sinh giảm, tuổi thọ trung bình của người dân tăng cao"],
["DC", "Trình bày đặc điểm phân bố dân cư nước ta.", "- Nước ta có MĐDS (mật độ dân số) cao (năm 2024 là khoảng 305 người/km²) đứng thứ 48 thế giới và thứ 5 trong khu vực ĐNÁ (sau Sing và Philip)\n- Phân bố dân cư có sự khác nhau giữa các khu vực: giữa đồng bằng với trung du và miền núi, giữa TT và NT\n+ Giữa ĐB và MN: dân cư tập trung đông ở các khu vực ĐB và ven biển (ĐBSH có MĐDS cao nhất: 1091 người/km²), thưa thớt ở miền núi và cao nguyên (Trung du, MN PB có MĐDS thấp nhất: 136 người/km²)\n+ Giữa TT và NT: dân cư nước ta chủ yếu sinh sống ở NT, tỉ lệ dân thành thị còn thấp (Năm 2021: NT: 62,9%, TT: 37,1%)\n+ HN và TPHCM có MĐDS cao nhất nước ta\n+ Ngay trong nội bộ từng vùng cũng có sự phân bố không đều:\n○ ĐBSH có MĐDS cao hơn ĐBSCL: 1091 người/km² - 426 người/km²\n○ Tây Bắc nhỏ hơn Đông Bắc\n- Phân bố dân cư nước ta có sự thay đổi theo thời gian và không gian theo hướng ngày càng hợp lý hơn\n+ MĐDS ngày càng tăng (2021: 297 người/km² - 2024: 305 người/km²)\n+ Các vùng kinh tế phát triển năng động thu hút đông dân cư như: ĐBSH, Đông Nam Bộ...\n+ Tỷ lệ dân TT tăng từ 19,5% (1990) lên 37,1% (2021). Một số đô thị có quy mô dân số đông, CSHT hiện đại như: TPHCM: 4375 người/km², HN: 2480 người/km²..."],
["DC", "Giải thích vì sao ĐBSH có mật độ dân số cao nhất cả nước.", "- ĐBSH có MĐDS cao nhất cả nước, năm 2024: 1034 người/km², do ĐBSH có nhiều điều kiện thuận lợi về tự nhiên, trình độ phát triển kinh tế và lịch sử khai thác, định cư.\n- ĐBSH có điều kiện tự nhiên thuận lợi: địa hình bằng phẳng, khí hậu NĐẨGM, đất phù sa màu mỡ, nguồn nước dồi dào.\n- ĐBSH có điều kiện tự nhiên thuận lợi cho tập trung dân cư như: địa hình khá bằng phẳng, đất đai màu mỡ do phù sa sông Hồng và sông Thái Bình bồi tụ, khí hậu NĐẨGM, nguồn nước dồi dào,... do đó, thuận lợi để thâm canh lúa nước, thuận lợi để xây dựng mạng lưới giao thông, phát triển CN, dịch vụ, xây dựng đô thị...\n- ĐBSH là vùng có trình độ phát triển kinh tế - xã hội hàng đầu nước ta: CSHT đồng bộ, hiện đại, khoảng cách giao thông và phát triển, khoảng cách y tế, giáo dục, khoa học công nghệ... phát triển hàng đầu VN, CN và dịch vụ phát triển, thu hút đông dân cư và lao động.\n- Vùng ĐBSH có lịch sử khai thác và định cư lâu đời, hàng nghìn năm trước.\n→ Do sự tác động tổng hợp, đồng thời của các nhân tố trên đã làm dân cư tập trung đông đúc ở ĐBSH"],
["DC", "Nêu hậu quả của phân bố dân cư chưa hợp lí (không đồng đều) ở nước ta.", "- Dân cư phân bố không đồng đều, chưa hợp lí, gây khó khăn trong việc sử dụng hợp lí nguồn lao động và khai thác tài nguyên thiên nhiên ở mỗi vùng\n+ Ở đồng bằng: đất chật người đông nên tài nguyên thiên nhiên bị khai thác quá mức dẫn đến nguy cơ cạn kiệt tài nguyên. Dân cư đông đúc gây khó khăn trong vấn đề giải quyết việc làm, nguồn lao động dư thừa dẫn đến tỉ lệ thất nghiệp cao, sử dụng lao động kém hiệu quả, gây sức ép lên các vấn đề về môi trường, giáo dục, y tế,... Làm chậm sự chuyển dịch cơ cấu kinh tế, ảnh hưởng đến tốc độ phát triển kinh tế, mâu thuẫn giữa tích lũy và tiêu dùng.\n+ Ở vùng núi và cao nguyên có diện tích rộng lớn nhưng dân cư thưa thớt nên gây ra tình trạng thiếu lao động, đặc biệt là lao động có trình độ, kĩ thuật cao. Trong khi đó, tài nguyên thiên nhiên (đất đai, rừng, khoáng sản,...) chưa được khai thác triệt để, còn ở dạng tiềm năng. Địa hình hiểm trở gây khó khăn trong việc xây dựng CSHT. Chính vì vậy, kinh tế - xã hội chưa phát triển mạnh, ảnh hưởng đến đời sống của người dân.\n+ Ở thành thị: tập trung chủ yếu ở đồng bằng, tình trạng đô thị hoá quá mức, gây khó khăn cho vấn đề môi trường ô nhiễm, suy giảm tài nguyên thiên nhiên, vấn đề việc làm, gây sức ép lên vấn đề y tế, giáo dục, nhà ở...\n+ Ở nông thôn có tình trạng dư thừa lao động nhưng thiếu việc làm, thất nghiệp \"nông nhàn\" còn rất lớn và chưa được sử dụng hiệu quả."],
["DC", "Trình bày đặc điểm nguồn lao động nước ta (ưu điểm và hạn chế).", "A) Ưu điểm - 5 ý\n- Nguồn lao động dồi dào do dân đông. Lực lượng lao động chiếm 49 triệu dân cả nước (năm 2021), từ đó tạo điều kiện phát triển kinh tế, đáp ứng nhu cầu lao động, đặc biệt là trong các ngành CN - XD (CN sản xuất dày dép, may mặc; CN chế biến nông sản;...), ngành N-L-TS.\n- Nguồn lao động bổ sung hàng năm lớn, trung bình mỗi năm bổ sung 1 triệu người\n- Chất lượng lao động ngày càng được nâng cao, nhờ những thành tựu trong phát triển văn hoá, giáo dục, y tế, kinh tế,... đã là cơ sở để phát triển những ngành đòi hỏi KHKT cao, như: CN thông tin, sản xuất điện tử, máy vi tính; CN bán dẫn,...\n- Phẩm chất của người lao động VN cần cù, chịu khó, sáng tạo, có nhiều kinh nghiệm trong sản xuất N-L-TS, tiểu thủ CN,...\n- Phố lao động kĩ thuật cao, tập trung hầu hết ở các đồng bằng, các thành phố lớn như: HN, TP HCM, HP,..., thuận lợi để phát triển các ngành dịch vụ, công nghệ cao như: điện tử, tin học, hoá chất... và thu hút đầu tư nước ngoài.\nB) Hạn chế - 7 ý\n- Lao động phân bố chưa đồng đều\n- Lao động ở các đồng bằng, các thành phố lớn dư thừa, gây khó khăn cho vấn đề giải quyết việc làm, làm tăng tỷ lệ thất nghiệp\n- Ở các vùng núi, trung du, cao nguyên giàu tiềm năng nhưng còn ở dạng tiềm năng vì thiếu lao động, đặc biệt là lao động kĩ thuật cao\n- Chất lượng lao động có sự chênh lệch lớn giữa các vùng kinh tế, giữa NT và TT, giữa đồng bằng và miền núi. Chính vì vậy tạo nên sự chênh lệch về tốc độ phát triển kinh tế - xã hội\n- Thể lực còn yếu, tác phong CN chưa cao\n- Chất lượng lao động chưa cao, chưa đáp ứng được sự nghiệp CNH, HĐH\n- Đội ngũ cán bộ quản lý giỏi, nhiều kỹ thuật lành nghề còn thiếu"],
