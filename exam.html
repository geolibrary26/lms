<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">

<title>Kiểm tra miệng Địa lí • Cô Hải Hà</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{--bg:#eaf4f4;--tx:#12303a;--mu:#6a808a;--pr:#0f766e;--pr2:#0e7490;--ac:#f97316;--bd:#d6e6e8;--sh:0 10px 30px rgba(14,80,95,.10)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.6 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 420px at 0 -5%,#c7ecee,transparent 60%),radial-gradient(800px 380px at 100% 0,#fde7d3,transparent 55%),var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.hero{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px;padding:22px 26px;border-radius:24px;color:#fff;background:linear-gradient(120deg,#0b3b4a,#0f766e 60%,#14a3a3);box-shadow:var(--sh)}
.hero h1{margin:0;font-size:24px}.hero p{margin:2px 0 0;opacity:.85;font-size:14px}
.c{background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:18px 22px;margin-bottom:16px;box-shadow:var(--sh)}
h2{font-size:18px;margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
input,textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:12px;background:#f8fcfc;color:var(--tx);font:inherit}
input:focus,textarea:focus,select:focus{outline:3px solid #99e0dc;border-color:var(--pr)}
textarea{margin-top:10px;resize:vertical}
label{font-size:13px;color:var(--mu);display:block;margin:8px 0 4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button{padding:11px 18px;border:0;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;background:#e3eff0;color:var(--tx);transition:transform .12s}
button:hover:not(:disabled){transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.b{background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff}
button.dg{background:#fee2e2;color:#b91c1c}
.hero button{background:rgba(255,255,255,.18);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 12px;border-radius:99px;background:#e3eff0}
.tag.bad{background:#fee2e2;color:#b91c1c}.tag.wn{background:#fef3c7;color:#b45309}.tag.pr{background:#dbeafe;color:#1d4ed8}.tag.ok{background:#dcfce7;color:#15803d}
.steps{display:flex;gap:8px;margin:0 0 16px}.steps i{flex:1;text-align:center;font-style:normal;font-weight:700;padding:6px 0;border-radius:12px;background:#fff;border:1.5px solid var(--bd);color:var(--mu)}
.steps i.dn{background:#dcfce7;color:#15803d;border-color:#86efac}.steps i.cur{background:var(--pr);color:#fff;border-color:var(--pr)}
.q{font-size:22px;font-weight:800;margin:10px 0 14px;line-height:1.4}
.rg{position:relative;width:150px;height:150px}.rg svg{width:100%;transform:rotate(-90deg)}
.rb{fill:none;stroke:#dcebec;stroke-width:9}.rf{fill:none;stroke-width:9;stroke-linecap:round}
.rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-variant-numeric:tabular-nums}
.bt{display:flex;gap:10px;flex-wrap:wrap}
.a{white-space:pre-line;border-left:5px solid var(--pr);padding:4px 0 4px 14px;font-size:15.5px}
.ans{background:linear-gradient(#f2fbfa,#fff)}
.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.lv{background:#fff;border:2px solid var(--bd);line-height:1.35;padding:12px 6px}
.lv.bad{border-color:#fecaca}.lv.wn{border-color:#fde68a}.lv.pr{border-color:#bfdbfe}.lv.ok{border-color:#bbf7d0}
.lv.bad.on{background:#ef4444;color:#fff}.lv.wn.on{background:#f59e0b;color:#fff}.lv.pr.on{background:#3b82f6;color:#fff}.lv.ok.on{background:#16a34a;color:#fff}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.nav button{padding:14px 22px}
.ban{display:flex;gap:18px;align-items:center;border-radius:24px;padding:22px 26px;color:#fff;margin-bottom:16px;box-shadow:var(--sh)}
.ban.ok{background:linear-gradient(120deg,#15803d,#22c55e)}.ban.wn{background:linear-gradient(120deg,#d97706,#fbbf24)}.ban.bad{background:linear-gradient(120deg,#dc2626,#f97316)}
.em{font-size:52px;line-height:1}.vt{font-size:26px;font-weight:800}.ban>div:last-child{flex:1}
.bar{height:10px;background:rgba(255,255,255,.35);border-radius:9px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.qi{padding:10px 0;border-top:1px dashed var(--bd)}details{margin-top:6px}summary{cursor:pointer;color:var(--pr);font-weight:600;font-size:14px}
.ta{background:#fff7ed;border-left:5px solid var(--ac);border-radius:10px;padding:10px 14px;margin-top:10px}
.li{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--bd)}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600;margin-top:8px}.chip.ok{background:#dcfce7;color:#15803d}.chip.bad{background:#fee2e2;color:#b91c1c}
.hsb{margin:0;min-height:100vh;color:#fff;background:linear-gradient(160deg,#0b3b4a,#0f766e)}
.hsw{text-align:center;padding:5vh 5vw}.hsh{opacity:.8;font-size:22px}.hsq{font-size:clamp(26px,3.6vw,46px);font-weight:800;margin:4vh auto;max-width:900px;line-height:1.35}
.hsw .rg{width:240px;height:240px;margin:0 auto}.hsw .rg b{font-size:56px;color:#fff}.hsw .rb{stroke:rgba(255,255,255,.2)}.hsm{font-size:22px;opacity:.9;margin-top:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#12303a;color:#fff;padding:10px 20px;border-radius:99px;z-index:9}
@media print{.np{display:none!important}body{background:#fff}}
@media(max-width:560px){.ban{flex-direction:column;text-align:center}.hero h1{font-size:20px}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const CATS={TN:"Tự nhiên Việt Nam",DC:"Dân cư",KT:"Kinh tế ngành N-L-TS & CN"};
const Q=[
["TN","Trình bày đặc điểm vị trí địa lí Việt Nam.","- Trung tâm Đông Nam Á, phía đông bán đảo Đông Dương, biển Đông thông ra TBD.\n- Nội chí tuyến Bắc bán cầu; khu vực gió mùa châu Á điển hình.\n- Cầu nối ĐNÁ lục địa và hải đảo; gần ngã tư hàng hải - hàng không quốc tế.\n- Trên đường di lưu, di cư của sinh vật; nơi giao thoa 2 vành đai sinh khoáng TBD và Địa Trung Hải.\n- Nhiều thiên tai, chịu tác động mạnh của biến đổi khí hậu."],
["TN","Phân tích ảnh hưởng của vị trí địa lí và phạm vi lãnh thổ đến khí hậu nước ta.","- Nội chí tuyến, gió tín phong + gió mùa → nhiệt đới ẩm gió mùa (>20°C, ẩm >80%, mưa 1500-2000mm); không hoang mạc hóa như Bắc Phi, Tây Nam Á cùng vĩ độ.\n- Biển Đông: tăng ẩm, biến tính khối khí, dịu mát mùa hạ, bớt hanh khô mùa đông.\n- Lãnh thổ dài, hẹp ngang + địa hình + khối khí → phân hóa Bắc-Nam, Tây-Đông, theo mùa.\n- Gây bão, áp thấp nhiệt đới, hạn hán, xâm nhập mặn."],
["TN","Nêu các đặc điểm chung của địa hình Việt Nam.","- Đồi núi chiếm 3/4 diện tích, chủ yếu đồi núi thấp (<1000m: 85%); đồng bằng 1/4.\n- Được tân kiến tạo nâng thành nhiều bậc kế tiếp; hướng nghiêng TB-ĐN; hướng núi TB-ĐN và vòng cung.\n- Chịu tác động mạnh của thiên nhiên nhiệt đới ẩm gió mùa: phong hóa, xâm thực, xói mòn, cacxtơ, bồi tụ đồng bằng.\n- Chịu tác động mạnh của con người (tích cực và tiêu cực: phá rừng → sạt lở, lũ quét)."],
["TN","So sánh địa hình vùng núi Tây Bắc và Đông Bắc.","- Tây Bắc: giữa sông Hồng - sông Cả; núi cao, đồ sộ nhất (>1500m; Phan-xi-păng 3143m); hướng TB-ĐN, 3 mạch song song; cắt xẻ mạnh, đỉnh nhọn, sườn dốc, thung lũng sâu hẹp; cánh đồng giữa núi.\n- Đông Bắc: từ dãy Con Voi đến Quảng Ninh; núi thấp <1000m; hướng vòng cung (4 cánh cung: Sông Gâm, Ngân Sơn, Bắc Sơn, Đông Triều) chụm ở Tam Đảo; đỉnh tròn, sườn thoải, thung lũng rộng; có đồi bát úp, cacxtơ."],
["TN","Trình bày tính chất nhiệt đới ẩm gió mùa của khí hậu Việt Nam và nguyên nhân.","- Nhiệt đới: nhiệt độ TB >20°C, nắng 1400-3000 giờ/năm, cán cân bức xạ dương (do nội chí tuyến, 2 lần Mặt Trời lên thiên đỉnh).\n- Ẩm: mưa 1500-2000mm, độ ẩm >80% (biển Đông, gió mùa, bão, ATNĐ).\n- Gió mùa: mùa đông (ĐB, tháng 11-4, từ cao áp Xibia, lạnh), mùa hạ (TN, tháng 5-10, nóng ẩm, mưa nhiều; phơn Tây Nam)."],
["TN","Chứng minh khí hậu nước ta phân hóa đa dạng.","- Bắc-Nam: ranh giới dãy Bạch Mã (16°B). Miền Bắc nhiệt đới ẩm gió mùa có mùa đông lạnh; miền Nam cận xích đạo gió mùa, mùa mưa-khô; ven biển Trung Bộ mưa thu-đông.\n- Tây-Đông: biển - đồng bằng - miền núi phía Tây.\n- Độ cao: 3 đai (nhiệt đới <600-700m/900-1000m; cận nhiệt đến 2600m; ôn đới >2600m).\n- Theo mùa. Thất thường do gió mùa, địa hình, bão, El Nino, La Nina."],
["TN","Đặc điểm chung của mạng lưới sông ngòi nước ta và giải thích.","- Dày đặc, rộng khắp (2360 sông >10km), chủ yếu nhỏ, ngắn, dốc.\n- Hướng TB-ĐN và vòng cung.\n- 2 mùa: lũ 70-80%, cạn 20-30% lưu lượng.\n- Nhiều nước, giàu phù sa (800 tỉ m³, 200 triệu tấn/năm).\n- Giải thích: ¾ đồi núi, mưa nhiều theo mùa, lãnh thổ hẹp ngang, núi ăn sát biển."],
["TN","Phân tích chế độ nước của sông Hồng, Thu Bồn và Mê Công (Cửu Long).","- Sông Hồng: lũ T6-10 (đỉnh T8, 75-80%); cạn T11-5; mạng nan quạt hội tụ Việt Trì → lũ nhanh, thất thường.\n- Thu Bồn: lũ lệch thu-đông T9-12 (đỉnh T11, 65%), cạn 8 tháng; sông ngắn, dốc → lũ lên nhanh, đột ngột.\n- Mê Công: lũ T7-11 (đỉnh T9, 80%), cạn T12-6; hình lông chim, độ dốc nhỏ, có Biển Hồ điều tiết → lũ lên nhanh, rút chậm, điều hòa."],
["TN","Đặc điểm và giá trị sử dụng của đất feralit.","- ~65% diện tích, trung du miền núi, dưới 1600-1700m; màu đỏ vàng (oxit sắt, nhôm); chua, nghèo base và mùn.\n- 3 nhóm: trên đá vôi (Bắc, Bắc Trung Bộ, màu mỡ), trên bazan (Tây Nguyên, ĐNB, phì cao), đá khác.\n- Giá trị: rừng sản xuất (thông, keo...), cây CN lâu năm (chè, cà phê, cao su, hồ tiêu), cây ăn quả, dược liệu; không hợp trồng lúa."],
["TN","Trình bày và giải thích đặc điểm chung của tài nguyên khoáng sản nước ta.","- Phong phú, đa dạng (>5000 mỏ, ~60 loại; 3 nhóm: năng lượng, kim loại, phi kim loại).\n- Phần lớn mỏ vừa và nhỏ; trữ lượng lớn: than, dầu khí, bô-xít...\n- Phân bố rộng khắp, tập trung Đông Bắc, Bắc Trung Bộ, Tây Nguyên, thềm lục địa.\n- Giải thích: giao thoa 2 vành đai sinh khoáng; lịch sử địa chất lâu dài, phức tạp (nội sinh, ngoại sinh)."],
["TN","Vì sao bảo tồn đa dạng sinh học ở Việt Nam là cấp thiết? Nêu biện pháp.","- Suy giảm số lượng loài, hệ sinh thái (70% rừng tự nhiên là rừng nghèo/mới phục hồi), nguồn gen.\n- Nguyên nhân: biến đổi khí hậu; khai thác quá mức, phá rừng, ô nhiễm, loài ngoại lai.\n- Biện pháp: khu bảo tồn, vườn quốc gia; trồng và bảo vệ rừng; chống săn bắt, đánh bắt quá mức; xử lí chất thải; nâng cao ý thức."],
["TN","Trình bày các bộ phận vùng biển Việt Nam.","Đường cơ sở → nội thủy (phía trong, là lãnh thổ) → lãnh hải (12 hải lí) → tiếp giáp lãnh hải (12 hải lí) → đặc quyền kinh tế (cùng lãnh hải rộng 200 hải lí) → thềm lục địa (đáy biển, lòng đất, đến mép rìa lục địa, tối đa 350 hải lí). Diện tích biển ~1 triệu km²; tiếp giáp biển Đông với 8 nước."],
["DC","Trình bày sự phân bố các dân tộc ở Việt Nam.","- 54 dân tộc, cùng sinh sống rộng khắp.\n- Kinh >85%, đồng bằng, ven biển, trung du.\n- Dân tộc thiểu số >15%: trung du miền núi phía Bắc (Thái, Tày, Nùng, Mông), Tây Nguyên (Ê-đê, Gia-rai, Ba-na), ven biển Nam Bộ và ĐBSCL (Khmer, Chăm, Hoa).\n- Phân bố thay đổi theo thời gian, không gian, xu hướng đan xen.\n- Người Việt ở nước ngoài >5 triệu, là bộ phận không tách rời."],
["DC","Trình bày quy mô dân số và gia tăng dân số nước ta.","- Quy mô: 2021 ≈ 98,5 triệu; cuối 2024 ≈ 101,3 triệu; thứ 16 thế giới, thứ 3 Đông Nam Á.\n- Tỉ lệ gia tăng tự nhiên = (sinh - tử)/10 (%).\n- Gia tăng nhanh từ nửa sau TK20; những năm gần đây giảm (2021: 0,94%) nhưng quy mô lớn nên mỗi năm vẫn tăng ~1 triệu người; khác biệt giữa vùng, thành thị - nông thôn."],
["DC","Ảnh hưởng của dân số đông và tăng nhanh đến phát triển kinh tế - xã hội.","- Tích cực: nguồn lao động dồi dào, bổ sung hằng năm lớn (~1 triệu); thị trường tiêu thụ rộng.\n- Tiêu cực: kinh tế - tốc độ phát triển, mâu thuẫn tích lũy - tiêu dùng, chậm chuyển dịch cơ cấu; xã hội - chất lượng cuộc sống, áp lực nhà ở, giáo dục, y tế, việc làm, thất nghiệp; môi trường - ô nhiễm, suy giảm tài nguyên."],
["DC","Phân tích sự thay đổi cơ cấu dân số theo nhóm tuổi.","- Dân số vàng và xu hướng già hóa.\n- Dưới 15 tuổi: tỉ trọng cao nhưng giảm (24,1%).\n- 15-64 tuổi: tỉ trọng lớn nhất, tăng (67,6%).\n- Từ 65 tuổi: nhỏ nhưng tăng (8,3%).\n- Nguyên nhân: kinh tế - xã hội phát triển, kế hoạch hóa gia đình, y tế tiến bộ → tỉ suất sinh giảm, tuổi thọ tăng."],
["DC","Trình bày đặc điểm phân bố dân cư nước ta.","- Mật độ cao (2024 ≈ 305 người/km²), thứ 3 Đông Nam Á.\n- Không đều: đồng bằng (ĐBSH 1091) >> miền núi, cao nguyên (Tây Bắc, Trung du miền núi phía Bắc 136); nông thôn 62,9% - thành thị 37,1% (2021); HN, TP.HCM cao nhất.\n- Thay đổi theo thời gian, ngày càng hợp lí hơn: mật độ tăng, tỉ lệ dân thành thị tăng."],
["DC","Giải thích vì sao ĐBSH có mật độ dân số cao nhất cả nước.","Tổng hợp nhân tố: địa hình bằng phẳng, đất phù sa màu mỡ, khí hậu nhiệt đới ẩm gió mùa, nguồn nước dồi dào; kinh tế - xã hội phát triển, cơ sở hạ tầng đồng bộ, công nghiệp - dịch vụ phát triển hàng đầu, thu hút dân cư, lao động; lịch sử khai thác và định cư lâu đời."],
["DC","Hậu quả của phân bố dân cư không đều và biện pháp giải quyết.","- Đồng bằng: dân đông, lao động dư thừa, thất nghiệp, áp lực nhà ở, y tế, giáo dục, môi trường.\n- Miền núi: thưa dân (3/4 diện tích, 1/4 dân), thiếu lao động, tài nguyên chưa khai thác, hạ tầng khó phát triển.\n- Giải pháp: phát triển công nghiệp, dịch vụ nông thôn; đô thị hóa; phân bố lại dân cư - lao động; xuất khẩu lao động; thực hiện kế hoạch hóa gia đình."],
["DC","Trình bày đặc điểm nguồn lao động nước ta (ưu điểm và hạn chế).","- Ưu: dồi dào (lực lượng lao động 2021 ≈ 50,6 triệu), tăng ~1 triệu/năm; chất lượng ngày càng cao (đào tạo 26,2% - 2021); cần cù, sáng tạo, nhiều kinh nghiệm N-L-TS, tiểu thủ công nghiệp.\n- Hạn chế: phân bố chưa đều, thừa ở đồng bằng - thiếu ở miền núi; thể lực yếu, tác phong công nghiệp chưa cao; chưa đáp ứng CNH-HĐH; thiếu cán bộ giỏi, công nhân kĩ thuật."],
["DC","Vì sao tỉ lệ gia tăng dân số tự nhiên giảm nhưng quy mô dân số vẫn tăng?","- Tỉ lệ gia tăng giảm do thực hiện tốt chính sách dân số kế hoạch hóa gia đình, tỉ suất sinh giảm (kinh tế phát triển, nhận thức tăng, y tế tốt).\n- Tỉ lệ gia tăng vẫn cao (0,94%) và quy mô dân số lớn (~101 triệu) nên mỗi năm dân số vẫn tăng ~1 triệu người."],
["DC","Vì sao tỉ lệ dân thành thị nước ta tăng?","Do công nghiệp hóa, hiện đại hóa, đô thị hóa: chuyển dịch cơ cấu kinh tế theo hướng tăng công nghiệp - dịch vụ, giảm nông nghiệp; công nghiệp, dịch vụ phát triển cần nhiều lao động, thu hút dân cư về đô thị (tỉ lệ dân thành thị: 19,5% năm 1990 → 37,1% năm 2021); đô thị mở rộng, thu hút nhập cư từ nông thôn."],
["DC","Trình bày thực trạng và giải pháp vấn đề việc làm.","- Thực trạng: 2021 có 49 triệu lao động có việc làm; thất nghiệp 3,2% (thành thị 4,3%, nông thôn 2,5%), thiếu việc làm 2,52% (nông thôn 2,94%); việc làm giản đơn, năng suất thấp phổ biến.\n- Giải pháp: hoàn thiện chính sách; đào tạo, dạy nghề; phát triển ngành cần nhiều lao động; thị trường lao động; xuất khẩu lao động; bảo hiểm thất nghiệp; phân bố lại dân cư, lao động."],
["DC","So sánh quần cư nông thôn và quần cư thành thị.","- Mật độ: nông thôn thấp - thành thị cao.\n- Hoạt động kinh tế: nông thôn nông nghiệp là chủ yếu, đang chuyển sang dịch vụ, công nghiệp; thành thị công nghiệp - dịch vụ.\n- Chức năng: nông thôn hành chính, văn hóa, xã hội (đang thay đổi); thành thị đa chức năng (kinh tế, văn hóa, chính trị, đổi mới sáng tạo).\n- Cấu trúc: nông thôn làng, xóm, bản, thôn; thành thị phường, thị trấn, nhà ở dày đặc."],
["KT","Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố sản xuất lúa.","- Tự nhiên: đồng bằng châu thổ, đất phù sa; khí hậu nhiệt đới ẩm → 2-3 vụ/năm; nước dồi dào; nhiều giống lúa tốt. Khó khăn: đất nhiễm mặn, phèn, cát bay, bình quân đất thấp; thiên tai, sâu bệnh, biến đổi khí hậu.\n- Kinh tế - xã hội: lao động kinh nghiệm; KHCN; thủy lợi, chế biến; chính sách; thị trường (gạo ST25...).\n- Khó khăn: cơ sở vật chất kĩ thuật chưa đồng bộ, thị trường biến động, liên kết còn hạn chế."],
["KT","Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố cây công nghiệp.","- Tự nhiên: vị trí; đồi núi, đất feralit (trung du miền núi Bắc Bộ, Tây Nguyên) - cây lâu năm, đồng bằng - cây ngắn ngày; khí hậu nhiệt đới + phân hóa (có cây cận nhiệt như chè); nước; giống tốt. Khó khăn: xói mòn, bạc màu, thiên tai, sâu bệnh, đất hẹp.\n- Kinh tế - xã hội: lao động có kinh nghiệm; KHCN; thủy lợi, chế biến; chính sách; thị trường."],
["KT","Phân tích điều kiện phát triển ngành chăn nuôi nước ta.","- Cơ sở thức ăn (đồng cỏ, phụ phẩm trồng trọt, thủy sản, công nghiệp chế biến) có ý nghĩa hàng đầu.\n- Khí hậu nhiệt đới ẩm thuận lợi; giống bản địa và nhập ngoại, lai tạo.\n- Cơ sở vật chất: chuồng trại, thú y, nghiên cứu giống.\n- Dân cư, thị trường tiêu thụ lớn; chính sách khuyến khích.\n- Khó khăn: dịch bệnh (cúm gà, dịch tả lợn Châu Phi), thức ăn chưa đảm bảo, hình thức còn lạc hậu."],
["KT","Phân tích điều kiện tự nhiên và kinh tế - xã hội phát triển ngành thủy sản.","- Tự nhiên: biển Đông rộng (1 triệu km²), bờ biển dài 3260km, 4 ngư trường trọng điểm; nhiều đảo, vũng, vịnh, đầm phá, rừng ngập mặn; sông ngòi, ao hồ dày đặc; nguồn lợi phong phú. Khó khăn: bão, ATNĐ; khai thác quá mức; ô nhiễm biển.\n- KT-XH: lao động, thị trường, chính sách, cơ sở hạ tầng (cảng cá), KHCN."],
["KT","Trình bày vai trò của cây lúa.","- Kinh tế: cung cấp lương thực chính; nguyên liệu cho chế biến; xuất khẩu (Việt Nam thuộc nhóm đầu thế giới), thu ngoại tệ; phụ phẩm làm thức ăn chăn nuôi.\n- Xã hội: đảm bảo an ninh lương thực; tạo việc làm, tăng thu nhập, nâng cao chất lượng cuộc sống."],
["KT","Trình bày sự phát triển và phân bố ngành công nghiệp sản xuất điện.","- Phát triển: sản lượng tăng liên tục (244,9 tỉ kWh năm 2021); cơ cấu đa dạng: thủy điện, nhiệt điện (than, khí), điện tái tạo (gió, mặt trời), điện rác; xu hướng tăng điện gió, mặt trời.\n- Phân bố: thủy điện ở miền núi, sông có tiềm năng (Hòa Bình, Sơn La, Ya-ly); nhiệt điện than Quảng Ninh, Vũng Áng; nhiệt điện khí Bà Rịa-Vũng Tàu, Cà Mau; điện gió ở Duyên hải Nam Trung Bộ, Tây Nguyên, ĐBSCL; điện mặt trời ở DHNTB, Tây Nguyên."],
["KT","Trình bày sự phát triển và phân bố ngành công nghiệp dệt may và giày dép.","- Phát triển: ngành thế mạnh, truyền thống (lao động dồi dào, thị trường lớn); chiếm 11,1% giá trị sản xuất công nghiệp (2021); sản lượng tăng nhanh; xuất khẩu chủ lực (vải, quần, áo, giày, dép); chất lượng nâng cao nhờ KHCN; hướng chuyển từ gia công sang thiết kế, thời trang.\n- Phân bố: rộng khắp, tập trung Đông Nam Bộ và ĐBSH; mạnh ở các đô thị lớn (Hà Nội, TP.HCM, Hải Phòng, Đà Nẵng, Cần Thơ, Huế)."],
["KT","Trình bày sự phát triển và phân bố ngành sản xuất sản phẩm điện tử, máy vi tính.","- Phát triển: ngành mới, hàm lượng công nghệ cao, tăng nhanh; chiếm 25,3% giá trị sản xuất công nghiệp; sản phẩm chính: máy tính, linh kiện điện tử, điều hòa, tivi; đóng góp 32,2% giá trị xuất khẩu.\n- Phân bố: ĐBSH, Đông Nam Bộ (lao động chất lượng, hạ tầng, vốn đầu tư nước ngoài): Hà Nội, Bắc Ninh, Thái Nguyên, Bắc Giang, TP.HCM, Đồng Nai, Bình Dương."],
["KT","Trình bày sự phát triển và phân bố công nghiệp chế biến thực phẩm và đồ uống.","- Phát triển: lâu đời, dựa trên nguyên liệu từ nông nghiệp - thủy sản, lao động, thị trường; giá trị tăng nhưng tỉ trọng giảm (12,6% năm 2021); cơ cấu: xay xát gạo, đường, chế biến thịt - sữa - thủy sản, thức ăn chăn nuôi, nước giải khát, rượu bia...; xu hướng: phát triển vùng nguyên liệu, thương hiệu.\n- Phân bố: rộng khắp, tập trung Đông Nam Bộ, ĐBSH, ĐBSCL."],
["KT","Giải thích vì sao phải đẩy mạnh công nghiệp xanh.","- Khái niệm: dùng công nghệ tiên tiến, sản xuất thân thiện môi trường, tiết kiệm năng lượng, tái sử dụng chất thải.\n- Hiện nay sản xuất còn bất cập về xử lí chất thải, khí thải gây ô nhiễm.\n- Ý nghĩa: giảm chất thải, ô nhiễm; tạo sản phẩm đạt chuẩn khắt khe của thị trường (Hoa Kì, Nhật Bản, EU), thuế thấp; tiết kiệm chi phí, nguyên liệu, năng lượng."],
["KT","Trình bày đặc điểm ngành thủy sản nước ta (nuôi trồng, khai thác và phân bố).","- Nguồn lợi phong phú (>2000 loài cá, 100 loài tôm...); 4 ngư trường trọng điểm.\n- Sản lượng 2021: 8,81 triệu tấn; nuôi trồng nhanh hơn khai thác (nuôi 55,4%, khai thác 44,6%).\n- Khai thác: Bắc Trung Bộ - DHNTB cao nhất (42,7%); Kiên Giang, Bà Rịa-Vũng Tàu, Cà Mau, Bình Định.\n- Nuôi trồng: ĐBSCL lớn nhất (69,8%); An Giang, Đồng Tháp, Quảng Ninh, Hải Phòng."],
["KT","Trình bày đặc điểm tài nguyên rừng và sự phát triển ngành lâm nghiệp.","- 2021: rừng 14,7 triệu ha (tự nhiên 69%, trồng 31%), độ che phủ 42%; rừng tự nhiên tập trung Trung du miền núi Bắc Bộ; rừng phòng hộ, đặc dụng, sản xuất.\n- Trồng rừng được đẩy mạnh (~200 nghìn ha mới/năm); sản lượng gỗ khai thác tăng (12 triệu m³, gấp 4,6 lần 2010); vùng gỗ lớn: TDMNBB, Bắc Trung Bộ, DHNTB, Tây Nguyên."],
["KT","Vì sao cây công nghiệp phát triển mạnh trong những năm gần đây?","Vai trò quan trọng (nguyên liệu chế biến, xuất khẩu, tạo việc làm, bảo vệ môi trường); điều kiện tự nhiên (đồi núi, đất feralit, khí hậu nhiệt đới, nước, giống); lao động dồi dào, kinh nghiệm; thị trường trong và ngoài nước mở rộng; chính sách hỗ trợ; ứng dụng KHCN; cơ sở vật chất kĩ thuật (thủy lợi, chế biến, kho bãi, vận chuyển)."]
];

function deny(){$(hero("Chưa được cấp quyền","")+`<div class="c"><p>Tài khoản <b>${e(U.email)}</b> chưa được duyệt hoặc đã hết hạn. Hãy nhờ quản trị viên duyệt.</p><button onclick="out()">Đăng xuất</button></div>`)}
firebase.auth().onAuthStateChanged(async u=>{U=u;S.me=null;
 if(u){try{let t=await u.getIdToken(),p=await(await fetch(ROOT+"/users/"+u.uid+".json?auth="+t)).json();
  if(p&&p.status=="active"&&(!p.expiresAt||p.expiresAt>Date.now()))S.me={name:p.name||u.displayName||u.email,role:p.role}}catch(_){}}
 route()});

/* ---------- Điều hướng ---------- */
function route(){clearInterval(S.tm);let m=location.hash.match(/^#r=(.+)$/);
 if(m)return view(m[1]);if(!U)return login();if(!S.me)return deny();home()}
async function view(id){$(hero("📘 Kết quả kiểm tra miệng Địa lí","Chuyên Địa lí cô Hải Hà")+'<div class="c">Đang tải kết quả...</div>');
 try{let r=await api("/"+id,"GET");if(!r||!r.qs)throw 0;r.r=r.r||[];$(hero("📘 Kết quả kiểm tra miệng Địa lí","Chuyên Địa lí cô Hải Hà",'<button onclick="print()">🖨 In / lưu PDF</button>')+resHTML(r,"view"))}
 catch(_){$(hero("📘 Kết quả kiểm tra miệng Địa lí","Chuyên Địa lí cô Hải Hà")+'<div class="c"><h2>Không mở được kết quả</h2><p>Link có thể sai, kết quả đã bị xóa hoặc mạng đang lỗi. Hãy tải lại trang hoặc nhờ trợ giảng gửi lại link.</p></div>')}}

/* ---------- Trang chính + lịch sử ---------- */
function home(){clearInterval(S.tm);S.cur=null;
 $(hero("👩‍🏫 Kiểm tra miệng Địa lí","TG: "+e(S.me.name)+" • mỗi HS 5 câu ngẫu nhiên • 2 phút mỗi câu",'<button onclick="out()">Đăng xuất</button>')
 +`<div class="c"><h2>📅 Lịch kiểm tra từ Sheet <span class="mu" id="sst"></span></h2><div class="row"><div><label>Ngày</label><input type="date" id="sd" oninput="setSd(this.value)"></div><button class="b" onclick="report()">📋 Sao chép báo cáo ngày</button></div><div id="sc"></div></div>`
 +`<div class="c"><h2>🚀 Mở lượt kiểm tra mới</h2><div class="g"><div><label>Tên học sinh</label><input id="n"></div><div><label>Ca</label><input id="ca" placeholder="VD: Ca 1"></div><div><label>Thời gian kiểm tra</label><input id="gio" placeholder="VD: 14:30 17/11"></div></div><p class="mu">5 câu lấy từ 3 phạm trù: Tự nhiên, Dân cư, Kinh tế ngành. Khi bắt đầu, cửa sổ phụ sẽ mở để chia sẻ màn hình cho HS (hãy cho phép cửa sổ bật lên).</p><button class="b" onclick="start()">Bắt đầu kiểm tra</button></div>
 <div class="c"><h2>📚 Lịch sử kiểm tra</h2><div class="g"><div><label>Từ ngày</label><input type="date" id="f1" oninput="fl()"></div><div><label>Đến ngày</label><input type="date" id="f2" oninput="fl()"></div><div><label>Trợ giảng</label><select id="f3" onchange="fl()"></select></div><div><label>Học sinh</label><input id="f4" placeholder="Tìm theo tên..." oninput="fl()"></div></div><div class="row" style="margin-top:8px"><span class="mu" id="cnt"></span><button onclick="clr()">Xóa bộ lọc</button></div><div id="ls"></div></div>`);
 let f=S.f;document.getElementById("f1").value=f.a||"";document.getElementById("f2").value=f.b||"";document.getElementById("f4").value=f.sRaw||"";document.getElementById("sd").value=S.sd;sched();refreshSched();list();load()}
function fl(){let g=k=>document.getElementById(k).value;S.f={a:g("f1"),b:g("f2"),by:g("f3"),s:g("f4").trim().toLowerCase(),sRaw:g("f4")};list()}
function clr(){S.f={};home()}
function list(){let l=document.getElementById("ls");if(!l)return;let f=S.f;
 let sel=document.getElementById("f3"),tg={};S.recs.forEach(r=>{tg[r.by||""]=r.bn||"(không rõ)"});
 sel.innerHTML='<option value="">Tất cả</option>'+Object.keys(tg).map(k=>`<option value="${e(k)}">${e(tg[k])}</option>`).join("");sel.value=f.by||"";
 let a=S.recs.filter(r=>(!f.a||dOf(r)>=f.a)&&(!f.b||dOf(r)<=f.b)&&(!f.by||(r.by||"")==f.by)&&(!f.s||r.n.toLowerCase().includes(f.s)));
 document.getElementById("cnt").textContent=a.length+"/"+S.recs.length+" lượt";
 l.innerHTML=a.length?a.map(r=>{let v=verdict(calc(r).all),own=U&&S.me&&(r.by==U.uid||S.me.role=="superadmin");
 return `<div class="li"><div><b>${e(r.n)}</b><div class="mu">${e(dOf(r))} • ${e(r.ca)} • ${e(r.gio)}${r.bn?" • TG: "+e(r.bn):""}</div></div><span class="tag ${v[2]}">${v[0]} ${v[1]}</span><div class="row"><button onclick="sum('${r.id}')">Xem</button><button onclick="cp(link('${r.id}'))">🔗 Link</button>${own?`<button class="dg" onclick="del('${r.id}')">🗑 Xóa</button>`:""}</div></div>`}).join(""):'<span class="mu">Không có lượt nào khớp.</span>'}
async function load(){let l=lg();
 try{let o=await api("","GET",0,'?orderBy=%22%24key%22&limitToLast=500');l=[];if(o)Object.keys(o).forEach(k=>{let r=o[k];if(r&&r.qs&&r.r){r.id=k;l.push(r)}})}catch(_){}
 S.recs=l.sort((a,b)=>b.t-a.t);if(!S.cur){list();sched()}}
async function del(id){let r=S.recs.find(x=>x.id==id);if(!r||!confirm("Xóa lượt kiểm tra của "+r.n+"? Không thể khôi phục."))return;
 try{await api("/"+id,"DELETE");S.recs=S.recs.filter(x=>x.id!=id);try{localStorage.oe=JSON.stringify(lg().filter(x=>x.id!=id))}catch(_){}
  if(S.rec&&S.rec.id==id){S.rec=null;home()}else list();toast("Đã xóa")}
 catch(x){toast("Không xóa được ("+x.message+")")}}

/* ---------- Lượt kiểm tra ---------- */
/* ---------- Đồng bộ lịch từ Google Sheet ---------- */
const SHEET_ID="1TvI5xiJVy8qT52dZ64ZeAWiH11FDaqXuFq74hmJNtqM"; // đoạn giữa /d/ và /edit trong link Sheet
const TAB="Học sinh";
const norm=s=>String(s||"").normalize("NFC").trim().toLowerCase().replace(/\s+/g," ");
const VT=a=>a>=2?"Đã học bài":a>=1?"Học bài chưa kĩ":"Chưa học bài";
const WD=["CN","T2","T3","T4","T5","T6","T7"];
S.sch=[];S.schT=0;S.sd=dk();
async function loadSched(){
 let u="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&headers=1&sheet="+encodeURIComponent(TAB)+"&_="+Date.now();
 let t=await(await fetch(u,{cache:"no-store"})).text();
 let j=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
 S.sch=j.table.rows.map(r=>{let c=i=>{let x=r.c[i];return x?String(x.f!=null?x.f:(x.v!=null?x.v:"")).trim():""};
  let d=c(3),m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return{n:c(0),lop:c(1),d,iso:m?m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"):"",gio:c(4).slice(0,5),tg:c(5),meet:c(6),st:c(7),nt:c(8)}
 }).filter(x=>x.n&&x.iso);
 S.schT=Date.now()}
function caNo(x){let ts=[...new Set(S.sch.filter(y=>y.iso==x.iso).map(y=>y.gio))].sort();return ts.indexOf(x.gio)+1}
const absent=x=>/vắng/i.test(x.st);
function permit(x){let s=x.st+" "+x.nt;return /không phép|ko phép/i.test(s)?"không phép":/có phép/i.test(s)?"có phép":null}
function recOf(x){return S.recs.filter(r=>norm(r.n)==norm(x.n)&&dOf(r)==x.iso).sort((a,b)=>b.t-a.t)[0]}
const dayLbl=iso=>WD[new Date(iso+"T00:00:00").getDay()]+", "+iso.split("-").reverse().join("/");
function sched(){let box=document.getElementById("sc");if(!box)return;
 let L=S.sch.filter(x=>x.iso==S.sd).sort((a,b)=>a.gio.localeCompare(b.gio)||a.n.localeCompare(b.n));
 let st=document.getElementById("sst");if(st)st.textContent=S.schT?"Đồng bộ lúc "+new Date(S.schT).toLocaleTimeString("vi-VN"):"Đang tải...";
 box.innerHTML=L.length?L.map(x=>{let r=recOf(x),ab=absent(x),mine=S.me&&norm(x.tg)==norm(S.me.name);
  let tag=ab?'<span class="tag wn">⚠️ Vắng</span>':r?'<span class="tag ok">✅ Đã có kết quả</span>':/đã kiểm tra/i.test(x.st)?'<span class="tag ok">Đã KT (theo Sheet)</span>':'<span class="tag pr">Chờ kiểm tra</span>';
  return `<div class="li"><div><b>${e(x.n)}</b><div class="mu">Ca ${caNo(x)} • ${e(x.gio)} • ${e(x.lop)} • TG: ${e(x.tg)}${mine?" (bạn)":""}</div></div>${tag}<div class="row">${x.meet?`<a href="${e(x.meet)}" target="_blank" rel="noopener"><button>Meet</button></a>`:""}${ab||r?"":`<button class="b" onclick="startS('${encodeURIComponent(x.n+"|"+x.iso+"|"+x.gio)}')">▶ Bắt đầu</button>`}</div></div>`}).join(""):'<span class="mu">Không có học sinh nào được xếp trong ngày này.</span>'}
function startS(k){let [n,iso,gio]=decodeURIComponent(k).split("|"),x=S.sch.find(y=>y.n==n&&y.iso==iso&&y.gio==gio);
 if(!x){toast("Lịch vừa thay đổi, hãy chọn lại");sched();return}
 start({n:x.n,ca:"Ca "+caNo(x),gio:x.gio+" "+x.d.slice(0,5)})}
async function refreshSched(){if(!document.getElementById("sc"))return;
 try{await loadSched();sched()}
 catch(_){let s=document.getElementById("sst");if(s)s.textContent="⚠️ Không đọc được Sheet (kiểm tra ID và quyền chia sẻ)"}}
setInterval(refreshSched,60000);
addEventListener("focus",refreshSched);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshSched()});
function setSd(v){S.sd=v||dk();sched()}
function report(){let iso=S.sd,L=S.sch.filter(x=>x.iso==iso).sort((a,b)=>a.gio.localeCompare(b.gio)||a.n.localeCompare(b.n));
 if(!L.length){toast("Ngày này không có lịch");return}
 let warn=0,bl=L.map(x=>{let kq;
  if(absent(x)){let p=permit(x);if(!p){p="";warn++}
   kq="Học sinh vắng mặt "+p+". Tổ Trợ giảng đã xếp lịch kiểm tra bù cho HS."}
  else{let r=recOf(x);if(r){let a=calc(r).all;kq=a.toFixed(1)+"/3 ("+VT(a)+")"}else{kq="Chưa có kết quả";warn++}}
  return "Học sinh: "+x.n+"\nLớp: "+x.lop+"\nNgày: "+dayLbl(iso)+"\nCa số: "+caNo(x)+"\nThời gian: "+x.gio+"\nKết quả: "+kq}).join("\n\n");
 let t="[BÁO CÁO TÌNH HÌNH KIỂM TRA 1:1 NGÀY "+iso.split("-").reverse().slice(0,2).join("/")+"]\nKính gửi Quý phụ huynh,\nTổ Trợ giảng xin thông báo Kết quả kiểm tra lí thuyết 1:1 như sau:\n\n"+bl+"\n\nCác em và Quý phụ huynh vui lòng liên hệ Tổ Trợ giảng để xem thông tin chi tiết về kết quả kiểm tra.\nTrân trọng!";
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(warn?"Đã sao chép, nhưng còn "+warn+" mục cần kiểm tra lại":"Đã sao chép báo cáo")).catch(()=>prompt("Sao chép báo cáo:",t))}

function pick(){let by={TN:[],DC:[],KT:[]};sh(Q).forEach(q=>by[q[0]].push(q));let p=[by.TN[0],by.DC[0],by.KT[0]],ks=sh(Object.keys(by)),ex=ks[0],ex2=ks[1];p.push(by[ex][1]);p.push(by[ex2][1]);return sh(p)}
function start(p){let n=p?p.n:document.getElementById("n").value.trim();if(!n){alert("Nhập tên học sinh");return}
 S.cur={n,ca:p?p.ca:(document.getElementById("ca").value||"-"),gio:p?p.gio:(document.getElementById("gio").value||new Date().toLocaleString("vi-VN")),qs:pick(),i:0,r:[],ts:[TM,TM,TM,TM,TM],nt:[,,,,],run:false,done:false};
 if(!openWin())return;q()}
function openWin(){if(!S.win||S.win.closed)S.win=window.open("","hs_view","width=1000,height=640");if(!S.win){alert("Trình duyệt chặn cửa sổ bật lên. Hãy cho phép rồi thử lại.");return false}S.win.focus();ch();return true}
function ring(t){let col=t<=15?"#ef4444":t<=45?"#f59e0b":"#22d3ee";return `<div class="rg"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="rb"/><circle cx="60" cy="60" r="54" class="rf" style="stroke:${col};stroke-dasharray:339.3;stroke-dashoffset:${339.3*(1-Math.max(0,t)/TM)}"/></svg><b>${fmt(t)}</b></div>`}
function ch(){let w=S.win,c=S.cur;if(!w||w.closed||!c)return;let d=w.document;
 if(!d.getElementById("hs")){d.open();d.write('<meta charset="utf-8"><title>Màn hình học sinh</title><style>'+document.querySelector("style").textContent+'</style><body class="hsb"><div id="hs"></div>');d.close()}
 let t=c.ts[c.i];d.getElementById("hs").innerHTML=c.done?`<div class="wrap"><h1 style="text-align:center">🎉 Hoàn thành bài kiểm tra!</h1>${resHTML(S.rec,"hs")}</div>`:`<div class="hsw"><div class="hsh">${e(c.n)} • Câu ${c.i+1}/5</div><div class="hsq">${e(c.qs[c.i][1])}</div>${ring(t)}<div class="hsm">${t>0?(c.run?"Thời gian suy nghĩ":"Chuẩn bị..."):"Hết giờ — mời em trả lời"}</div></div>`}
function q(){clearInterval(S.tm);let c=S.cur,x=c.qs[c.i];c.run=false;
 $(hero("📝 "+e(c.n),"Ca: "+e(c.ca)+" • "+e(c.gio),'<button onclick="openWin()">🖥 Mở lại cửa sổ HS</button><button onclick="if(confirm(\'Dừng lượt kiểm tra?\'))home()">Thoát</button>')
 +`<div class="steps">${c.qs.map((_,k)=>`<i class="${k==c.i?"cur":c.r[k]!=null?"dn":""}">${k+1}</i>`).join("")}</div>
 <div class="c"><span class="tag">${CI[x[0]]} ${CATS[x[0]]}</span><div class="q">${e(x[1])}</div><div class="row"><div id="tm">${ring(c.ts[c.i])}</div><div class="bt"><button id="bt" class="b" onclick="run()">${c.ts[c.i]<TM?"▶ Tiếp tục":"▶ Bắt đầu tính giờ"}</button><button onclick="c0()">⏭ Bỏ qua thời gian</button></div></div></div>
 <div class="c ans"><h2>📖 Đáp án chi tiết <span class="mu">(chỉ trợ giảng thấy)</span></h2><div class="a">${e(ans(x))}</div></div>
 <div class="c"><h2>🎯 HS học đến mức nào?</h2><div class="r">${LV.map((l,k)=>`<button class="lv ${LC[k]}${c.r[c.i]===k?" on":""}" onclick="rate(${k})">${IC[k]}<br>${l}</button>`).join("")}</div></div>
 <div class="c"><h2>✍️ Ghi chú cho câu này <span class="mu">(HS sẽ thấy trong kết quả)</span></h2><textarea id="nt" rows="3" maxlength="900" placeholder="VD: nhớ đúng ý chính nhưng thiếu số liệu, chưa giải thích được nguyên nhân..." oninput="S.cur.nt[S.cur.i]=this.value">${e(c.nt[c.i])}</textarea></div>
 <div class="nav"><button onclick="go(-1)" ${c.i?"":"disabled"}>← Câu trước</button><button class="b" id="nx" onclick="go(1)" ${c.r[c.i]==null?"disabled":""}>${c.i<4?"Câu tiếp theo →":"🏁 Kết thúc & xem kết quả"}</button></div>`);ch()}
function tick(){let c=S.cur;if(c.ts[c.i]>0)c.ts[c.i]--;let t=document.getElementById("tm");if(t)t.innerHTML=ring(c.ts[c.i]);if(c.ts[c.i]<=0){clearInterval(S.tm);c.run=false;let b=document.getElementById("bt");if(b)b.textContent="⏰ Hết giờ"}ch()}
function run(){let c=S.cur,b=document.getElementById("bt");if(c.run){clearInterval(S.tm);c.run=false;b.textContent="▶ Tiếp tục"}else{if(c.ts[c.i]<=0)return;c.run=true;b.textContent="⏸ Tạm dừng";S.tm=setInterval(tick,1000)}ch()}
function c0(){clearInterval(S.tm);S.cur.ts[S.cur.i]=0;S.cur.run=false;tick()}
function rate(k){let c=S.cur;c.r[c.i]=k;document.querySelectorAll(".lv").forEach((b,j)=>b.classList.toggle("on",j==k));document.getElementById("nx").disabled=false;document.querySelectorAll(".steps i")[c.i].classList.add("dn")}
function go(d){let c=S.cur;if(d>0&&c.i==4)return fin();clearInterval(S.tm);c.i+=d;q()}
async function fin(){let c=S.cur;clearInterval(S.tm);c.done=true;
 S.rec={id:nid(),t:Date.now(),n:c.n,ca:c.ca,gio:c.gio,qs:c.qs.map(x=>({c:x[0],q:x[1],a:ans(x)})),r:c.r,cm:{},nt:c.nt.map(x=>x.trim()),by:U.uid,bn:S.me.name,be:U.email,day:dk()};sv(S.rec);S.recs.unshift(S.rec);ch();sum(S.rec);await save(S.rec)}
async function save(r){let s=document.getElementById("st");try{await api("/"+r.id,"PUT",r);if(s)s.innerHTML='<span class="chip ok">☁️ Đã lưu lên Firebase</span>'}catch(x){if(s)s.innerHTML='<span class="chip bad">⚠️ Chưa lưu được ('+e(x.message)+'). <a href="#" onclick="save(S.rec);return false">Thử lại</a></span>'}}
function sum(r){if(typeof r=="string")r=S.recs.find(x=>x.id==r);S.rec=r;
 $(hero("📊 Kết quả: "+e(r.n),e(r.ca)+" • "+e(r.gio)+(r.bn?" • TG: "+e(r.bn):""),'<button onclick="print()">🖨 In</button><button onclick="home()">🏠 Trang chính</button>')
 +`<div class="c np"><h2>🔗 Link kết quả gửi cho học sinh</h2><div class="row" style="flex-wrap:nowrap"><input id="lk" readonly value="${e(link(r.id))}"><button class="b" onclick="cp(document.getElementById('lk').value)">Sao chép</button></div><div id="st"></div>${location.protocol=="file:"?'<p class="mu">Bạn đang mở file trên máy nên link chỉ dùng được sau khi đưa trang này lên GitHub Pages (đăng nhập Google cũng cần chạy trên domain đã thêm vào Authorized domains).</p>':""}</div>`
 +resHTML(r,"adm")+`<div class="nav np"><button onclick="home()">← Về trang chính</button><button class="b" onclick="saveCm()">💾 Lưu nhận xét</button></div>`)}
async function saveCm(){let r=S.rec,cm={};["TN","DC","KT","all"].forEach(k=>{let t=document.getElementById("cm_"+k);if(t&&t.value.trim())cm[k]=t.value.trim()});r.cm=cm;sv(r);
 try{await api("/"+r.id+"/cm","PUT",cm);toast("Đã lưu nhận xét")}catch(x){toast("Chưa lưu được lên Firebase: "+x.message)}}
addEventListener("hashchange",route);
</script></body></html>
