["DC", "Vì sao tỉ lệ gia tăng dân số tự nhiên giảm nhưng quy mô dân số vẫn tăng?", "- Tỷ lệ gia tăng dân số tự nhiên của VN giảm do thực hiện tốt chính sách dân số kế hoạch hoá gia đình trong những năm trước đây. Hiện nay, tỷ lệ gia tăng dân số giảm chủ yếu là do tỷ suất sinh giảm (do sự phát triển của kinh tế - xã hội, mức sống tăng, nhận thức dân trí của người dân tăng, áp dụng sự phát triển của KHCN, KHKT tiên tiến vào y tế, điều kiện chăm sóc sức khoẻ cải thiện nên tỷ lệ tử vong ở trẻ giảm, số sinh giảm...)\n- Tỷ lệ gia tăng dân số tự nhiên của nước ta giảm nhưng vẫn còn cao (0,94%) nên dân số vẫn tiếp tục có xu hướng tăng\n- Quy mô dân số của VN đông (Năm 2024: 101,1 triệu người). Do đó, tỷ lệ gia tăng dân số 0,94% đã giảm nhưng vẫn cao nên trung bình mỗi năm, dân số nước ta vẫn tăng khoảng 1 triệu người."],
["DC", "Vì sao tỉ lệ dân thành thị nước ta tăng?", "- Tỷ lệ dân đô thị tăng nhanh do quá trình CN hoá, hiện đại hoá làm tăng tốc độ đô thị hoá, góp phần làm tăng tỷ lệ dân đô thị.\n+ Quá trình CN hoá, đô thị hoá thúc đẩy sự chuyển dịch cơ cấu kinh tế và lao động theo hướng tăng tỉ trọng ngành CN và dịch vụ, giảm tỉ trọng ngành nông nghiệp. Từ đó, thu hút dân vào lao động tập trung tại các khu vực đô thị.\n+ Quá trình CNH, HĐH đẩy mạnh phát triển CN và dịch vụ, đòi hỏi cần nhiều lao động trong lĩnh vực kinh tế này. Chính vì vậy, MĐDS tăng do thu hút lao động."],
["DC", "Trình bày thực trạng và giải pháp vấn đề việc làm.", "- Việc làm là 1 vấn đề kinh tế - xã hội gay gắt, được xã hội quan tâm vì:\n* Thực trạng\n- Số lao động có việc làm trong độ tuổi lao động của nước ta khá cao. Năm 2021, trong tổng số 50,6 triệu lao động có 49 triệu lao động có việc làm, trong đó thành thị là 17,7 triệu người; trong khi đó, nông thôn là 31,3 triệu người\n- Tuy nhiên, tình trạng thất nghiệp và thiếu việc làm vẫn là vấn đề kinh tế - xã hội lớn cần quan tâm hiện nay:\n+ Tình trạng thất nghiệp diễn ra cụ thể ở TT. Năm 2021, nước ta có 1,6 triệu người thất nghiệp, tỷ lệ thất nghiệp là 3,2%, trong khi đó, khu vực TT là 4,3%; NT là 2,5%\n+ Tình trạng thiếu việc làm diễn ra cụ thể ở NT. Năm 2021, tỷ lệ thiếu việc làm chung của cả nước là 2,52%; trong đó, khu vực NT là 2,94%, khu vực TT là 1,69%\n- Các việc làm giản đơn, năng suất thấp còn phổ biến. Trong những năm gần đây, việc hội nhập sâu rộng vào nền kinh tế quốc dân đem lại cho người lao động nước ta nhiều cơ hội việc làm, nâng cao tay nghề và chất lượng lao động. Sự phát triển mạnh mẽ của KHCN tạo ra những thay đổi mang tính đột phá về việc làm.\n* Giải pháp\n- Hoàn thiện chính sách, pháp luật về lao động nhằm khuyến khích, hỗ trợ, huy động mọi nguồn lực đầu tư tạo ra việc làm\n- Đẩy mạnh đào tạo, dạy nghề, nâng cao chất lượng lao động\n- Đẩy mạnh phát triển các ngành kinh tế, đặc biệt là những ngành cần nhiều lao động\n- Phát triển hệ thống tư vấn, thông tin về thị trường lao động, việc làm\n- Đẩy mạnh hợp tác quốc tế về lao động (xuất khẩu lao động)\n- Xây dựng và thực hiện tốt chương trình bảo hiểm xã hội, bảo hiểm thất nghiệp, hỗ trợ tích cực để người mất việc sớm trở lại làm việc\n- Phân bố lại dân cư và lao động trên địa bàn cả nước."],
["DC", "So sánh quần cư nông thôn và quần cư thành thị.", "Quần cư nông thôn | Quần cư thành thị\n1. MĐDS: MĐDS thấp | MĐDS cao\n2. Hoạt động kinh tế: Nông nghiệp là chủ yếu, chuyển dịch cơ cấu kinh tế phát triển dịch vụ, CN, tiểu thủ CN | CN và dịch vụ là hoạt động kinh tế chủ yếu\n3. Chức năng: Hành chính, văn hoá, xã hội. Chức năng quần cư NT đang thay đổi theo hướng đô thị hoá | Đa chức năng: trung tâm kinh tế, văn hoá, chính trị, đổi mới sáng tạo,...\n4. Cấu trúc quần cư: Nơi cư trú được cấu trúc thành xã, làng, xóm, bản, thôn,... | Nơi cư trú được cấu trúc thành phường, thị trấn, tổ dân phố."],
["DC", "Phân tích sự thay đổi cơ cấu dân số theo giới tính.", "a) Đặc điểm:\n- Tỉ số giới tính có sự thay đổi theo thời gian. Hiện nay, tỉ số giới tính của nước ta khá cân bằng (Năm 2021: 99,4 nam / 100 nữ)\n- Tỉ số giới tính có sự khác nhau giữa các nhóm tuổi:\n+ Nhóm 0-14t: Nam > Nữ\n+ Nhóm >65t: Nữ < Nam\n+ Đặc biệt, tình trạng mất cân bằng giới tính khi sinh ở mức cao (Năm 2021: 112 bé trai / 100 bé gái)\n- Tỉ số giới tính có sự khác nhau giữa thành thị (TT) và nông thôn (NT), giữa các vùng kinh tế.\nb) Nguyên nhân: Do tác động của phong tục tập quán, tâm lý xã hội, yếu tố KHKT, do tình hình phát triển kinh tế,...\nc) Ảnh hưởng: cơ cấu dân số theo giới tính tác động đến chiến lược phát triển KT-XH, đến phân bố sản xuất, tổ chức đời sống xã hội"],
["DC", "Phân tích ảnh hưởng của cơ cấu dân số theo nhóm tuổi (dân số vàng và xu hướng già hóa).", "* Ảnh hưởng\n- Tích cực: tỉ trọng người trong tuổi lao động cao, tỉ lệ dân phụ thuộc ít, nguồn lao động dồi dào, thị trường tiêu thụ. Đây là chiến lược để VN đẩy mạnh phát triển kinh tế, nâng cao thu nhập cho người dân\n- Hạn chế: số lượng và tỉ lệ người cao tuổi ngày càng lớn, đòi hỏi tăng chi phí cho an sinh xã hội, dịch vụ y tế. Số lượng đông, tăng nhanh trong khi đặc điểm kinh tế VN chưa phát triển mạnh, gây sức ép lên vấn đề việc làm, môi trường, ngành thành, giáo dục, y tế"],
["DC", "Giải thích nguyên nhân phân bố dân cư không đều ở nước ta.", "- Dân cư nước ta phân bố không đều do chịu tác động tổng hợp, đồng thời của nhiều nhân tố, bao gồm: ĐK tự nhiên (ĐH, KH, nguồn nước, đất,...), lịch sử định cư và khai thác lãnh thổ, trình độ phát triển KT-XH và mức độ khai thác, tính chất của nền kinh tế (nông nghiệp, công nghiệp,...),...\n- Nhân tố tác động đến sự phân bố dân cư khác nhau ở mỗi vùng miền, mức độ tác động cũng khác nhau nên sự phân bố dân cư khác nhau.\n+ Ở các vùng đồng bằng và đô thị: ĐH khá bằng phẳng, đất phù sa màu mỡ, nguồn nước dồi dào, kinh tế phát triển, gắn liền với các hoạt động CN và dịch vụ. Ngoài ra có 1 số tỉnh thành có lịch sử khai thác và đô thị ra đời lâu đời. Chính vì vậy dân cư tập trung đông đúc.\n+ Ở các vùng núi và cao nguyên có ĐH hiểm trở, giao thông khó khăn, KH có nhiều thiên tai (lũ quét, bão, sạt lở,...), kinh tế chậm phát triển, gắn liền với các hoạt động N-L-TS. Chính vì vậy dân cư thưa thớt."],
["DC", "Nêu các giải pháp giải quyết vấn đề phân bố dân cư ở nước ta.", "- Đẩy mạnh phát triển công nghiệp, dịch vụ ở các vùng nông thôn, giải quyết tình trạng dư thừa lao động, thiếu việc làm\n- Đẩy mạnh đô thị hoá ở nông thôn, xây dựng CSHT, CSVC cho vùng núi và cao nguyên\n- Phân bố lại dân cư, lao động trên phạm vi cả nước nhằm ổn định đời sống của người dân, khai thác tốt hơn tiềm năng ở những vùng thưa dân, thiếu lao động\n- Xuất khẩu lao động, ngăn chặn nạn di dân tự do\n- Thực hiện chính sách dân số kế hoạch hoá gia đình và các giải pháp kinh tế để nâng cao mức sống của người dân, giảm mức sinh"],
["DC", "Vì sao ĐBSH có tỉ lệ gia tăng dân số tự nhiên cao ở nước ta hiện nay?", "- Do ĐBSH là vùng có kinh tế phát triển, mức sống cao, điều kiện chăm sóc sức khoẻ hàng đầu cả nước, áp dụng sự phát triển của KHCN, kĩ thuật tiên tiến (KTTT) vào y tế, làm tỷ lệ tử vong trẻ sơ sinh giảm thấp nhất cả nước.\n- Do vùng ĐBSH còn nhiều phong tục tập quán như: trọng nam khinh nữ...\n⇒ Chính vì vậy, ĐBSH có tỷ suất sinh cao, tăng trong những năm gần đây nên tỉ lệ gia tăng tự nhiên cũng tăng cao > 1%."],
["DC", "Vì sao trung du và miền núi phía Bắc có mật độ dân số thấp nhất cả nước?", "- Trung du miền núi phía Bắc có MĐDS thấp nhất cả nước, năm 2024: 136 người/km², do trung du miền núi phía Bắc có địa hình hiểm trở, không thuận lợi để phát triển kinh tế, CN và dịch vụ.\n- Trung du miền núi phía Bắc có địa hình hiểm trở, giao thông còn khó khăn, đường đi gập ghềnh, khí hậu có nhiều thiên tai như lũ quét, sạt lở, bão...\n- Trung du miền núi phía Bắc là vùng kinh tế chậm phát triển, CSHT còn kém chất lượng, KHCN và kĩ thuật chưa phát triển mạnh, nhiều dịch vụ gặp nhiều khó khăn, các hoạt động y tế, giáo dục,... còn lạc hậu, chưa phát triển, các hoạt động kinh tế gắn liền với hoạt động N-L-TS.\n- Vùng trung du miền núi phía Bắc có tiềm năng để khai thác tài nguyên, song, vẫn chưa được khai thác hợp lý\n→ Do sự tác động tổng hợp, đồng thời của các nhân tố trên đã làm dân cư thưa thớt ở trung du miền núi phía Bắc sinh sống."],
["DC", "Vì sao dân cư vùng Bắc Trung Bộ phân bố không đều giữa phía Đông và phía Tây?", "- Đồng bằng (phía Đông): kinh tế phát triển, dân trí cao, lịch sử khai thác lâu đời\n- Miền núi (phía Tây): kinh tế lạc hậu\n→ Đồng bằng đông dân; miền núi ít dân (giải thích như Câu 7)."],
["DC", "Trình bày những chuyển biến tích cực trong cơ cấu sử dụng lao động ở nước ta hiện nay. Tại sao có những chuyển biến đó?", "* Chuyển biến về sử dụng lao động trong các ngành kinh tế\n- Lao động trong khu vực N-L-TS còn chiếm tỷ trọng cao nhưng có xu hướng giảm liên tục\n- Lao động trong khu vực CN và dịch vụ chiếm tỷ trọng chưa cao nhưng có xu hướng tăng\nLưu ý: dạng bài này dựa vào bảng số liệu để nhận xét\n⇒ Giải thích:\n○ Do nước ta đang trong quá trình CNH, HĐH, cơ cấu kinh tế có sự chuyển dịch tích cực theo hướng tăng tỷ trọng CN, dịch vụ, giảm tỷ trọng nông nghiệp nên tỷ trọng lao động trong khu vực kinh tế này (N-L-TS) cũng giảm theo\n○ Do lao động nước ta có trình độ, còn hạn chế, chủ yếu là lao động gắn với các hoạt động N-L-TS\n* Chuyển biến về sử dụng lao động trong các thành phần kinh tế\n- Lao động trong khu vực kinh tế ngoài nhà nước có xu hướng tăng\n- Lao động trong khu vực kinh tế nhà nước giảm\n- Lao động trong khu vực có vốn đầu tư nước ngoài còn ít nhưng có xu hướng tăng\n⇒ Giải thích:\n○ Do sự chuyển đổi sang nền kinh tế thị trường của nước ta trong giai đoạn hiện nay\n○ Do nước ta đang trong quá trình CNH, HĐH\n* Chuyển biến về năng suất lao động xã hội\n- Năng suất lao động ngày càng tăng nhưng nhìn chung còn khá thấp so với thế giới\n- Năng suất lao động thấp ảnh hưởng đến thu nhập của người lao động và làm chậm quá trình phân công lao động xã hội. Quỹ thời gian lao động của người dân ở NT chưa được sử dụng hết\n⇒ Giải thích:\n○ Do tốc độ phát triển kinh tế chưa phù hợp với tốc độ phát triển dân số và nguồn lao động\n○ Cơ cấu kinh tế chưa phù hợp với cơ cấu nguồn lao động\n* Chuyển biến về cơ cấu lao động theo thành thị và nông thôn\n- Tỉ trọng lao động ở TT ngày càng tăng\n- Tỉ trọng lao động ở NT ngày càng giảm\n⇒ Giải thích:\n○ Do chịu ảnh hưởng của quá trình CNH, HĐH\n○ Do hệ quả của quá trình đô thị hoá (ĐTH)"],
["DC", "Chứng minh nguồn lao động nước ta dồi dào và ngày càng được nâng cao.", "- Năm 2021, lực lượng lao động nước ta là 50,6 triệu người, chiếm 51,3% tổng số dân\n- So với năm 2010, lực lượng lao động nước ta là 39,4 triệu người, bình quân mỗi năm nước ta tăng 1 triệu lao động.\n- Phẩm chất lao động của nước ta cần cù, sáng tạo, có kinh nghiệm phong phú trong sản xuất N-L-TS, tiểu thủ CN,...\n- Chất lượng nguồn lao động ngày càng được nâng cao, tỷ lệ người lao động đã qua đào tạo tăng từ 14,6% (năm 2010) lên 26,2% (năm 2021)"],
["KT", "Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố sản xuất lúa (phần 1: điều kiện tự nhiên).", "* Tự nhiên\n- Vị trí địa lý: VN có VTĐL nằm gần trung tâm ĐNÁ, nằm phía Đông bán đảo Đông Dương, giáp với biển Đông nên thuận lợi để giao thương, phát triển ngành sx lúa.\n- ĐH + đất:\n+ ĐH đồng bằng chiếm 1/4 S lãnh thổ với 2 đb châu thổ rộng lớn là sông Hồng và sông Mê Công và ĐBDHMT. Đất ở các đb chủ yếu là đất phù sa màu mỡ, thích hợp để sx lúa. Bên cạnh đó, ở ĐB còn có nhiều đất mặn, đất phèn, do đó cần lai tạo nhiều giống lúa có khả năng chịu được mặn, phèn.\n+ Ở núi, dọc theo thung lũng sông, có đất phù sa tương đối màu mỡ nên tạo điều kiện thuận lợi để phát triển các cánh đồng giữa núi (Than Uyên, Nghĩa Lộ, Điện Biên)\n- Khí hậu: Việt Nam có khí hậu NĐẨGM với nhiệt độ trung bình cao >20°C, lượng mưa lớn 1500mm - 2000mm /năm, độ ẩm cao >80% tạo điều kiện cho phép phát triển ngành sx lúa được diễn ra quanh năm, tăng vụ, tăng năng suất, có thể ↑ 2→3 vụ lúa /năm.\n- Nguồn nước:\n+ Có mạng lưới sông ngòi dày đặc, kênh rạch, nhiều hồ, đầm tự nhiên và nhân tạo, nguồn nước ngầm phong phú, tạo điều kiện để cung cấp nước tưới tiêu cho sx lúa\n+ Các hệ thống sông lớn còn có vai trò bồi đắp phù sa cho đồng bằng châu thổ, góp phần mở rộng S trồng lúa.\n- Sinh vật: VN có nhiều giống lúa tốt cho năng suất cao (gạo ST25, gạo ST24), chất lượng cao, là cơ sở để các nguồn gen quý cho ngành sx lúa.\n* Khó khăn\n- ĐH và đất:\n+ Ở các vùng đồng bằng trũng và thấp, đặc biệt là ĐBSCL, đất bị thoái hóa do nhiễm mặn, nhiễm phèn, ngập úng, gây ảnh hưởng đến sx lúa.\n+ Vùng ven biển có hiện tượng sa mạc hóa (đặc biệt ở Ninh Thuận và Bình Thuận), hiện tượng cát bay, cát chảy nên đất đai nghèo chất dinh dưỡng, dẫn đến ảnh hưởng tiêu cực đến năng suất lúa.\n+ Bình quân đất tự nhiên và đất nông nghiệp trên đầu người ở nước ta thấp và ngày càng bị thu hẹp (do mở rộng của đô thị, nông nghiệp, dịch vụ) làm hạn chế việc mở rộng sx lúa.\n- Khí hậu:\n+ Nước ta có nhiều thiên tai như bão, hạn hán, sương muối,... gây thiệt hại cho sx lúa.\n+ Môi trường nóng ẩm là điều kiện thuận lợi để sâu bệnh phát triển ảnh hưởng đến sản lượng và chất lượng lúa.\n+ BĐKH làm gia tăng các hiện tượng thời tiết cực đoan, làm cho sản xuất lúa trở nên bấp bênh.\n- Nguồn nước: Chế độ dòng chảy sông ngòi thất thường, mùa khô gây thiếu nước nghiêm trọng, mùa mưa nước sông dâng cao gây ngập úng, ảnh hưởng tới năng suất cây trồng. Chính vì vậy, thủy lợi là biện pháp hàng đầu trong thâm canh lúa."],
["KT", "Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố sản xuất lúa (phần 2: điều kiện kinh tế - xã hội).", "+ Điều kiện kinh tế - xã hội (Lao động trong ngành N² là 29,1%)\n- Dân cư lao động: Nước ta có lực lượng lao động trong sản xuất lúa dồi dào, có kinh nghiệm sx lúa, (kinh nghiệm trong thâm canh lúa nước). Trình độ lao động ngày càng được nâng cao, là cơ sở cho việc áp dụng KHKT mới vào trong sản xuất lúa và nâng cao khả năng cạnh tranh của các sản phẩm lúa trên thị trường thế giới.\n- Khoa học công nghệ: ngày càng hiện đại, phát triển và được ứng dụng rộng rãi trong sx lúa, giúp hoạt động sx lúa ngày càng thuận lợi hơn, nâng cao giá trị và chất lượng sản phẩm lúa\n- Hệ thống cơ sở VCKT phục vụ sản xuất lúa: gồm thủy lợi, dịch vụ trồng trọt, công nghệ chế biến ngày càng được hoàn thiện, phổ rộng khắp cả nước, góp phần tăng giá trị và khả năng cạnh tranh của lúa gạo, nâng cao hiệu quả sx, ổn định và phát triển vùng chuyên canh\n- Chính sách phát triển sản xuất lúa: Nhà nước ban hành nhiều chính sách thúc đẩy ngành sx lúa phát triển như thu hút đầu tư, cho vay vốn ưu đãi, sx lúa công nghệ cao, chuyển từ tư duy sx lúa sang tư duy kinh tế sx lúa, tham gia vào chuỗi giá trị toàn cầu.\n- Thị trường tiêu thụ gạo: Là thị trường trong và ngoài nước được mở rộng đã thúc đẩy sx lúa phát triển, đa dạng hóa sản phẩm gạo. Nhiều sản phẩm gạo VN đã đáp ứng được tiêu chuẩn toàn cầu, đặc biệt là gạo ST25, có mặt ở các thị trường lớn như Mỹ, EU, Nhật Bản, Trung Quốc,...\n- Khó khăn:\n+ Cơ sở VCKT nhiều vùng còn hạn chế, chưa hoàn thiện và đồng bộ. Công nghệ chế biến ở 1 số vùng chưa phát triển, công nghệ còn lạc hậu nên giá trị sản phẩm không cao.\n+ Thị trường thế giới có nhiều biến động về giá cả, nhiều sản phẩm gạo nước ta chưa đáp ứng được các yêu cầu của thị trường thế giới và khu vực.\n+ Việc liên kết trong sx, chế biến, tiêu thụ còn hạn chế."],
["KT", "Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố cây công nghiệp (phần 1: điều kiện tự nhiên).", "* Tự nhiên:\n- VTĐL: VN có VTĐL nằm gần trung tâm ĐNÁ, nằm phía Đông bán đảo Đông Dương giáp với biển Đông nên thuận lợi để giao thương, phát triển cây CN.\n- ĐH + đất:\n+ ĐH đồi núi chiếm 3/4 S lãnh thổ, chủ yếu là đồi núi thấp, một số vùng có các cao nguyên tương đối rộng lớn, khá bằng phẳng (Trung du và miền núi Bắc Bộ, Tây Nguyên). Khu vực này có đất feralit là chủ yếu, thuận lợi cho việc hình thành, phát triển các vùng chuyên canh cây CN.\n+ ĐH đồng bằng chiếm 1/4 S lãnh thổ với 2 đồng bằng châu thổ rộng lớn là đồng bằng sông Hồng, sông Mê Công và ĐBDHMT. Đất ở các đồng bằng chủ yếu là đất phù sa màu mỡ, thích hợp để trồng các cây CN ngắn ngày. ĐBDHMT có nhiều đất cát, thích hợp để trồng các cây CN ngắn ngày, đặc biệt là lạc.\n- Khí hậu:\n+ VN có Khí hậu NĐẨGM với nhiệt độ trung bình cao >20°C, lượng mưa lớn 1500mm - 2000mm, độ ẩm cao >80% tạo điều kiện cho phép phát triển sx cây CN được diễn ra quanh năm, tăng vụ, tăng năng suất,... tạo nên các sản phẩm có giá trị kinh tế cao (tiêu, điều, cà phê, cao su).\n+ KH nước ta phân hóa đa dạng (theo mùa, độ cao, B-N, T-Đ) đã tạo nên sự khác nhau về cơ cấu mùa vụ giữa các vùng, sự đa dạng sản phẩm trên cả nước. Ngoài các cây CN NĐ, nước ta còn phát triển các cây CN cận nhiệt như chè,...\n- Nguồn nước:\n+ Có mạng lưới sông ngòi dày đặc, kênh rạch, nhiều hồ, đầm tự nhiên và nhân tạo, lượng mưa hàng năm tương đối lớn, nguồn nước ngầm phong phú, tạo điều kiện để cung cấp nước tưới tiêu cho việc trồng trọt cây CN.\n- Sinh vật: Nhiều giống cây trồng tốt là cơ sở cung cấp nguồn gen quý cho cây CN (cà phê Buôn Ma Thuột, chè San Tuyết)\n* Khó khăn:\n- ĐH và đất:\n+ ĐH đồi núi có độ dốc lớn, mưa nhiều tập trung theo mùa, thảm thực vật tự nhiên bị tàn phá nên nhiều S đất ở trung du miền núi bị rửa trôi, xói mòn, bạc màu trở nên khô cằn, nghèo chất dinh dưỡng gây ảnh hưởng tới sx cây CN\n+ Vùng ven biển có hiện tượng sa mạc hóa (đặc biệt là ở Ninh Thuận và Bình Thuận), hiện tượng cát bay, cát chảy nên đất đai nghèo chất dinh dưỡng.\n+ Bình quân đất tự nhiên và đất nông nghiệp theo đầu người ở nước ta thấp và ngày càng bị thu hẹp làm hạn chế việc mở rộng sx cây CN.\n- Khí hậu:\n+ Nước ta có nhiều thiên tai như bão, lũ, hạn hán,... gây thiệt hại cho sx cây CN.\n+ Môi trường nóng ẩm là điều kiện thuận lợi để sâu bệnh phát triển, ảnh hưởng đến chất lượng cây CN.\n- Nguồn nước: Chế độ dòng chảy sông ngòi thất thường, mùa khô gây thiếu nước nghiêm trọng, mùa mưa nước sông dâng cao gây ngập úng ảnh hưởng tới năng suất cây trồng. Chính vì vậy, thủy lợi là biện pháp hàng đầu trong thâm canh cây CN.\n* Đất feralit gồm 3 nhóm đất chính:\n○ Đất feralit trên đá bazan: phổ ở Tây Nguyên, Đông Nam Bộ, có độ phì cao, tầng đất dày.\n○ Đất feralit trên đá vôi: phổ ở Trung du miền núi Bắc Bộ, Bắc Trung Bộ, đất màu mỡ, tầng đất mỏng.\n○ Đất feralit trên các loại đá khác, phổ rộng khắp cả nước."],
["KT", "Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố cây công nghiệp (phần 2: điều kiện kinh tế - xã hội).", "* Điều kiện kinh tế - xã hội\n- Dân cư lao động: Nước ta có lực lượng lao động trong ngành trồng trọt cây CN dồi dào, có kinh nghiệm trồng cây CN. Trình độ lao động ngày càng được nâng cao. Là cơ sở cho việc áp dụng KHKT mới vào trong trồng cây CN và nâng cao khả năng cạnh tranh của các sản phẩm từ các loại CN trên thị trường.\n- Khoa học công nghệ: ngày càng hiện đại, phát triển và được ứng dụng rộng rãi trong việc trồng trọt cây CN, giúp hoạt động trồng trọt cây CN ngày càng thuận lợi hơn, nâng cao giá trị và chất lượng sản phẩm.\n- Hệ thống cơ sở VCKT phục vụ trồng trọt cây CN: gồm thủy lợi, dịch vụ trồng trọt, CN chế biến ngày càng được hoàn thiện, phổ rộng khắp cả nước góp phần tăng giá trị và khả năng cạnh tranh của hàng từ cây CN, nâng cao hiệu quả sx, ổn định và phát triển các vùng chuyên canh.\n- Chính sách phát triển cây CN: Nhà nước ban hành nhiều chính sách thúc đẩy ngành trồng trọt, chế biến cây CN phát triển như thu hút đầu tư, cho vay vốn ưu đãi, ứng dụng CN nghệ cao, chuyển từ tư duy trồng trọt cây CN sang tư duy kinh tế cây CN, tham gia vào chuỗi giá trị toàn cầu.\n- Thị trường tiêu thụ sản phẩm từ cây CN: Là thị trường trong và ngoài nước được mở rộng đã thúc đẩy trồng trọt phát triển, đa dạng hóa sản phẩm từ cây CN. Nhiều sản phẩm từ cây CN của VN đã đáp ứng được tiêu chuẩn toàn cầu, có mặt ở các thị trường lớn như Mỹ, EU, Nhật Bản, TQ,...\n- Khó khăn: + Cơ sở VCKT nhiều vùng còn hạn chế, chưa hoàn thiện và đồng bộ. Công nghệ chế biến ở 1 số vùng chưa phát triển, công nghệ còn lạc hậu nên giá trị sản phẩm không cao.\n+ Thị trường thế giới có nhiều biến động về giá cả, nhiều sản phẩm từ cây CN nước ta chưa đáp ứng được các yêu cầu của thị trường thế giới và khu vực.\n+ Việc liên kết trong sx, chế biến, tiêu thụ còn hạn chế."],
["KT", "Phân tích điều kiện phát triển ngành chăn nuôi nước ta (phần 1: cơ sở thức ăn và giống).", "* Cơ sở thức ăn: có ý nghĩa hàng đầu, đảm bảo ngày càng tốt hơn cho ĐK chăn nuôi. Thức ăn chăn nuôi được lấy từ nhiều nguồn khác (đồng cỏ tự nhiên, phụ phẩm trồng trọt, CN,...)\n- Đồng cỏ tự nhiên: Diện tích tương đối lớn, phân bố trên các cao nguyên ở Trung du miền núi Bắc Bộ, Tây Nguyên, Bắc Trung Bộ. Năng suất các đồng cỏ ngày càng được nâng cao.\n+ KH NĐẨGM với nhiệt độ cao >20°C, độ ẩm cao >80%, lượng mưa lớn từ 1500mm - 2000mm thuận lợi để phát triển chăn nuôi gia súc như trâu, bò, dê, ngựa.\n- Sản phẩm của ngành trồng trọt: Nhờ giải quyết tốt về lương thực cho người dân nên phần lớn hoa màu (ngô, khoai, sắn,...) được dành làm thức ăn cho chăn nuôi.\n+ Diện tích đất trồng hoa màu khá ổn định, tạo ra sản lượng lớn hoa màu, cung cấp thức ăn thường xuyên cho chăn nuôi. Chính vì vậy, sản phẩm của ngành trồng trọt rất quan trọng trong phát triển ngành chăn nuôi.\n- Phụ phẩm ngành Tsản là bổ sung thức ăn có giá trị dinh dưỡng cao cho chăn nuôi (mỗi năm cung cấp từ 13000 → 14000 tấn bột cá).\n- Nguồn thức ăn từ ngành Công nghiệp chế biến: rất phong phú, đa dạng, bao gồm cả thức ăn cho gia súc, gia cầm tạo điều kiện cho hình thức chăn nuôi công nghiệp ngày càng phát triển.\n* Có nhiều giống gia súc, gia cầm bản địa cho năng suất cao như lợn Móng Cái, trâu Tuyên Quang, gà mía Sơn Tây.\n- Nhiều giống ngoại, nhập cho năng suất cao như bò sữa Hà Lan, bò Kube,...\n- Nhiều đàn gia súc, gia cầm được lai tạo giống cho năng suất cao như"],
["KT", "Phân tích điều kiện phát triển ngành chăn nuôi nước ta (phần 2: cơ sở vật chất kĩ thuật, lao động, thị trường, chính sách và khó khăn).", "* Cơ sở VCKT phục vụ chăn nuôi\n- Hệ thống chuồng trại, xí nghiệp chăn nuôi được xây dựng mạng lưới các cơ sở chế biến phổ rộng khắp cả nước (thực phẩm đông lạnh, đồng hộp).\n- Dịch vụ thú y: cung cấp vật tư chăn nuôi ngày càng được mở rộng và phát triển\n- Các trung tâm nghiên cứu về giống phát triển, kỹ thuật lai tạo nhiều giống hiện đại, cho năng suất cao, phù hợp với điều kiện sinh thái của VN.\n* Dân cư lao động: đông đảo, có nhiều kinh nghiệm để chăn nuôi gia súc, gia cầm\n* Thị trường: VN là 1 đất nước đông dân (năm 2021 là 98,5 triệu người), mức sống ngày càng nâng cao, tạo ra thị trường tiêu thụ rộng lớn nhất là các đô thị. Đây là động lực quan trọng thúc đẩy ngành chăn nuôi phát triển mạnh.\n- Có một số mặt hàng được xuất khẩu ra thế giới, như...\n* Chính sách: Chính sách khuyến khích chăn nuôi, đưa chăn nuôi trở thành ngành chính trong sản xuất nông nghiệp như: chính sách tăng kinh tế hộ gia đình, kinh tế trang trại.\n* Khó khăn:\n- Cơ sở thức ăn cho chăn nuôi chưa được đảm bảo\n- Môi trường NĐẨGM dễ phát sinh dịch bệnh như cúm gà, tả lợn châu Phi,...\n- S đồng cỏ nhỏ, phân bố rải rác, năng suất thấp, nhiều cỏ tạp\n- Mùa khô ở các tỉnh phía Nam thiếu nước nên đồng cỏ kém phát triển, nhất là vùng Tây Nguyên.\n- Nhiều giống nội cho năng suất thấp, chất lượng chưa cao, chưa đáp ứng được xuất khẩu.\n- Cơ sở VCKT chưa phát triển đồng bộ, công nghệ chế biến thịt sữa và công tác dịch vụ thú y còn nhiều hạn chế, nhiều dịch bệnh gây thiệt hại cho đàn gia súc.\n- Hình thức chăn nuôi còn lạc hậu, cho năng suất chưa cao.\n⟹ Chính vì vậy, ngành chăn nuôi chưa phát triển tương xứng với tiềm năng của nước ta."],
["KT", "Phân tích điều kiện tự nhiên và kinh tế - xã hội phát triển ngành thủy sản.", "→ Tự nhiên: VTĐL phát triển quanh năm\nKhí hậu: nhiệt độ nước biển tầng mặt cao; phân hóa theo mùa → nhiều dòng biển → nguồn nguyên Tsản phong phú\nNước:\n- Nước ngọt: sông, suối, ao, hồ, kênh, rạch dày đặc; mùa lũ mang lại nguồn lợi Tsản phong phú\n- Nước mặn: + Giáp với biển Đông rộng lớn (1 tr km²), dài bờ biển dài 3260 km, 28 tỉnh, thành phố giáp biển (từ MC, QN → HT, KG)\n+ Nhiều đảo, quần đảo với 2 quần đảo xa bờ lớn nhất VN là HSa (Tp.ĐN), TSa (KHòa), 2 đảo lớn nhất là PQuốc, CBà\n+ Có nhiều bãi tôm, bãi cá đặc biệt là 4 ngư trường lớn: Hải Phòng - Quảng Ninh, Ninh Thuận - Bình Thuận - Bà Rịa Vũng Tàu, Cà Mau - Kiên Giang, HS - TSa\n+ Ven biển có nhiều vũng, vịnh, đầm, phá\n→ phát triển ngành nuôi trồng Tsản, xây dựng cảng cá\n- Nước lợ: rừng ngập mặn, đầm, phá; Cửa sông, Cửa biển, Bãi triều\n- Sinh vật: Có nguồn lợi hải sản phong phú, đa dạng; có tôi nước lạnh, phù du sinh vật phong phú (Ninh Thuận - Bình Thuận), cung cấp nguồn thức ăn cho Tsản\n* Khó khăn: - KH nhiều thiên tai: bão, lũ, áp thấp NĐ,...\n- BĐKH → sự ↑, khai thác, nuôi trồng Tsản\n- Tsản ven bờ bị khai thác quá mức, xa khả năng cho phép, suy giảm nguồn nguyên Tsản\n- Tranh chấp ngư trường ở các vùng biển xa bờ\n- Ô nhiễm môi trường biển ngày càng cao.\n* Điều kiện kinh tế - xã hội: trang 84 sách Địa lý 12"],
["KT", "Trình bày vai trò của cây lúa.", "- Cung cấp lương thực (có các đb châu thổ rộng lớn → c² lúa → nguồn lương thực cho người dân)\n- Làm nguyên liệu cho ngành CNghiệp chế biến (cám, gạo,...)\n- Xuất khẩu ra các thị trường quốc tế → phát triển kinh tế, đẩy mạnh ngoại thương (gạo ST25)\n- Cung cấp việc làm cho người dân\n- Thúc đẩy sự phát triển của KHCN và KT, CSHTVC và KT\n- Cung cấp phụ phẩm thức ăn cho chăn nuôi\nCây lúa là cây lương thực chính, đóng vai trò quan trọng trong sự phát triển kinh tế xã hội của nó ta\n* Đối với kinh tế\n- Cung cấp nguyên liệu cho ngành CNghiệp chế biến lương thực\n- Tạo ra các mặt hàng xuất khẩu (VN là 1 trong nước XK gạo hàng đầu thế giới) thúc đẩy ngoại thương phát triển, thu ngoại tệ, tích lũy vốn, thúc đẩy kinh tế phát triển\n- Cung cấp phụ phẩm thức ăn cho chăn nuôi\n* Đối với xã hội\n- Cung cấp tinh bột hàng ngày cho bữa ăn của người dân\n- Đảm bảo an ninh lương thực quốc gia\n- Tạo việc làm, tăng thu nhập, nâng cao chất lượng cuộc sống của người dân"],
["KT", "Trình bày sự phát triển và phân bố ngành công nghiệp sản xuất điện.", "* Sự phát triển\n- Giá trị sản xuất CN điện chiếm tỉ trọng cao trong cơ cấu giá trị sản xuất toàn ngành CN năm 2021 (chiếm 4,8%)\n- Sản lượng điện ở nước ta tăng liên tục để phục vụ cho sản xuất và đời sống của người dân, đạt 244,9 kW năm 2021.\n- Cơ cấu sản lượng điện nước ta đa dạng, đang thay đổi theo hướng tăng tỉ trọng các ngành: + Thủy điện - Sông, suối; + Nhiệt điện: Than, Khí; + Điện tái tạo: Gió, Mặt trời; + Điện từ rác\n- Xu hướng phát triển: CN sản xuất điện đang thay đổi theo hướng tăng tỉ trọng điện gió, điện mặt trời và các loại điện tái tạo khác. Ứng dụng KHCN hiện đại trong sản xuất, truyền tải nguồn điện, vận hành, kiểm soát phát thải khí nhà kính, đảm bảo quản lí hệ thống lưới điện thông minh.\n* Phân bố\n- Thủy điện: các nhà máy thủy điện phân bố chủ yếu ở miền núi, gắn với các sông có trữ năng thủy điện lớn như hệ thống sông Hồng (37% trữ năng thủy điện cả nước), sông Đồng Nai, sông Sê San, 1 số nhà máy thủy điện có công suất lớn: Sơn La, Hòa Bình, Ya-ly,...\n- Nhiệt điện\n+ Nhiệt điện than: phát triển dựa trên khoáng sản than phong phú, chủ yếu phân bố ở tỉnh Quảng Ninh. Có một số nhà máy điện than như: Phả Lại - Hải Dương, Uông Bí - Quảng Ninh, Vũng Áng 1 - Hà Tĩnh, Vĩnh Tân 2 - Ninh Thuận,...\n+ Nhiệt điện khí: phát triển dựa trên khoáng sản dầu mỏ, khí đốt chủ yếu ở Thềm lục địa phía Nam. Một số nhà máy điện khí là: Phú Mỹ (BRVT), Cà Mau 1 - 2 (Cà Mau),...\n+ Điện gió: phát triển mạnh ở DHNTB, Tây Nguyên, ĐBSCL các nhà máy lớn tập trung ở các tỉnh Quảng Trị, Ninh Thuận, Bạc Liêu,...\n+ Điện Mặt trời: phát triển chủ yếu ở DHNTB, TN. Các tỉnh có nhiều nhà máy điện MT: Ninh Thuận, Bình Thuận,... Gần đây, nước ta đã xây dựng và vận hành 1 số nhà máy điện rác ở Hà Nội, TP Hồ Chí Minh,..."],
["KT", "Trình bày sự phát triển và phân bố ngành công nghiệp dệt may và giày dép.", "* Sự phát triển\n- Ngành CN dệt may, với sản xuất trang phục, giày, dép là ngành CN quan trọng, là các ngành CN thế mạnh và truyền thống của nước ta dựa trên nguồn lao động dồi dào, thị trường tiêu thụ rộng lớn.\n- Tỉ trọng của ngành CN dệt may và giày, dép chiếm tỉ trọng cao, năm 2021 là 11,1% giá trị sản xuất toàn ngành CN.\n- Sản lượng sản phẩm của ngành tăng nhanh\n- Các sản phẩm của ngành được xuất khẩu đi nhiều nước trên thế giới và là mặt hàng xuất khẩu chủ lực của nước ta như: vải, quần, áo, giày, dép,...\n- Chất lượng mẫu mã sản phẩm ngày càng được nâng cao nhờ ứng dụng các thành tựu KHCN hiện đại như in 3D, trí tuệ nhân tạo AI, công nghệ tự động hóa,...\n- Định hướng phát triển:\n+ Tập trung ưu tiên vào thiết kế mẫu mã, chủ động sản xuất nguyên liệu, phụ liệu trong nước nhằm tiết kiệm chi phí nhập khẩu\n+ Chuyển từ gia công sang sản xuất quần áo thời trang, giày cao cấp xuất khẩu.\n+ Đẩy mạnh khai thác các thị trường xuất khẩu truyền thống như Trung Quốc, Asian, thúc đẩy các thị trường tiềm năng như EU, Nhật Bản, Hoa Kỳ, Nga.\n* Sự phân bố\n- Phân bố rộng khắp cả nước, trong đó Đông Nam Bộ và ĐBSH là vùng tập trung nhất. Phát triển mạnh ở các đô thị lớn như Hà Nội, TP Hồ Chí Minh, Hải Phòng, Đà Nẵng, Cần Thơ, Huế"],
["KT", "Trình bày sự phát triển và phân bố ngành sản xuất sản phẩm điện tử, máy vi tính.", "MB: Công nghiệp sản xuất điện tử, máy vi tính là ngành có hàm lượng công nghệ cao, áp dụng nhiều công nghệ cao vào sản xuất như trí tuệ nhân tạo, tự động hoá,...; đem lại giá trị kinh tế lớn.\n* Sự phát triển\n- CN sản xuất sản phẩm điện tử, máy vi tính là ngành CN mới, có tốc độ tăng nhanh, giá trị sản xuất của ngành chiếm 25,3% giá trị sản xuất Công nghiệp cả nước.\n- Sản lượng các sản phẩm của ngành tăng nhanh\n- Các sản phẩm chính là của ngành là: máy tính và linh kiện điện tử, máy điều hòa không khí, ti vi lắp ráp,... đây là các mặt hàng xuất khẩu lớn ở nước ta, đóng góp 32,2% giá trị xuất khẩu cả nước.\n- Xu thế phát triển: đầu tư vào nghiên cứu, áp dụng công nghệ mới vào trong sản xuất; nâng cao năng suất, chất lượng của sản phẩm; giảm thải thoát và ô nhiễm môi trường; góp phần tăng giá trị sản phẩm;...\n* Sự phân bố\n- Ngành CN sản xuất sản phẩm điện tử, máy vi tính được phát triển và phổ nhiều ở vùng ĐBSH, Đông Nam Bộ. Các địa phương có nhiều lợi thế về nguồn lao động (chất lượng), cơ sở hạ tầng và thu hút vốn đầu tư nước ngoài như Hà Nội, Bắc Ninh, Thái Nguyên, Bắc Giang, TP Hồ Chí Minh, Đồng Nai, Bình Dương..."],
["KT", "Trình bày sự phát triển và phân bố công nghiệp chế biến thực phẩm và đồ uống.", "* Sự phát triển\n- Đây là ngành có lâu đời dựa trên cơ sở nguồn nguyên liệu tại chỗ phong phú từ ngành N-L-TS, thế mạnh nguồn lao động dồi dào, thị trường tiêu thụ rộng lớn, đáp ứng nhu cầu trong nước và quốc tế\n- Giá trị sản xuất tăng nhưng tỉ trọng trong cơ cấu giá trị sản xuất CN cả nước giảm, chiếm 12,6% năm 2021.\n- Cơ cấu ngành gồm nhiều phân ngành như: xay xát gạo, sản xuất thực phẩm; chế biến thịt, sữa và các sản phẩm từ sữa; chế biến Thủy sản, sản xuất thức ăn cho gia súc, gia cầm, cho Thủy sản; sản xuất nước tinh khiết, rượu, bia,...\n- Xu hướng phát triển:\n+ Sản phẩm của ngành ngày càng phát triển để đáp ứng nhu cầu của thị trường trong nước và quốc tế\n+ Khuyến khích phát triển vùng nguyên liệu quy mô lớn để đảm bảo nguồn nguyên liệu đầu vào đủ tiêu chuẩn cho công nghiệp chế biến.\n+ Ưu tiên chế biến các sản phẩm nông nghiệp và Thủy sản chủ lực, có khả năng cạnh tranh cao, góp phần tăng giá trị\n+ Xây dựng và phát triển thương hiệu đặc trưng cho nông nghiệp và Thủy sản\n* Sự phân bố\n- Phân bố rộng khắp cả nước nhưng tập trung ở Đông Nam Bộ (TP Hồ Chí Minh, Đồng Nai), ĐBSH (Hà Nội, Hải Phòng), ĐBSCL (Cần Thơ, Đồng Tháp)"],
["KT", "Giải thích vì sao phải đẩy mạnh công nghiệp xanh.", "- Khái niệm: Công nghiệp xanh là nền CN sử dụng công nghệ tiên tiến để sản xuất những sản phẩm thân thiện với môi trường, sử dụng tiết kiệm và hiệu quả năng lượng, tái sử dụng chất thải và giảm thiểu tác động tiêu cực đến môi trường\n- Biểu hiện:\n+ Xu hướng tăng công nghiệp xanh thể hiện ở sự tăng 1 số ngành như: điện MT, điện gió, điện rác, công nghiệp xử lý nước thải,... góp phần thúc đẩy tăng trưởng xanh.\n+ 1 số khu CN xanh đang được triển khai ở Bắc Giang, Vĩnh Phúc,...\n- Ý nghĩa:\nHiện nay, sản xuất CN ở nước ta còn nhiều bất cập trong xử lý chất thải, phát thải khí gây ô nhiễm môi trường, một số ngành còn sử dụng nhiều lao động, sự phối hợp tái sử dụng phế phẩm giữa các ngành chưa nhiều. Do vậy, tăng CN xanh sẽ giúp:\n+ Giảm thiểu chất thải CN, qua đó khắc phục và giải quyết được tình trạng ô nhiễm môi trường nhờ vận hành chuỗi sản xuất khép kín, tuần hoàn giữa các doanh nghiệp (đầu vào của doanh nghiệp này là đầu ra của doanh nghiệp khác).\n+ Giúp tạo ra sản phẩm CN chất lượng cao, đáp ứng các tiêu chuẩn khắt khe của thị trường thế giới (Hoa Kỳ, Nhật Bản, EU), đồng thời sẽ chịu mức thuế thấp hơn khi xuất khẩu vào các thị trường này\n+ Giúp tiết kiệm chi phí đầu vào, nguyên liệu, nhiên liệu và năng lượng trong sản xuất."],
["KT", "Trình bày đặc điểm ngành thủy sản nước ta (nuôi trồng, khai thác và phân bố).", "* Sự phát triển chung\n- Giá trị sản xuất Tsản chiếm khoảng 26% toàn ngành N-L-TS. Tốc độ tăng trưởng giá trị sản xuất Tsản của nước ta giai đoạn 2010-2021 tăng trung bình khoảng 6,6%/năm.\n- Sản lượng Tsản nước ta tăng nhanh và liên tục. Năm 2021 đạt 8,81 triệu tấn.\n- Tốc độ tăng sản lượng thủy sản nuôi trồng nhanh hơn khai thác, do đó, cơ cấu sản lượng Tsản có sự chuyển dịch từ khai thác sang nuôi trồng.\n- Tsản của nước ta đã xuất khẩu đến nhiều thị trường lớn như EU, Hoa Kỳ, Nhật Bản... Xuất khẩu Tsản thúc đẩy các hoạt động nuôi trồng, khai thác và chế biến Tsản.\n* Sự phát triển và phân bố các ngành Tsản\n- Khai thác Tsản:\n+ Sản lượng Tsản khai thác tăng khá nhanh, năm 2021 đạt 3,93 triệu tấn, chiếm 44,6% tổng sản lượng Tsản. Trong đó, chủ yếu là khai thác hải sản, đặc biệt là cá biển chiếm 74,1% tổng sản lượng Tsản khai thác năm 2021.\n+ Đẩy mạnh khai thác xa bờ, đầu tư hiện đại hóa với các tàu đánh bắt, trang thiết bị, truy xuất nguồn gốc khai thác hải sản, định vị tàu thuyền và vùng khai thác hải sản, hướng tới khai thác bền vững,...\n+ Phân bố:\n○ Vùng Bắc Trung Bộ và DHMT có sản lượng Tsản khai thác cao nhất cả nước, chiếm 42,7% sản lượng Tsản khai thác cả nước\n○ Các tỉnh khai thác Tsản lớn nhất là: Kiên Giang, Bà Rịa - Vũng Tàu, Cà Mau, Bình Định,...\n- Nuôi trồng Tsản:\n+ Sản lượng Tsản nuôi trồng phát triển nhanh, năm 2021 đạt 4,88 triệu tấn, chiếm 55,4% tổng sản lượng Tsản.\n+ Đối tượng nuôi trồng chủ yếu là nuôi tôm, cá ba sa, cá tra,...\n+ Chất lượng sản phẩm nuôi trồng Tsản ngày càng gia tăng đáp ứng nhu cầu về an toàn thực phẩm, truy xuất nguồn gốc và các tiêu chuẩn quốc tế, đặc biệt là thị trường Hoa Kỳ, EU, Nhật Bản,...\n+ Áp dụng rộng rãi các mô hình nuôi trồng theo hướng xanh, bền vững; hình thức trang trại công nghệ cao, nuôi hữu cơ, mô hình sinh thái (tôm - lúa, tôm - rừng...).\n+ Phân bố:\n○ ĐBSCL là vùng nuôi trồng Tsản lớn nhất cả nước ta chiếm 69,8% tổng sản lượng Tsản nuôi trồng của cả nước năm 2021.\n○ Các tỉnh nuôi trồng nhiều Tsản nước ta: An Giang, Đồng Tháp, Quảng Ninh, Hải Phòng,..."],
["KT", "Trình bày đặc điểm tài nguyên rừng và sự phát triển ngành lâm nghiệp.", "Tài nguyên rừng đóng vai trò quan trọng trong sự phát triển kinh tế - xã hội và bảo vệ môi trường, ứng phó với BĐKH ở nước ta.\n- Năm 2021, tổng S rừng là 14,7 triệu ha (trong đó rừng tự nhiên chiếm 69%, rừng trồng chiếm 31% tổng S rừng). Tỉ lệ che phủ rừng chiếm 42%.\n+ Vùng Bắc Trung Bộ và DHMT có S rừng lớn nhất cả nước (31,8% cả nước)\n- Rừng tự nhiên chiếm 69% tổng S rừng, phân nhiều nhất ở vùng Trung du miền núi Bắc Bộ, chiếm hơn 37% tổng S rừng tự nhiên cả nước.\n+ Rừng tự nhiên gồm: rừng phòng hộ và rừng đặc dụng:\n○ Rừng phòng hộ: Là rừng đầu nguồn của các con sông, rừng phi lao chắn cát, rừng ngập mặn ven biển, phân bố chủ yếu ở TDMNBB, BTB và DHMT, ĐBSCL\n○ Rừng đặc dụng: Là các vườn quốc gia, dự trữ sinh quyển thế giới, tập trung chủ yếu ở BTB, TN và trên các đảo\n+ Rừng trồng: chủ yếu là rừng sx, có khả năng khai thác gỗ, làm nguyên liệu cho các ngành kinh tế và xuất khẩu ở TDMNBB, BTB, DHMT\n* Sự phát triển và phân bố ngành lâm nghiệp\na) Trồng rừng và khoanh nuôi, bảo vệ rừng\n- Hoạt động trồng rừng được quan tâm, đẩy mạnh. S rừng trồng mới ngày càng được mở rộng. Năm 2021, cả nước có gần 46 triệu ha rừng trồng tập trung. Trung bình mỗi năm nước ta trồng mới khoảng 200 nghìn ha rừng tập trung. Rừng trồng chủ yếu là rừng làm nguyên liệu giấy, rừng gỗ trụ mỏ, rừng thông nhựa, rừng phòng hộ.\n- Hoạt động khoanh nuôi và bảo vệ rừng ngày càng được chú trọng như ứng dụng công nghệ thông tin, chuyển đổi số trong quản lý, chăm sóc, cảnh báo cháy rừng, phát triển mô hình N - L kết hợp, trồng cây dược liệu dưới tán rừng, phát triển du lịch sinh thái,...\n- Các vùng có S rừng trồng mới nhiều là TD và MNBB, BTB và DHMT, TN\nb) Khai thác, chế biến Lâm sản\n- Năm 2021, S rừng sx chiếm 53% tổng S rừng\n- Sản lượng gỗ khai thác ngày càng tăng, năm 2021 là khoảng 12 triệu m³ gỗ, gấp 4,6 lần so với 2010\n- Các vùng có sản lượng gỗ lớn là TDMNBB, BTB và DHMT, TN"],
["KT", "Vì sao cây công nghiệp phát triển mạnh trong những năm gần đây?", "Trong những năm gần đây, cây CN của nước ta phát triển mạnh nhờ có nhiều điều kiện thuận lợi để phát triển và có vai trò quan trọng trong sự phát triển kinh tế - xã hội nước ta.\n- Cây CN có vai trò quan trọng trong việc cung cấp nguyên liệu phát triển ngành Công nghiệp chế biến thực phẩm, Công nghiệp hàng tiêu dùng,... cây CN tạo nhiều mặt hàng xuất khẩu có giá trị kinh tế cao như cà phê, cao su, hồ tiêu, chè,..., thúc đẩy kinh tế phát triển. Đồng thời tạo nhiều việc làm, tăng thu nhập, nâng cao chất lượng cuộc sống, phân bố lại dân cư - lao động. Cây CN có vai trò bảo vệ môi trường, chống xói mòn đất, tận dụng tài nguyên...\n- Nước ta có nhiều điều kiện tự nhiên phát triển cây CN. 3/4 ĐH là đồi núi, đất chủ yếu là feralit thích hợp phát triển cây CN, KH NĐẨGM với nhiệt độ cao >20°C, lượng mưa lớn từ 1500-2000 mm /năm thuận lợi phát triển các cây CN NĐ như cà phê, cao su, điều,... Bên cạnh đó KH phân hóa đa dạng nên phát triển đc các cây CNghiệp có nguồn gốc cận nhiệt như cây chè; nguồn nước mặt và nước ngầm phong phú, đa dạng cung cấp nước tưới tiêu cho sx cây CNghiệp; nhiều giống cây CNghiệp cho năng suất và chất lượng cao...\n- Dân cư lao động: nước ta có nguồn lao động dồi dào, 29,1% lao động hoạt động trong ngành N², nông dân có nhiều kinh nghiệm trong việc trồng và chế biến các sản phẩm cây CN.\n- Thị trường trong và ngoài nước được mở rộng. Nước ta tăng cường xuất khẩu các sản phẩm cây CNghiệp như: cao su, cà phê, hồ tiêu, điều, chè,... Các biện pháp hỗ trợ xuất khẩu và mở rộng thị trường quốc tế thúc đẩy sự phát triển của cây CN.\n- Chính sách: nhà nước có nhiều chính sách hỗ trợ thúc đẩy phát triển cây CN như: thu hút đầu tư trong nước và ngoài nước, cho vay vốn ưu đãi, hỗ trợ tiếp cận thị trường,...\n- Tăng cường nghiên cứu, ứng dụng KHCN mới vào trồng trọt, chăm sóc và bảo quản cây CN, đã góp phần nâng cao năng suất, chất lượng cây CN. Công nghệ giúp nông dân tăng cường quản lý, giảm thiểu tổn thất và tăng giá trị thương phẩm.\n- Phát triển cây CN góp phần đa dạng hóa cơ cấu cây trồng. Nhu cầu ngày càng tăng về đa dạng hóa sản phẩm N², giúp làm giảm rủi ro và tăng thu nhập cho nông dân.\n- Phát triển cơ sở vật chất kỹ thuật, cơ sở hạ tầng như hệ thống thủy lợi, cơ sở chế biến cây CN, cơ sở lưu trữ và vận chuyển đã giúp nâng cao năng lượng sx và tiếp cận thị trường. Do đó, thúc đẩy sự phát triển cây CN."],
["KT", "Trình bày sự phát triển và phân bố ngành CN khai thác dầu thô, khí tự nhiên.", "* Sự phát triển\n- Ngành CN khai thác dầu thô và khí TN có lịch sử lâu đời (bắt đầu khai thác từ năm 1986)\n+ Hiện trạng: Sản lượng dầu thô và khí TN khai thác tăng nhanh (2010-2015, dầu thô khai thác trong nước tăng hơn 2 triệu tấn), nhưng gần đây có nhiều biến động (2015-2021, giảm 7,7 triệu tấn). Khí TN giảm 2 tỉ m³ từ 2010-2021. Đến 2021, dầu thô khai thác trong nước đạt 9,1 triệu tấn, khí TN đạt 7,4 tỉ m³.\n- Cơ cấu ngành đa dạng, gồm:\n+ Thăm dò, khai thác dầu thô và khí TN\n+ Lọc, hóa dầu\n+ Sản xuất ngành Công nghiệp phụ trợ để cung cấp nguyên liệu, nhiên liệu cho CN chế biến hóa lỏng và sản xuất khí.\n- Mục đích sử dụng:\n+ Khí TN được hóa lỏng để phục vụ cho ngành sản xuất điện, phân bón ở BRVT, Cà Mau...\n+ Phần lớn dầu thô khai thác dùng để xuất khẩu, 1 phần làm nguyên liệu cho các nhà máy lọc dầu.\n- Công nghệ khai thác được đầu tư phát triển, ngày càng hiện đại, góp phần làm gia tăng giá trị sản phẩm, giảm thất thoát tài nguyên và ô nhiễm môi trường.\n* Phân bố\n- Dầu thô được khai thác chủ yếu ở thềm lục địa phía Nam với các mỏ dầu: Rồng, Bạch Hổ, Đại Hùng,...\n- Khí TN được khai thác chủ yếu ở các bể trầm tích (Cổ Chu Mã Lai, Nam Côn Sơn, Cửu Long), mỏ khí: Lan Tây, Lan Đỏ, Sư Tử Trắng,...\n- Các nhà máy lọc hóa dầu: Nghi Sơn, Thanh Hóa, Dung Quất,..."],
["KT", "Phân tích các điều kiện tự nhiên ảnh hưởng đến sự phát triển ngành công nghiệp nước ta (thuận lợi và khó khăn).", "a) Thuận lợi\n1. Vị trí địa lý và nhân tố tự nhiên\n- VTĐL: Nước ta gần trung tâm ĐNA, khu vực kinh tế sôi động trên thế giới → tạo điều kiện để nước ta thu hút đầu tư nước ngoài ↑ CN đồng thời trao đổi sản phẩm để ↑ CN.\n- Tài nguyên khoáng sản:\n+ Cơ cấu khoáng sản đa dạng, một số khoáng sản có trữ lượng lớn, thuận lợi để ↑ CN với cơ cấu ngành đa dạng. Một số ngành có quy mô lớn như:\n○ Than đá: trữ lượng khoảng 7 tỉ tấn, phân bố chủ yếu ở bể than Quảng Ninh, than nâu ở ĐBSH\n○ Dầu mỏ và khí TN: Tổng trữ lượng khoảng 10 tỉ tấn dầu quy đổi, phân bố chủ yếu ở vùng TLĐ phía Đông Nam (Bà Rịa - Vũng Tàu, Bình Thuận, Cà Mau).\n○ Sắt: Tổng trữ lượng khoảng 1,1 tỉ tấn, phân bố chủ yếu ở khu vực Đông Bắc (Thái Nguyên, Lào Cai, Hà Giang) và Bắc Trung Bộ (Hà Tĩnh)\n○ Bôxit: Trữ lượng khoảng 9,6 tỉ tấn, phân bố tập trung ở Tây Nguyên (Đắk Nông, Lâm Đồng, Gia Lai, Kon Tum), ngoài ra còn có ở một số tỉnh thành phía Bắc (Lạng Sơn, Cao Bằng, Hà Giang).\n○ Apatit: Trữ lượng khoảng 2 tỉ tấn, phân bố tập trung ở Lào Cai\n○ Titan: Tổng trữ lượng khoảng 663 triệu tấn, phân bố rải rác ở ven biển từ Quảng Ninh đến Bà Rịa - Vũng Tàu, Tây Nguyên.\n○ Đá vôi: Tổng trữ lượng lên đến 8 tỉ tấn, phân bố chủ yếu ở vùng núi phía Bắc và Bắc Trung Bộ (Hà Giang, Ninh Bình, Thanh Hóa, Quảng Bình).\n+ Sự phân bố nguyên khoáng sản trên lãnh thổ tạo các thế mạnh ↑ phát triển CN giữa các vùng.\n- Nguồn nước:\n+ Nước ta có mạng lưới sông ngòi dày đặc, nguồn nước dồi dào cung cấp nước cho các ngành CN\n+ Sông ngòi chảy qua ĐH dốc nên có trữ năng thủy điện lớn như Quảng Hanh (Quảng Ninh), Kim Bôi (Hòa Bình), Vĩnh Hảo (Bình Thuận), Bình Châu (BR-VT)... thuận lợi cho ngành CN sản xuất đồ uống\n- Tài nguyên KH:\n+ KH NĐẨGM với nhiệt độ cao quanh năm, số giờ nắng nhiều, hoạt động của gió mùa... là nguồn năng lượng mới để ↑ CN sản xuất điện\n+ KH tạo điều kiện ↑ nền N² NĐ đa dạng, năng suất cao, cung cấp nguồn nguyên liệu dồi dào cho ngành CN sản xuất, chế biến thực phẩm\n+ KH GM cũng tạo ra tính thời vụ trong sản xuất N², từ đó tác động đến sự ↑ ngành CN chế biến nông sản.\n- Tài nguyên sinh vật: phong phú, nhiều loài có giá trị cung cấp nguyên liệu cho CN sản xuất, chế biến thực phẩm, dược phẩm.\nb) Khó khăn\n- Khoáng sản:\n+ KSản ở nước ta phân bố đồng đều, tập trung chủ yếu ở miền núi với ĐH hiểm trở nên gây ra khó khăn cho việc khai thác KSản (chi phí)\n+ Nhiều loại KSản có quy mô nhỏ, trữ lượng ít, phân bố rải rác nên gây khó khăn khai thác, quản lý, khai thác KSản.\n+ Nguồn tài nguyên KSản dần bị cạn kiệt do sự khai thác quá mức.\n- Nguồn nước: Chế độ nước sông thay đổi theo mùa, vì vậy mà vào mùa khô, một số nhà máy thủy điện bị thiếu nước, ít phát huy hết công suất.\n- Sinh vật: Nhiều cánh rừng bị khai thác quá mức (chặt cây để sx gỗ, giấy,...) gây ra sự suy giảm về diện tích và chất lượng\n- Vùng biển bị ô nhiễm bởi các hoạt động sinh hoạt, rác thải, nước thải từ các khu công nghiệp, gây ảnh hưởng tiêu cực đến chất lượng nước → nguồn lợi hải sản bị suy giảm."],
["KT", "Phân tích các điều kiện kinh tế - xã hội ảnh hưởng đến sự phát triển ngành công nghiệp nước ta (thuận lợi và khó khăn).", "2. Kinh tế - xã hội\na) Thuận lợi\n- Dân số và lao động: Nước ta có dân số đông (năm 2021 là 98,5 triệu người)\n+ Thị trường tiêu thụ rộng lớn, thúc đẩy sự ↑ của nhiều ngành CN\n+ Lực lượng lao động dồi dào, trình độ lao động ngày càng được nâng cao, tạo thuận lợi để ↑ CN nói chung và ứng dụng KHCN tiên tiến trong sx CN, ↑ các ngành CN công nghệ cao.\n+ Lao động trong các làng nghề, cơ sở sx tiểu thủ CN có tay nghề cao, kinh nghiệm sx phong phú\n- Chính sách: Các chính sách ↑ CN như: chính sách tái cấu trúc CN, chính sách ↑ CN xanh, chính sách KHCN... đã làm giảm dần tỉ trọng CN khai khoáng, tăng nhanh tỉ trọng CN chế biến, chế tạo; rút ngắn quá trình công nghiệp hóa, hiện đại hóa, tạo động lực cho sự ↑ các ngành CN mới, CN thân thiện với môi trường, thay đổi phổ CN...\n- Thị trường:\n+ Thị trường trong nước và quốc tế ngày càng mở rộng. Nhu cầu về các sản phẩm CN chất lượng cao ngày càng tăng đã góp phần ↑ các ngành CN, chuyển dịch cơ cấu CN.\n+ VN đã tham gia kí kết các hiệp định thương mại tự do với EU, Nhật Bản,... Nhiều sản phẩm của các ngành CN như dệt, sx trang phục, sx giày dép... đã đáp ứng được các tiêu chuẩn toàn cầu, được xuất khẩu sang thị trường các nước ↑ như Hoa Kỳ, Nhật Bản, các nước EU,...\n- Cơ sở hạ tầng, cơ sở vật chất kỹ thuật\n+ Cơ sở hạ tầng của nước ta có nhiều đổi mới và ngày càng hoàn thiện, khả năng liên kết vùng lớn.\n+ Cơ sở vật chất kỹ thuật được đầu tư ↑ hiện đại với nhiều khu CN tập trung, khu chế xuất, khu công nghệ cao, các điểm CN, làng nghề truyền thống... hình thành trên phạm vi cả nước.\n- Khoa học - công nghệ và vốn đầu tư:\n+ Việc ứng dụng KHCN tiên tiến vào sx CN như công nghệ số, tự động hóa, công nghệ vật liệu mới... góp phần nâng cao năng suất lao động, giá trị, chất lượng của các sản phẩm CN\n+ Vốn đầu tư cho CN ngày càng tăng (năm 2021 chiếm 36,5% tổng số vốn đầu tư các ngành kinh tế) đã tạo động lực cho sự ↑ CN nhất là các ngành công nghệ cao như ngành CN sx điện tử và máy vi tính,...\nb) Khó khăn\n- Thị trường ngày càng cạnh tranh, các sản phẩm CN đòi hỏi phải đáp ứng tiêu chuẩn toàn cầu\n- Cơ sở vật chất kỹ thuật một số ngành còn lạc hậu"],
["KT", "Trình bày đặc điểm nguồn lợi thủy sản nước ta.", "- Nguồn lợi thủy sản nước ta rất phong phú, bao gồm cả Tsản nước mặn, nước ngọt, nước lợ\n- Vùng biển nước ta có hơn 2000 loài cá, 1600 loài giáp xác (trong đó có 100 loài tôm), có 2500 loài thân mềm, hơn 600 loài rong biển,.... Trong đó còn có nhiều loài đặc sản có giá trị kinh tế cao như: sò huyết, tôm hùm, bào ngư.\n+ Nước ta có nhiều bãi tôm, bãi cá, có 4 ngư trường trọng điểm: Hải Phòng - Quảng Ninh, Hoàng Sa - Trường Sa, Ninh Thuận - Bình Thuận - Bà Rịa Vũng Tàu, Cà Mau - Kiên Giang.\n+ Tổng sản lượng hải sản của VN khoảng 4 triệu tấn, cho phép khai thác bền vững trung bình khoảng 1,5 triệu tấn mỗi năm.\n- Nước ta có mạng lưới sông ngòi dày đặc (3200 con sông có chiều dài >10 km), nhiều ao hồ, kênh rạch, các ô trũng thuận lợi cho khai thác và nuôi trồng Tsản + tổng diện tích S mặt nước là 900 nghìn ha.\n+ VN có khoảng 544 loài cá, nhiều loài cá giá trị kinh tế cao: cá hồi, cá sang, cá tầm\n+ Vùng có S mặt nước nuôi trồng Tsản lớn là vùng ĐBSCL và ĐBSH. Trong đó, ĐBSCL chiếm 70% S mặt nước\n- Dọc bờ biển có nhiều rừng ngập mặn (ĐBSCL, S lớn nhất thế giới), nhiều vùng vịnh, đầm phá (ven biển miền Trung), nhiều bãi triều, cửa sông, cửa biển (Bắc Bộ và Nam Bộ), thuận lợi cho khai thác và nuôi trồng Tsản nước lợ.\n- Nguồn lợi Tsản nội địa và ven bờ biển của nước ta đang bị suy thoái do khai thác quá mức."],
["KT", "Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố ngành nông nghiệp (phần 1: điều kiện tự nhiên - thuận lợi).", "* Tự nhiên\n- VTĐL: VN có VTĐL nằm gần trung tâm ĐNÁ, nằm phía Đông bán đảo Đông Dương, giáp với biển Đông nên thuận lợi để giao thương, phát triển ngành nông nghiệp\n- Địa hình + đất\n+ ĐH đồi núi chiếm 3/4 S lãnh thổ, chủ yếu là đồi núi thấp, một số vùng có các cao nguyên bề mặt rộng lớn tương đối, khá bằng phẳng (Trung du và miền núi Bắc Bộ, Tây Nguyên). Khu vực này có đất feralit là chủ yếu, thuận lợi cho việc hình thành các vùng chuyên canh cây công nghiệp, cây ăn quả. Có các đồng cỏ lớn, thích hợp để phát triển chăn nuôi gia súc lớn (trâu, bò,...)\n+ ĐH đồng bằng chiếm 1/4 S lãnh thổ với 2 đồng bằng châu thổ rộng lớn là đồng bằng sông Hồng, đồng bằng sông Mê Công và đồng bằng ven biển miền Trung. Đất ở các đồng bằng chủ yếu là đất phù sa màu mỡ, thích hợp để trồng các cây lương thực - thực phẩm, cây ăn quả, cây nông nghiệp ngắn ngày, thích hợp chăn nuôi lợn và gia cầm.\n- Khí hậu\n+ VN có KH NĐẨGM, với nhiệt độ cao >20°C, lượng mưa lớn >1600mm, độ ẩm cao >80% tạo điều kiện cho phép sx nông nghiệp được diễn ra quanh năm, tăng vụ, tăng năng suất,... tạo nên các sản phẩm n² NĐ có giá trị kinh tế cao. (lúa gạo, cà phê, cao su, tiêu, điều, xoài, sầu riêng,...)\n+ KH nước ta phân hóa đa dạng (theo mùa, độ cao, B-N) đã tạo nên sự ≠ về cơ cấu mùa vụ giữa các vùng, sự đa dạng sản phẩm n² trên cả nước. Ngoài các cây trồng, vật nuôi NĐ, nước ta còn phát triển các cây trồng, vật nuôi cận nhiệt và ôn đới như cây CN (chè), cây ăn quả (đào, lê, táo, mận, dâu tây,...), cây rau ưa lạnh (su su, su hào, bắp cải), các loài cá nước lạnh (cá hồi, cá tầm,...). Đây là cơ sở để hình thành các vùng chuyên canh ở nước ta.\n- Nguồn nước\n+ Có mạng lưới sông ngòi dày đặc, nhiều hồ, đầm tự nhiên và nhân tạo, lượng mưa hàng năm tương đối lớn, nguồn nước ngầm phong phú, tạo điều kiện để cung cấp nước cho sx nông nghiệp, phát triển Tsản\n+ Các hệ thống sông lớn còn có vai trò bồi đắp phù sa cho đồng bằng châu thổ.\n- Sinh vật\n+ Nhiều giống cây trồng vật nuôi tốt, là cơ sở cung cấp nguồn gen quý cho ngành trồng trọt và chăn nuôi\n+ Các đồng cỏ thuận lợi cho việc chăn nuôi gia súc như trâu, bò, dê, cừu,..."],
["KT", "Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố ngành nông nghiệp (phần 2: khó khăn về tự nhiên).", "* Khó khăn - ĐH và đất\n+ ĐH đồi núi có độ dốc lớn, mưa nhiều, tập trung theo mùa, thảm thực vật tự nhiên bị tàn phá nên nhiều S đất ở trung du miền núi bị rửa trôi, xói mòn, bạc màu trở nên khô cằn, nghèo chất dinh dưỡng\n+ Ở các vùng đồng bằng trũng, thấp đặc biệt là ĐBSCL, đất bị thoái hóa do nhiễm mặn, nhiễm phèn, ngập úng\n+ Vùng ven biển có hiện tượng sa mạc hóa (đặc biệt ở Ninh Thuận và Bình Thuận), hiện tượng cát bay, cát chảy nên đất đai nghèo chất dinh dưỡng\n+ Bình quân đất tự nhiên và đất nông nghiệp theo đầu người ở nước ta thấp và ngày càng bị thu hẹp (do mở rộng của đô thị, nông nghiệp, dịch vụ) làm hạn chế việc mở rộng sản xuất nông nghiệp hàng hóa\n- Khí hậu\n+ Nước ta có nhiều thiên tai như bão, lũ, hạn hán, áp thấp NĐ, sương muối, rét đậm rét hại,... gây thiệt hại cho sx n²\n+ Môi trường nóng ẩm là điều kiện thuận lợi để sâu bệnh phát triển, ảnh hưởng đến sản lượng và chất lượng nông sản (cúm gà, dịch tả lợn châu Phi,...)\n+ BĐKH làm gia tăng các hiện tượng thời tiết cực đoan làm cho sản xuất n² trở nên bấp bênh\n- Nguồn nước\n+ Có chế độ dòng chảy sông ngòi thất thường, mùa khô gây thiếu nước nghiêm trọng, mùa mưa nước sông dâng cao gây ngập úng ảnh hưởng tới năng suất cây trồng. Chính vì vậy, thủy lợi là biện pháp hàng đầu trong thâm canh n²"],
["KT", "Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố ngành nông nghiệp (phần 3: điều kiện kinh tế - xã hội).", "* Điều kiện kinh tế - xã hội\n- Dân cư lao động\n+ Nước ta có lực lượng lao động trong n² dồi dào (năm 2021 chiếm 29,1%), có kinh nghiệm sản xuất n² (là kinh nghiệm (.) thâm canh lúa nước, trồng cây CN, cây ăn quả, trồng rừng,...), Trình độ lao động ngày càng được nâng cao, là cơ sở cho việc áp dụng KHKT mới vào trong sản xuất n² và nâng cao khả năng cạnh tranh của các sản phẩm n² trên thị trường.\n- Khoa học công nghệ (CN sinh học, CN nhà kính, CN tưới nhỏ giọt, CN cảm biến tự động hóa,...) ngày càng hiện đại, phát triển và được ứng dụng rộng rãi trong sx n², giúp hoạt động sx n² ngày càng thuận lợi hơn, nâng cao giá trị và chất lượng sản phẩm\n- Hệ thống Cơ sở VCKT phục vụ n² gồm: thủy lợi, dịch vụ trồng trọt, dịch vụ chăn nuôi, CN chế biến ngày càng được hoàn thiện, phổ rộng khắp cả nước, góp phần tăng giá trị và khả năng cạnh tranh của hàng n², nâng cao hiệu quả sx, ổn định và phát triển vùng chuyên canh\n- Chính sách phát triển n²: Nhà nước ban hành nhiều chính sách thúc đẩy pt n² phát triển như thu hút đầu tư, cho vay vốn ưu đãi, phát triển n² hữu cơ, n² CNghệ cao, tái cơ cấu n², chuyển từ tư duy sx n² sang tư duy kinh tế n², tham gia vào chuỗi giá trị toàn cầu.\n- Thị trường tiêu thụ nông sản: Là thị trường trong và ngoài nước được mở rộng đã thúc đẩy sx phát triển, đa dạng hóa sản phẩm n². Nhiều sphẩm n² VN đã đáp ứng được tiêu chuẩn toàn cầu, có mặt ở các thị trường lớn như Mỹ, EU, Nhật Bản, Trung Quốc,...\n- Khó khăn: + Cơ sở VCKT nhiều vùng còn hạn chế, chưa hoàn thiện và đồng bộ. CN chế biến ở 1 số vùng chưa phát triển, CNghệ còn lạc hậu nên giá trị sphẩm ≠ cao\n+ Thị trường thế giới có nhiều biến động về giá cả, nhiều sphẩm n² nước ta chưa đáp ứng được các yêu cầu của thị trường thế giới và khu vực.\n+ Việc liên kết (.) sx, chế biến, tiêu thụ còn hạn chế."],
["KT", "Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố của cây ăn quả (phần 1: điều kiện tự nhiên).", "* Tự nhiên\n- VTĐL: VN có VTĐL nằm gần trung tâm ĐNÁ, nằm p.Đông bán đảo Đông Dương, giáp với biển Đông nên thuận lợi để giao thương, phát triển việc sx cây ăn quả\n- ĐH + đất:\n+ ĐH đồng bằng chiếm 1/4 S lãnh thổ với 2 đồng bằng châu thổ rộng lớn là đồng bằng sông Hồng và sông Mê Công và ĐBDHMT. Đất ở các đồng bằng chủ yếu là đất phù sa màu mỡ, thích hợp để trồng các cây ăn quả (ĐB là ĐBSCL nổi tiếng: chuối, sầu riêng, xoài, mít, vú sữa).\n+ ĐH đồi núi chiếm 3/4 S lãnh thổ, chủ yếu là đồi núi thấp, một số vùng có các cao nguyên tương đối rộng lớn, khá bằng phẳng (Trung du và miền núi Bắc Bộ, Tây Nguyên). Khu vực này có đất feralit là chủ yếu, thuận lợi cho việc hình thành, phát triển các vùng chuyên canh cây ăn quả. VD: đào, lê, táo, mận, cam, bưởi.\n- Khí hậu:\n+ VN có khí hậu NĐẨGM với nhiệt độ cao >20°C, lượng mưa lớn >1600 mm/năm, độ ẩm cao >80%, tạo điều kiện cho phép phát triển sx cây ăn quả được diễn ra quanh năm, tăng vụ, tăng năng suất,... tạo nên các sphẩm từ cây ăn quả NĐ có giá trị kinh tế cao: xoài, mít, sầu riêng,...\n+ KH nước ta phân hóa đa dạng (theo mùa, độ cao, B-N, T-Đ) đã tạo nên sự ≠ về cơ cấu mùa vụ giữa các vùng, sự đa dạng sphẩm từ cây ăn quả trên cả nước. Ngoài các cây trồng NĐ, nước ta còn phát triển các cây ăn quả cận nhiệt và ôn đới như đào, lê, táo, mận, dâu tây,.... Đây là cơ sở để hình thành các vùng chuyên canh ở nước ta.\n- Nguồn nước:\n+ Có mạng lưới sông ngòi dày đặc, kênh rạch, nhiều hồ và đầm tự nhiên và nhân tạo, lượng mưa hàng năm tương đối lớn, nguồn nước ngầm phong phú, tạo điều kiện để cung cấp nước tưới tiêu cho sx cây ăn quả.\n+ Các hệ thống sông ngòi lớn còn có vai trò bồi đắp phù sa cho đồng bằng châu thổ.\n- Sinh vật: Nhiều giống cây trồng tốt, là cơ sở cung cấp nguồn gen quý cho trồng trọt cây ăn quả"],
["KT", "Phân tích các nhân tố ảnh hưởng đến sự phát triển và phân bố của cây ăn quả (phần 2: khó khăn tự nhiên và điều kiện kinh tế - xã hội).", "* Khó khăn:\n- ĐH và đất:\n+ ĐH đồi núi có độ dốc lớn, mưa nhiều, tập trung theo mùa, thảm thực vật tự nhiên bị tàn phá nên nhiều S đất ở trung du miền núi bị rửa trôi, xói mòn, bạc màu trở nên khô cằn, nghèo chất dinh dưỡng.\n+ Ở các vùng đồng bằng trũng, thấp đặc biệt là ĐBSCL, đất bị thoái hóa do nhiễm mặn, nhiễm phèn, ngập úng.\n+ Vùng ven biển có hiện tượng sa mạc hóa (đặc biệt là Ninh Thuận và Bình Thuận), hiện tượng cát bay, cát chảy nên đất đai nghèo chất dinh dưỡng.\n+ Bình quân đất tự nhiên và đất nông nghiệp theo đầu người ở nước ta thấp và ngày càng bị thu hẹp do sự mở rộng của đô thị, nông nghiệp, dịch vụ làm hạn chế việc mở rộng sx cây ăn quả.\n- Khí hậu:\n+ Nước ta có nhiều thiên tai như bão, hạn hán, sương muối,... gây thiệt hại cho sx cây ăn quả\n+ Môi trường nóng ẩm là điều kiện thuận lợi để sâu bệnh phát triển, ảnh hưởng đến sản lượng và chất lượng sphẩm cây ăn quả.\n+ BĐKH làm gia tăng các hiện tượng thời tiết cực đoan làm cho sx cây ăn quả trở nên bấp bênh.\n- Nguồn nước: Có chế độ dòng chảy sông ngòi thất thường: mùa khô gây thiếu nước nghiêm trọng, mùa mưa nước sông dâng cao gây ngập úng ảnh hưởng tới năng suất cây trồng. Chính vì vậy, thủy lợi là biện pháp hàng đầu trong thâm canh cây ăn quả.\n* Điều kiện kinh tế - xã hội\n- Dân cư lao động: Nước ta có lực lượng lao động trong sx cây ăn quả dồi dào, có kinh nghiệm trồng cây ăn quả. Trình độ lao động ngày càng được nâng cao, là cơ sở cho việc áp dụng KHKT mới vào trong sx cây ăn quả và nâng cao khả năng cạnh tranh của các sphẩm từ cây ăn quả trên thị trường.\n- KHCN: ngày càng hiện đại, phát triển và được ứng dụng rộng rãi trong sx cây ăn quả, giúp hoạt động sx cây ăn quả ngày càng thuận lợi hơn, nâng cao giá trị và chất lượng sphẩm.\n- Hệ thống cơ sở VCKT phục vụ sx cây ăn quả gồm: thủy lợi, dịch vụ trồng trọt, CN chế biến ngày càng được hoàn thiện, phổ rộng khắp cả nước, góp phần tăng giá trị và khả năng cạnh tranh của sphẩm từ cây ăn quả, nâng cao hiệu quả sx, ổn định và phát triển vùng chuyên canh.\n- Chính sách phát triển: Nhà nước ban hành nhiều chính sách thúc đẩy sx cây ăn quả phát triển như thu hút đầu tư, cho vay vốn ưu đãi, ứng dụng CN cao, chuyển từ tư duy sx cây ăn quả sang tư duy kinh tế cây ăn quả, tham gia chuỗi giá trị toàn cầu.\n- Thị trường tiêu thụ: Là thị trường trong và ngoài nước được mở rộng đã thúc đẩy sx phát triển, đa dạng hóa sphẩm từ cây ăn quả. Nhiều sphẩm VN đã đáp ứng được tiêu chuẩn toàn cầu, có mặt tại các thị trường lớn như\n- Khó khăn: +) Cơ sở VCKT nhiều vùng còn hạn chế chưa hoàn thiện và đồng bộ. CN chế biến ở 1 số vùng chưa phát triển, CNghệ còn lạc hậu nên giá trị sphẩm ≠ cao.\n+) Thị trường thế giới có nhiều biến động về giá cả, nhiều sphẩm từ cây ăn quả nước ta chưa đáp ứng được các yêu cầu của thị trường thế giới và khu vực.\n+) Vc liên kết trong chế biến, sx, tiêu thụ còn hạn chế."],
["KT", "Trình bày vai trò của cây công nghiệp.", "Cây CNghiệp của VN đa dạng, phát triển, đóng vai trò quan trọng trong sự phát triển kinh tế - xã hội của nước ta.\n* Đối với kinh tế\n- Cung cấp nguyên liệu cho ngành CNghiệp chế biến thực phẩm (mía, tiêu, lạc, cà phê,...), ngành CNghiệp sx hàng tiêu dùng (cao su, bông, thuốc lá,...)\n- Thúc đẩy các ngành kinh tế khác phát triển (CNghiệp chế biến, CNghiệp sx hàng tiêu dùng,...)\n- Tạo ra các mặt hàng XK, thúc đẩy ngoại thương phát triển, thu ngoại tệ, tích lũy vốn, thúc đẩy kinh tế phát triển\n- Chuyển dịch cơ cấu kinh tế ở nhiều vùng. Phát triển cây công nghiệp, phá thế độc canh cây lúa. Trồng trọt kết hợp với chăn nuôi tạo nên nền Nông nghiệp vững trải và cân đối. đa dạng hóa cơ cấu cây trồng\n* Đối với xã hội\n- Tạo việc làm, nhất là đối với các dân tộc thiểu số miền núi, nâng cao CLCS của nhân dân\n- Phân bố lại dân cư và lao động.\n* Đối với tài nguyên - môi trường\n- Tận dụng thế mạnh về tài nguyên (đặc biệt là vùng Trung du miền núi Bắc Bộ và Tây Nguyên)\n- Giúp bảo vệ môi trường, chống xói mòn đất, điều hòa KH"],
["KT", "Trình bày vai trò ngành chăn nuôi.", "Ngành chăn nuôi chiếm hơn 30% gtr sx ngành N² và ngày càng tăng do ngành chăn nuôi có vai trò quan trọng trong nền kinh tế quốc dân.\n* Đối với kinh tế\n- Cung cấp cho con người thực phẩm có dinh dưỡng cao từ đạm, giảm tinh bột trong cơ cấu bữa ăn\n- Cung cấp nguyên liệu cho ngành công nghiệp chế biến thực phẩm (thịt, trứng, sữa)\n- Phát triển các ngành công nghiệp dược phẩm, mỹ phẩm, hàng tiêu dùng\n- Tạo mặt hàng xuất khẩu, phát triển ngoại thương, thu ngoại tệ, tích lũy vốn, thúc đẩy ngành kinh tế phát triển\n- Chuyển dịch cơ cấu kinh tế ở nhiều vùng. Phát triển chăn nuôi, trở thành ngành kinh tế chính trong sx N², phá thế độc canh cây lúa. Trồng trọt kết hợp với chăn nuôi tạo nên nền N² vững trải và cân đối.\n- Chăn nuôi gia súc và lợn thì cung cấp sức kéo và phân bón cho ngành trồng trọt.\n- Chăn nuôi tận dụng triệt để phụ phẩm của ngành trồng trọt và Tsản\n* Đối với xã hội: tạo việc làm, tăng thu nhập, nâng cao chất lượng cuộc sống của người dân"],
["KT", "Trình bày vai trò của ngành lâm nghiệp.", "Lâm nghiệp đóng vai trò quan trọng trong sự phát triển bền vững, ảnh hưởng trực tiếp đến kinh tế - xã hội và môi trường.\n* Đối với kinh tế\n- Cung cấp nguyên liệu cho ngành sx (gỗ, tre,... và các sphẩm từ rừng, nấm hương, mộc nhĩ)\n- Phát triển ngành CNghiệp khai thác và chế biến Lsản, CNghiệp hàng tiêu dùng, CNghiệp dược phẩm, mỹ phẩm, dược liệu\n- Tạo ra các mặt hàng xuất khẩu (gỗ,...), thúc đẩy ngoại thương phát triển, thu ngoại tệ, tích lũy vốn, thúc đẩy kinh tế phát triển\n- Phát triển ngành du lịch bền vững: Du lịch sinh thái, nghỉ dưỡng, khám phá.\n* Đối với xã hội: Tạo việc làm, tăng thu nhập, nâng cao chất lượng cuộc sống của người dân\n* Đối với môi trường:\n- Bảo vệ môi trường: giảm ô nhiễm không khí, hấp thụ khí CO₂, điều hòa KH, cân bằng HST\n- Bảo vệ nguồn nước, ngăn xói mòn đất, giữ nước ngầm, hạn chế lũ lụt và hạn hán\n- Duy trì đa dạng sinh học, bảo vệ hệ sinh thái và các nguồn gen động thực vật quý hiếm, bảo vệ và phát triển môi trường sống cho động thực vật"],
["KT", "Trình bày vai trò ngành thủy sản.", "Ngành Tsản chiếm 26,5% gtri sx ngành N² và ngày càng phát triển, có vai trò quan trọng trong sự phát triển kinh tế - xã hội của VN.\n* Đối với kinh tế\n- Ngành Tsản cung cấp cho con người ơn nguồn thức ăn phong phú, có dinh dưỡng cao, giúp giảm cơ cấu tinh bột trong bữa ăn\n- Cung cấp nguyên liệu cho ngành CNghiệp chế biến, thực phẩm\n- Thúc đẩy các ngành kinh tế khác phát triển: CNghiệp sx hàng tiêu dùng, sphẩm mỹ phẩm, dược phẩm, cung cấp 13000 → 14000 tấn bột cá giúp phát triển chăn nuôi,...)\n- Ngành Tsản tạo mặt hàng xuất khẩu (cá tra, cá ba sa, cá ngừ đại dương), thúc đẩy ngoại thương, thu ngoại tệ lớn, tích lũy vốn, thúc đẩy ngành kinh tế phát triển\n- Thúc đẩy sự chuyển dịch cơ cấu kinh tế nước ta.\n* Đối với xã hội\n- Tạo công ăn, việc làm cho nhân dân, giúp tăng thu nhập, nâng cao chất lượng đời sống, đặc biệt là ngư dân.\n- Có ý nghĩa quan trọng trong việc khẳng định và đảm bảo chủ quyền quốc gia trên biển và hải đảo."],
["KT", "Trình bày vai trò của cây ăn quả.", "Cây ăn quả đóng vai trò quan trọng trong đời sống con người, giúp cung cấp nguồn thực phẩm giàu chất dinh dưỡng, góp phần phát triển kinh tế - xã hội và bảo vệ môi trường.\n* Đối với kinh tế\n- Cung cấp cho con người thực phẩm có giá trị dinh dưỡng cao, chứa nhiều chất xơ và vitamin (cam, xoài, sầu riêng, bơ, chuối,...)\n- Cung cấp nguyên liệu cho ngành công nghiệp chế biến thực phẩm (cam, sầu riêng,...)\n- Tạo mặt hàng xuất khẩu (thanh long, mít, xoài, vải,...), đẩy mạnh ngoại thương, thu ngoại tệ, tích lũy vốn, thúc đẩy kinh tế phát triển\n- Thúc đẩy các ngành kinh tế khác phát triển như: dược phẩm, mỹ phẩm...\n- Chuyển dịch cơ cấu kinh tế ở nhiều vùng, địa phương\n* Đối với xã hội: Tạo việc làm, tăng thu nhập, nâng cao chất lượng cuộc sống người dân\n* Đối với môi trường: Tận dụng tài nguyên và bảo vệ môi trường ở khu vực đồi núi."],
["KT", "Trình bày xu hướng phát triển và phân bố nông nghiệp ở nước ta.", "- N² nước ta phát triển theo hướng sx hàng hóa tập trung (nhu cầu của thị trường), quy mô lớn, tham gia ngày càng sâu vào chuỗi giá trị toàn cầu\n- Chú trọng phát triển N² xanh, N² hữu cơ, N² sinh thái, N² CNghệ cao để thích ứng với BĐKH\n- Tăng cường ứng dụng KHCNghệ và thu hút đầu tư của các doanh nghiệp vào các hđộng N²\n- Chuyển dịch cơ cấu ngành N² theo hướng giảm tỉ trọng ngành trồng trọt, tăng tỉ trọng ngành chăn nuôi và dịch vụ N²\n- Sphẩm N² được phát triển theo 3 trục sphẩm chủ lực: sphẩm cấp quốc gia, sphẩm cấp tỉnh, sphẩm đặc sản địa phương - OCOP.\n- Phân bố N² thay đổi, phù hợp với điều kiện sinh thái của các vùng N²"],
["KT", "Trình bày sự phát triển và phân bố ngành trồng trọt.", "- Trồng trọt là ngành chiếm tỉ trọng cao trong cơ cấu gtrị sx N² (năm 2021: chiếm 60,8...)\n- Nhiều sphẩm ngành trồng trọt có gtrị XK cao như: chè, cà phê, lúa gạo, sầu riêng,...\n- Trong từng loại cây trồng có sự thay đổi nhằm đáp ứng nhu cầu thị trường và sự về giống phù hợp đk sinh thái, cho năng suất cao, chất lượng tốt\n- Cơ cấu cây trồng đa dạng: cây lương thực, cây CN, cây ăn quả, cây rau đậu,...\n- Cơ cấu cây trồng thay đổi, chuyển dịch từ cây trồng có giá trị kinh tế và hiệu quả không cao sang cây trồng ≠ cho gtrị kté và hiệu quả cao hơn, đáp ứng nhu cầu của thị trường tiêu thụ."],
["KT", "Trình bày sự phát triển và phân bố cây lương thực.", "- Cây lương thực gồm: lúa, ngô, khoai, sắn. Trong đó, cây lúa là cây lương thực chính, chiếm vị trí chủ đạo (chiếm 88,9% diện tích cây lương thực có hạt)\n- Lúa có vai trò quan trọng, góp phần đảm bảo an ninh lương thực trong nước và phục vụ xuất khẩu\n- Áp dụng tiến bộ KH - CN trong sx lúa nên năng suất và sản lượng lúa ngày càng tăng, đảm bảo được nhu cầu của thị trường và thúc đẩy nền kinh tế của nước ta phát triển, dù diện tích lúa giảm.\n+ Nhiều giống lúa mới có đặc tính chịu được mặn, hạn, chống chịu sâu bệnh được đưa vào sử dụng giúp tăng năng suất lúa, cải thiện chất lượng lúa và phù hợp với bối cảnh BĐKH.\n- Cơ cấu mùa vụ thay đổi tùy địa phương:\n+ Miền Bắc có 2 vụ lúa và 1 vụ đông\n+ Miền Nam có từ 2 → 3 vụ lúa / năm\n* Phân bố:\n- Lúa được trồng trên khắp cả nước, 2 vùng trồng lúa trọng điểm lúa lớn nhất của nước ta là ĐBSH và ĐBSCL.\n+ ĐBSCL là vùng sx lúa và xuất khẩu lúa gạo lớn nhất cả nước (năm 2021 chiếm 53% diện tích, 55% sản lượng, cung cấp 90% sản lượng gạo xuất khẩu).\n+ ĐBSH là vùng sx lương thực lớn thứ 2 cả nước."],
["KT", "Trình bày sự phát triển và phân bố cây công nghiệp.", "* Sự phát triển\n- Cây CN gồm cây CN lâu năm (chè, cà phê, cao su, tiêu, điều,...) và cây CN hằng năm (mía, bông, thuốc lá, lạc, đậu tương,...)\n- Cây CN lâu năm chiếm 80% S cây CN cả nước\n+ Các cây CN lâu năm chiếm diện tích lớn là: chè, cà phê, cao su, tiêu, điều.\n- Cây CN hằng năm: S giảm\n+ Các cây CN có S lớn là: lạc, đậu tương, thuốc lá,...\n- Cây CN có vai trò quan trọng trong phá thế độc canh cây lúa, đa dạng hóa cơ cấu cây trồng và là mặt hàng xuất khẩu có giá trị cao như cà phê,...\n* Phân bố\n- Các cây CN lâu năm tập trung thành các vùng chuyên canh cây CN ở Trung du miền núi Bắc Bộ (chè, cà phê), Tây Nguyên (cà phê, tiêu, điều, chè), Đông Nam Bộ (cao su, tiêu, điều, cà phê).\n- Các cây CN hằng năm được trồng nhiều ở vùng Bắc Trung Bộ và Duyên hải Nam Trung Bộ, Trung du miền núi Bắc Bộ."],
["KT", "Trình bày ý nghĩa của vấn đề nông nghiệp xanh.", "* Khái niệm: N² xanh là nền N² áp dụng đồng bộ các quy trình công nghệ, sử dụng hợp lí, tiết kiệm vật tư đầu vào cho sx N², sử dụng hiệu quả các nguồn tài nguyên thiên nhiên\n* Ý nghĩa: N² xanh đảm bảo phát triển N² bền vững trên cả 3 trụ cột: kinh tế, xã hội và môi trường\n- Kinh tế:\n+ Nâng cao tính cạnh tranh của nông sản, tăng chất lượng nông sản, truy xuất được nguồn gốc và quy trình sx nông sản.\n+ Thúc đẩy phát triển công nghệ, xử lý và tái sử dụng phụ phẩm N², chất thải chăn nuôi,... vừa cung cấp thức ăn cho vật nuôi, vừa chuyển hóa chất thải làm phân bón hữu cơ\n- Xã hội:\n+ Góp phần nâng cao thu nhập của người dân và nâng cao chất lượng cuộc sống\n+ Tạo ra các sản phẩm sạch, đảm bảo sức khỏe người tiêu dùng\n- Môi trường:\n+ Bảo vệ các nguồn tài nguyên thiên nhiên và hệ sinh thái N²\n+ Phục hồi, cải tạo và khai thác hiệu quả tài nguyên thiên nhiên, giảm thiểu ô nhiễm môi trường"]

const SHEET_ID="1TvI5xiJVy8qT52dZ64ZeAWiH11FDaqXuFq74hmJNtqM";
const TAB="Học sinh";
const norm=s=>String(s||"").normalize("NFC").trim().toLowerCase().replace(/\s+/g," ");
const VT=a=>a>=2?"Đã học bài":a>=1?"Chưa học bài kĩ":"Chưa học bài";
const WD=["CN","T2","T3","T4","T5","T6","T7"];
S.sch=[];S.schT=0;S.sd=dk();
async function loadSched(){
 let u="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&headers=1&sheet="+encodeURIComponent(TAB)+"&_="+Date.now();
 let t=await(await fetch(u,{cache:"no-store"})).text();
 let j=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
 S.sch=j.table.rows.map(r=>{let c=i=>{let x=r.c[i];return x?String(x.f!=null?x.f:(x.v!=null?x.v:"")).trim():""};
  let d=c(3),m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return{n:c(0),lop:c(1),d,iso:m?m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0"):"",gio:c(4).slice(0,5),tg:c(5),meet:c(6),st:c(7),nt:c(8)}
 }).filter(x=>x.n&&x.iso);
 S.schT=Date.now()}
function caNo(x){let ts=[...new Set(S.sch.filter(y=>y.iso==x.iso).map(y=>y.gio))].sort();return ts.indexOf(x.gio)+1}
const absent=x=>/vắng/i.test(x.st);
function permit(x){let s=x.st+" "+x.nt;return /không phép|ko phép/i.test(s)?"không phép":/có phép/i.test(s)?"có phép":null}
function recOf(x){return S.recs.filter(r=>norm(r.n)==norm(x.n)&&dOf(r)==x.iso).sort((a,b)=>b.t-a.t)[0]}
const dayLbl=iso=>WD[new Date(iso+"T00:00:00").getDay()]+", "+iso.split("-").reverse().join("/");
function sched(){let box=document.getElementById("sc");if(!box)return;
 let L=S.sch.filter(x=>x.iso==S.sd).sort((a,b)=>a.gio.localeCompare(b.gio)||a.n.localeCompare(b.n));
 let st=document.getElementById("sst");if(st)st.textContent=S.schT?"đồng bộ lúc "+new Date(S.schT).toLocaleTimeString("vi-VN"):"đang tải...";
 let sb=document.getElementById("stt");if(sb){let dn=L.filter(x=>recOf(x)).length,ab=L.filter(absent).length,pgn=L.filter(x=>S.prog[PK(x.n,x.iso)]&&!recOf(x)).length;
  sb.innerHTML=`<div class="st s0"><b>${L.length}</b><span>Học sinh ngày ${dayLbl(S.sd)}</span></div><div class="st s1"><b>${dn}</b><span>Đã có kết quả</span></div><div class="st s2"><b>${pgn}</b><span>Đang kiểm tra dở</span></div><div class="st s3"><b>${ab}</b><span>Vắng</span></div>`}
 box.innerHTML=L.length?L.map(x=>{let r=recOf(x),ab=absent(x),mine=S.me&&norm(x.tg)==norm(S.me.name),k=PK(x.n,x.iso),pg=S.prog[k];
  let tag=ab?'<span class="tag wn">⚠️ Vắng</span>':r?'<span class="tag ok">✅ Đã có kết quả</span>':pg?`<span class="tag pr">⏳ Đang dở — câu ${pg.i+1}/5 (TG ${e(pg.bn)})</span>`:/đã kiểm tra/i.test(x.st)?'<span class="tag ok">Đã KT (theo Sheet)</span>':'<span class="tag pr">Chờ kiểm tra</span>';
  return `<div class="li"><div><b>${e(x.n)}</b><div class="mu">Ca ${caNo(x)} • ${e(x.gio)} • ${e(x.lop)} • TG: ${e(x.tg)}${mine?" (bạn)":""}</div></div>${tag}<div class="row">${x.meet?`<a href="${e(x.meet)}" target="_blank" rel="noopener"><button>Meet</button></a>`:""}${ab||r?"":pg?`<button class="b" onclick="resume('${k}')">▶ Tiếp tục</button><button class="dg" onclick="resetProg('${k}')">↺ Đặt lại</button>`:`<button class="b" onclick="startS('${encodeURIComponent(x.n+"|"+x.iso+"|"+x.gio)}')">▶ Bắt đầu</button>`}</div></div>`}).join(""):'<span class="mu">Không có học sinh nào được xếp trong ngày này.</span>'}
function startS(k){let [n,iso,gio]=decodeURIComponent(k).split("|"),x=S.sch.find(y=>y.n==n&&y.iso==iso&&y.gio==gio);
 if(!x){toast("Lịch vừa thay đổi, hãy chọn lại");sched();return}
 start({n:x.n,iso:x.iso,ca:"Ca "+caNo(x),gio:x.gio+" "+x.d.slice(0,5)})}
async function refreshSched(){if(!document.getElementById("sc"))return;
 try{await loadSched();sched()}
 catch(_){let s=document.getElementById("sst");if(s)s.textContent="⚠️ không đọc được Sheet (kiểm tra ID và quyền chia sẻ)"}
 if(!S.cur&&U&&S.me)loadProg().then(()=>{sched();pgl()})}
setInterval(refreshSched,60000);
addEventListener("focus",refreshSched);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshSched()});
function setSd(v){S.sd=v||dk();sched()}
function report(){let iso=S.sd,L=S.sch.filter(x=>x.iso==iso).sort((a,b)=>a.gio.localeCompare(b.gio)||a.n.localeCompare(b.n));
 if(!L.length){toast("Ngày này không có lịch");return}
 let warn=0,bl=L.map(x=>{let kq;
  if(absent(x)){let p=permit(x);if(!p){p="";warn++}
   kq="Học sinh vắng mặt "+p+". Tổ Trợ giảng đã xếp lịch kiểm tra bù cho HS."}
  else{let r=recOf(x);if(r){let d=calc(r);kq=d.na?"Chưa kiểm tra được câu nào (hết thời gian ca)":d.all.toFixed(1)+"/3 ("+VT(d.all)+")"+(d.na<5?" — tính trên "+d.na+"/5 câu đã kiểm tra":"")}else{kq="Chưa có kết quả";warn++}}
  return "Học sinh: "+x.n+"\nLớp: "+x.lop+"\nNgày: "+dayLbl(iso)+"\nCa số: "+caNo(x)+"\nThời gian: "+x.gio+"\nKết quả: "+kq}).join("\n\n");
 let t="[BÁO CÁO TÌNH HÌNH KIỂM TRA 1:1 NGÀY "+iso.split("-").reverse().slice(0,2).join("/")+"]\nKính gửi Quý phụ huynh,\nTổ Trợ giảng xin thông báo Kết quả kiểm tra lí thuyết 1:1 như sau:\n\n"+bl+"\n\nCác em và Quý phụ huynh vui lòng liên hệ Tổ Trợ giảng để xem thông tin chi tiết về kết quả kiểm tra.\nTrân trọng!";
 (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(warn?"Đã sao chép, nhưng còn "+warn+" mục cần kiểm tra lại":"Đã sao chép báo cáo")).catch(()=>prompt("Sao chép báo cáo:",t))}

/* ---------- Tiến độ lưu trên Firebase (oral_prog) ---------- */
const PK=(n,day)=>"p_"+[...norm(n)].map(c=>/[a-z0-9]/.test(c)?c:c.charCodeAt(0).toString(36)).join("").slice(0,80)+"_"+day;
const unrated=-2;
async function loadProg(){if(!U||!S.me)return;
 try{let o=await apiP("","GET",0,'?orderBy=%22%24key%22&limitToLast=300');S.prog={};
  if(o)Object.keys(o).forEach(k=>{let p=o[k];if(p&&!p.d&&p.qi&&p.n)S.prog[k]=p})}catch(_){}}
function pgl(){let a=Object.keys(S.prog).sort((x,y)=>S.prog[y].upd-S.prog[x].upd);
 let bg=document.getElementById("bpg");if(bg){bg.textContent=a.length;bg.style.display=a.length?"":"none"}
 let b=document.getElementById("pg");if(!b)return;
 b.innerHTML=a.length?a.map(k=>{let p=S.prog[k];return `<div class="li"><div><b>${e(p.n)}</b><div class="mu">${e(p.day)} • ${e(p.ca)} • câu ${(p.i||0)+1}/5 • TG: ${e(p.bn)} • cập nhật ${new Date(p.upd).toLocaleTimeString("vi-VN")}</div></div><div class="row"><button class="b" onclick="resume('${k}')">▶ Tiếp tục</button><button class="dg" onclick="resetProg('${k}')">↺ Đặt lại</button></div></div>`}).join(""):'<span class="mu">Không có lượt nào đang dở.</span>'}
async function resetProg(k){let p=S.prog[k];if(!p||!confirm("Đặt lại tiến độ của "+p.n+" ("+p.day+")?\nToàn bộ mức đánh giá, ghi chú và bộ 5 câu hỏi hiện tại sẽ bị xóa; lần bắt đầu tiếp theo sẽ bốc bộ câu hỏi mới."))return;
 try{await apiP("/"+k,"DELETE");delete S.prog[k];sched();pgl();toast("Đã đặt lại tiến độ")}
 catch(x){toast("Không đặt lại được: "+x.message)}}
let spT=null;
function saveProg(now){let c=S.cur;if(!c||c.done)return;clearTimeout(spT);
 let f=async()=>{if(!S.cur||S.cur.done||S.cur.key!=c.key)return;
  let p={n:c.n,ca:c.ca,gio:c.gio,day:c.day,qi:c.qi,i:c.i,
   r:Array.from({length:5},(_,k)=>c.r[k]==null?unrated:c.r[k]),ts:c.ts,
   nt:Array.from({length:5},(_,k)=>c.nt[k]||""),by:U.uid,bn:S.me.name,upd:Date.now()};
  try{await apiP("/"+c.key,"PUT",p);S.prog[c.key]=p}catch(x){toast("Chưa lưu được tiến độ: "+x.message)}};
 if(now)f();else spT=setTimeout(f,800)}
const fromProg=(p,key)=>({n:p.n,ca:p.ca,gio:p.gio,day:p.day,key,qi:p.qi,qs:p.qi.map(i=>Q[i]),i:p.i||0,
 r:Array.from({length:5},(_,k)=>p.r&&p.r[k]!=null&&p.r[k]!=unrated?p.r[k]:undefined),
 ts:Array.from({length:5},(_,k)=>p.ts&&p.ts[k]!=null?p.ts[k]:TM),
 nt:Array.from({length:5},(_,k)=>(p.nt&&p.nt[k])||""),run:false,done:false});
async function resume(key){let p;try{p=await apiP("/"+key,"GET")}catch(x){toast("Không đọc được tiến độ: "+x.message);return}
 if(!p||p.d||!p.qi){toast("Lượt này đã kết thúc hoặc không còn");await loadProg();sched();pgl();return}
 if(p.by!=U.uid&&Date.now()-p.upd<30000&&!confirm("TG "+p.bn+" vừa cập nhật lượt này vài giây trước. Vẫn tiếp quản?"))return;
 S.cur=fromProg(p,key);saveProg(1);if(!openWin())return;q()}

async function start(p){let n=p?p.n:document.getElementById("n").value.trim();if(!n){alert("Nhập tên học sinh");return}
 let day=p?p.iso:dk(),key=PK(n,day),old=null;
 try{old=await apiP("/"+key,"GET")}catch(_){}
 if(old&&old.qi&&!old.d)return resume(key);
 let qs=pick(n);
 S.cur={n,ca:p?p.ca:(document.getElementById("ca").value||"-"),gio:p?p.gio:(document.getElementById("gio").value||new Date().toLocaleString("vi-VN")),
  day,key,qi:qs.map(x=>Q.indexOf(x)),qs,i:0,r:[],ts:[TM,TM,TM,TM,TM],nt:["","","","",""],run:false,done:false};
 saveProg(1);if(!openWin())return;q()}
function openWin(){if(!S.win||S.win.closed)S.win=window.open("","hs_view","width=1000,height=640");if(!S.win){alert("Trình duyệt chặn cửa sổ bật lên. Hãy cho phép rồi thử lại.");return false}S.win.focus();ch();return true}
function ring(t){let col=t<=15?"#ef4444":t<=45?"#f59e0b":"#22d3ee";return `<div class="rg"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="rb"/><circle cx="60" cy="60" r="54" class="rf" style="stroke:${col};stroke-dasharray:339.3;stroke-dashoffset:${339.3*(1-Math.max(0,t)/TM)}"/></svg><b>${fmt(t)}</b></div>`}
function ch(){let w=S.win,c=S.cur;if(!w||w.closed||!c)return;let d=w.document;
 if(!d.getElementById("hs")){d.open();d.write('<meta charset="utf-8"><title>Màn hình học sinh</title><style>'+document.querySelector("style").textContent+'</style><body class="hsb"><div id="hs"></div>');d.close()}
 let t=c.ts[c.i];d.getElementById("hs").innerHTML=c.done?`<div class="wrap"><h1 style="text-align:center">🎉 Hoàn thành bài kiểm tra!</h1>${resHTML(S.rec,"hs")}</div>`:`<div class="hsw"><div class="hsh">${e(c.n)} • Câu ${c.i+1}/5</div><div class="hsq">${e(c.qs[c.i][1])}</div>${ring(t)}<div class="hsm">${t>0?(c.run?"Thời gian suy nghĩ":"Chuẩn bị..."):"Hết giờ — mời em trả lời"}</div></div>`}
function q(){clearInterval(S.tm);let c=S.cur,x=c.qs[c.i];c.run=false;
 $(shell(ph("📝 "+e(c.n),"Ca: "+e(c.ca)+" • "+e(c.gio),'<button onclick="openWin()">🖥 Mở lại cửa sổ HS</button><button onclick="if(confirm(\'Thoát? Tiến độ đã được lưu, bạn hoặc trợ giảng khác có thể vào lại để tiếp tục.\')){saveProg(1);S.tab=\'pg\';home()}">Thoát</button>')
 +`<div class="steps">${c.qs.map((_,k)=>`<i class="${k==c.i?"cur":c.r[k]===-1?"sk":c.r[k]!=null?"dn":""}">${k+1}</i>`).join("")}</div>
 <div class="ex"><div>
 <div class="c"><span class="tag">${CI[x[0]]} ${CATS[x[0]]}</span><div class="q">${e(x[1])}</div><div class="row"><div id="tm">${ring(c.ts[c.i])}</div><div class="bt"><button id="bt" class="b" onclick="run()">${c.ts[c.i]<TM?"▶ Tiếp tục":"▶ Bắt đầu tính giờ"}</button><button onclick="c0()">⏭ Bỏ qua thời gian</button></div></div></div>
 <div class="c"><h2>🎯 HS học đến mức nào?</h2><div class="r">${LV.map((l,k)=>`<button class="lv ${LC[k]}${c.r[c.i]===k?" on":""}" onclick="rate(${k})">${IC[k]}<br>${l}</button>`).join("")}</div><div class="row" style="margin-top:12px"><span class="mu">Hết thời gian ca? Bỏ qua câu này — chỉ tính điểm trên các câu đã kiểm tra. ${c.r[c.i]===-1?'<span class="tag wn">Đã bỏ qua câu này</span>':""}</span><button onclick="skip()">⏭ Bỏ qua câu này</button></div></div>
 <div class="c"><h2>✍️ Ghi chú cho câu này <span class="mu">(HS sẽ thấy trong kết quả)</span></h2><textarea id="nt" rows="3" maxlength="900" placeholder="VD: nhớ đúng ý chính nhưng thiếu số liệu, chưa giải thích được nguyên nhân..." oninput="S.cur.nt[S.cur.i]=this.value;saveProg()">${e(c.nt[c.i])}</textarea></div>
 <div class="nav"><button onclick="go(-1)" ${c.i?"":"disabled"}>← Câu trước</button><button class="b" id="nx" onclick="go(1)" ${c.r[c.i]==null?"disabled":""}>${c.i<4?"Câu tiếp theo →":"🏁 Kết thúc & xem kết quả"}</button></div>
 </div><div class="c ans"><h2>📖 Đáp án chi tiết <span class="mu">(chỉ trợ giảng thấy)</span></h2><div class="a">${e(ans(x))}</div></div></div>`,"nw"));ch()}
function tick(){let c=S.cur;if(c.ts[c.i]>0)c.ts[c.i]--;let t=document.getElementById("tm");if(t)t.innerHTML=ring(c.ts[c.i]);if(c.ts[c.i]<=0){clearInterval(S.tm);c.run=false;let b=document.getElementById("bt");if(b)b.textContent="⏰ Hết giờ";saveProg()}else if(c.ts[c.i]%10==0)saveProg();ch()}
function run(){let c=S.cur,b=document.getElementById("bt");if(c.run){clearInterval(S.tm);c.run=false;b.textContent="▶ Tiếp tục";saveProg()}else{if(c.ts[c.i]<=0)return;c.run=true;b.textContent="⏸ Tạm dừng";S.tm=setInterval(tick,1000)}ch()}

 S.rec={id:nid(),t:Date.now(),n:c.n,ca:c.ca,gio:c.gio,qs:c.qs.map(x=>({c:x[0],q:x[1],a:ans(x)})),r:Array.from({length:5},(_,k)=>c.r[k]==null?-1:c.r[k]),cm:{},nt:Array.from({length:5},(_,k)=>(c.nt[k]||"").trim()),by:U.uid,bn:S.me.name,be:U.email,day:c.day||dk()};

 try{await apiP("/"+c.key,"PUT",{d:1,n:c.n,day:c.day,upd:Date.now()});delete S.prog[c.key]}catch(_){}}

 +resHTML(r,"adm")+`<div class="nav np"><button onclick="S.tab='sc';home()">← Về trang chính</button><button class="b" onclick="saveCm()">💾 Lưu nhận xét</button></div>`,"hs"))}

 try{await api("/"+r.id+"/cm","PUT",cm);toast("Đã lưu nhận xét")}catch(x){toast("Chưa lưu được lên Firebase: "+x.message)}}
