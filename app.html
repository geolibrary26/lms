<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>GeoLibrary · Cổng học sinh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">

<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--s:#f5f7fc;--ink:#0e1a3a;--mu:#6a7794;--ln:#e7ebf4;--b:#2456f5;--b2:#6a93ff;--bs:#eaf0ff;--g:#0fa76f;--gs:#e5f8ef;--am:#d98206;--as:#fff3df;--r:#e5484d;--rs:#ffecec;--v:#7358ff;--vs:#f0ecff;--sh:0 1px 2px rgba(14,26,58,.04),0 10px 28px -14px rgba(14,26,58,.16)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--s);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;justify-content:center;min-height:100dvh}
#app{width:100%;max-width:480px;min-height:100dvh;background:#fff;padding-bottom:104px;box-shadow:0 0 60px rgba(14,26,58,.07)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--ink);outline:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.svg{display:block}
/* auth */
.auth{padding:26px 22px 40px;min-height:100dvh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--b);color:#fff;display:grid;place-items:center}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.2}.brand small{color:var(--mu);font-size:12.5px}
.bk{width:40px;height:40px;border-radius:13px;border:1px solid var(--ln);display:grid;place-items:center;margin-bottom:16px}
.steps{display:flex;gap:6px;margin-bottom:22px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--ln)}.steps i.on{background:var(--b)}
.auth h1{font-size:30px;line-height:1.15;letter-spacing:-.035em;font-weight:800;margin-bottom:10px}
.auth .s{color:var(--mu);margin-bottom:22px}
.fld{margin-bottom:14px;position:relative}.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld input{width:100%;height:54px;padding:0 16px;border-radius:15px;background:var(--s);border:1.5px solid transparent;font-size:16px;font-weight:500;transition:.15s}
.fld input:focus{border-color:var(--b);background:#fff;box-shadow:0 0 0 4px rgba(36,86,245,.1)}
.fld .eye{position:absolute;right:6px;bottom:6px;width:42px;height:42px;display:grid;place-items:center;color:var(--mu)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;height:56px;border-radius:17px;background:var(--b);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 14px 26px -14px rgba(36,86,245,.8);margin-top:8px;transition:transform .12s}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.6}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--ln);box-shadow:none}
.btn.gr{background:var(--g);box-shadow:0 14px 26px -14px rgba(15,167,111,.8)}
.link{color:var(--b);font-weight:600;padding:10px;display:block;margin:4px auto 0}
.err{background:var(--rs);color:#b4232a;border-radius:13px;padding:11px 14px;margin-bottom:14px;font-size:14px;animation:shake .4s}
.note{background:var(--bs);color:#1b3fb8;border-radius:13px;padding:11px 14px;margin-bottom:14px;font-size:13.5px}
.pm{display:flex;gap:5px;margin:-4px 0 10px}.pm i{flex:1;height:5px;border-radius:9px;background:var(--ln);transition:.2s}
.rules{color:var(--mu);font-size:13px;margin-bottom:12px}.rules span{display:block}.rules .ok{color:var(--g)}
.okc{width:96px;height:96px;border-radius:50%;margin:70px auto 22px;display:grid;place-items:center;background:var(--gs);color:var(--g);animation:pop .5s both}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:4px 0 22px}
.feats div{background:var(--s);border-radius:16px;padding:12px 8px;text-align:center;font-size:12px;font-weight:600;line-height:1.3}
.feats svg{margin:0 auto 6px;color:var(--b)}
/* app */
.lg{object-fit:contain;border-radius:12px;flex:none}.bt{display:flex;align-items:center;gap:9px;padding:14px 20px 0;font-weight:800;font-size:15px;letter-spacing:-.02em}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px}
.hi{display:flex;align-items:center;gap:12px;min-width:0}.hi small{color:var(--mu);font-size:13px;display:block}.hi b{font-size:19px;font-weight:800;letter-spacing:-.02em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:46px;height:46px;border-radius:50%;background:var(--bs);color:var(--b);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--ln);display:grid;place-items:center;position:relative;flex:none;background:#fff}
.ib i{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--r);border:2px solid #fff}
.hero{margin:14px 20px 0;border-radius:28px;padding:22px;color:#fff;background:radial-gradient(300px 220px at 100% 0,rgba(255,255,255,.28),transparent 70%),linear-gradient(145deg,#2f64ff,#1b3fd0);box-shadow:0 22px 40px -22px rgba(36,86,245,.9);position:relative;overflow:hidden}
.hero h3{font-size:24px;line-height:1.2;letter-spacing:-.03em;font-weight:800;margin:12px 0 6px}.hero p{opacity:.85;font-size:14px}
.hero .go{margin-top:18px;background:#fff;color:var(--b);height:52px;border-radius:16px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:9px}
.hero .go.ok{background:rgba(255,255,255,.18);color:#fff}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.18);width:fit-content}
.pill i{width:8px;height:8px;border-radius:50%;background:#7dffb9;animation:pulse 1.4s infinite}
.sec{display:flex;align-items:center;justify-content:space-between;padding:26px 20px 12px}.sec h2{font-size:19px;font-weight:800;letter-spacing:-.025em}.sec a{color:var(--b);font-size:13.5px;font-weight:600;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.st{border-radius:20px;padding:14px 12px;background:var(--s)}.st b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}.st small{color:var(--mu);font-size:12.5px}
.card{margin:0 20px 12px;padding:15px 16px;border-radius:20px;background:#fff;border:1px solid var(--ln);box-shadow:var(--sh)}
.li{display:flex;align-items:center;gap:13px}.li .t{flex:1;min-width:0}.li b{display:block;font-size:15px;font-weight:700}.li small{color:var(--mu);font-size:13px}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.tl{margin:0 20px;border-left:2px solid var(--ln);padding-left:18px}
.tl .it{position:relative;padding:2px 0 18px}.tl .it:before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--c)}
.tl .it b{display:block;font-weight:700}.tl small{color:var(--mu);font-size:13px}
.sc{min-width:60px;text-align:center;padding:8px 6px;border-radius:14px;font-weight:800;font-size:18px;line-height:1.1}.sc small{display:block;font-size:10.5px;font-weight:600;opacity:.7}
.g{background:var(--gs);color:#0b8057}.t2{background:var(--bs);color:var(--b)}.w{background:var(--as);color:#a35f00}.r{background:var(--rs);color:#b4232a}
.bar{height:7px;border-radius:9px;background:var(--s);overflow:hidden;margin-top:10px;position:relative}.bar i{display:block;height:100%;border-radius:9px;background:var(--b)}.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--am)}
.P{background:var(--gs);color:#0b8057}.L{background:var(--as);color:#a35f00}.A{background:var(--rs);color:#b4232a}.E{background:var(--s);color:var(--mu)}
.dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800}
.ph{padding:18px 20px 4px}.ph h1{font-size:30px;letter-spacing:-.035em;font-weight:800;line-height:1.15}.ph p{color:var(--mu)}
.chips{display:flex;gap:8px;padding:14px 20px 12px;overflow-x:auto;scrollbar-width:none}.chip{padding:9px 16px;border-radius:99px;background:var(--s);font-weight:600;font-size:13.5px;white-space:nowrap;color:var(--mu)}.chip.on{background:var(--ink);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bs);color:var(--b)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal span{font-size:12px;color:var(--mu);font-weight:600}.cal div{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:600;color:#9aa5bd}
.cal .P,.cal .L,.cal .A{font-weight:800}.cal .today{outline:2px solid var(--b)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.mh b{font-size:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln)}.kv:last-child{border:0}.kv span{color:var(--mu)}.kv b{text-align:right;font-weight:600}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);z-index:20}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;color:var(--mu);font-size:11.5px;font-weight:600}
.tb.on{color:var(--b)}.tb.on span{background:var(--bs)}.tb span{padding:5px 16px;border-radius:99px;transition:.2s}
.sheet{position:fixed;inset:0;background:rgba(14,26,58,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sh{width:100%;max-width:480px;background:#fff;border-radius:28px 28px 0 0;padding:12px 22px calc(24px + env(safe-area-inset-bottom,0px));animation:slide .3s cubic-bezier(.2,.8,.25,1);max-height:90dvh;overflow:auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 18px}
.nx{border-radius:16px;padding:13px 15px;margin-top:12px;background:var(--bs);font-size:14px}.nx.g2{background:var(--as)}.nx h4{font-size:13px;margin-bottom:4px;color:var(--b)}.nx.g2 h4{color:var(--am)}
/* camera */
#cam{position:fixed;inset:0;z-index:80;background:#fff;display:none;justify-content:center;overflow:auto}#cam.on{display:flex}
.camw{width:100%;max-width:480px;padding:calc(18px + env(safe-area-inset-top,0px)) 22px 30px;text-align:center}
.camw .ib{margin-bottom:6px}.camw h2{font-size:25px;font-weight:800;letter-spacing:-.03em}.camw>p{color:var(--mu);margin:6px 0 20px}
.vf{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:0 auto 20px}
.vf video{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);border-radius:50%;object-fit:cover;transform:scaleX(-1);background:var(--s)}
.vf svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.fs{font-weight:700;font-size:16px;min-height:52px}.fs.ok{color:var(--g)}
.tips{display:grid;gap:8px;text-align:left;margin-top:14px}.tips div{display:flex;gap:11px;align-items:center;background:var(--s);border-radius:14px;padding:11px 14px;font-size:13.5px}.tips svg{color:var(--b);flex:none}
.cbox{margin-top:18px;text-align:left;background:var(--s);border-radius:20px;padding:16px}
.cbox h3{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:800;margin-bottom:4px}.cbox h3 svg{color:var(--b)}
.cbox p{color:var(--mu);font-size:13.5px;margin-bottom:12px}
.cbox input{width:100%;height:52px;padding:0 16px;border-radius:14px;background:#fff;border:1.5px solid var(--ln);font-size:17px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.cbox input:focus{border-color:var(--b);box-shadow:0 0 0 4px rgba(36,86,245,.1)}
.cbox .btn{height:50px;margin-top:10px}.cbox .err,.cbox .note{margin:10px 0 0}
.pimg{width:100%;border-radius:20px;max-height:62dvh;object-fit:cover;background:var(--s);margin:12px 0 4px}
.ib.sm{width:36px;height:36px;border-radius:12px}
.ok2{background:var(--gs);color:#0b6a49;border-radius:13px;padding:11px 14px;margin-top:10px;font-size:14px}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes slide{from{transform:translateY(100%)}to{transform:none}}@keyframes pulse{50%{opacity:.35;transform:scale(1.5)}}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ib .cn{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:99px;background:var(--r);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid #fff;animation:pop .4s}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-weight:600;border-bottom:1px solid var(--ln);text-align:left}.act:last-child{border:0}.act svg{color:var(--b)}.act em{margin-left:auto;font-style:normal;color:var(--mu);font-size:13px}
.sh .card{margin:0 0 10px}.act2.cur{border-color:var(--b);background:var(--bs)}
.nb{color:var(--mu);font-size:13.5px;margin-top:8px;max-height:3.4em;overflow:hidden}.nb.full{max-height:none;color:var(--ink);font-size:15px;line-height:1.6}.nb ul{padding-left:20px}.nb a{color:var(--b);font-weight:600}
.nt.new{border-color:#b9ccff;background:linear-gradient(#fff,#f5f8ff)}.nimg{width:100%;border-radius:16px;margin-bottom:12px;max-height:340px;object-fit:cover}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;z-index:99;font-weight:600;animation:rise .4s}
@media(min-width:1500px){.dk-m{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){
body{background:linear-gradient(135deg,#eef2ff,#f5f7fc 50%,#e8f8f1)}#app{max-width:none;background:none;box-shadow:none;padding-bottom:0}
.auth{max-width:520px;min-height:auto;margin:6vh auto;background:#fff;border-radius:32px;box-shadow:0 30px 80px -30px rgba(14,26,58,.25);padding:38px 40px 44px}
.dk{display:grid;grid-template-columns:270px 1fr;min-height:100dvh}
.dk-s{position:sticky;top:0;height:100dvh;background:#fff;border-right:1px solid var(--ln);padding:24px 16px;display:flex;flex-direction:column;gap:4px}.dk-s nav{display:grid;gap:4px;margin:10px 0 auto}
.dn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;font-weight:600;color:var(--mu);text-align:left;width:100%;transition:.2s}.dn:hover{background:var(--s)}.dn.on{background:var(--bs);color:var(--b)}.dn em{margin-left:auto;background:var(--r);color:#fff;border-radius:99px;font-style:normal;font-size:12px;padding:1px 8px}
.dk-u{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--s);margin:10px 0;cursor:pointer}.dk-u b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dk-u small{color:var(--mu);font-size:12.5px}
.dk-m{padding:28px 40px 60px;max-width:none;width:100%;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;align-content:start}
.dk-m>*{grid-column:1/-1;margin-left:0!important;margin-right:0!important}.dk-m>.card{grid-column:auto}
.dk-m .bt{display:none}.dk-m .top,.dk-m .sec,.dk-m .ph,.dk-m .stats,.dk-m .chips{padding-left:0;padding-right:0}.dk-m .hero{margin-top:14px;padding:28px 32px}.dk-m .card{margin-bottom:14px}.dk-m .tl{margin:0}
.sheet{align-items:center}.sh{border-radius:28px;max-width:520px}.sh .grab{display:none}}
/* ===== animation ===== */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-7px)}}@keyframes drift{to{transform:translate(-40px,50px) scale(1.2)}}
@keyframes gbar{0%{transform:scaleY(.2)}35%,80%{transform:scaleY(1)}100%{transform:scaleY(.2)}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{0%{transform:translateY(0);opacity:0}15%,85%{opacity:1}100%{transform:translateY(72px);opacity:0}}
@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}@keyframes ckd{0%,15%{stroke-dashoffset:30}45%,100%{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}}@keyframes gshift{to{background-position:200% 0}}
@keyframes sheen{0%{left:-60%}55%,100%{left:130%}}@keyframes bob{50%{transform:translateY(-4px)}}@keyframes tabpop{40%{transform:translateY(-4px) scale(1.18)}}
#app.enter>*:not(.tabs):not(.auth),#app.enter>.auth>*:not(.okc){animation:rise .55s cubic-bezier(.2,.8,.25,1) backwards}
#app.enter .bar i{transform-origin:left;animation:grow .9s .3s cubic-bezier(.2,.8,.25,1) backwards}
#app.enter polyline{stroke-dasharray:1000;animation:draw 1.4s .2s ease-out backwards}
#app.enter .tb.on svg{animation:tabpop .45s .1s}
.okc path{stroke-dasharray:30;animation:ckd .7s .3s ease-out backwards}
#cam.on{animation:fade .25s}.sheet{animation-timing-function:ease-out}
.btn,.hero .go,.chip,.tb{transition:transform .15s,box-shadow .2s,opacity .2s,background .2s}.btn:not(:disabled):hover{transform:translateY(-1px)}
.card,.st{transition:transform .15s,box-shadow .2s}.card[onclick]:active,.st[onclick]:active{transform:scale(.975)}.chip:active,.hero .go:active{transform:scale(.96)}
.tb span{transition:background .3s,transform .3s}.tb.on span{transform:scale(1.04)}
.steps i{transition:background .4s}
.wel{position:relative;overflow:hidden}.wel>*{position:relative;z-index:1}
.wel:before,.wel:after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.wel:before{width:300px;height:300px;top:-90px;right:-110px;background:radial-gradient(circle,rgba(36,86,245,.2),transparent 70%);animation:drift 9s ease-in-out infinite alternate}
.wel:after{width:260px;height:260px;bottom:-80px;left:-100px;background:radial-gradient(circle,rgba(15,167,111,.16),transparent 70%);animation:drift 11s ease-in-out infinite alternate-reverse}
.gt{background:linear-gradient(90deg,#2456f5,#7358ff,#0fa76f,#2456f5);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gshift 5s linear infinite}
.ill .fl1{animation:float 5s ease-in-out infinite}.ill .fl2{animation:float 5s -2.5s ease-in-out infinite}
.ill .gb{transform-box:fill-box;transform-origin:bottom;animation:gbar 3.2s ease-in-out infinite}
.ill .spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.ill .scan{animation:scan 2.6s ease-in-out infinite}.ill .ckp{stroke-dasharray:30;animation:ckd 3.2s ease-out infinite}
.wel .feats svg{animation:bob 2.6s ease-in-out infinite}.wel .feats div:nth-child(2) svg{animation-delay:-.9s}.wel .feats div:nth-child(3) svg{animation-delay:-1.8s}
.wel .btn:not(.sec){position:relative;overflow:hidden}.wel .btn:not(.sec):after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sheen 3.4s 1s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>

async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'x'+h}}

 async brand(){try{const l=await val('public/brand/logo');if(l)CFG.logo=l}catch(e){}},

 async register(sid,vh,phone,pw,reset){const p=digits(phone),ix=await val('phoneIdx/'+p);

  const att=(await Promise.all(jobs)).filter(Boolean).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));

 async checkinCode(stu,c,raw){const code=String(raw||'').toUpperCase().replace(/\s+/g,'');
  if(!/^[A-Z0-9_-]{3,32}$/.test(code))throw Object.assign(new Error('Mã không đúng. Em kiểm tra lại nhé.'),{bad:1});

  const sl=c.slots.find(x=>x.d===new Date().getDay()),start=S0?S0.start:(sl?sl.s:'00:00'),ts=Date.now(),late=ts>new Date(date+'T'+start).getTime()+c.late*60000,

 async checkin(stu,c,img){const S0=c.ses,date=S0?S0.date:iso(new Date());let id=S0?S0.id:c.id+'_'+date;

  return`<div class="ph"><h1>Điểm số</h1><p>Theo dõi kết quả từng bài</p></div><div class="stats" style="margin-top:16px"><div class="st"><b style="color:var(--b)">${fmt(a)}</b><small>Điểm TB</small></div><div class="st"><b>${d.tests.length}</b><small>Số bài</small></div><div class="st"><b style="color:var(--g)">${fmt(Math.max(0,...d.tests.map(t=>t.score/t.max*10)))}</b><small>Cao nhất</small></div></div>
  <div class="card" style="margin-top:14px">${spark()}</div>
  <div class="chips"><button class="chip ${S.clsF==='all'?'on':''}" onclick="S.clsF='all';render()">Tất cả</button>${cl.map(c=>`<button class="chip ${S.clsF===c?'on':''}" onclick="S.clsF='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div>${ts.map(tCard).join('')||'<div class="card">Chưa có điểm.</div>'}<div style="padding:4px 22px;color:var(--mu);font-size:13px"><span style="color:var(--am)">▎</span> Vạch cam là điểm trung bình của lớp.</div>`}
function vAtt(){const d=S.data,at=attSt(),m=S.calM,y=m.getFullYear(),mo=m.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),map={};d.att.forEach(x=>{map[x.date]=(map[x.date]==='A'||x.st==='A')?'A':(map[x.date]==='L'||x.st==='L')?'L':'P'});const td=iso(new Date());
  let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let i=1;i<=days;i++){const k=y+'-'+pad(mo+1)+'-'+pad(i),s=map[k];cells+=`<div class="${s||''} ${k===td?'today':''}">${i}</div>`}
  return`<div class="ph"><h1>Điểm danh</h1><p>Lịch sử đi học của em</p></div><div class="stats" style="margin-top:16px;margin-bottom:12px"><div class="st"><b style="color:var(--g)">${at.P}</b><small>Có mặt</small></div><div class="st"><b style="color:var(--am)">${at.L}</b><small>Đi muộn</small></div><div class="st"><b style="color:var(--r)">${at.A}</b><small>Vắng</small></div></div>
  <div class="card"><div class="mh"><button class="ib" aria-label="Tháng trước" onclick="calMove(-1)">${ic('left',20)}</button><b>Tháng ${mo+1}/${y}</b><button class="ib" aria-label="Tháng sau" onclick="calMove(1)">${ic('chev',20)}</button></div><div class="cal">${['T2','T3','T4','T5','T6','T7','CN'].map(x=>`<span>${x}</span>`).join('')}${cells}</div></div>
  <div class="sec" style="padding-top:12px"><h2>Chi tiết</h2></div>${d.att.slice(0,20).map((x,i)=>`<div class="card" style="padding:12px 16px"><div class="li"><div class="dot ${x.st}" style="width:34px;height:34px;font-size:14px">${x.st==='P'?'✓':x.st==='L'?'M':'V'}</div><div class="t"><b style="font-size:14.5px">${esc(x.cls)}</b><small>${DN[new Date(x.date).getDay()]}, ${vd(x.date)}${x.time?' · '+x.time:''}</small></div>${x.ph?`<button class="ib sm" aria-label="Xem ảnh điểm danh" title="Xem ảnh điểm danh" onclick="showProof(${i})">${ic('cam',17)}</button>`:''}<span class="tag ${x.st}">${stLabel(x.st)}</span></div></div>`).join('')}`}
function vMe(){const s=S.stu;return`<div class="ph"><h1>Cá nhân</h1></div><div class="card" style="margin-top:16px;text-align:center;padding:26px 16px"><div class="av" style="width:84px;height:84px;font-size:34px;margin:0 auto 12px">${esc(s.name.trim().split(' ').pop()[0])}</div><b style="font-size:21px;letter-spacing:-.02em">${esc(s.name)}</b><div style="color:var(--mu)">${esc([s.grade,s.school].filter(Boolean).join(' · '))}</div></div>
  <div class="card"><div class="kv"><span>Ngày sinh</span><b>${vd(s.dob)}</b></div><div class="kv"><span>Trường THCS</span><b>${esc(s.school)}</b></div><div class="kv"><span>SĐT liên hệ</span><b>${esc(s.phone.replace(/(\d{4})(\d{3})(\d{3})/,'$1 $2 $3'))}</b></div><div class="kv"><span>Số lớp đang học</span><b>${S.data.classes.length}</b></div></div>
  <div class="card">${S.sids.length>1?`<button class="act" onclick="openSw()">${ic('user')}<span>Đổi học sinh</span><em>${S.sids.length} hồ sơ</em></button>`:''}<button class="act" onclick="S.add=true;S.f={};nav('info')">${ic('grad')}<span>Thêm học sinh (anh/chị/em)</span></button><button class="act" onclick="openPw()">${ic('lock')}<span>Đổi mật khẩu</span></button></div>
  <button class="btn sec" style="width:calc(100% - 40px);margin:6px 20px;color:var(--r)" onclick="logout()">${ic('out',20)} Đăng xuất</button>`}
function tabs(){const T=[['home','home','Trang chủ'],['classes','book','Lớp học'],['scores','chart','Điểm số'],['att','cal','Điểm danh'],['me','user','Cá nhân']];return`<nav class="tabs">${T.map(t=>`<button class="tb ${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')"><span>${ic(t[1],22)}</span>${t[2]}</button>`).join('')}</nav>`}
function tDetail(t){const f=n=>n==null||n===''?'—':fmt(+n),nl=x=>esc(x).replace(/\n/g,'<br>');
  return (t.cau||[]).map((c,ci)=>{const cp=+c.m?Math.min(100,(+c.d||0)/+c.m*100):0,bc=cp>=99.9?'#16a34a':cp<=0?'#dc2626':'#d97706';
    return `<div class="dq-c">${ci===0?'<div class="dq-sec">Chi tiết từng câu, từng ý</div>':''}<div class="dq-ch"><b>${esc(c.t||('Câu '+c.i))}</b><span class="dq-pill">${f(c.d)} / ${f(c.m)}</span></div><div class="dq-pb"><i style="width:${cp}%;background:${bc}"></i></div>`+
    (c.y||[]).map(y=>{const k=+y.d>=+y.m?'ok':(+y.d<=0?'lo':'mid');return `<div class="dq-y ${k}"><div class="dq-yh"><span class="dq-id">Ý ${esc(y.i||'')}</span><div class="dq-sc"><b>${f(y.d)}</b> / ${f(y.m)}</div></div>${y.n?`<div class="dq-nd">${nl(y.n)}</div>`:''}${y.o?`<div class="dq-ok">✓ ${nl(y.o)}</div>`:''}${y.l?`<div class="dq-lose">✗ Mất điểm: ${nl(y.l)}</div>`:''}</div>`}).join('')+`</div>`}).join('')}
function tTail(t){const li=(a)=>a&&a.length?a.map(x=>`<div class="dq-li"><span>${esc(x)}</span></div>`).join(''):'<div style="color:var(--mu)">—</div>';
  return (t.mh&&t.mh.length||t.ci&&t.ci.length)?`<div class="dq-2"><div class="dq-box dq-g"><div class="dq-bt">Điểm mạnh</div>${li(t.mh)}</div><div class="dq-box dq-r"><div class="dq-bt" style="color:#b91c1c">Cần cải thiện</div>${li(t.ci)}</div></div>`:''}
function openTest(id){const t=S.data.tests.find(x=>x.id===id),v=t.score/t.max*10;$('#sheet').innerHTML=`<div class="sheet" onclick="closeSheet()"><div class="sh" onclick="event.stopPropagation()"><div class="grab"></div><small style="color:var(--mu)">${esc(t.cls)} · ${vd(t.date)}</small><h2 style="font-size:23px;letter-spacing:-.03em;margin:4px 0 14px">${esc(t.title)}</h2><div style="display:flex;gap:12px"><div class="st" style="flex:1"><b class="${tone(v)}" style="background:none">${fmt(t.score)}<small style="display:inline;font-size:14px">/${t.max}</small></b><small>Điểm của em</small></div><div class="st" style="flex:1"><b style="color:var(--am)">${t.avg?fmt(t.avg):'—'}</b><small>Trung bình lớp</small></div></div>${tDetail(t)}${t.nx?`<div class="nx"><h4>Nhận xét cá nhân của giáo viên</h4>${esc(t.nx)}</div>`:''}${t.gn?`<div class="nx g2"><h4>Nhận xét chung / Lời nhắn của giáo viên</h4>${esc(t.gn)}</div>`:''}${tTail(t)}<button class="btn sec" style="margin-top:18px" onclick="closeSheet()">Đóng</button></div></div>`}
async function showProof(i){const x=S.data.att[i];if(!x||!x.pid)return;let v=null;
  try{v=await val('proofs/'+x.pid+'_'+S.stu.id)}catch(e){return toast('Chưa xem được ảnh: '+(/permission/i.test(e.message||'')?'cần cập nhật Rules (nhánh proofs).':e.message))}
  if(!v||!/^data:image\//.test(v.img||''))return toast('Buổi này không có ảnh điểm danh');
  $('#sheet').innerHTML=`<div class="sheet" onclick="closeSheet()"><div class="sh" onclick="event.stopPropagation()"><div class="grab"></div><small style="color:var(--mu)">${DN[new Date(x.date).getDay()]}, ${vd(x.date)}${x.time?' · '+x.time:''}</small><h2 style="font-size:21px;letter-spacing:-.03em;margin:4px 0 0">Ảnh điểm danh</h2><img class="pimg" src="${esc(v.img)}" alt="Ảnh điểm danh"><p style="color:var(--mu);font-size:13.5px">${esc(x.cls)} · ${stLabel(x.st)}</p><button class="btn sec" style="margin-top:14px" onclick="closeSheet()">Đóng</button></div></div>`}
function closeSheet(){$('#sheet').innerHTML=''}
function calMove(k){S.calM=new Date(S.calM.getFullYear(),S.calM.getMonth()+k,1);render()}
function go(t){S.tab=t;render();window.scrollTo(0,0)}
async function logout(){stopScoreLive();S.manual=true;try{await au.signOut()}catch(e){}S={manual:false,face:null,step:'welcome',tab:'home',f:{},stu:null,data:null,calM:new Date(),clsF:'all',err:'',busy:false,t:0,pw:false,reset:false,sids:[],notes:[],add:false,phone:''};render()}
function render(){const st=S.step;let h;
  if(st==='app'){const c=({home:vHome,classes:vClasses,scores:vScores,att:vAtt,me:vMe,notes:vNotes}[S.tab])();h=DESK()?deskShell(c):c+tabs()}
  else h=({loading:viewLoading,setup:viewSetup,welcome:viewWelcome,login:viewLogin,info:viewInfo,acct:viewAcct,ok:viewOk}[st])();
  const k=st+(st==='app'?S.tab:''),ch=k!==_k;_k=k;A.classList.remove('enter');A.innerHTML=h;
  if(ch){void A.offsetWidth;A.classList.add('enter');let n=0;A.querySelectorAll(':scope>*:not(.tabs),:scope>.auth>*').forEach(e=>e.style.animationDelay=Math.min(n++*45,520)+'ms')}}
let _k='';

/* ---------- thông báo · đổi mật khẩu · đổi học sinh · giao diện desktop ---------- */
const DESK=()=>matchMedia('(min-width:900px)').matches,unread=()=>(S.notes||[]).filter(n=>!n.read).length;
const fmtTxt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m.replace(/\n/g,'')+'</ul>').replace(/\n/g,'<br>');
const nCard=n=>`<div class="card nt ${n.read?'':'new'}" onclick="openNote('${esc(n.id)}')"><div class="li"><div class="ico" style="background:var(--bs);color:var(--b)">${ic(n.pin?'pin':'bell',21)}</div><div class="t"><b>${esc(n.title)}</b><small>${vd(iso(new Date(n.at)))} ${hm(n.at)}${n.read?'':' · <span style="color:var(--b);font-weight:700">Mới</span>'}</small></div></div><div class="nb">${fmtTxt((n.body||'').slice(0,160))}</div></div>`;
const noteSec=()=>S.notes.length?`<div class="sec" id="nw" style="padding-top:22px"><h2>Thông báo</h2><a onclick="go('notes')">Xem tất cả</a></div>${S.notes.slice(0,2).map(nCard).join('')}`:'';
const vNotes=()=>`<div class="ph"><h1>Thông báo</h1><p>${unread()?unread()+' thông báo chưa đọc':'Em đã đọc hết thông báo'}</p></div><div style="height:14px"></div>`+(S.notes.map(nCard).join('')||'<div class="card"><small style="color:var(--mu)">Chưa có thông báo nào.</small></div>');
function openNote(id){const n=S.notes.find(x=>x.id===id);if(!n)return;if(!n.read){n.read=true;rdb.ref('noticeRead/'+S.stu.id+'/'+id).set(Date.now()).catch(()=>{})}
  $('#sheet').innerHTML=`<div class="sheet" onclick="closeSheet()"><div class="sh" onclick="event.stopPropagation()"><div class="grab"></div><small style="color:var(--mu)">${vd(iso(new Date(n.at)))} ${hm(n.at)}</small><h2 style="font-size:22px;letter-spacing:-.03em;margin:4px 0 12px">${esc(n.title)}</h2>${/^data:image\//.test(n.img||'')?`<img class="nimg" src="${esc(n.img)}" alt="">`:''}<div class="nb full">${fmtTxt(n.body||'')}</div><button class="btn sec" style="margin-top:18px" onclick="closeSheet()">Đóng</button></div></div>`;render()}
function openSw(){$('#sheet').innerHTML=`<div class="sheet" onclick="closeSheet()"><div class="sh" onclick="event.stopPropagation()"><div class="grab"></div><h2 style="font-size:22px;letter-spacing:-.03em">Chọn học sinh</h2><p style="color:var(--mu);margin:4px 0 14px">Các em dùng chung SĐT này. Chọn hồ sơ muốn xem.</p>${S.sids.map(x=>`<button class="card act2 ${x.id===S.stu.id?'cur':''}" style="width:100%;text-align:left" onclick="switchTo('${esc(x.id)}')"><div class="li"><div class="av">${esc(x.name.trim().split(' ').pop()[0])}</div><div class="t"><b>${esc(x.name)}</b></div>${x.id===S.stu.id?ic('check',20):ic('chev',18)}</div></button>`).join('')}<button class="btn sec" onclick="closeSheet();S.add=true;S.f={};nav('info')">${ic('grad',19)} Thêm học sinh khác</button></div></div>`}
async function switchTo(id){closeSheet();try{localStorage.setItem('gl_sid',id)}catch(e){}S.step='loading';render();try{await openSession(id);DB.log('switch',id)}catch(e){S.err=e.message}S.tab='home';S.step='app';render()}
function openPw(){$('#sheet').innerHTML=`<div class="sheet" onclick="closeSheet()"><div class="sh" onclick="event.stopPropagation()"><div class="grab"></div><h2 style="font-size:22px;letter-spacing:-.03em">Đổi mật khẩu</h2><p style="color:var(--mu);margin:4px 0 14px">Mật khẩu áp dụng cho mọi học sinh dùng chung SĐT này.</p><div class="err" id="cpe" style="display:none"></div><div class="fld"><label for="cp0">Mật khẩu hiện tại</label><input id="cp0" type="password" autocomplete="current-password"></div><div class="fld"><label for="cp1">Mật khẩu mới</label><input id="cp1" type="password" autocomplete="new-password" placeholder="Ít nhất 8 ký tự, có chữ và số"></div><div class="fld"><label for="cp2">Nhập lại mật khẩu mới</label><input id="cp2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')subPw()"></div><button class="btn" onclick="subPw()">${ic('shield',19)} Lưu mật khẩu mới</button><button class="btn sec" onclick="closeSheet()">Hủy</button></div></div>`}
async function subPw(){const a=$('#cp0').value,b=$('#cp1').value,c=$('#cp2').value,e=$('#cpe'),er=m=>{e.textContent=m;e.style.display='block';e.style.animation='none';void e.offsetWidth;e.style.animation=''};
  if(!a)return er('Nhập mật khẩu hiện tại.');if(b.length<8||!/\d/.test(b)||!/[a-zA-Z]/.test(b))return er('Mật khẩu mới cần ít nhất 8 ký tự, gồm cả chữ và số.');if(b!==c)return er('Hai mật khẩu mới chưa giống nhau.');if(a===b)return er('Mật khẩu mới phải khác mật khẩu cũ.');
  try{const u=au.currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,a));await u.updatePassword(b);DB.log('pw',S.stu.id);closeSheet();toast('Đã đổi mật khẩu thành công')}catch(x){er(x.code==='auth/invalid-credential'||x.code==='auth/wrong-password'?'Mật khẩu hiện tại chưa đúng.':AUTHERR[x.code]||x.message)}}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function deskShell(c){const T=[['home','home','Trang chủ'],['classes','book','Lớp học'],['scores','chart','Điểm số'],['att','cal','Điểm danh'],['notes','bell','Thông báo'],['me','user','Cá nhân']],u=unread(),s=S.stu,m=S.sids.length>1;
  return`<div class="dk"><aside class="dk-s">${brandRow(40,'Cổng học sinh')}<nav>${T.map(t=>`<button class="dn ${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${ic(t[1],20)}<span>${t[2]}</span>${t[0]==='notes'&&u?`<em>${u}</em>`:''}</button>`).join('')}</nav><div class="dk-u" ${m?'onclick="openSw()"':''}><div class="av">${esc(s.name.trim().split(' ').pop()[0])}</div><div style="min-width:0"><b>${esc(s.name)}</b><small>${m?'Đổi học sinh ▾':esc(s.school)}</small></div></div><button class="dn" onclick="S.add=true;S.f={};nav('info')">${ic('grad',20)}<span>Thêm học sinh</span></button><button class="dn" onclick="openPw()">${ic('lock',20)}<span>Đổi mật khẩu</span></button><button class="dn" onclick="logout()" style="color:var(--r)">${ic('out',20)}<span>Đăng xuất</span></button></aside><main class="dk-m">${c}</main></div>`}
matchMedia('(min-width:900px)').addEventListener('change',()=>{if(S.step==='app')render()});
let _tk=0;setInterval(()=>{if(S.step!=='app'||!S.stu||document.hidden)return;_tk++;if(_tk%2===0)refreshSess(false);else softRender()},60000);
boot();
</script>
</body>
</html>
