.kqsc{font-size:13px;color:#5b6b7a;white-space:nowrap;font-weight:600}
.kqsc b{font-size:18px;color:#0f1f2e;font-weight:800}
.kqy.ok .kqsc b{color:#15803d}.kqy.lo .kqsc b{color:#b91c1c}
.kqok,.kqlose{margin-top:8px;font-size:12.8px;padding:7px 11px;border-radius:9px;word-break:break-word}
.kqok{background:#dcfce7;color:#14532d}.kqlose{background:#fee2e2;color:#7f1d1d}
.kqbox{border:1px solid #e3eaef;border-radius:14px;padding:14px 16px;background:#f8fbfb}
.kqbt{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0f766e;margin-bottom:6px}
.kq2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kq2 .kqbox{background:#fff}
.kqli{display:flex;gap:7px;margin-top:5px;font-size:13px}
.kqli:before{content:"";width:7px;height:7px;border-radius:50%;margin-top:7px;flex:none}
.kqg .kqli:before{background:#16a34a}.kqr .kqli:before{background:#dc2626}
.kqnote{font-size:11.5px;color:#7b8a98;padding-top:14px;padding-bottom:22px;border-top:1px dashed #d5dee5;margin:6px 36px 0;padding-left:0;padding-right:0}
.kqfoot-pdf{padding:6px 36px;font-size:11px;color:#7b8a98;display:flex;justify-content:space-between;background:#fff}
@media(max-width:600px){.kqb{padding:8px 16px}.kqh{padding:24px 18px 22px}.kqtt{font-size:20px}.kqsum{flex-direction:column-reverse;align-items:stretch}.kqring{align-self:center}.kqinfo{grid-template-columns:1fr}.kq2{grid-template-columns:1fr}.kqnote{margin:6px 16px 0}.kq-web{border-radius:14px}}
/* ===== Trang công khai cho học sinh ===== */
body.kq-body{background:linear-gradient(165deg,#e4f4f1 0%,#f4f7f9 55%,#eef3f8 100%);min-height:100vh}
.kqpub{padding:22px 14px 50px}
.kqact{max-width:820px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kqload{text-align:center;color:#5b6b7a;padding:90px 0}
.kqauth{max-width:440px;margin:6vh auto 0;background:#fff;border-radius:22px;box-shadow:0 30px 70px -26px rgba(15,118,110,.45);overflow:hidden}
.kqauth .kqhd{background:linear-gradient(135deg,#0b2b2a,#0f766e 70%,#15a89c);color:#fff;padding:26px 28px 22px;position:relative;overflow:hidden}
.kqauth .kqhd:before{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 68%)}
.kqauth h1{font-size:22px;font-weight:800;margin-top:14px;position:relative}
.kqauth .kqex{font-size:13px;opacity:.88;margin-top:4px;position:relative}
.kqauth .kqfm{padding:22px 28px 26px}
.kqauth .kqhint{font-size:12px;color:#7b8a98;margin-top:12px;line-height:1.5}
.kqerrc{max-width:440px;margin:12vh auto 0;background:#fff;border-radius:20px;padding:34px 28px;text-align:center;box-shadow:0 24px 60px -24px rgba(15,31,46,.25)}
.kqerrc h1{font-size:19px;font-weight:800;margin:10px 0 6px}
@media print{body.kq-body{background:#fff}.kqnoprint{display:none!important}.kqpub{padding:0}.kq-web{box-shadow:none;border-radius:0;max-width:none}.kqb,.kqy{break-inside:avoid}}
/* ===== Phần trong trang quản trị ===== */
.kqon{border-color:var(--p)!important;color:var(--p2)!important;background:var(--ps)!important}
.urow{flex-wrap:wrap;gap:6px}.urow .row{flex-wrap:wrap}
.kqmod .kq-web{box-shadow:none;border:1px solid var(--line)}
</style>
<script>
/* ===================== KẾT QUẢ CHO HỌC SINH: PDF + LINK RIÊNG + TRA CỨU THEO ĐỢT ===================== */
(function(){
'use strict';
const KQ={meta:{},loading:{},okCodes:{},cur:null,code:'',m:null,fail:0,lock:0};
window.KQ=KQ;
const arr=x=>Array.isArray(x)?x:(x&&typeof x==='object'?Object.values(x):[]);
const rd2=x=>Math.round((+x||0)*100)/100;
const fmtN=x=>String(rd2(x)).replace('.',',');
const nl=s=>esc(s).replace(/\n/g,'<br>');
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40)||'hs';
const kqTok=()=>Array.from(crypto.getRandomValues(new Uint8Array(20)),x=>(x%36).toString(36)).join('');
const kqLink=t=>baseUrl()+'?kq='+encodeURIComponent(t);
const kqExLink=c=>baseUrl()+'?tracuu='+encodeURIComponent(c);
const kqDobFmt=d=>(!d||d==='0000-00-00')?'':fmtD(d);
const p2=n=>String(n).padStart(2,'0');
const kqWhen=ts=>{ const d=new Date(ts||Date.now()); return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes()); };
async function kqKey(name,dob,school){ return 'h'+(await sha('kq1|'+norm(name).replace(/\s+/g,' ')+'|'+dob+'|'+normSchool(school))).slice(0,40); }

/* ---------- Dựng phiếu kết quả (mảng các khối để chia trang PDF cho đẹp) ---------- */
function kqBlocks(p){
  const cau=arr(p.cau), B=[], pct=p.max?Math.round(p.tong/p.max*100):0;
  const col=pct>=85?'#16a34a':pct>=65?'#0f766e':pct>=50?'#d97706':'#dc2626';
  const logo=(typeof BR!=='undefined'&&BR.logo)?'<img src="'+esc(BR.logo)+'" alt="">':'<span>◎</span>';
  B.push('<section class="kqb kqh"><div class="kqh1"><div class="kqlogo">'+logo+'</div><div><div class="kqcn">'+esc(p.center||'')+'</div><div class="kqsub">PHIẾU KẾT QUẢ BÀI KIỂM TRA</div></div></div>'+
    '<div class="kqtt">'+esc(p.title||'Bài kiểm tra')+'</div><div class="kqh2">'+(p.date?'<span class="kqchip">Ngày kiểm tra: '+esc(fmtD(p.date))+'</span>':'')+(p.cls?'<span class="kqchip">Lớp '+esc(p.cls)+'</span>':'')+(p.ma?'<span class="kqchip">Mã đề '+esc(p.ma)+'</span>':'')+'</div></section>');
  const info=[['Họ và tên',p.name],['Ngày sinh',p.dob],['Trường',p.school],['Lớp',p.cls]].filter(x=>x[1]);
  B.push('<section class="kqb kqsum"><div class="kqinfo">'+info.map(x=>'<div><span>'+x[0]+'</span><b>'+esc(x[1])+'</b></div>').join('')+
    ((p.scale&&+p.scale!==+p.max&&p.max)?'<div class="kqscale">Quy đổi theo thang '+fmtN(p.scale)+': <b>'+fmtN(p.tong/p.max*p.scale)+' điểm</b></div>':'')+'</div>'+
    '<div class="kqring"><svg viewBox="0 0 120 120" width="132" height="132"><circle cx="60" cy="60" r="50" fill="none" stroke="#e3efed" stroke-width="11"/><circle cx="60" cy="60" r="50" fill="none" stroke="'+col+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+(Math.min(100,pct)/100*314.16).toFixed(1)+' 314.16" transform="rotate(-90 60 60)"/></svg>'+
    '<div class="kqrc"><b style="color:'+col+'">'+fmtN(p.tong)+'</b><span>/ '+fmtN(p.max)+' điểm</span></div></div></section>');
  cau.forEach((c,ci)=>{ const ys=arr(c.y), cp=c.max?Math.min(100,c.diem/c.max*100):0, bc=cp>=99.9?'#16a34a':cp<=0?'#dc2626':'#d97706';
    const head='<div class="kqch">'+(ci===0?'<div class="kqsec">Chi tiết từng câu, từng ý</div>':'')+'<div class="kqch1"><b>'+esc(c.ten||('Câu '+c.id))+'</b><span class="kqpill">'+fmtN(c.diem)+' / '+fmtN(c.max)+'</span></div><div class="kqpb"><i style="width:'+cp+'%;background:'+bc+'"></i></div></div>';
    const yh=y=>{ const k=y.diem>=y.max?'ok':(y.diem<=0?'lo':'mid'); return '<div class="kqy '+k+'"><div class="kqyh"><span class="kqid">'+esc(y.id)+'</span><div class="kqnd">'+esc(y.nd)+'</div><div class="kqsc"><b>'+fmtN(y.diem)+'</b> / '+fmtN(y.max)+'</div></div>'+
      (y.ok?'<div class="kqok">✓ '+nl(y.ok)+'</div>':'')+(y.lose?'<div class="kqlose">✗ Mất điểm: '+nl(y.lose)+'</div>':'')+'</div>'; };
    if(!ys.length) B.push('<section class="kqb">'+head+'</section>');
    ys.forEach((y,yi)=>B.push('<section class="kqb">'+(yi===0?head:'')+yh(y)+'</section>'));
  });
  if(p.nx) B.push('<section class="kqb" style="padding-top:14px"><div class="kqbox"><div class="kqbt">Nhận xét cá nhân của giáo viên</div><div>'+nl(p.nx)+'</div></div></section>');
  if(p.gn) B.push('<section class="kqb" style="padding-top:6px"><div class="kqbox" style="background:#fffbeb;border-color:#f3e2b3"><div class="kqbt" style="color:#b45309">Nhận xét chung / Lời nhắn của giáo viên</div><div>'+nl(p.gn)+'</div></div></section>');
  const g=arr(p.manh), r=arr(p.cai);
  if(g.length||r.length) B.push('<section class="kqb" style="padding-top:6px"><div class="kq2"><div class="kqbox kqg"><div class="kqbt">Điểm mạnh</div>'+(g.length?g.map(x=>'<div class="kqli"><span>'+esc(x)+'</span></div>').join(''):'<div class="muted">—</div>')+'</div><div class="kqbox kqr"><div class="kqbt" style="color:#b91c1c">Cần cải thiện</div>'+(r.length?r.map(x=>'<div class="kqli"><span>'+esc(x)+'</span></div>').join(''):'<div class="muted">—</div>')+'</div></div></section>');
  B.push('<section class="kqb kqnote">'+(p.manual?'Kết quả do giáo viên chấm':'Kết quả được chấm với sự hỗ trợ của AI theo barem của giáo viên')+' · Cập nhật '+kqWhen(p.ts)+'. Mọi thắc mắc về điểm số, em vui lòng liên hệ giáo viên'+(p.center?' — '+esc(p.center):'')+'.</section>');
  return B;
}
const kqPage=p=>'<div class="kq kq-web">'+kqBlocks(p).join('')+'</div>';

/* ---------- Xuất PDF (chụp từng khối → ghép trang A4, giữ đúng tiếng Việt) ---------- */
let kqLibs=null;
const kqLd=(src,chk)=>new Promise((ok,no)=>{ if(chk()) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('Không tải được thư viện tạo PDF — kiểm tra kết nối mạng')); document.head.appendChild(s); });
const kqLoadLibs=()=>kqLibs||(kqLibs=Promise.all([kqLd('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas),kqLd('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf)]).catch(e=>{ kqLibs=null; throw e; }));
const kqShot=(el)=>html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:794});
async function kqPdf(p,btn){
  const old=btn?btn.innerHTML:''; if(btn){ btn.disabled=true; btn.innerHTML='Đang tạo PDF…'; }
  let host=null;
  try{
    await kqLoadLibs();
    host=document.createElement('div'); host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1';
    host.innerHTML=kqBlocks(p).map(b=>'<div class="kq kq-pdf">'+b+'</div>').join(''); document.body.appendChild(host);
    try{ if(document.fonts&&document.fonts.load) await document.fonts.load('700 14px Inter','ạ ế ữ ơ đ'); if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',compress:true}), PW=210, PH=297, TOP=12, BOT=15;
    let y=0, page=1, first=true;
    for(const el of Array.from(host.children)){
      const cv=await kqShot(el); let w=PW, h=cv.height*PW/cv.width; const avail=PH-TOP-BOT;
      if(h>avail){ w=PW*avail/h; h=avail; }
      if(!first && y+h>PH-BOT){ pdf.addPage(); page++; y=TOP; }
      pdf.addImage(cv.toDataURL('image/jpeg',.93),'JPEG',(PW-w)/2,y,w,h); y+=h; first=false;
    }
    for(let i=1;i<=page;i++){
      const f=document.createElement('div'); f.className='kq kq-pdf kqfoot-pdf'; f.innerHTML='<span>'+esc(p.center||'')+(p.name?' · '+esc(p.name):'')+'</span><span>Trang '+i+' / '+page+'</span>'; host.appendChild(f);
      const cv=await kqShot(f); pdf.setPage(i); pdf.addImage(cv.toDataURL('image/jpeg',.9),'JPEG',0,PH-11,PW,cv.height*PW/cv.width);
    }
    pdf.save('KetQua_'+slug(p.name)+'_'+slug(p.title)+'.pdf'); toast('Đã tải file PDF','ok');
  }catch(e){ toast('Không tạo được PDF: '+(e.message||e),'err'); }
  finally{ if(host) host.remove(); if(btn){ btn.disabled=false; btn.innerHTML=old; } }
}

/* ---------- Dữ liệu công khai ---------- */
function kqIdent(r){ const st=S.students[r.sid]||{}, ti=(r.trans&&r.trans.thong_tin)||{};
  return {name:st.name||r.name||ti.ho_ten||'', dob:st.dob||parseDob(ti.ngay_sinh)||'', school:st.school||ti.truong||'', cls:className(r.classId)!=='—'?className(r.classId):(ti.lop||'')}; }
function kqPubFromRec(r,code){ const id=kqIdent(r), R=r.res, same=(r.title||'')===(G.exam.title||'');
  return JSON.parse(JSON.stringify({v:1,center:(S.settings&&S.settings.centerName)||(typeof BR!=='undefined'?BR.name:'')||'',title:r.title||'',date:(same&&G.exam.date)||dk(new Date(r.ts||Date.now())),examCode:code||null,ma:R.ma||'',
    name:id.name||'(chưa có tên)',dob:kqDobFmt(id.dob),school:id.school,cls:id.cls,tong:rd2(R.tong),max:rd2(R.max),scale:same?(+G.exam.maxScore||null):null,
    cau:arr(R.cau).map(c=>({id:c.id,ten:c.ten||'',diem:rd2(c.diem),max:rd2(c.max),y:arr(c.y).map(y=>({id:y.id,nd:y.noi_dung||'',diem:rd2(y.diem),max:rd2(y.diem_toi_da),ok:y.da_dat||'',lose:y.mat_diem||''}))})),
    nx:R.nhan_xet_chung||'',manh:arr(R.diem_manh),cai:arr(R.can_cai_thien),ts:Date.now()})); }
function kqCodes(){ try{ return JSON.parse(localStorage.getItem('geoai_kqcodes')||'{}'); }catch(e){ return {}; } }
function kqCodeFor(title,create){ const k=(title||'').trim(); if(!k) return ''; const K=window.KS;
  if(K&&K.ready){ if((G.exam.title||'').trim()===k){ if(!G.exam.code&&create){ G.exam.code=kqTok().slice(0,8); IDB.set('exam',G.exam); } return G.exam.code||''; }
    const ent=Object.entries(K.exams||{}).find(e=>(e[1].title||'').trim()===k); if(ent){ if(!ent[1].code&&create){ ent[1].code=kqTok().slice(0,8); rdb.ref('gexams/'+ent[0]+'/code').set(ent[1].code); } return ent[1].code||''; } }
  const m=kqCodes(); if(!m[k]&&create){ m[k]=kqTok().slice(0,8); try{ localStorage.setItem('geoai_kqcodes',JSON.stringify(m)); }catch(e){} } return m[k]||''; }
function kqSetCode(v){ const title=(G.exam.title||'').trim(); const c=String(v||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,30); if(!title) return; if(c.length<4){ toast('Mã đợt cần ít nhất 4 ký tự (a-z, 0-9, dấu -)','err'); render(); return; }
  if(window.KS&&KS.ready&&(G.exam.title||'').trim()===title){ G.exam.code=c; IDB.set('exam',G.exam); } else { const m=kqCodes(); m[title]=c; try{ localStorage.setItem('geoai_kqcodes',JSON.stringify(m)); }catch(e){} } toast('Đã đổi mã đợt. Hãy bấm “Công khai” lại để cập nhật link mới.','ok'); render(); }
function kqLoadMeta(code){ KQ.loading[code]=1; rdb.ref('pubexam/'+code+'/meta').get().then(s=>{ KQ.meta[code]=s.val()||null; }).catch(()=>{ KQ.meta[code]=null; }).then(()=>{ delete KQ.loading[code]; render(); }); }

async function kqPublish(r,silent){
  const id=kqIdent(r), title=(r.title||'').trim(), code=title?kqCodeFor(title,true):''; let m=null;
  if(code){ m=(await rdb.ref('pubexam/'+code+'/meta').get()).val();
    if(m&&m.title&&m.title!==title&&!KQ.okCodes[code]){ if(!confirm('Mã đợt “'+code+'” đang dùng cho đề “'+m.title+'”. Vẫn dùng chung mã này?')) return null; KQ.okCodes[code]=1; } }
  const tok=(r.pub&&r.pub.token)||kqTok(), pub=kqPubFromRec(r,code), up={}; up['pubres/'+tok]=pub;
  let key=''; const canIdx=!!(code&&id.name&&id.dob&&id.school);
  if(canIdx){ key=await kqKey(id.name,id.dob,id.school); up['pubexam/'+code+'/idx/'+key]=tok; }
  const o=r.pub; if(o&&o.key&&o.code&&(o.key!==key||o.code!==code)) up['pubexam/'+o.code+'/idx/'+o.key]=null;
  if(code){ up['pubexam/'+code+'/meta/title']=title; up['pubexam/'+code+'/meta/center']=pub.center||''; up['pubexam/'+code+'/meta/date']=pub.date||''; up['pubexam/'+code+'/meta/ts']=Date.now(); if(!m||m.open==null) up['pubexam/'+code+'/meta/open']=true; }
  await rdb.ref().update(up);
  r.pub={token:tok,code,key,idx:canIdx,ts:pub.ts}; try{ await IDB.set('results',G.results); }catch(e){}
  if(code) delete KQ.meta[code];
  return r.pub;
}
async function kqRevokeData(r){ const up={}; up['pubres/'+r.pub.token]=null; if(r.pub.key&&r.pub.code) up['pubexam/'+r.pub.code+'/idx/'+r.pub.key]=null; await rdb.ref().update(up); }
async function kqRevoke(id){ const r=G.results.find(x=>x.id===id); if(!r||!r.pub) return; if(!confirm('Thu hồi link? Học sinh sẽ không còn xem được kết quả này nữa.')) return;
  try{ await kqRevokeData(r); r.pub=null; await IDB.set('results',G.results); closeModal(); toast('Đã thu hồi link','ok'); render(); }catch(e){ toast('Lỗi: '+e.message,'err'); } }

/* ---------- Giao diện quản trị ---------- */
function kqCurRec(){ if(!G.res) return null; return {id:G.savedId||'',ts:Date.now(),title:G.exam.title,classId:G.exam.classId,sid:G.cur.sid,name:G.cur.name||(G.cur.trans&&G.cur.trans.thong_tin&&G.cur.trans.thong_tin.ho_ten)||'',res:G.res,trans:G.cur.trans}; }
function kqRec(id){ return id?G.results.find(x=>x.id===id):kqCurRec(); }
function kqPreview(id){ const r=kqRec(id); if(!r){ toast('Chưa có kết quả','err'); return; } const p=kqPubFromRec(r,r.pub&&r.pub.code); window._kqP=p;
  modal(ic('file',18)+' Xem trước phiếu kết quả — đúng như học sinh sẽ thấy','<div class="kqmod">'+kqPage(p)+'</div>','<button class="btn" onclick="closeModal()">Đóng</button><button class="btn" onclick="kqPdf(window._kqP,this)">'+ic('download',14)+' Tải PDF</button><button class="btn pri" onclick="closeModal();kqShare('+(id?'\''+id+'\'':'')+')">'+ic('globe',14)+' Tạo link cho học sinh</button>',true); }
async function kqPdfRec(id){ const r=kqRec(id); if(!r){ toast('Chưa có kết quả','err'); return; } toast('Đang tạo PDF…'); await kqPdf(kqPubFromRec(r,r.pub&&r.pub.code),null); }
async function kqShare(id){
  try{ let r; if(id) r=G.results.find(x=>x.id===id); else { if(!G.res) return; await gSave(); r=G.results.find(x=>x.id===G.savedId); }
    if(!r) return; const nf=arr(r.res.can_giao_vien_xem_lai).length;
    if(nf&&!confirm('Bài này còn '+nf+' mục AI báo “cần giáo viên xem lại”. Bạn đã kiểm tra điểm chưa? Bấm OK để công khai cho học sinh.')) return;
    toast('Đang tạo link…'); const p=await kqPublish(r); if(p) kqShareModal(r); render();
  }catch(e){ toast('Lỗi tạo link: '+e.message+(/permission/i.test(e.message)?' — hãy dán Rules mới vào Firebase (Cài đặt → Thiết lập Firebase).':''),'err'); } }
function kqShareModal(r){ const p=r.pub, L=kqLink(p.token), EX=p.code?kqExLink(p.code):'', pb=kqPubFromRec(r,p.code);
  const msg='Kết quả bài “'+(r.title||'kiểm tra')+'” của em '+pb.name+': '+fmtN(pb.tong)+'/'+fmtN(pb.max)+' điểm.\nXem chi tiết từng ý & tải PDF: '+L+(EX?'\nHoặc tra cứu cả đợt (nhập họ tên, ngày sinh, trường): '+EX:'');

async function kqPublishAll(){ const title=(G.exam.title||'').trim(), list=G.results.filter(r=>(r.title||'').trim()===title); if(!list.length){ toast('Chưa có bài nào của đề này','err'); return; }
  if(!confirm('Công khai '+list.length+' bài của đề “'+title+'” để học sinh tra cứu?\nHãy chắc chắn bạn đã xem lại điểm và nhận xét.')) return;
  let ok=0,noidx=0,fail=0,err=''; for(const r of list){ try{ const p=await kqPublish(r,true); if(p){ ok++; if(!p.idx) noidx++; } }catch(e){ fail++; err=e.message; } }
  toast('Đã công khai '+ok+'/'+list.length+' bài'+(noidx?' · '+noidx+' bài thiếu ngày sinh/trường (chỉ có link riêng)':'')+(fail?' · lỗi '+fail+': '+err:''),fail?'err':'ok'); render(); }
async function kqToggleOpen(code,open){ try{ await rdb.ref('pubexam/'+code+'/meta/open').set(!!open); KQ.meta[code]=Object.assign({},KQ.meta[code],{open:!!open}); toast(open?'Đã mở tra cứu':'Đã đóng tra cứu','ok'); render(); }catch(e){ toast('Lỗi: '+e.message,'err'); } }

  const code=kqCodeFor(title,true), L=kqExLink(code), list=G.results.filter(r=>(r.title||'').trim()===title), n=list.filter(r=>r.pub&&r.pub.code===code).length;

    '<div class="cols2 mt12"><div class="field"><label>Mã đợt thi (đặt cho dễ nhớ: a-z, 0-9, dấu -)</label><input class="inp" id="kqCode" value="'+esc(code)+'" maxlength="30" onchange="kqSetCode(this.value)"></div>'+

    '<div class="small muted">Đã công khai <b>'+n+'</b>/'+list.length+' bài của đề này. Bài chấm sau: bấm “Link cho học sinh” ở từng bài hoặc “Công khai” lại. Mã đợt và link được đồng bộ cho mọi trợ giảng.</div></div>'; }

window.gDelRes=async function(id){ const r=G.results.find(x=>x.id===id); if(!r) return;
  if(r.pub){ if(!confirm('Bài này đang có link công khai. Xoá bài sẽ thu hồi luôn link của học sinh. Tiếp tục?')) return; try{ await kqRevokeData(r); }catch(e){ toast('Không thu hồi được link: '+e.message,'err'); return; } }
  else if(!confirm('Xoá kết quả này?')) return;
  G.results=G.results.filter(x=>x.id!==id); await IDB.set('results',G.results); render(); };
const _vg3=window.vGrade;
window.vGrade=function(){ let h=_vg3();

  kqShell('<div class="kqauth"><div class="kqhd">'+kqHead()+'<h1>Tra cứu kết quả</h1><div class="kqex">'+esc(m.title||'')+(m.date?' · '+esc(fmtD(m.date)):'')+'</div></div><div class="kqfm"><form onsubmit="kqSearch(event);return false" autocomplete="on">'+

    '<div class="field"><label>Ngày sinh *</label><input class="inp" id="kqD" inputmode="numeric" maxlength="10" placeholder="dd/mm/yyyy — VD: 15/03/2009" oninput="kqDobMask(this)"></div>'+

function kqDobMask(el){ const d=el.value.replace(/\D/g,'').slice(0,8); el.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d; }
function kqMsg(t){ const e=document.getElementById('kqMsg'); if(e) e.innerHTML='<div class="err">'+esc(t)+'</div>'; }
async function kqSearch(ev){ if(ev) ev.preventDefault(); const now=Date.now();
  if(KQ.lock&&now<KQ.lock) return kqMsg('Bạn thử sai nhiều lần. Vui lòng chờ '+Math.ceil((KQ.lock-now)/1000)+' giây rồi thử lại.');
  const name=val('kqN'), dob=parseDob(val('kqD')), school=val('kqS');
  if(!name||!school) return kqMsg('Vui lòng nhập đầy đủ họ tên và trường.'); if(!dob) return kqMsg('Ngày sinh chưa đúng định dạng (VD: 15/03/2009).');
  const b=document.getElementById('kqGo'); if(b){ b.disabled=true; b.textContent='Đang tìm…'; }
  try{ const key=await kqKey(name,dob,school), tok=(await rdb.ref('pubexam/'+KQ.code+'/idx/'+key).get()).val();
    if(!tok){ KQ.fail++; if(KQ.fail>=5){ KQ.lock=Date.now()+60000; KQ.fail=0; } if(b){ b.disabled=false; b.textContent='Xem kết quả'; } return kqMsg('Không tìm thấy kết quả. Hãy kiểm tra lại họ tên, ngày sinh, tên trường — hoặc kết quả của em chưa được công bố.'); }
    const p=(await rdb.ref('pubres/'+tok).get()).val(); if(!p){ if(b){ b.disabled=false; b.textContent='Xem kết quả'; } return kqMsg('Kết quả chưa sẵn sàng. Vui lòng thử lại sau.'); }
    KQ.fail=0; kqShowResult(p,tok,true);
  }catch(e){ if(b){ b.disabled=false; b.textContent='Xem kết quả'; } kqMsg('Không kết nối được. Hãy kiểm tra mạng rồi thử lại.'); } }
const kqBack=()=>kqForm();
async function kqBootLookup(code){ kqShell('<div class="kqload">Đang tải…</div>'); let m=null; try{ m=(await rdb.ref('pubexam/'+code+'/meta').get()).val(); }catch(e){}
  if(!m||!m.title) return kqErr('Không tìm thấy đợt thi','Link tra cứu không đúng, hoặc kết quả đợt thi này chưa được công bố.');
  if(m.open===false) return kqErr('Đã đóng tra cứu','Đợt thi “'+m.title+'” hiện không mở tra cứu. Vui lòng liên hệ giáo viên.');

/* ---------- TRA CỨU ĐIỂM THEO BÀI KIỂM TRA (đặt ở trang Điểm số): điểm giáo viên nhập tay + điểm chấm AI ---------- */
const kqCenter=()=>(S.settings&&S.settings.centerName)||(typeof BR!=='undefined'&&BR.name)||'';
async function kqEnsureCode(t){ if(t.pubCode) return t.pubCode; const code=kqCodeFor(t.title,false)||kqTok().slice(0,8); await C('tests').doc(t.id).update({pubCode:code}); t.pubCode=code; return code; }
function kqTestRows(t){ const tmax=+t.max||10, ti=(t.title||'').trim();
  return Object.keys(t.scores||{}).filter(sid=>S.students[sid]&&t.scores[sid]!=null&&t.scores[sid]!=='').map(sid=>{ const st=S.students[sid], r=G.results.find(x=>x.sid===sid&&(x.title||'').trim()===ti&&x.res), sc=+t.scores[sid];
    const ai=(r&&r.res.max)?rq(r.res.tong/r.res.max*tmax):null, okInfo=!!(st.name&&st.dob&&st.dob!=='0000-00-00'&&st.school);
    return {sid,st,sc,r,okInfo,detail:!!(r&&ai!=null&&Math.abs(ai-sc)<0.01),aiDiff:!!(r&&ai!=null&&Math.abs(ai-sc)>=0.01)}; }).sort((a,b)=>(a.st.name||'').localeCompare(b.st.name||'','vi')); }
function kqPubManual(t,sid,code){ const st=S.students[sid]||{}, cn=className(t.classId), cm=(t.comments&&t.comments[sid])||{};
  return {v:1,center:kqCenter(),title:t.title||'',date:t.date||dk(new Date()),examCode:code||null,name:st.name||'',dob:kqDobFmt(st.dob),school:st.school||'',cls:cn!=='—'?cn:'',tong:rd2(+t.scores[sid]),max:rd2(+t.max||10),scale:null,cau:[],nx:cm.nx||'',gn:t.pubNote||'',manh:arr(cm.manh),cai:arr(cm.cai),ts:Date.now(),manual:1}; }
function kqPubFor(t,x,code){ let pub; if(x.detail){ pub=kqPubFromRec(x.r,code); pub.scale=+t.max||10; if(t.date) pub.date=t.date; pub.gn=t.pubNote||''; } else pub=kqPubManual(t,x.sid,code); const cm=(t.comments&&t.comments[x.sid])||{}; if(x.detail){ if(cm.nx) pub.nx=cm.nx; if(cm.manh) pub.manh=arr(cm.manh); if(cm.cai) pub.cai=arr(cm.cai); } return pub; }
async function kqTestOpen(tid){ const t=S.tests[tid]; if(!t) return;
  if(!G.ready){ G.ready=true; toast('Đang tải dữ liệu bài chấm AI…'); try{ await gLoad(); }catch(e){} }
  const code=t.pubCode||'', rows=kqTestRows(t); let m=null; if(code){ try{ m=(await rdb.ref('pubexam/'+code+'/meta').get()).val(); }catch(e){} }
  const title=(t.title||'').trim(), L=code?kqExLink(code):'', tmax=+t.max||10, miss=rows.filter(x=>!x.okInfo), nDetail=rows.filter(x=>x.detail).length;
  const st=!code||!m?'<span class="pill pill-gray">Chưa công khai</span>':m.open===false?'<span class="pill pill-red">Đã đóng tra cứu</span>':'<span class="pill pill-grn">Đang mở tra cứu</span>';
  const body='<div class="row wrap mb12" style="gap:8px"><b>'+esc(title)+'</b>'+st+'<span class="small muted">'+fmtD(t.date)+' · thang '+tmax+' · '+rows.length+' học sinh có điểm</span></div>'+
   '<div class="small muted mb12">Học sinh nhập <b>họ tên + ngày sinh + trường</b> để xem điểm. Điểm lấy đúng như trong bảng Điểm số (giáo viên nhập trực tiếp hoặc lưu từ chấm AI); học sinh có bài chấm AI khớp điểm sẽ xem được thêm chi tiết từng ý và tải PDF.</div>'+
   (code?'<div class="field"><label>Link tra cứu chung cho cả lớp (gửi vào nhóm lớp)</label><div class="row"><input class="inp" readonly value="'+esc(L)+'" onclick="this.select()"><button class="btn" onclick="copyText(this.previousElementSibling.value)">'+ic('copy',14)+' Chép</button></div></div>':'<div class="warn small mb12">Link tra cứu sẽ được tạo khi bạn bấm “Công khai điểm”.</div>')+
   '<div class="field"><label>Nhận xét chung / Lời nhắn cho cả lớp (không bắt buộc; hiện thành ô riêng trên phiếu điểm của mọi học sinh, bên cạnh nhận xét cá nhân — áp dụng từ lần công khai kế tiếp)</label><textarea class="inp" rows="2" onchange="kqTestNote(\''+tid+'\',this.value)" placeholder="VD: Điểm đã làm tròn đến 0,25. Em thắc mắc xin liên hệ giáo viên.">'+esc(t.pubNote||'')+'</textarea></div>'+
   (miss.length?'<div class="warn small mb12">'+ic('alert',13)+' '+miss.length+' học sinh thiếu họ tên / ngày sinh / trường nên <b>chưa tra cứu được</b>: '+esc(miss.slice(0,8).map(x=>x.st.name||x.sid).join(', '))+(miss.length>8?'…':'')+'. Hãy bổ sung ở mục Học sinh.</div>':'')+

  const foot=(code&&m?'<button class="btn red" onclick="kqRevokeTest(\''+tid+'\')">'+ic('trash',14)+' Thu hồi tất cả</button><button class="btn" onclick="kqTestToggle(\''+tid+'\','+(m.open===false?'true':'false')+')">'+(m.open===false?'Mở lại tra cứu':'Đóng tra cứu')+'</button>':'')+'<button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" '+(rows.length?'':'disabled')+' onclick="kqPublishTest(\''+tid+'\')">'+ic('upload',14)+' '+(m?'Cập nhật':'Công khai')+' điểm '+rows.filter(x=>x.okInfo).length+' học sinh</button>';
  modal(ic('globe',18)+' Tra cứu điểm cho học sinh',body,foot,true); }
async function kqPublishTest(tid){ const t=S.tests[tid]; if(!t) return; const title=(t.title||'').trim(), rows=kqTestRows(t), ok=rows.filter(x=>x.okInfo);
  if(!rows.length){ toast('Bài này chưa có điểm học sinh nào','err'); return; }

  const nf=ok.filter(x=>x.detail&&arr(x.r.res.can_giao_vien_xem_lai).length).length;
  if(!confirm('Công khai điểm '+ok.length+' học sinh của bài “'+title+'” để học sinh tra cứu?'+(nf?'\n⚠ '+nf+' bài chấm AI còn mục “cần giáo viên xem lại”.':'')+'\nHãy chắc chắn điểm và nhận xét đã đúng.')) return;

      up['pubres/'+tok]=pub; up['pubexam/'+code+'/idx/'+key]=tok; if(old&&old!==tok) up['pubres/'+old]=null;

  modal('Sửa nhận xét — '+esc(x.st.name),b,'<button class="btn" onclick="kqTestOpen(\''+tid+'\')">Huỷ</button><button class="btn pri" onclick="kqSaveNx(\''+tid+'\',\''+sid+'\')">Lưu'+(t.pubCode?' &amp; cập nhật link':'')+'</button>',true); }

  try{ if(x.detail){ const R=x.r.res; R.nhan_xet_chung=g('nxT'); R.diem_manh=lines(g('nxM')); R.can_cai_thien=lines(g('nxC')); { const c0={nx:R.nhan_xet_chung,manh:R.diem_manh,cai:R.can_cai_thien,src:'gv'}; await C('tests').doc(tid).update({['comments.'+sid]:c0}); t3=Object.assign({},t,{comments:Object.assign({},t.comments||{},{[sid]:c0})}); } arr(R.cau).forEach((c,ci)=>arr(c.y).forEach((y,yi)=>{ y.da_dat=g('nxO'+ci+'_'+yi); y.mat_diem=g('nxL'+ci+'_'+yi); })); await IDB.set('results',G.results); }
    else { const cm={nx:g('nxT'),manh:lines(g('nxM')),cai:lines(g('nxC'))}, empty=!cm.nx&&!cm.manh.length&&!cm.cai.length; await C('tests').doc(tid).update({['comments.'+sid]:empty?FV.delete():cm}); t3=Object.assign({},t,{comments:Object.assign({},t.comments||{},{[sid]:empty?undefined:cm})}); }

<script>
/* ===================== ĐỒNG BỘ CHẤM BÀI AI CHO MỌI TRỢ GIẢNG (Firebase) ===================== */
(function(){
'use strict';
const KS=window.KS={exams:{},objs:{},sig:{},pgSig:{},pages:{},ready:false,inited:false,exUpd:0,exSig:'',fSig:'',filesLoaded:true,stat:'',msg:''};
const ref=p=>rdb.ref(p);
const arr=x=>Array.isArray(x)?x:(x&&typeof x==='object'?Object.values(x):[]);
const J=o=>JSON.parse(JSON.stringify(o===undefined?null:o));
const who=()=>((typeof S!=='undefined'&&S.profile&&S.profile.name)||'');
function canon(x){ if(x===undefined||x===null||x==='') return undefined;
  if(Array.isArray(x)){ const a=x.map(canon).filter(v=>v!==undefined); return a.length?a:undefined; }
  if(typeof x==='object'){ const o={}; Object.keys(x).sort().forEach(k=>{ const v=canon(x[k]); if(v!==undefined) o[k]=v; }); return Object.keys(o).length?o:undefined; }
  return x; }
const sg=o=>{ const s=JSON.stringify(canon(o))||''; let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return s.length+':'+h; };
const fsig=l=>arr(l).map(x=>((x&&x.data)||'').length+':'+((x&&x.data)||'').slice(-24)+':'+((x&&x.name)||'')).join('|');
const EXD=()=>({title:'',maxScore:20,note:'',date:'',classId:'',de:[],barem:[],rubric:null,rubrics:null,rubIdx:0,rubricOk:false});

/* ---------- trạng thái ---------- */
const statH=()=>'<span id="ksStat" class="pill '+(KS.stat==='err'?'pill-red':KS.stat==='sav'||!KS.ready?'pill-amber':'pill-grn')+'">'+(KS.stat==='err'?'Lỗi đồng bộ: '+esc(KS.msg):KS.stat==='sav'?'Đang đồng bộ…':!KS.ready?'Đang kết nối…':'Đã đồng bộ cho mọi trợ giảng')+'</span>';
function stat(k,m){ KS.stat=k; KS.msg=m||''; const e=document.getElementById('ksStat'); if(e) e.outerHTML=statH(); }
const onErr=e=>{ stat('err',(e&&e.code==='PERMISSION_DENIED')||/permission/i.test(e&&e.message||'')?'chưa cập nhật Rules Firebase (xem Cài đặt → Thiết lập Firebase)':(e&&e.message)||String(e)); };

/* ---------- vẽ lại an toàn ---------- */
let pend=false;
function soft(){ if(typeof S==='undefined'||S.view!=='grade') return; const a=document.activeElement; if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.closest('#main')){ pend=true; return; } render(); }
document.addEventListener('focusout',()=>{ if(pend){ pend=false; setTimeout(soft,250); } });

/* ---------- chuẩn hoá dữ liệu đọc từ Firebase (mảng rỗng bị Firebase xoá) ---------- */
function normRes(r){ r=r||{}; r.cau=arr(r.cau).map(c=>Object.assign({},c,{y:arr(c.y).map(y=>Object.assign({},y))})); ['diem_manh','can_cai_thien','can_giao_vien_xem_lai'].forEach(k=>{ r[k]=arr(r[k]); }); return r; }
function normTrans(t){ if(!t) return null; t.thong_tin=t.thong_tin||{}; t.bai_lam=arr(t.bai_lam); t.khong_doc_duoc=arr(t.khong_doc_duoc); return t; }
const normRubrics=l=>{ const a=arr(l).map(normRubric).filter(Boolean); return a.length?a:null; };
function normRubric(b){ if(!b) return null; b.cau=arr(b.cau).map(c=>Object.assign({},c,{y:arr(c.y).map(y=>Object.assign({},y))})); return b; }
const metaOf=e=>({title:e.title||'',maxScore:+e.maxScore||20,note:e.note||'',date:e.date||'',classId:e.classId||'',rubrics:(Array.isArray(e.rubrics)&&e.rubrics.length)?e.rubrics:(e.rubric?[e.rubric]:null),rubricOk:!!e.rubricOk,code:e.code||null,maList:e.maList||''});
const hasContent=e=>!!(e.title||arr(e.de).length||arr(e.barem).length||e.rubric||e.note);

/* ---------- đề + barem ---------- */
const _set=IDB.set.bind(IDB);
let exTimer=null;
KS.pushExam=()=>{ clearTimeout(exTimer); exTimer=setTimeout(doPushExam,600); };
async function doPushExam(){ const e=G.exam; if(!e||!KS.ready) return; if(!e.id) e.id=uid(); try{ localStorage.setItem('geoai_examid',e.id); }catch(x){}
  if(!hasContent(e)&&!KS.exams[e.id]) return;
  const meta=metaOf(e), ms=sg(meta), fs=fsig(e.de)+'#'+fsig(e.barem), up={};
  if(ms!==KS.exSig){ const upd=Date.now(); up['gexams/'+e.id]=J(Object.assign({},meta,{upd,by:who()})); KS.exUpd=upd; }
  let files=null;
  if(KS.filesLoaded&&fs!==KS.fSig){ files=J({de:arr(e.de),barem:arr(e.barem),n:arr(e.de).length+arr(e.barem).length}); if(JSON.stringify(files).length>9e6){ stat('err','đề/barem quá nặng (>9MB) — hãy dùng ảnh nhỏ hơn'); return; } up['gexfiles/'+e.id]=files; }
  if(!Object.keys(up).length) return; stat('sav');
  try{ await rdb.ref().update(up); KS.exSig=ms; if(files) KS.fSig=fs; stat('ok'); }catch(x){ onErr(x); } }
let fRef=null;
function watchFiles(id){ if(fRef){ try{ fRef.off(); }catch(e){} fRef=null; } if(!id) return; fRef=ref('gexfiles/'+id);
  fRef.on('value',s=>{ KS.filesLoaded=true; if(!s.exists()) return; const v=s.val(), de=arr(v.de), ba=arr(v.barem), fs=fsig(de)+'#'+fsig(ba); if(fs!==KS.fSig&&G.exam.id===id){ G.exam.de=de; G.exam.barem=ba; KS.fSig=fs; _set('exam',G.exam).catch(()=>{}); soft(); } },onErr); }
function applyMeta(m){ const e=G.exam; e.title=m.title||''; e.maxScore=+m.maxScore||20; e.note=m.note||''; e.date=m.date||''; e.classId=m.classId||''; e.rubrics=normRubrics(m.rubrics||(m.rubric?[m.rubric]:null)); e.rubIdx=0; e.rubric=null; gRubSync(); e.rubricOk=!!m.rubricOk; if(m.code) e.code=m.code; else delete e.code; e.maList=m.maList||''; KS.exSig=sg(metaOf(e)); KS.exUpd=m.upd||0; }
async function pickExam(id,quiet){ const m=KS.exams[id]; if(!m) return; Object.assign(G.exam,EXD()); G.exam.id=id; applyMeta(m); KS.fSig=''; KS.filesLoaded=false; try{ localStorage.setItem('geoai_examid',id); }catch(e){} watchFiles(id); _set('exam',G.exam).catch(()=>{}); if(!quiet){ gNew(); } }
function newExam(){ Object.assign(G.exam,EXD()); delete G.exam.code; G.exam.id=uid(); KS.exSig=''; KS.fSig=''; KS.exUpd=0; KS.filesLoaded=true; watchFiles(''); try{ localStorage.setItem('geoai_examid',G.exam.id); }catch(e){} _set('exam',G.exam).catch(()=>{}); gNew(); }
async function delExam(){ const id=G.exam.id; if(!id||!KS.exams[id]){ newExam(); return; } if(!confirm('Xoá đề “'+(G.exam.title||'chưa đặt tên')+'” (cả barem và file đề) khỏi hệ thống cho mọi trợ giảng?\nCác bài đã chấm của đề này vẫn được giữ.')) return;
  try{ await rdb.ref().update({['gexams/'+id]:null,['gexfiles/'+id]:null}); toast('Đã xoá đề','ok'); newExam(); }catch(e){ onErr(e); toast('Lỗi: '+e.message,'err'); } }

/* ---------- bài đã chấm ---------- */
const content=b=>({title:b.title,classId:b.classId,sid:b.sid,name:b.name,res:b.res,trans:b.trans,real:b.real,examId:b.examId,np:b.np,pub:b.pub});
function bodyOf(r){ const o=KS.objs[r.id]||{}, pgs=arr(r.pages);
  return {id:r.id,ts:r.ts||Date.now(),title:r.title||'',classId:r.classId||'',sid:r.sid||'',name:r.name||'',res:r.res,trans:r.trans||null,real:(r.real==null?'':String(r.real)),
    examId:r.examId||o.examId||((r.title||'')===(G.exam.title||'')?(G.exam.id||''):''),np:pgs.length||o.np||0,pub:r.pub!==undefined?r.pub:(o.pub||null)}; }
function toRes(id,v){ return {id,ts:v.ts||0,title:v.title||'',classId:v.classId||'',sid:v.sid||'',name:v.name||'',res:normRes(v.res),trans:normTrans(v.trans),real:v.real!=null?v.real:'',examId:v.examId||'',np:v.np||0,pub:v.pub||null,by:v.by||'',pages:KS.pages[id]}; }
function rebuild(){ const list=Object.values(KS.objs); G.results.forEach(r=>{ if(!KS.objs[r.id]) list.push(r); }); list.sort((a,b)=>(b.ts||0)-(a.ts||0)); G.results=list; }
function onRes(s){ const v=s.val()||{}, seen={}; Object.keys(v).forEach(id=>{ if(!v[id]||!v[id].res) return; const o=toRes(id,v[id]); KS.objs[id]=o; seen[id]=1; KS.sig[id]=sg(content(bodyOf(o))); });
  Object.keys(KS.objs).forEach(id=>{ if(!seen[id]) delete KS.objs[id]; }); rebuild(); soft(); }
function shrink(it){ return new Promise(ok=>{ if(!it||it.t!=='img'||(it.data||'').length<350000) return ok(it); const im=new Image(); im.onload=()=>{ try{ const k=Math.min(1,1500/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); ok({t:'img',name:it.name||'',data:c.toDataURL('image/jpeg',.72).split(',')[1]}); }catch(e){ ok(it); } }; im.onerror=()=>ok(it); im.src='data:image/jpeg;base64,'+it.data; }); }
let pushing=Promise.resolve();
KS.pushResults=()=>{ pushing=pushing.then(doPushResults,doPushResults); return pushing; };
async function doPushResults(){ if(!KS.ready) return 0; const todo=[];

      if(pgs.length&&KS.pgSig[r.id]!==ps){ const sm=await Promise.all(pgs.map(shrink)); if(JSON.stringify(sm).length>9e6){ toast('Ảnh bài của '+body.name+' quá nặng, chỉ đồng bộ điểm và nhận xét','err'); body.np=0; } else { await ref('gpages/'+r.id).set(J(sm)); KS.pages[r.id]=sm; body.np=sm.length; } KS.pgSig[r.id]=ps; }
      const s2=sg(content(body)); const out=J(body); out.by=who(); out.upd=Date.now(); await ref('gres/'+r.id).set(out); KS.sig[r.id]=s2; n++; }
    stat('ok'); }catch(e){ onErr(e); toast('Lỗi đồng bộ: '+e.message,'err'); }
  return n; }
KS.del=async id=>{ delete KS.objs[id]; delete KS.pages[id]; delete KS.sig[id]; delete KS.pgSig[id]; try{ await rdb.ref().update({['gres/'+id]:null,['gpages/'+id]:null}); }catch(e){ onErr(e); } };

/* ---------- gắn vào kho lưu cục bộ cũ (IDB) ---------- */
IDB.set=async function(k,v){ if(!(KS.ready&&k==='results')){ try{ await _set(k,v); }catch(e){} } if(!KS.ready) return; if(k==='exam') KS.pushExam(); else if(k==='results') await KS.pushResults(); };

/* ---------- khởi động ---------- */
KS.init=async function(){ if(KS.inited) return; KS.inited=true; stat('sav');
  let r1,r2; const p1=new Promise(o=>r1=o), p2=new Promise(o=>r2=o);
  ref('gexams').on('value',s=>{ KS.exams=s.val()||{}; const cur=G.exam.id&&KS.exams[G.exam.id]; if(KS.ready&&cur&&(cur.upd||0)>KS.exUpd){ applyMeta(cur); _set('exam',G.exam).catch(()=>{}); } soft(); r1(); },e=>{ onErr(e); r1(); });
  ref('gres').orderByChild('ts').limitToLast(200).on('value',s=>{ onRes(s); r2(); },e=>{ onErr(e); r2(); });
  await Promise.race([Promise.all([p1,p2]),new Promise(o=>setTimeout(o,12000))]);
  const e=G.exam; e.de=arr(e.de); e.barem=arr(e.barem);
  let id=e.id||''; try{ if(!id) id=localStorage.getItem('geoai_examid')||''; }catch(x){}

  else if(id&&KS.exams[id]) await pickExam(id,true);
  else { const ids=Object.keys(KS.exams).sort((a,b)=>(KS.exams[b].upd||0)-(KS.exams[a].upd||0)); if(ids.length) await pickExam(ids[0],true); else { e.id=e.id||uid(); KS.filesLoaded=true; } }
  KS.ready=true;
  if(e.id&&!KS.exams[e.id]&&hasContent(e)){ watchFiles(e.id); await doPushExam(); }
  const n=await KS.pushResults(); if(n>0) toast('Đã đồng bộ '+n+' bài chấm từ máy này lên hệ thống','ok');
  if(KS.stat!=='err') _set('results',[]).catch(()=>{});   /* xoá bản lưu cũ trên máy để không hồi sinh bài đã xoá */
  stat(KS.stat==='err'?'err':'ok',KS.msg); render(); };

/* ---------- gắn vào giao diện / hàm cũ ---------- */
const _gl=window.gLoad;
window.gLoad=async function(){ await _gl.apply(this,arguments); try{ await KS.init(); }catch(e){ onErr(e); } };
const _gv=window.gView;
window.gView=async function(id){ const r=G.results.find(x=>x.id===id);
  if(r&&!r.pages&&r.np>0){ toast('Đang tải ảnh bài làm…'); try{ const s=(await ref('gpages/'+id).get()).val(); r.pages=arr(s); KS.pages[id]=r.pages; KS.pgSig[id]=fsig(r.pages); }catch(e){ r.pages=[]; } }

const _gdr=window.gDelRes;
window.gDelRes=async function(id){ const had=G.results.some(x=>x.id===id); await _gdr.apply(this,arguments); if(had&&!G.results.some(x=>x.id===id)) await KS.del(id); };
const _gs2=window.gSave;
window.gSave=async function(){ const rs=await _gs2.apply(this,arguments); try{ const n=G.results.find(x=>x.id===G.savedId); if(n&&!n.examId&&G.exam.id&&(n.title||'')===(G.exam.title||'')){ n.examId=G.exam.id; await IDB.set('results',G.results); } rebuild(); }catch(e){} return rs; };

function ksCard(){ const cur=G.exam, ids=Object.keys(KS.exams).sort((a,b)=>(KS.exams[b].upd||0)-(KS.exams[a].upd||0));
  const opts=((cur.id&&!KS.exams[cur.id])?'<option value="'+esc(cur.id)+'" selected>'+esc(cur.title||'(đề mới — chưa đặt tên)')+'</option>':'')+ids.map(i=>'<option value="'+esc(i)+'" '+(i===cur.id?'selected':'')+'>'+esc((KS.exams[i].title||'(chưa đặt tên)')+(KS.exams[i].date?' · '+fmtD(KS.exams[i].date):'')+(KS.exams[i].by?' — '+KS.exams[i].by:''))+'</option>').join('');
  return '<div class="card mb12"><div class="row between wrap"><div style="max-width:560px"><div class="b">Đề chấm dùng chung '+statH()+'</div><div class="small muted mt8">Đề, barem, bài đã chấm, ảnh bài làm và link học sinh được lưu trên hệ thống — mọi trợ giảng đã duyệt cùng thấy, cùng chấm tiếp, không phụ thuộc máy.</div></div>'+
