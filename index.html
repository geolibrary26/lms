function shrink(cv,w,q){ const c=document.createElement('canvas'); c.width=w; c.height=Math.round(cv.height*w/cv.width); c.getContext('2d').drawImage(cv,0,0,c.width,c.height); return c.toDataURL('image/jpeg',q); }
function times(d){ return { s:new Date(d.date+'T'+(d.start||'00:00')), e:new Date(d.date+'T'+(d.end||'23:59')) }; }
function phase(d){ const t=times(d), n=Date.now(), early=(d.early!=null?d.early:15)*60000; if(n<t.s-early) return 'upcoming'; if(n<t.s) return 'open'; if(n<=t.e) return 'live'; if(n<=t.e.getTime()+30*60000) return 'grace'; return 'ended'; }

const FACE_CDNS=['https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js','https://cdnjs.cloudflare.com/ajax/libs/face-api.js/0.22.2/face-api.min.js','https://unpkg.com/face-api.js@0.22.2/dist/face-api.min.js'];
const FACE_MODEL='https://justadudewhohacks.github.io/face-api.js/models';
let facePromise=null;
function ensureFaceApi(){ if(facePromise) return facePromise; facePromise=(async()=>{
  if(typeof faceapi==='undefined'){ let ok=false; for(const u of FACE_CDNS){ try{ await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=u; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); if(typeof faceapi!=='undefined'){ok=true;break;} }catch(e){} } if(!ok) throw new Error('no faceapi'); }
  await faceapi.nets.ssdMobilenetv1.loadFromUri(FACE_MODEL); await faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL); await faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL); return true;
})().catch(e=>{ facePromise=null; throw e; }); return facePromise; }
const dist = (a,b) => { let s=0; for(let i=0;i<a.length;i++){ const d=a[i]-b[i]; s+=d*d; } return Math.sqrt(s); };

function ensureAtt(m){ if(S.attMonth===m) return; if(attUnsub) attUnsub(); S.attMonth=m; S.att={}; attUnsub=C('attendance').where('date','>=',m+'-01').where('date','<=',m+'-31').onSnapshot(s=>{ S.att=mapDocs(s); softRender(); },e=>console.error(e)); }

async function doSignup(){

function shiftDate(n){ const p=S.P.att, d=new Date(p.date+'T00:00'); d.setDate(d.getDate()+n); p.date=dk(d); render(); }
async function mark(sid,s){
  const p=S.P.att, id=p.classId+'_'+p.date, ref=C('attendance').doc(id), cur=(S.att[id]&&S.att[id].marks&&S.att[id].marks[sid])||null;
  try{
    if(cur&&cur.s===s){ await ref.update({['marks.'+sid]:FV.delete()}); return; }
    await ref.set({classId:p.classId,date:p.date,marks:{[sid]:{s,t:Date.now(),m:(cur&&cur.m==='online')?'online':'manual',by:S.profile.name}}},{merge:true});
  }catch(e){ toast('Lỗi: '+e.message,'err'); }
}
async function markAll(){
  const p=S.P.att, id=p.classId+'_'+p.date, studs=classStudents(p.classId), cur=(S.att[id]&&S.att[id].marks)||{}, mm={};
  studs.forEach(s=>{ if(!cur[s.id]) mm[s.id]={s:'P',t:Date.now(),m:'manual',by:S.profile.name}; });
  if(!Object.keys(mm).length){ toast('Mọi học sinh đã có trạng thái'); return; }
  try{ await C('attendance').doc(id).set({classId:p.classId,date:p.date,marks:mm},{merge:true}); toast('Đã đánh dấu có mặt cho HS chưa điểm danh','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); }
}

async function editSession(id,classId,date){
  const d=id?(S.onl[id]||S.att[id]||{}):{}; let link={};
  if(id){ try{ const l=await C('links').doc(id).get(); link=l.data()||{}; }catch(e){} }
  const c=S.classes[classId]||{}, sch=(c.schedule||[]).find(x=>x.dow===new Date(date+'T00:00').getDay())||{};
  modal(id?'Sửa buổi online':'Tạo buổi học online',
   '<div class="field"><label>Lớp</label><select class="inp" id="ssClass" '+(id?'disabled':'')+'>'+classOpts(classId)+'</select></div><div class="field"><label>Tiêu đề buổi học</label><input class="inp" id="ssTitle" value="'+esc(d.title||('Buổi học '+(c.name||'')))+'"></div>'+
   '<div class="cols2"><div class="field"><label>Ngày</label><input class="inp" id="ssDate" type="date" value="'+date+'" '+(id?'disabled':'')+'></div><div></div><div class="field"><label>Bắt đầu</label><input class="inp" id="ssStart" type="time" value="'+(d.start||sch.start||'18:00')+'"></div><div class="field"><label>Kết thúc</label><input class="inp" id="ssEnd" type="time" value="'+(d.end||sch.end||'19:30')+'"></div></div>'+
   '<div class="field"><label>Link phòng học (Google Meet / Zoom / Teams…)</label><input class="inp" id="ssUrl" placeholder="https://meet.google.com/…" value="'+esc(link.url||c.onlineUrl||'')+'"></div>'+
   '<div class="cols2"><div class="field"><label>Mở điểm danh trước (phút)</label><input class="inp" id="ssEarly" type="number" value="'+(d.early!=null?d.early:(S.settings.early!=null?S.settings.early:15))+'"></div><div class="field"><label>Tính muộn sau (phút)</label><input class="inp" id="ssLate" type="number" value="'+(d.late!=null?d.late:(S.settings.late!=null?S.settings.late:10))+'"></div></div>'+
   '<div class="small muted">Học sinh vào bằng link, chọn tên, nhập ngày sinh + trường, chụp mặt. Hệ thống tự điểm danh.</div>',
   (id?'<button class="btn red" onclick="delSession(\''+id+'\')">Huỷ buổi online</button>':'')+'<button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" onclick="saveSession(\''+id+'\')">Lưu</button>');
}
async function saveSession(oldId){
  const cid=val('ssClass')||($('#ssClass')&&$('#ssClass').value), date=val('ssDate'), url=val('ssUrl');
  if(!cid||!date){ toast('Thiếu lớp hoặc ngày','err'); return; }
  if(url && !/^https?:\/\//i.test(url)){ toast('Link phải bắt đầu bằng http(s)://','err'); return; }
  const id=cid+'_'+date, th=S.settings.faceThreshold!=null?+S.settings.faceThreshold:0.5;
  try{
    await C('attendance').doc(id).set({classId:cid,date,online:true,title:val('ssTitle'),start:val('ssStart'),end:val('ssEnd'),early:+val('ssEarly')||0,late:+val('ssLate')||0,thr:th,createdBy:S.profile.name},{merge:true});
    await C('links').doc(id).set({url,platform:url?new URL(url).hostname.replace(/^www\./,''):''});
    closeModal(); toast('Đã lưu buổi online','ok'); if(S.view==='att'){ S.P.att.classId=cid; S.P.att.date=date; render(); }
  }catch(e){ toast('Lỗi: '+e.message,'err'); }
}
async function delSession(id){ if(!confirm('Huỷ buổi online này? (Dữ liệu điểm danh của buổi sẽ bị xoá)')) return; try{ await C('attendance').doc(id).delete(); await C('links').doc(id).delete(); closeModal(); toast('Đã huỷ','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); } }

/* ===================== CHUYÊN CẦN THÁNG ===================== */
function vRep(){
  const cls=activeClasses(); if(!cls.length) return '<h2 class="pt">Chuyên cần tháng</h2><div class="mt16">'+noClass()+'</div>';
  const p=S.P.rep; if(!p.classId||!S.classes[p.classId]) p.classId=cls[0].id; if(!p.month) p.month=mk(new Date()); ensureAtt(p.month);
  const docs=Object.values(S.att).filter(d=>d.classId===p.classId&&d.date.startsWith(p.month)).sort((a,b)=>a.date.localeCompare(b.date)), studs=classStudents(p.classId);
  const sym={P:''+ic('check')+'',L:'M',E:'P',A:'V'};
  const rows=studs.map((s,i)=>{ const c={P:0,L:0,E:0,A:0}; const cells=docs.map(d=>{ const m=(d.marks||{})[s.id]; if(m&&c[m.s]!=null) c[m.s]++; return '<td class="center"><span class="cell '+(m?'c-'+m.s:'c-N')+'">'+(m?sym[m.s]:'·')+'</span></td>'; }).join(''); const t=c.P+c.L+c.E+c.A, r=t?Math.round((c.P+c.L)/t*100):null;
    return '<tr><td>'+(i+1)+'</td><td class="nowrap"><b>'+esc(s.name)+'</b></td>'+cells+'<td class="center">'+c.P+'</td><td class="center">'+c.L+'</td><td class="center">'+c.E+'</td><td class="center">'+c.A+'</td><td style="min-width:110px">'+(r==null?'—':'<b style="color:'+(r<80?'var(--red)':'var(--grn)')+'">'+r+'%</b><div class="bar"><div style="width:'+r+'%;background:'+(r<80?'var(--red)':'var(--grn)')+'"></div></div>')+'</td></tr>'; }).join('');
  return '<div class="row between wrap"><h2 class="pt">Chuyên cần tháng</h2><button class="btn" onclick="exportRep()">'+ic('download')+' Xuất Excel</button></div><div class="toolbar"><select class="inp" onchange="setP(\'rep\',\'classId\',this.value)">'+classOpts(p.classId)+'</select><input class="inp" type="month" value="'+p.month+'" onchange="setP(\'rep\',\'month\',this.value)"><span class="small muted">'+docs.length+' buổi học trong tháng</span></div>'+
  '<div class="row wrap small mb12"><span class="cell c-P">'+ic('check')+'</span>Có mặt <span class="cell c-L">M</span>Muộn <span class="cell c-E">P</span>Phép <span class="cell c-A">V</span>Vắng <span class="cell c-N">·</span>Chưa ghi · Chuyên cần = (có mặt + muộn) / số buổi đã ghi</div>'+
  (docs.length&&studs.length?'<div class="card" style="padding:0"><div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Học sinh</th>'+docs.map(d=>'<th class="center" style="cursor:pointer" title="Mở buổi" onclick="go(\'att\',{classId:\''+d.classId+'\',date:\''+d.date+'\'})">'+d.date.slice(8)+'/'+d.date.slice(5,7)+(d.online?' '+ic('video')+'':'')+'</th>').join('')+'<th class="center">CM</th><th class="center">M</th><th class="center">P</th><th class="center">V</th><th>Chuyên cần</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>':'<div class="card empty">Chưa có dữ liệu điểm danh trong tháng này.</div>');
}
function exportRep(){
  const p=S.P.rep, docs=Object.values(S.att).filter(d=>d.classId===p.classId&&d.date.startsWith(p.month)).sort((a,b)=>a.date.localeCompare(b.date)), studs=classStudents(p.classId), sym={P:'x',L:'M',E:'P',A:'V'};
  const rows=[['Họ tên'].concat(docs.map(d=>fmtD(d.date)),['Có mặt','Muộn','Phép','Vắng','Chuyên cần %'])];
  studs.forEach(s=>{ const c={P:0,L:0,E:0,A:0}; const cells=docs.map(d=>{ const m=(d.marks||{})[s.id]; if(m&&c[m.s]!=null) c[m.s]++; return m?sym[m.s]:''; }); const t=c.P+c.L+c.E+c.A; rows.push([s.name].concat(cells,[c.P,c.L,c.E,c.A,t?Math.round((c.P+c.L)/t*100):''])); });
  exportXlsx('ChuyenCan_'+className(p.classId)+'_'+p.month,rows);
}

/* ===================== CÀI ĐẶT ===================== */
const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{d}/documents {
    function staff(){ return request.auth != null &&
      get(/databases/$(d)/documents/users/$(request.auth.uid)).data.status == 'active'; }
    match /users/{u} {
      allow read: if request.auth != null && (request.auth.uid == u || staff());
      allow create: if request.auth != null && request.auth.uid == u &&
        (request.resource.data.status == 'pending' || !exists(/databases/$(d)/documents/settings/main));
      allow update, delete: if staff();
    }
    match /settings/{id} {
      allow read: if request.auth != null;
      allow create: if request.auth != null && id == 'main';
      allow update, delete: if staff();
    }
    // Phần học sinh truy cập không cần đăng nhập (trang vào lớp online)
    match /classes/{id}    { allow read: if true; allow write: if staff(); }
    match /links/{id}      { allow read: if true; allow write: if staff(); }
    match /roster/{id} {
      allow read: if true; allow write: if staff();
      allow update: if request.resource.data.diff(resource.data).affectedKeys().hasOnly(['face','faceAt'])
                    && !('face' in resource.data);
    }
    match /attendance/{id} {
      allow read: if true; allow write: if staff();
      allow update: if request.resource.data.diff(resource.data).affectedKeys().hasOnly(['marks']);
    }
    match /proofs/{id}     { allow create: if true; allow read, write: if staff(); }
    // Mọi dữ liệu khác (students, tests, fees...) chỉ nhân sự được duyệt
    match /{c}/{id}        { allow read, write: if staff(); }
  }
}`;

}

const J = { id:null, doc:null, cls:null, roster:[], sid:null, step:1, stream:null, tries:0, lock:0, link:null, busy:false, msg:'', msgKind:'' };

async function bootJoin(){

    const d=await C('attendance').doc(J.id).get(); if(!d.exists||!d.data().online) return jErr('Không tìm thấy lớp online');

function jHead(){ const d=J.doc, ph=phase(d); return '<div class="logo">'+brandMark()+'</div><h1>'+esc(d.title||'Lớp học online')+'</h1><div class="sub">'+esc(J.cls.name||'')+' · '+fmtD(d.date)+' · '+d.start+'–'+d.end+'<br><span class="pill '+PH[ph][1]+'" style="margin-top:8px">'+PH[ph][0]+'</span></div>'; }

  if(soft && document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName)) return;
  const d=J.doc, ph=phase(d); if(J.step===1||J.step===2) { /* check phase */ }
  if(J.step===3) return;
  if(ph==='upcoming'){ const t=new Date(times(d).s.getTime()-(d.early!=null?d.early:15)*60000); jShell(jHead()+'<div class="err" style="background:var(--ambs);color:#92400e">Chưa đến giờ. Điểm danh mở lúc <b>'+fmtHM(t)+'</b>.</div>'); return; }
  if(ph==='ended'){ jShell(jHead()+'<div class="err">Buổi học đã kết thúc.</div>'); return; }
  if(J.step===1){
    jShell(jHead()+'<div id="jmsg"></div><div class="field"><label>Họ và tên của em</label><select class="inp" id="jName"><option value="">— Chọn tên —</option>'+J.roster.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div><div class="field"><label>Ngày sinh</label><input class="inp" id="jDob" type="date"></div><div class="field"><label>Trường đang học</label><input class="inp" id="jSchool" placeholder="VD: THCS Nguyễn Tất Thành"></div><button class="btn pri full" onclick="jVerifyInfo()">Tiếp tục</button><div class="small muted center mt12">Bước tiếp theo: chụp khuôn mặt để điểm danh.</div>'); return;
  }
  if(J.step===2){
    jShell(jHead()+'<div class="b mb12 center">Xin chào '+esc((J.roster.find(x=>x.id===J.sid)||{}).name)+'</div><div class="cam" id="jCam"><video id="jv" autoplay playsinline muted></video><div class="oval"></div></div><div id="jmsg" class="mt12">'+(J.msg?'<div class="'+(J.msgKind||'err')+'">'+J.msg+'</div>':'')+'</div><button class="btn pri full mt8" id="jShot" onclick="jCapture()" disabled>'+ic('camera')+' Chụp & điểm danh</button><button class="btn full mt8" onclick="J.step=1;jStop();renderJoin()">'+ic('arrowL')+' Quay lại</button>');
    jStartCam(); return;
  }
}
function jStop(){ if(J.stream){ J.stream.getTracks().forEach(t=>t.stop()); J.stream=null; } }
async function jStartCam(){
  try{ jStop(); J.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false}); const v=$('#jv'); if(!v) return; v.srcObject=J.stream; v.play().catch(()=>{}); const b=$('#jShot'); if(b) b.disabled=false; ensureFaceApi().catch(()=>{}); }
  catch(e){ const m=$('#jmsg'); if(m) m.innerHTML='<div class="err">Không mở được camera. Hãy cho phép quyền camera (trang cần chạy trên https).</div>'; }
}
function jFail(t){ J.tries++; if(J.tries>=6){ J.lock=Date.now()+60000; J.tries=0; } return t; }
async function jVerifyInfo(){
  const m=$('#jmsg'), say=t=>{ m.innerHTML='<div class="err">'+t+'</div>'; };
  if(Date.now()<J.lock){ say('Nhập sai quá nhiều lần, chờ '+Math.ceil((J.lock-Date.now())/1000)+' giây.'); return; }
  const sid=$('#jName').value, dob=$('#jDob').value, school=$('#jSchool').value.trim();
  if(!sid||!dob||!school){ say('Vui lòng chọn tên, nhập ngày sinh và trường.'); return; }
  const st=J.roster.find(x=>x.id===sid); if(!st.vhash){ say('Học sinh này chưa có thông tin ngày sinh/trường trong hệ thống. Hãy báo trợ giảng.'); return; }
  const h=await vhash(sid,dob,school); if(h!==st.vhash){ say(jFail('Thông tin chưa đúng. Kiểm tra lại ngày sinh và trường.')); return; }
  J.sid=sid; J.step=2; J.msg=''; J.tries=0; renderJoin();
}
async function jCapture(){
  const v=$('#jv'); if(!v||!v.videoWidth){ toast('Camera chưa sẵn sàng','err'); return; }
  if(Date.now()<J.lock){ $('#jmsg').innerHTML='<div class="err">Thử quá nhiều lần, chờ '+Math.ceil((J.lock-Date.now())/1000)+' giây.</div>'; return; }
  if(J.busy) return; J.busy=true; const btn=$('#jShot'); btn.disabled=true; const say=(t,k)=>{ $('#jmsg').innerHTML='<div class="'+(k||'err')+'">'+t+'</div>'; };
  const cv=document.createElement('canvas'); cv.width=v.videoWidth; cv.height=v.videoHeight; cv.getContext('2d').drawImage(v,0,0); const image=shrink(cv,320,0.7);
  say('Đang phân tích khuôn mặt…','ok'); let flag='', dmin=null;
  try{
    let dets; try{ await ensureFaceApi(); dets=await faceapi.detectAllFaces(cv,new faceapi.SsdMobilenetv1Options({minConfidence:0.5})).withFaceLandmarks().withFaceDescriptors(); }catch(e){ dets=null; flag='model_unavailable'; }
    if(dets){
      if(!dets.length){ say('Không thấy khuôn mặt. Hãy nhìn thẳng vào camera.'); btn.disabled=false; J.busy=false; return; }
      if(dets.length>1){ say('Có nhiều hơn 1 khuôn mặt trong ảnh.'); btn.disabled=false; J.busy=false; return; }
      const q=Array.from(dets[0].descriptor), st=J.roster.find(x=>x.id===J.sid), enrolled=st.face?Object.values(st.face):[];
      if(!enrolled.length){ await C('roster').doc(J.sid).set({face:{d0:q},faceAt:Date.now()},{merge:true}); flag='enrolled'; }
      else { dmin=Math.min.apply(null,enrolled.map(e=>dist(q,e))); const thr=J.doc.thr!=null?+J.doc.thr:0.5;
        if(dmin>=thr){ jFail(); const left=6-J.tries; say(J.lock>Date.now()?'Khuôn mặt chưa khớp. Chờ 60 giây rồi thử lại.':'Khuôn mặt chưa khớp. Thử lại ('+left+' lần còn lại).'); btn.disabled=false; J.busy=false; return; } }
    }
    // ghi điểm danh
    const ref=C('attendance').doc(J.id), cur=await ref.get(), old=((cur.data()||{}).marks||{})[J.sid], ts=Date.now(), late=ts>times(J.doc).s.getTime()+(J.doc.late!=null?J.doc.late:10)*60000;
    if(!(old&&(old.s==='P'||old.s==='L'))){ const mark={s:late?'L':'P',t:ts,m:'online'}; if(flag) mark.f=flag; await ref.update({['marks.'+J.sid]:mark}); }
    try{ await C('proofs').doc(J.id+'_'+J.sid).set({docId:J.id,sid:J.sid,img:image,ts,flag:flag||null,dist:dmin}); }catch(e){}
    let link=null; try{ link=(await C('links').doc(J.id).get()).data(); }catch(e){}
    jStop(); J.step=3; const st=J.roster.find(x=>x.id===J.sid);
    jShell('<div class="center"><div class="tick">'+ic('check')+'</div><h1>Điểm danh thành công</h1><div class="sub">'+esc(st.name)+' · '+fmtHM(ts)+(late?' (muộn)':'')+(flag==='enrolled'?'<br>Đã đăng ký khuôn mặt cho lần sau.':'')+'</div>'+(link&&link.url?'<a class="btn pri full" target="_blank" rel="noopener" href="'+esc(link.url)+'" style="text-decoration:none">'+ic('video')+' Vào phòng học</a>':'<div class="err" style="background:var(--ambs);color:#92400e">Giảng viên chưa cập nhật link phòng học.</div>')+'</div>');
  }catch(e){ say('Lỗi: '+esc(e.message||e)); btn.disabled=false; }
  J.busy=false;
}

 ],\n      \"$i\": {\n        \".write\": \"root.child('users').child(auth.uid).child('status').val()=='active' && !data.exists()\"\n      }\n    }\n  }\n}";

async function bootStaff(u){
  await loadBrand(); const em=(u.email||'').toLowerCase(); let p=null;

      let su=false; const cu=(await rdb.ref('config/superUid').get()).val();
      if(!cu&&(!SUPER_EMAIL||em===SUPER_EMAIL.toLowerCase())){ await rdb.ref('config/superUid').set(u.uid); su=true; }
      let inv=null; if(!su&&INV){ inv=(await C('invites').doc(INV).get()).data(); if(inv&&(!inv.active||inv.exp<Date.now())) inv=null; }
      if(!su&&!inv) return gate(''+ic('lock')+'','Cần link mời','Tài khoản <b>'+esc(em)+'</b> chưa được mời. Hãy xin superadmin link mời rồi mở lại link đó.');
      p={name:u.displayName||em,email:em,photo:u.photoURL||'',role:su?'superadmin':(inv.role||'Trợ giảng'),status:su?'active':'pending',createdAt:Date.now()}; if(!su) p.invite=INV;
      await C('users').doc(u.uid).set(p);

  }
  S.profile=Object.assign({id:u.uid,owner:p.role==='superadmin'},p);
  if(p.status!=='active') return gate(p.status==='pending'?''+ic('hourglass')+'':''+ic('userX')+'',p.status==='pending'?'Chờ superadmin duyệt':'Tài khoản bị khoá',p.status==='pending'?'Yêu cầu của <b>'+esc(em)+'</b> đã được gửi. Bạn sẽ vào được sau khi được duyệt.':'Liên hệ superadmin.','<button class="btn pri full" onclick="location.reload()">Tải lại</button>');
  startData(); showShell();
}

function jSearch(v){ const q=norm(v),b=$('#jRes'); if(!q){ b.innerHTML=''; return; }
  const r=J.roster.filter(s=>norm(s.name).includes(q)).slice(0,6);
  b.innerHTML=r.length?'<div class="jr">'+r.map(s=>'<button class="jri" onclick="J.pick=\''+s.id+'\';renderJoin()"><span class="avatar">'+esc(givenName(s.name).charAt(0))+'</span><b>'+esc(s.name)+'</b>'+ic('arrowR')+'</button>').join('')+'</div>':'<div class="empty small">Không tìm thấy tên này. Kiểm tra lại chính tả hoặc báo trợ giảng.</div>'; }
async function jVerifyInfo(){ const m=$('#jmsg'),say=t=>{ m.innerHTML='<div class="err">'+t+'</div>'; };
  if(Date.now()<J.lock){ say('Nhập sai quá nhiều lần, chờ '+Math.ceil((J.lock-Date.now())/1000)+' giây.'); return; }
  const sid=J.pick,dd=+val('jD'),mo=+val('jMo'),yy=+val('jY'),school=val('jSchool');
  if(!(dd>=1&&dd<=31&&mo>=1&&mo<=12&&yy>=1980&&yy<=new Date().getFullYear())||!school){ say('Vui lòng nhập đủ ngày, tháng, năm sinh hợp lệ và tên trường.'); return; }
  const st=J.roster.find(x=>x.id===sid); if(!st.vhash){ say('Học sinh này chưa có ngày sinh/trường trong hệ thống. Hãy báo trợ giảng.'); return; }
  if(await vhash(sid,yy+'-'+pad(mo)+'-'+pad(dd),school)!==st.vhash){ say(jFail('Thông tin chưa đúng. Kiểm tra lại ngày sinh và trường.')); return; }
  J.sid=sid; J.step=2; J.msg=''; J.tries=0; renderJoin(); }

</script>
