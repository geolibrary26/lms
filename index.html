/* ---- danh sách ---- */
function dayRow(d){ const ph=phase(d); return '<div class="row between urow wrap"><div><b>'+wdOf(d.date)+', '+fmtD(d.date)+'</b> <span class="small muted">'+d.start+'–'+d.end+' · vào lớp '+joinedN(d)+'/'+sessionStudents(d).length+'</span></div><div class="row"><span class="pill '+PH[ph][1]+'">'+PH[ph][0]+'</span><button class="btn sm" onclick="go(\'att\',{classId:\''+d.classId+'\',date:\''+d.date+'\'})">Điểm danh</button><button class="btn sm" title="Ảnh vào lớp" onclick="viewProofs(\''+d.id+'\')">'+ic('camera',14)+'</button><button class="btn sm" title="Xuất Excel" onclick="exportSession(\''+d.id+'\')">'+ic('download',14)+'</button></div></div>'; }
function serCard(g){ const o=g.f, ph=phase(o), tot=sessionStudents(o).length, n=joinedN(o), pct=tot?Math.round(n/tot*100):0, N=g.days.length;
  return '<div class="card oc ph-'+ph+'"><div class="row between"><span class="pill '+PH[ph][1]+'">'+PH[ph][0]+'</span><span class="small muted">'+(N>1?N+' buổi · '+fmtD(g.days[0].date)+' → '+fmtD(g.days[N-1].date):wdOf(o.date)+', '+fmtD(o.date))+'</span></div>'+
  '<div class="b mt8" style="font-size:16px;letter-spacing:-.01em">'+esc(o.title||'Buổi online')+'</div>'+
  '<div class="small muted mt8 row wrap" style="gap:6px">'+ic('clock',13)+' '+(N>1?(!g.live?'Buổi gần nhất: ':ph==='upcoming'?'Buổi tiếp theo: ':'Buổi hôm nay: ')+wdOf(o.date)+' '+fmtD(o.date)+' · ':'')+o.start+'–'+o.end+' '+(isMerged(o)?'<span class="ctag mg">'+ic('layers',11)+' Gộp</span> ':'')+ctags(o)+'</div>'+
  '<div class="row between mt12 small"><span>Đã vào lớp <b>'+n+'/'+tot+'</b></span><b>'+pct+'%</b></div><div class="bar mt8"><div style="width:'+pct+'%"></div></div>'+
  (N>1?'<details class="mt12"><summary class="small link" style="cursor:pointer">Xem '+N+' buổi trong đợt này</summary><div class="mt8">'+g.days.map(dayRow).join('')+'</div></details>':'')+
  '<div class="row wrap mt12"><button class="btn sm" onclick="copyText(joinLink(\''+o.id+'\'))">'+ic('link',14)+' Link</button><button class="btn sm" onclick="openRoom(\''+o.id+'\')">'+ic('external',14)+' Mở phòng</button><button class="btn sm" onclick="go(\'att\',{classId:\''+o.classId+'\',date:\''+o.date+'\'})">Điểm danh</button><button class="btn sm" onclick="viewProofs(\''+o.id+'\')">'+ic('camera',14)+' Ảnh</button><button class="btn sm" onclick="amOpen(\''+o.classId+'\',\''+o.date+'\')">'+ic('copy',14)+' Thông báo</button><button class="btn sm" onclick="exportSession(\''+o.id+'\')">'+ic('download',14)+' Excel</button><button class="btn sm" onclick="editSeries(\''+g.key+'\')">Sửa</button></div>'+
  (N>1?'<div class="small muted mt8">Chỉ 1 link cho cả '+N+' buổi — học sinh vào lại đúng link cũ mỗi ngày.</div>':'')+'</div>'; }
window.onlList=onlList=function(){ const p=S.P.onl, q=norm(p.q||''), all=Object.values(S.onl); let gs=groups().filter(g=>p.tab==='ended'?!g.live:p.tab==='all'?true:g.live);
  if(q) gs=gs.filter(g=>g.days.some(o=>norm((o.title||'')+' '+sessClassNames(o)).includes(q)));
  gs.sort((a,b)=>{ const x=(a.f.date+a.f.start).localeCompare(b.f.date+b.f.start); return p.tab==='active'?x:-x; });
  return gs.length?'<div class="grid g3">'+gs.map(serCard).join('')+'</div>':'<div class="card empty"><div class="emptyic">'+ic('video',34)+'</div>'+(all.length?'Không có buổi nào phù hợp.':'Chưa có buổi online nào. Bấm “Tạo buổi online” để bắt đầu.')+'</div>'; };
window.vOnline=vOnline=function(){ const p=S.P.onl, all=Object.values(S.onl), td=dk(new Date()), gs=groups(), up=gs.filter(g=>g.live), dn=gs.filter(g=>!g.live), done=all.filter(o=>phase(o)==='ended'); let rate=0,n=0; done.forEach(o=>{ const t=sessionStudents(o).length; if(t){ rate+=joinedN(o)/t; n++; } });
  const stat=(l,v,x,i,c)=>'<div class="card stat"><span class="si '+c+'">'+ic(i,22)+'</span><div><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(x?'<div class="small muted">'+x+'</div>':'')+'</div></div>';
  const tab=(k,l,c)=>'<button class="'+(p.tab===k?'on':'')+'" onclick="setP(\'onl\',\'tab\',\''+k+'\')">'+l+' <span>'+c+'</span></button>';
  return pageHead('Lớp học online','Mỗi đợt học online chỉ có 1 link — học nhiều ngày thì học sinh vào lại đúng link cũ, hệ thống tự mở buổi của ngày hôm đó. Chọn tên, nhập ngày sinh & trường, đưa mặt vào camera để điểm danh.','<button class="btn" onclick="go(\'merge\')">'+ic('layers')+' Gộp lớp</button><button class="btn pri" onclick="newOnline()">'+ic('plus',16)+' Tạo buổi online</button>')+
  '<div class="grid g4 mb16">'+stat('Hôm nay',all.filter(o=>o.date===td).length,'buổi online','calendar','c1')+stat('Đang diễn ra',all.filter(o=>phase(o)==='live').length,'','video','c2')+stat('Buổi gộp lớp',all.filter(isMerged).length,'','layers','c3')+stat('Tỉ lệ vào lớp TB',n?Math.round(rate/n*100)+'%':'—','các buổi đã kết thúc','userCheck','c4')+'</div>'+
  '<div class="toolbar" style="margin-top:0"><div class="seg">'+tab('active','Sắp tới & đang diễn ra',up.length)+tab('ended','Đã kết thúc',dn.length)+tab('all','Tất cả',gs.length)+'</div><span class="grow"></span><div class="jsr" style="min-width:220px;max-width:300px">'+ic('search',16)+'<input class="inp" style="padding:9px 12px 9px 40px;font-size:14px" placeholder="Tìm buổi học…" value="'+esc(p.q||'')+'" oninput="onlSearch(this.value)"></div></div><div id="onlList">'+onlList()+'</div>'; };
/* ---- tạo / sửa: cả đợt trong một cửa sổ ---- */
window.ssRows=ssRows=function(a){ return a.map((d,i)=>'<div class="row" style="gap:6px;margin-bottom:6px"><input class="inp ssD" type="date" data-id="'+(d.id||'')+'" value="'+d.date+'" style="flex:1"><input class="inp ssS" type="time" value="'+d.start+'" style="width:112px"><input class="inp ssE" type="time" value="'+d.end+'" style="width:112px">'+(a.length>1?'<button class="btn sm red" onclick="ssDelRow('+i+')">✕</button>':'')+'</div>').join(''); };
window.ssRead=ssRead=function(){ const D=document.querySelectorAll('.ssD'),S_=document.querySelectorAll('.ssS'),E_=document.querySelectorAll('.ssE'); return Array.from(D).map((x,i)=>({id:x.dataset.id||'',date:x.value,start:S_[i].value,end:E_[i].value})); };
window.ssDelRow=ssDelRow=function(i){ const a=ssRead(), r=a[i]; if(r&&r.id){ const d=S.onl[r.id]; if(d&&Object.keys(d.marks||{}).length&&!confirm('Xoá buổi '+fmtD(r.date)+'? Điểm danh và ảnh của buổi này sẽ bị xoá khi bấm Lưu.')) return; } a.splice(i,1); $('#ssDays').innerHTML=ssRows(a); };
window.editSession=editSession=function(id,classId,date){ const d=id&&(S.onl[id]||S.att[id]); editSeries(d?keyOf(d):'',classId,date); };
window.newOnline=newOnline=function(){ const c=activeClasses(); if(!c.length){ toast('Hãy tạo lớp trước','err'); return; } editSeries('',c[0].id,dk(new Date())); };
window.editSeries=async function(key,classId,date){
  const days=key?grpDays(key):[], f=days[0]||{}; let link={}; if(f.id){ try{ link=(await C('links').doc(f.id).get()).data()||{}; }catch(e){} }
  classId=f.classId||classId; const c=S.classes[classId]||{}, sch=(c.schedule||[]).find(x=>x.dow===new Date(date+'T00:00').getDay())||{};
  const rows=days.length?days.map(d=>({id:d.id,date:d.date,start:d.start,end:d.end})):[{id:'',date,start:sch.start||'18:00',end:sch.end||'19:30'}];
  const sel=f.merged||(sessionFor(classId,date)||{}).merged||[], dt=f.title||(sel.length?'Buổi học gộp '+[classId].concat(sel).map(className).join(' + '):'Buổi học '+(c.name||''));
  modal(key?'Sửa buổi online':'Tạo buổi học online',
   '<div class="field"><label>Lớp chính</label><select class="inp" id="ssClass" onchange="ssMgRefresh()" '+(key?'disabled':'')+'>'+classOpts(classId)+'</select></div>'+
   '<div class="field"><label>'+ic('layers',14)+' Gộp lớp — các lớp cùng học chung link này (tuỳ chọn)</label><div id="mgList" class="mgbox">'+mergeChecks(classId,sel)+'</div></div>'+
   '<div class="field"><label>Tiêu đề buổi học</label><input class="inp" id="ssTitle" value="'+esc(dt)+'"></div>'+
   '<div class="field"><label>Các ngày học — cả đợt dùng chung 1 link (đổi ngày, thêm hoặc bớt ngày được)</label><div id="ssDays">'+ssRows(rows)+'</div><button class="btn sm" onclick="ssAddRow()">+ Thêm ngày</button>'+
   '<details class="mt8"><summary class="small link" style="cursor:pointer">Thêm nhanh nhiều ngày theo lịch tuần</summary><div class="cols2 mt8"><div class="field"><label>Từ ngày</label><input class="inp" id="ssGF" type="date"></div><div class="field"><label>Đến ngày</label><input class="inp" id="ssGT" type="date"></div><div class="field"><label>Bắt đầu</label><input class="inp" id="ssGS" type="time" value="18:00"></div><div class="field"><label>Kết thúc</label><input class="inp" id="ssGE" type="time" value="19:30"></div></div><div class="row wrap" style="gap:10px">'+[1,2,3,4,5,6,0].map(w=>'<label class="chk"><input type="checkbox" class="ssW" value="'+w+'"> '+(w?'T'+(w+1):'CN')+'</label>').join('')+'</div><button class="btn sm mt8" onclick="ssGen()">Thêm các ngày này</button></details></div>'+
   '<div class="field"><label>Link phòng học (Google Meet / Zoom / Teams…)</label><input class="inp" id="ssUrl" placeholder="https://meet.google.com/…" value="'+esc(link.url||c.onlineUrl||'')+'"></div>'+
   '<div class="cols2"><div class="field"><label>Mở điểm danh trước (phút)</label><input class="inp" id="ssEarly" type="number" value="'+(f.early!=null?f.early:(S.settings.early!=null?S.settings.early:15))+'"></div><div class="field"><label>Tính muộn sau (phút)</label><input class="inp" id="ssLate" type="number" value="'+(f.late!=null?f.late:(S.settings.late!=null?S.settings.late:10))+'"></div></div>'+
   '<div class="small muted">Link vào lớp không chứa ngày: dù học nhiều ngày, học sinh chỉ dùng 1 link duy nhất. Mỗi ngày học sinh mở lại link cũ, hệ thống tự mở điểm danh đúng buổi của ngày đó. (Khác với lớp online cố định đặt trong Sửa lớp học.)</div>',
   (key?'<button class="btn red" onclick="delSeries(\''+key+'\')">Huỷ cả đợt</button>':'')+'<button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" id="srSave" onclick="saveSeries(\''+key+'\')">Lưu</button>'); };
window.saveSeries=async function(key){
  const cid=val('ssClass')||($('#ssClass')&&$('#ssClass').value), url=val('ssUrl'), list=Array.from(document.querySelectorAll('.mgc:checked')).map(x=>x.value), rows=ssRead().filter(r=>r.date);
  if(!cid||!rows.length){ toast('Thiếu lớp hoặc ngày','err'); return; }
  if(rows.some(r=>!r.start||!r.end||r.end<=r.start)){ toast('Giờ kết thúc phải sau giờ bắt đầu','err'); return; }
  if(new Set(rows.map(r=>r.date)).size!==rows.length){ toast('Mỗi ngày chỉ có một buổi online của lớp','err'); return; }
  if(url&&!/^https?:\/\//i.test(url)){ toast('Link phải bắt đầu bằng http(s)://','err'); return; }
  const code=key||rnd(), base={title:val('ssTitle'),early:+val('ssEarly')||0,late:+val('ssLate')||0,series:code}, old=key?grpDays(key):[], keep=new Set(rows.map(r=>r.id).filter(Boolean)), b=$('#srSave'); if(b) b.disabled=true;
  try{
    for(const r of rows){ const id=cid+'_'+r.date, ex=S.onl[id]; if(ex&&ex.id!==r.id) throw new Error('Ngày '+fmtD(r.date)+' đã có buổi online khác của lớp này');
      const host=sessionFor(cid,r.date); if(host&&host.id!==id&&(host.merged||[]).includes(cid)) throw new Error('Lớp này đang được gộp vào buổi của lớp '+className(host.classId)+' ngày '+fmtD(r.date)+'. Hãy chọn lớp đó làm lớp chính.'); }
    for(const d of old){ if(keep.has(d.id)) continue;
      await applyMerge(d.classId,d.date,[]); try{ const ps=await C('proofs').where('docId','==',d.id).get(); await Promise.all(ps.docs.map(x=>C('proofs').doc(x.id).delete())); }catch(e){}
      await C('attendance').doc(d.id).delete(); if(d.id!==code) await C('links').doc(d.id).delete(); }
    for(const r of rows){ const id=cid+'_'+r.date, od=r.id&&S.onl[r.id];
      if(od&&r.id!==id){ await ssMove(r.id,cid,r,list,base,url); continue; }
      await applyMerge(cid,r.date,list);
      await C('attendance').doc(id).set(Object.assign({classId:cid,date:r.date,online:true,start:r.start,end:r.end,createdBy:(od&&od.createdBy)||S.profile.name},base),{merge:true}); }
    const plat=ssPlat(url), dmap={}; for(const r of rows){ const id=cid+'_'+r.date; await C('links').doc(id).set({url,platform:plat,series:code}); dmap[r.date]={id,s:r.start,e:r.end}; }
    await C('links').doc(code).set({series:true,url,platform:plat,classId:cid,early:base.early,d:dmap});
    try{ log((key?'sửa':'tạo')+' đợt học online '+className(cid)+' ('+rows.length+' buổi)'); }catch(e){}
    closeModal(); if(!key) copyText(baseUrl()+'?join='+encodeURIComponent(code)); toast(rows.length>1?'Đã lưu đợt online '+rows.length+' buổi — 1 link chung':'Đã lưu buổi online','ok');
    if(S.view==='att'){ S.P.att.classId=cid; S.P.att.date=rows[0].date; render(); }
  }catch(e){ toast(e.message||String(e),'err'); if(b) b.disabled=false; } };
window.delSeries=async function(key){ const days=grpDays(key); if(!days.length) return;
  if(!confirm('Huỷ cả đợt học online'+(days.length>1?' ('+days.length+' buổi)':'')+'? Điểm danh và ảnh của các buổi sẽ bị xoá.')) return;
  try{ for(const d of days){ await applyMerge(d.classId,d.date,[]); try{ const ps=await C('proofs').where('docId','==',d.id).get(); await Promise.all(ps.docs.map(x=>C('proofs').doc(x.id).delete())); }catch(e){}
      await C('attendance').doc(d.id).delete(); await C('links').doc(d.id).delete(); }
    await C('links').doc(key).delete(); closeModal(); toast('Đã huỷ','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); } };
window.delSession=delSession=function(id){ const d=S.onl[id]; return delSeries(d?keyOf(d):id); };
/* ---- trang học sinh vào lớp: link không ngày, tự chọn buổi của hôm nay ---- */
const _jl0=jLegacyLoad;
async function serLoad(lk){ const ds=Object.keys(lk.d||{}).sort(); if(!ds.length) return null;
  const pk=ds.find(k=>phase({date:k,start:lk.d[k].s,end:lk.d[k].e,early:lk.early})!=='ended')||ds[ds.length-1], id=lk.d[pk].id; if(J.id===id&&J.doc) return false;
  const d=await C('attendance').doc(id).get(); if(!d.exists||!d.data().online) return null;
  J.id=id; J.doc=d.data(); J.cids=[J.doc.classId].concat(J.doc.merged||[]); await jLoadRoster(); return true; }
window.jLegacyLoad=jLegacyLoad=async function(){ let lk=null; try{ lk=(await C('links').doc(JOIN).get()).data(); }catch(e){}
  if(!(lk&&lk.d)) return _jl0();
  J.series=JOIN; if(await serLoad(lk)===null) return jErr('Không tìm thấy lớp online'); renderJoin();
  setInterval(async()=>{ if(J.step!==1) return; try{ const l=(await C('links').doc(JOIN).get()).data(); if(l&&l.d&&await serLoad(l)) renderJoin(); else if(J.step===1) renderJoin(true); }catch(e){} },30000); };
})();
</script>

<script>
/* ===================== MÃ LOG-IN: điểm danh không cần camera ===================== */
S.codes={};
(function(){ const i=NAV.findIndex(n=>n[0]==='online'); NAV.splice(i>=0?i+1:NAV.length-1,0,['codes',ic('lock'),'Mã log-in']); })();

/* ---------- phía học sinh ---------- */
function jCodeBox(){
  return '<div class="jcode"><div class="jct">'+ic('lock',16)+' Nhập Mã Log-in</div><div class="small muted mb8">Mã do trợ giảng cung cấp. Hãy liên hệ trợ giảng để lấy Log-in Code.</div><div id="jcmsg"></div><input class="inp" id="jCode" placeholder="NHẬP MÃ LOG-IN" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" onkeydown="if(event.key===\'Enter\')jCodeCheckin()"><button class="btn pri full mt8" id="jCodeBtn" onclick="jCodeCheckin()">'+ic('check',16)+' Xác nhận</button></div>';
}
function jCamFail(e){
  const m=$('#jmsg'); if(!m) return;
  const keep=($('#jCode')||{}).value||'', nm=(e&&e.name)||'';
  const noApi=!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  let t='Không mở được camera. Hãy cho phép quyền camera (trang cần chạy trên https).';
  if(nm==='NotFoundError'||nm==='DevicesNotFoundError'||nm==='OverconstrainedError') t='Không tìm thấy camera trên thiết bị này.';
  else if(nm==='NotReadableError'||nm==='TrackStartError') t='Camera đang được ứng dụng khác sử dụng. Hãy tắt ứng dụng đó rồi thử lại.';
  else if(noApi||window.isSecureContext===false) t='Trình duyệt này không mở được camera (trang cần chạy trên https). Hãy mở link bằng Chrome hoặc Safari.';
  m.innerHTML='<div class="err">'+t+'</div>'+
    '<button class="btn full" id="jRetry" onclick="jRetryCam()">'+ic('refresh',16)+' Xin lại quyền camera</button>'+
    '<div class="jtip mt8">Nếu trình duyệt không hỏi lại: nhấn biểu tượng ổ khoá cạnh thanh địa chỉ → chọn <b>Cho phép Camera</b>, rồi bấm nút trên. Nếu bạn đang truy cập trên Zalo/Facebook, hãy mở bằng Chrome hoặc Safari.</div>'+jCodeBox();
  const c=$('#jCode'); if(c&&keep) c.value=keep;
  const sh=$('#jShot'); if(sh) sh.disabled=true;
  try{ if(navigator.permissions&&navigator.permissions.query&&!J.pq){ navigator.permissions.query({name:'camera'}).then(p=>{ J.pq=p; p.onchange=()=>{ if(p.state==='granted'&&J.step===2&&!J.stream) jStartCam(); }; }).catch(()=>{}); } }catch(x){}
}
async function jRetryCam(){
  const b=$('#jRetry'); if(b){ b.disabled=true; b.innerHTML=ic('refresh',16)+' Đang xin quyền…'; }
  await jStartCam();
  const b2=$('#jRetry'); if(b2){ b2.disabled=false; b2.innerHTML=ic('refresh',16)+' Xin lại quyền camera'; }
}
function jRoomUrl(){ return J.fx?Promise.resolve((J.cl||{}).onlineUrl):C('links').doc(J.id).get().then(d=>(d.data()||{}).url).catch(()=>null); }
async function jCodeCheckin(){
  const inp=$('#jCode'), btn=$('#jCodeBtn'), say=(t,k)=>{ const x=$('#jcmsg'); if(x) x.innerHTML='<div class="'+(k||'err')+'">'+t+'</div>'; };
  if(J.busy||!inp) return;
  if(Date.now()<J.lock){ say('Nhập sai quá nhiều lần, chờ '+Math.ceil((J.lock-Date.now())/1000)+' giây.'); return; }
  const code=(inp.value||'').toUpperCase().replace(/\s+/g,'');
  if(!code){ say('Vui lòng nhập mã log-in.'); return; }
  if(!/^[A-Z0-9_-]{3,32}$/.test(code)){ say(jFail('Mã không đúng. Hãy kiểm tra lại.')); return; }
  J.busy=true; if(btn) btn.disabled=true; say('Đang kiểm tra mã…','ok');
  try{
    const cd=(await C('logincodes').doc(code).get()).data(), st=J.roster.find(x=>x.id===J.sid);
    if(!cd||cd.active===false){ say(jFail('Mã không đúng hoặc đã bị tắt.')); return; }
    if(cd.exp&&cd.exp<Date.now()){ say('Mã này đã hết hạn.'); return; }
    if(cd.max>0&&(cd.used||0)>=cd.max){ say('Mã này đã hết lượt sử dụng.'); return; }
    const cc=((st&&st.classIds)||[]).find(k=>(J.cids||[]).includes(k)&&(cd.classes||{})[k]===true);
    if(!cc){ say('Mã này không dùng cho lớp của em.'); return; }
    const ref=rdb.ref('attendance/'+J.id), cur=(await ref.get()).val(), ts=Date.now(), late=ts>times(J.doc).s.getTime()+(J.doc.late!=null?J.doc.late:10)*60000;
    if(((cur||{}).revoked||{})[J.sid]) return jBlocked();
    const old=((cur||{}).marks||{})[J.sid];
    if(old&&(old.s==='P'||old.s==='L')){ jDone(old.t||ts,old.s==='L',await jRoomUrl()); return; }
    if(J.fx&&!cur){ await ref.child('classId').set(J.cid); await ref.child('date').set(J.date); }
    const mark={s:late?'L':'P',t:ts,m:'online',cd:code,cc:cc}; if(J.fx) mark.rm=J.cid;
    const up={}; up['attendance/'+J.id+'/marks/'+J.sid]=mark; up['logincodes/'+code+'/used']=(cd.used||0)+1;
    try{ await rdb.ref().update(up); }
    catch(e){ say(/permission/i.test((e&&e.message)||'')?'Không điểm danh được: mã có thể vừa hết lượt hoặc hết hạn. Hãy thử lại hoặc báo trợ giảng.':'Lỗi: '+esc(e.message||e)); return; }
    try{ await C('proofs').doc(J.id+'_'+J.sid).set({docId:J.id,sid:J.sid,img:'',ts,flag:'code',cd:code}); }catch(e){}
    jDone(ts,late,await jRoomUrl());
  }catch(e){ say('Lỗi: '+esc(e.message||e)); }
  finally{ J.busy=false; if(btn) btn.disabled=false; }
}

/* ---------- phía quản trị ---------- */
function codeState(c){ if(c.active===false) return ['Đã tắt','pill-gray']; if(c.exp&&c.exp<Date.now()) return ['Hết hạn','pill-red']; if(c.max>0&&(c.used||0)>=c.max) return ['Hết lượt','pill-amber']; return ['Đang hoạt động','pill-grn']; }
const fmtDT=ts=>fmtD(dk(new Date(ts)))+' '+fmtHM(ts);
function vCodes(){

  '<div class="card mt16">'+(cs.length?cs.map(c=>{ const [lb,cl]=codeState(c), n=c.used||0, cls=Object.keys(c.classes||{});
    return '<div class="cdcard"><div class="row between wrap"><div><span class="cdc">'+esc(c.id)+'</span> <span class="pill '+cl+'">'+lb+'</span>'+(c.note?'<div class="small muted mt8">'+esc(c.note)+'</div>':'')+'</div><div class="row wrap"><button class="btn sm" onclick="copyText(\''+esc(c.id)+'\')">'+ic('copy',14)+' Sao chép</button><button class="btn sm" onclick="editCode(\''+esc(c.id)+'\')">'+ic('edit',14)+' Sửa</button><button class="btn sm" onclick="toggleCode(\''+esc(c.id)+'\')">'+(c.active===false?'Bật':'Tắt')+'</button><button class="btn sm red" onclick="delCode(\''+esc(c.id)+'\')">'+ic('trash',14)+'</button></div></div>'+
      '<div class="row wrap small mt8" style="gap:8px">'+cls.map(k=>'<span class="pill pill-blue">'+esc(className(k))+'</span>').join('')+'<span class="muted">'+ic('clock',13)+' '+(c.exp?'Hạn: '+fmtDT(c.exp):'Không thời hạn')+'</span><span class="muted">· Đã dùng <b>'+n+'</b>'+(c.max>0?'/'+c.max:' (không giới hạn lượt)')+'</span>'+(n?'<button class="btn sm" onclick="resetCode(\''+esc(c.id)+'\')">Đặt lại lượt</button>':'')+'</div></div>'; }).join(''):'<div class="empty">Chưa có mã nào. Bấm “Tạo mã mới” để tạo mã cho lớp.</div>')+'</div>'+
  '<div class="small muted mt12">Mỗi lần học sinh điểm danh thành công bằng mã tính là 1 lượt. Điểm danh bằng mã không có ảnh; trợ giảng thấy nhãn “vào bằng mã” ở danh sách điểm danh và có thể Thu hồi như bình thường.</div>';
}
function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r=crypto.getRandomValues(new Uint8Array(8)); return Array.from(r,x=>A[x%A.length]).join(''); }
function editCode(id){
  const c=id?S.codes[id]:null, sel=c?Object.keys(c.classes||{}):[], ex=c&&c.exp?new Date(c.exp):null;
  const exv=ex?dk(ex)+'T'+pad(ex.getHours())+':'+pad(ex.getMinutes()):'';
  const cl=activeClasses();
  modal(c?'Sửa mã log-in':'Tạo mã log-in',
   '<div class="field"><label>Mã log-in</label><div class="row" style="gap:8px"><input class="inp" id="cdCode" value="'+esc(c?c.id:genCode())+'" '+(c?'readonly':'')+' maxlength="20" style="text-transform:uppercase;font-weight:700;letter-spacing:2px">'+(c?'':'<button class="btn" type="button" onclick="document.getElementById(\'cdCode\').value=genCode()">'+ic('refresh',14)+' Ngẫu nhiên</button>')+'</div><div class="small muted mt8">4–20 ký tự chữ/số không dấu. Mã càng dài càng khó đoán.</div></div>'+
   '<div class="field"><label>Ghi chú (không bắt buộc)</label><input class="inp" id="cdNote" value="'+esc(c?c.note||'':'')+'" placeholder="VD: Mã dự phòng khi lỗi camera"></div>'+
   '<div class="field"><label>Dùng cho lớp</label>'+(cl.length?cl.map(k=>'<label class="chk"><input type="checkbox" name="cdCls" value="'+k.id+'" '+(sel.includes(k.id)?'checked':'')+'> '+esc(k.name)+'</label>').join(''):'<div class="muted small">Chưa có lớp nào.</div>')+'</div>'+
   '<div class="cols2"><div class="field"><label>Hết hạn lúc</label><input class="inp" id="cdExp" type="datetime-local" value="'+exv+'"><div class="small muted mt8">Để trống = không thời hạn</div></div><div class="field"><label>Giới hạn số lượt</label><input class="inp" id="cdMax" type="number" min="0" value="'+(c?c.max||0:0)+'"><div class="small muted mt8">0 = không giới hạn</div></div></div>'+
   '<label class="chk"><input type="checkbox" id="cdOn" '+(!c||c.active!==false?'checked':'')+'> Đang bật</label>',
   '<button class="btn" onclick="closeModal()">Huỷ</button><button class="btn pri" onclick="saveCode(\''+(c?esc(c.id):'')+'\')">Lưu</button>');
}
async function saveCode(old){
  const code=old||val('cdCode').toUpperCase().replace(/\s+/g,'');
  if(!/^[A-Z0-9_-]{4,20}$/.test(code)){ toast('Mã gồm 4–20 ký tự chữ/số, không dấu','err'); return; }
  if(!old&&S.codes[code]){ toast('Mã này đã tồn tại','err'); return; }
  const cls=[...document.querySelectorAll('input[name=cdCls]:checked')].map(x=>x.value); if(!cls.length){ toast('Chọn ít nhất 1 lớp','err'); return; }
  const ev=val('cdExp'), exp=ev?new Date(ev).getTime():null; if(ev&&isNaN(exp)){ toast('Hạn dùng không hợp lệ','err'); return; }
  const max=Math.max(0,parseInt(val('cdMax'))||0), b='logincodes/'+code+'/', up={};
  up[b+'note']=val('cdNote')||null; up[b+'classes']=Object.fromEntries(cls.map(k=>[k,true])); up[b+'max']=max; up[b+'active']=$('#cdOn').checked; up[b+'exp']=exp; up[b+'updatedAt']=Date.now();
  if(!old){ up[b+'used']=0; up[b+'createdAt']=Date.now(); up[b+'by']=S.profile.name; }
  try{ await rdb.ref().update(up); closeModal(); toast(old?'Đã cập nhật mã':'Đã tạo mã '+code,'ok'); try{ log((old?'sửa':'tạo')+' mã log-in '+code); }catch(e){} if(!old) copyText(code); }
  catch(e){ toast('Lỗi: '+(/permission/i.test(e.message||'')?'chưa cập nhật Rules (xem mục Cài đặt)':e.message),'err'); }
}
async function toggleCode(id){ const c=S.codes[id]; if(!c) return; try{ await C('logincodes').doc(id).update({active:c.active===false}); }catch(e){ toast('Lỗi: '+e.message,'err'); } }
async function resetCode(id){ if(!confirm('Đặt lại số lượt đã dùng của mã '+id+' về 0?')) return; try{ await C('logincodes').doc(id).update({used:0}); toast('Đã đặt lại lượt','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); } }
async function delCode(id){ if(!confirm('Xoá mã '+id+'? Học sinh sẽ không dùng được mã này nữa.')) return; try{ await C('logincodes').doc(id).delete(); toast('Đã xoá mã','ok'); try{ log('xoá mã log-in '+id); }catch(e){} }catch(e){ toast('Lỗi: '+e.message,'err'); } }
</script>

<script>

    if(!confirm('Dọn '+keys.length+' ảnh cũ hơn '+days+' ngày khỏi web?\nẢnh vẫn nằm trên Google Drive, điểm danh vẫn được giữ.'+(skip?'\n('+skip+' ảnh chưa có bản trên Drive sẽ được giữ lại.)':''))) return;
    for(let i=0;i<keys.length;i+=100){ const up={}; keys.slice(i,i+100).forEach(k=>{ up['proofs/'+k+'/img']=null; up['proofs/'+k+'/cleanedAt']=Date.now(); }); await rdb.ref().update(up); }
    try{ log('dọn '+keys.length+' ảnh điểm danh cũ hơn '+days+' ngày (đã có trên Drive)'); }catch(e){}
    toast('Đã dọn '+keys.length+' ảnh khỏi web','ok'); if(box) proofStats(); }

(function(){ const _vs=vSettings;

    const card='<div class="card"><div class="b mb12">'+ic('camera',16)+' Dọn dung lượng ảnh</div><div class="small muted mb12">Ảnh điểm danh tự động được sao lưu lên Google Drive (khoảng 1 phút sau khi học sinh vào lớp). Mỗi đêm hệ thống tự dọn ảnh cũ hơn 90 ngày khỏi web, bản trên Drive vẫn được giữ. Nút dưới đây để dọn thủ công; ảnh chưa có bản trên Drive sẽ không bị xoá.</div><div class="row wrap" style="gap:8px"><select class="inp" id="pfDays" style="width:auto"><option value="30">Cũ hơn 30 ngày</option><option value="60">Cũ hơn 60 ngày</option><option value="90" selected>Cũ hơn 90 ngày</option><option value="180">Cũ hơn 180 ngày</option></select><button class="btn" onclick="proofStats()">Kiểm tra dung lượng</button><button class="btn red" onclick="proofClean()">'+ic('trash',14)+' Dọn ảnh cũ khỏi web</button></div><div id="pfStat" class="small mt12"></div></div>';

<script>
/* ===================== TẢI ẢNH ĐIỂM DANH VỀ MÁY (ZIP, chia thư mục) ===================== */
const JSZ_URLS=['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js','https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'];
async function ensureZip(){ if(window.JSZip) return; for(const u of JSZ_URLS){ try{ await new Promise((res,rej)=>{ const e=document.createElement('script'); e.src=u; e.onload=res; e.onerror=rej; document.head.appendChild(e); }); if(window.JSZip) return; }catch(x){} } throw new Error('Không tải được thư viện nén ZIP, hãy kiểm tra mạng'); }
const zslug=(t,max)=>{ let r=String(t==null?'':t).replace(/[\\\/:*?"<>|#]+/g,'-').replace(/\s+/g,' ').trim(); return max?r.slice(0,max).trim():r; };
const hm=ts=>fmtHM(ts).replace(':','h');
const csvE=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
const csvT=rows=>'\ufeff'+rows.map(r=>r.map(csvE).join(',')).join('\r\n');
const STL={P:'Có mặt',L:'Muộn',E:'Xin phép',A:'Vắng'}, STN={P:'Có mặt',L:'Muộn',E:'Xin phép',A:'Vắng'};
function dlRangeChange(){ const c=$('#dlCustom'); if(c) c.style.display=val('dlRange')==='custom'?'flex':'none'; }
async function proofDownload(){
  const btn=$('#dlBtn'), box=$('#dlStat'), say=t=>{ if(box) box.innerHTML=t; }, sel=val('dlRange'); let from='',to='',label='toàn bộ dữ liệu';
  if(sel==='custom'){ from=val('dlFrom'); to=val('dlTo'); if(!from||!to||to<from){ toast('Chọn đủ "từ ngày" và "đến ngày" hợp lệ','err'); return; } label=from+' đến '+to; }
  else if(sel!=='all'){ const n=+sel; to=dk(new Date()); from=dk(new Date(Date.now()-(n-1)*864e5)); label=n+' ngày gần nhất'; }
  if(btn) btn.disabled=true;
  try{
    say('Đang tải thư viện nén…'); await ensureZip();
    say('Đang tải dữ liệu ảnh từ hệ thống…');
    let ref=rdb.ref('proofs'); if(from) ref=ref.orderByChild('ts').startAt(new Date(from+'T00:00').getTime()-2*864e5);
    const sn=await ref.get(), items=[]; sn.forEach(c=>{ const v=c.val(); if(v&&v.docId) items.push(v); });
    if(!items.length){ say('<span class="muted">Không có ảnh nào trong khoảng này.</span>'); return; }
    const byDoc={}; items.forEach(v=>{ (byDoc[v.docId]=byDoc[v.docId]||[]).push(v); });
    const ids=Object.keys(byDoc), docs={};
    for(let i=0;i<ids.length;i+=8){ say('Đang đọc thông tin '+Math.min(i+8,ids.length)+'/'+ids.length+' buổi học…'); await Promise.all(ids.slice(i,i+8).map(async id=>{ try{ docs[id]=(await rdb.ref('attendance/'+id).get()).val(); }catch(e){ docs[id]=null; } })); }
    const sess=[];
    ids.forEach(id=>{ const d=docs[id]||null, m=id.match(/(\d{4}-\d{2}-\d{2})$/), date=(d&&d.date)||(m&&m[1])||dk(new Date(byDoc[id][0].ts));
      if(from&&(date<from||date>to)) return;
      const type=d&&d.online?'Lớp online':d?'Lớp cố định':'Khác', cids=d?[d.classId].concat(d.merged||[]).filter(Boolean):[id.split('_')[0]], cn=cids.map(c=>(S.classes[c]&&S.classes[c].name)||c);
      const tm=d&&d.start?d.start.replace(':','h'):'', ttl=d&&d.online&&d.title?zslug(d.title,40):'';
      const folder=zslug([date,tm,cn.join(' + '),ttl].filter(Boolean).join(' · '),90);
      sess.push({id,d,date,type,cn,title:(d&&d.title)||'',folder,path:type+'/'+date.slice(0,7)+'/'+folder,list:byDoc[id].sort((a,b)=>a.ts-b.ts)}); });
    if(!sess.length){ say('<span class="muted">Không có buổi học nào trong khoảng này.</span>'); return; }
    sess.sort((a,b)=>(a.type+a.date+a.folder).localeCompare(b.type+b.date+b.folder));
    // chia phần (mỗi file ZIP tối đa ~1500 ảnh, không cắt đôi một buổi)
    const parts=[]; let cur=[],cnt=0; sess.forEach(x=>{ const n=x.list.filter(v=>v.img).length; if(cur.length&&cnt+n>1500){ parts.push(cur); cur=[]; cnt=0; } cur.push(x); cnt+=n; }); if(cur.length) parts.push(cur);
    const today=dk(new Date()); let total=0, noImg=0;
    for(let pi=0;pi<parts.length;pi++){
      say('Đang nén phần '+(pi+1)+'/'+parts.length+'…'); const zip=new JSZip(), idx=[['Loại buổi','Ngày','Lớp','Tiêu đề','Số ảnh','Số học sinh vào bằng mã (không ảnh)','Thư mục']];
      for(const x of parts[pi]){ const marks=(x.d&&x.d.marks)||{}, used={}, rows=[['STT','Họ tên','Trạng thái','Giờ vào lớp','Hình thức','Tên file ảnh']]; let ni=0,nc=0;
        x.list.forEach((v,i)=>{ const st=S.students[v.sid]||{}, nm=st.name||v.sid, mk_=(marks[v.sid]||{}).s; let fn='';
          if(v.img){ fn=zslug(nm)+' · '+hm(v.ts)+' · '+(STL[mk_]||'chưa rõ'); if(used[fn]) fn+=' ('+zslug(v.sid,5)+')'; used[fn]=1; fn+='.jpg'; zip.file(x.path+'/'+fn,v.img.replace(/^data:image\/\w+;base64,/,''),{base64:true}); ni++; total++; } else { nc++; noImg++; }
          rows.push([i+1,nm,STN[mk_]||'',fmtHM(v.ts),v.img?'Ảnh khuôn mặt':(v.driveId?'Ảnh đã lưu trên Google Drive':'Mã log-in'),fn]); });
        zip.file(x.path+'/Danh sách.csv',csvT(rows)); idx.push([x.type.replace(/^\d-/,''),fmtD(x.date),x.cn.join(' + '),x.title,ni,nc,x.path]); }
      zip.file('Mục lục.csv',csvT(idx));
      zip.file('Đọc me.txt','ẢNH ĐIỂM DANH — '+((S.settings&&S.settings.centerName)||'')+'\r\nKhoảng thời gian: '+(from?fmtD(from)+' → '+fmtD(to):'toàn bộ dữ liệu')+'\r\nXuất lúc: '+fmtD(today)+' '+fmtHM(Date.now())+(parts.length>1?'\r\nPhần '+(pi+1)+'/'+parts.length+' (mỗi buổi học nằm trọn trong một phần)':'')+'\r\n\r\nCấu trúc thư mục:\r\n  Lớp online / <năm-tháng> / <ngày> · <giờ> · <lớp> · <tiêu đề buổi> / <Họ tên> · <giờ vào> · <trạng thái>.jpg\r\n  Lớp cố định / <năm-tháng> / <ngày> · <lớp> / ...\r\n  Khác: ảnh của buổi học đã bị xoá hoặc không xác định\r\nTrong mỗi buổi có Danh sách.csv (mở bằng Excel). Mục lục.csv liệt kê toàn bộ buổi học.\r\nTên file viết tiếng Việt có dấu, giữ dấu cách cho dễ đọc.\r\n');
      const blob=await zip.generateAsync({type:'blob',compression:'STORE'},m=>say('Đang nén phần '+(pi+1)+'/'+parts.length+'… '+Math.round(m.percent)+'%'));

      if(pi<parts.length-1) await new Promise(r=>setTimeout(r,900)); }
    say('<span style="color:var(--grn)"><b>Đã tải xong:</b></span> '+total+' ảnh · '+sess.length+' buổi học · '+parts.length+' file ZIP'+(noImg?' · '+noImg+' học sinh vào bằng mã (không có ảnh, vẫn có trong DANH-SACH.csv)':'')+(parts.length>1?'<br><span class="muted">Nếu trình duyệt hỏi, hãy cho phép tải nhiều file.</span>':''));
    try{ log('tải ảnh điểm danh về máy ('+(from?fmtD(from)+'–'+fmtD(to):'toàn bộ')+', '+total+' ảnh)'); }catch(e){}
  }catch(e){ say('<span style="color:var(--red)">Lỗi: '+esc(e.message||e)+'</span>'); }
  finally{ if(btn) btn.disabled=false; } }

<script>
/* ===================== HỒ SƠ HỌC SINH ĐẦY ĐỦ · THÔNG TIN HỌC SINH TRONG ĐIỂM DANH & CHUYÊN CẦN ===================== */
const hh2=id=>{ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return h; };
const CC2=['pill-blue','pill-pur','pill-grn','pill-amber','pill-pink','pill-cyan'], ccl2=id=>CC2[hh2(id)%CC2.length];
const dobTxt=s=>s&&s.dob&&s.dob!=='0000-00-00'?fmtD(s.dob):'—';
function stuAvatar(s){ const h=hh2(s.id)%360; return '<span class="avatar" style="background:hsl('+h+',70%,92%);color:hsl('+h+',55%,32%)">'+esc((givenName(s.name)||'?').charAt(0).toUpperCase())+'</span>'; }
function stuCell(s,extra){ return '<div class="row">'+stuAvatar(s)+'<div><b class="lnk" onclick="stuProfile(\''+s.id+'\')" title="Bấm để xem hồ sơ học sinh">'+esc(s.name)+'</b><div class="small muted">'+esc(s.school||'Chưa có trường')+'</div>'+(extra||'')+'</div></div>'; }
function stuClsPills(s,ids){ return ((ids||s.classIds||[]).filter(c=>S.classes[c]).map(c=>'<span class="pill '+ccl2(c)+'">'+esc(className(c))+'</span>').join(' ')||'<span class="pill pill-amber">Chưa có lớp</span>'); }

/* ---- điểm danh: thêm ảnh/tên bấm được, trường, ngày sinh, lớp ---- */
window.attRows=attRows=function(){
  const {d,id,marks,studs}=attCtx(), p=S.P.att, merged=isMerged(d), q=norm(p.q||''), f=p.f||'';
  const list=studs.filter(s=>{ const m=marks[s.id]; if(q&&!norm(s.name+' '+(s.school||'')).includes(q)) return false; if(f==='none') return !m; if(f) return m&&m.s===f; return true; });
  if(!list.length) return '<tr><td colspan="6"><div class="empty">Không có học sinh phù hợp.</div></td></tr>';
  return list.map((s,i)=>{ const m=marks[s.id]||{}, b=(k,l)=>'<button class="'+k+' '+(m.s===k?'on':'')+'" onclick="mark(\''+s.id+'\',\''+k+'\')">'+l+'</button>';
    const pills='<div class="row small" style="gap:6px;margin-top:3px">'+(m.m==='online'?'<span class="pill pill-blue">'+ic('video',12)+' vào lớp '+fmtHM(m.t)+'</span>':'')+(m.f==='model_unavailable'?'<span class="pill pill-amber">chưa dò được mặt — xem ảnh</span>':'')+(m.cd?'<span class="pill pill-amber">'+ic('lock',12)+' vào bằng mã — không có ảnh</span>':'')+'</div>';
    const cl=merged?(s.classIds||[]).filter(c=>sessClassIds(d).includes(c)):null;
    return '<tr><td class="muted">'+(i+1)+'</td><td>'+stuCell(s,pills)+'</td><td class="nowrap">'+dobTxt(s)+'</td><td>'+stuClsPills(s,cl)+'</td><td><div class="mk">'+b('P','Có mặt')+b('L','Muộn')+b('E','Phép')+b('A','Vắng')+'</div></td><td class="right">'+(m.m==='online'&&(d.online||m.rm)?'<button class="btn sm" onclick="viewProof(\''+id+'\',\''+s.id+'\')">'+ic('camera',14)+' Ảnh</button> <button class="btn sm red" onclick="revokeOnline(\''+id+'\',\''+s.id+'\')">Thu hồi</button>':((d.revoked||{})[s.id]?'<span class="pill pill-red">Đã thu hồi</span> <button class="btn sm" onclick="allowOnline(\''+id+'\',\''+s.id+'\')">Cho vào lại</button>':''))+'</td></tr>'; }).join('');
};

/* ---- dữ liệu điểm danh toàn bộ (cache 60s) ---- */
let ATTALL=null, ATTALL_T=0, SP={};
async function loadAttAll(){ if(ATTALL&&Date.now()-ATTALL_T<60000) return ATTALL; const sn=await rdb.ref('attendance').get(), o={}; sn.forEach(c=>{ o[c.key]=Object.assign({id:c.key},c.val()); }); ATTALL=o; ATTALL_T=Date.now(); return o; }
const SPST={P:['Có mặt','pill-grn'],L:['Muộn','pill-amber'],E:['Xin phép','pill-blue'],A:['Vắng','pill-red']};
function spKind(d,m){ if(m&&m.cd) return 'Online · mã log-in'; if(m&&m.m==='online') return d.online?'Online (link buổi)':'Online cố định'; return 'Trợ giảng điểm danh'; }
function spRows(id){ const out=[]; Object.values(ATTALL||{}).forEach(d=>{ const m=(d.marks||{})[id], rv=(d.revoked||{})[id]; if(!m&&!rv) return; out.push({d,m,rv,date:d.date||''}); }); return out.sort((a,b)=>b.date.localeCompare(a.date)); }
const spCls=d=>[d.classId].concat(d.merged||[]).filter(Boolean).map(className).join(' + ');
function spRenderAtt(){ const box=$('#spAtt'); if(!box||box.dataset.sid!==SP.id) return;
  const mo=SP.month||'', rows=SP.rows.filter(r=>!mo||r.date.startsWith(mo)), c={P:0,L:0,E:0,A:0}; rows.forEach(r=>{ if(r.m&&c[r.m.s]!=null) c[r.m.s]++; });
  const n=c.P+c.L+c.E+c.A, pct=n?Math.round((c.P+c.L)/n*100):null, months=[...new Set(SP.rows.map(r=>r.date.slice(0,7)).filter(Boolean))];
  const mini=(l,v,k)=>'<div class="mini '+k+'"><b>'+v+'</b><span>'+l+'</span></div>';
  box.innerHTML='<div class="row wrap mb12" style="gap:8px"><select class="inp" style="width:auto" onchange="SP.month=this.value;spRenderAtt()"><option value="">Tất cả các tháng</option>'+months.map(x=>'<option value="'+x+'" '+(x===mo?'selected':'')+'>Tháng '+x.split('-').reverse().join('/')+'</option>').join('')+'</select><span class="small muted">'+rows.length+' lượt ghi nhận</span></div>'+
   '<div class="minis">'+mini('Chuyên cần',pct==null?'—':pct+'%','b')+mini('Có mặt',c.P,'g')+mini('Muộn',c.L,'a')+mini('Xin phép',c.E,'b')+mini('Vắng',c.A,'r')+'</div>'+
   (rows.length?'<div class="card" style="padding:0"><div class="scroll" style="max-height:340px;min-height:0"><table class="tbl"><thead><tr><th>Ngày</th><th>Lớp / buổi học</th><th>Hình thức</th><th>Trạng thái</th><th>Giờ vào</th></tr></thead><tbody>'+rows.map(r=>{ const d=r.d, m=r.m, st=m?(SPST[m.s]||['—','pill-gray']):['Đã thu hồi','pill-red'];
      return '<tr><td class="nowrap"><b>'+fmtD(r.date)+'</b><div class="small muted">'+(r.date?wdOf(r.date):'')+'</div></td><td>'+esc(spCls(d))+(d.online&&d.title?'<div class="small muted">'+esc(d.title)+'</div>':'')+'</td><td class="small">'+(m?esc(spKind(d,m)):'—')+'</td><td><span class="pill '+st[1]+'">'+st[0]+'</span></td><td class="nowrap">'+(m&&m.t&&m.m==='online'?fmtHM(m.t):'—')+'</td></tr>'; }).join('')+'</tbody></table></div></div>':'<div class="empty small">Chưa có dữ liệu điểm danh'+(mo?' trong tháng này':'')+'.</div>'); }
function spRenderPhotos(){ const box=$('#spPh'); if(!box||box.dataset.sid!==SP.id) return; const L=SP.photos||[], real=L.filter(v=>v.img).length;
  box.innerHTML=L.length?'<div class="row between wrap mb12"><span class="small muted">'+real+' ảnh · '+(L.length-real)+' lần vào bằng mã (không ảnh)</span>'+(real?'<button class="btn sm" onclick="spZip()">'+ic('download',14)+' Tải tất cả ảnh (.zip)</button>':'')+'</div><div class="pfgrid">'+L.map((v,i)=>{ const d=(ATTALL||{})[v.docId]||{}, date=d.date||dk(new Date(v.ts));
      return '<div class="pf"><button class="pfi" onclick="spShowPhoto('+i+')">'+(v.img?'<img src="'+v.img+'" alt="" loading="lazy">':(v.driveUrl?'<div class="pfcode">'+ic('camera',26)+'<span>Xem trên Drive</span></div>':'<div class="pfcode">'+ic('lock',26)+'<span>Vào bằng mã</span></div>'))+'</button><div class="pfb"><b>'+fmtD(date)+'</b><div class="small muted">'+fmtHM(v.ts)+(d.classId?' · '+esc(spCls(d)):'')+'</div></div></div>'; }).join('')+'</div>':'<div class="empty small">Chưa có ảnh điểm danh nào của học sinh này.</div>'; }
function spShowPhoto(i){ const v=(SP.photos||[])[i]; if(!v) return; if(!v.img){ toast('Lần này em điểm danh bằng Mã log-in nên không có ảnh','ok'); return; } const d=(ATTALL||{})[v.docId]||{}; lightbox(v.img,((S.students[SP.id]||{}).name||'')+' · '+fmtD(d.date||dk(new Date(v.ts)))+' '+fmtHM(v.ts),null); }

    L.forEach(v=>{ const d=(ATTALL||{})[v.docId]||{}, mk_=((d.marks||{})[SP.id]||{}).s; let fn=(d.date||dk(new Date(v.ts)))+' · '+hm(v.ts)+' · '+zslug(spCls(d)||'lớp',30)+' · '+(STL[mk_]||'chưa rõ'); if(used[fn]) fn+=' ('+zslug(v.docId.slice(-6))+')'; used[fn]=1; z.file(fn+'.jpg',v.img.replace(/^data:image\/\w+;base64,/,''),{base64:true}); });
    const blob=await z.generateAsync({type:'blob',compression:'STORE'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Ảnh điểm danh - '+zslug(st.name||SP.id)+'.zip'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),20000);
  }catch(e){ toast('Lỗi: '+(e.message||e),'err'); } }
function spCopyMsg(){ const s=S.students[SP.id]; if(!s) return; const mo=mk(new Date()), rows=(SP.rows||[]).filter(r=>r.m&&r.date.startsWith(mo)), ok=rows.filter(r=>r.m.s==='P'||r.m.s==='L').length, n=rows.length;
  copyText('Chào anh/chị, em '+s.name+' tháng '+mo.split('-').reverse().join('/')+' đi học '+ok+'/'+n+' buổi'+(n?' ('+Math.round(ok/n*100)+'%)':'')+'. Cảm ơn anh/chị! — '+((S.settings&&S.settings.centerName)||'')); }

/* ---- hồ sơ học sinh: toàn bộ thông tin ---- */
window.stuProfile=stuProfile=function(id){
  const s=S.students[id]; if(!s) return; const F=can('canFees'); if(F) ensureFees(S.feeMonth);
  SP={id,month:'',rows:[],photos:[]};
  let age=''; if(s.dob&&s.dob!=='0000-00-00'){ const b=new Date(s.dob+'T00:00'), n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())) a--; if(a>0&&a<100) age=' ('+a+' tuổi)'; }
  const z=(s.parentPhone||s.phone||'').replace(/\D/g,''), info=[['Họ và tên',esc(s.name)],['Ngày sinh',dobTxt(s)+age],['Trường',esc(s.school||'Chưa có')],['SĐT học sinh',esc(s.phone||'—')],['SĐT phụ huynh',esc(s.parentPhone||'—')],['Trạng thái',s.active===false?'<span class="pill pill-red">Ngừng học</span>':'<span class="pill pill-grn">Đang học</span>'],['Lớp đang học',stuClsPills(s)],['Ghi chú',s.note?esc(s.note).replace(/\n/g,'<br>'):'—'],['Mã học sinh','<span class="small muted">'+esc(id)+'</span>'],['Cập nhật lần cuối',s.updatedAt?fmtD(dk(new Date(s.updatedAt)))+' '+fmtHM(s.updatedAt):'—']];
  const infoH='<div class="grid mb16" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px">'+info.map(x=>'<div style="border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fafcfe"><div class="small muted" style="font-weight:600">'+x[0]+'</div><div style="margin-top:3px;font-weight:600;word-break:break-word">'+x[1]+'</div></div>').join('')+'</div>';
  const cids=(s.classIds||[]).filter(c=>S.classes[c]), tests=Object.values(S.tests).filter(t=>cids.includes(t.classId)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const avgOf=cid=>{ let t=0,w=0; tests.filter(x=>x.classId===cid).forEach(x=>{ const v=(x.scores||{})[id]; if(v!=null){ const k=+x.weight||1; t+=v/(+x.max||10)*10*k; w+=k; } }); return w?t/w:null; };
  const scH=tests.length?'<div class="card" style="padding:0"><div class="scroll" style="max-height:260px;min-height:0"><table class="tbl"><thead><tr><th>Bài kiểm tra</th><th>Lớp</th><th>Ngày</th><th class="center">Điểm</th><th class="center">Hệ số</th></tr></thead><tbody>'+tests.map(t=>{ const v=(t.scores||{})[id]; return '<tr><td><b>'+esc(t.title)+'</b></td><td class="small">'+esc(className(t.classId))+'</td><td class="nowrap">'+fmtD(t.date)+'</td><td class="center">'+(v!=null?'<b>'+v+'</b><span class="muted"> / '+(t.max||10)+'</span>':'<span class="muted">—</span>')+'</td><td class="center">'+(t.weight||1)+'</td></tr>'; }).join('')+'</tbody></table></div></div>'+'<div class="row wrap mt8" style="gap:8px">'+cids.map(c=>{ const a=avgOf(c); return '<span class="pill '+ccl2(c)+'">'+esc(className(c))+' · TB '+(a==null?'—':a.toFixed(2))+'</span>'; }).join('')+'</div>':'<div class="empty small">Chưa có bài kiểm tra nào cho các lớp của em.</div>';
  let feeH=''; if(F){ const [y,mo]=S.feeMonth.split('-').map(Number), ms=[]; for(let i=5;i>=0;i--) ms.push(mk(new Date(y,mo-1-i,1)));
    feeH='<div class="b mb12 mt16">'+ic('wallet',16)+' Học phí 6 tháng gần nhất</div><div class="card" style="padding:0"><table class="tbl"><thead><tr><th>Tháng</th><th class="right">Phải đóng</th><th class="right">Đã đóng</th><th>Trạng thái</th></tr></thead><tbody>'+ms.map(m=>{ const f=feeOf(id,m), full=f.due>0&&f.paid>=f.due; return '<tr><td>'+m.split('-').reverse().join('/')+'</td><td class="right">'+money(f.due)+'</td><td class="right">'+money(f.paid)+'</td><td>'+(f.due===0?'<span class="pill pill-gray">Miễn / chưa thu</span>':full?'<span class="pill pill-grn">Đã đóng</span>':f.paid>0?'<span class="pill pill-amber">Đóng một phần</span>':'<span class="pill pill-red">Chưa đóng</span>')+'</td></tr>'; }).join('')+'</tbody></table></div>'; }
  modal(esc(s.name),'<div class="pv">'+stuAvatar(s)+'<div class="grow"><div class="b" style="font-size:17px">'+esc(s.name)+'</div><div class="small muted">'+esc(s.school||'Chưa có trường')+'</div></div></div>'+
   '<div class="b mb12">'+ic('user',16)+' Thông tin học sinh</div>'+infoH+
   '<div class="b mb12">'+ic('userCheck',16)+' Chi tiết điểm danh</div><div id="spAtt" data-sid="'+id+'" class="mb16"><div class="muted small">Đang tải dữ liệu điểm danh…</div></div>'+
   '<div class="b mb12">'+ic('camera',16)+' Ảnh điểm danh</div><div id="spPh" data-sid="'+id+'" class="mb16"><div class="muted small">Đang tải ảnh…</div></div>'+

  (async()=>{ try{ await loadAttAll(); if(SP.id!==id) return; SP.rows=spRows(id); spRenderAtt(); }catch(e){ const b=$('#spAtt'); if(b&&b.dataset.sid===id) b.innerHTML='<div class="err">Không tải được điểm danh: '+esc(e.message||e)+'</div>'; }
    try{ const sn=await rdb.ref('proofs').orderByChild('sid').equalTo(id).get(), L=[]; sn.forEach(c=>{ const v=c.val(); if(v) L.push(Object.assign({key:c.key},v)); }); L.sort((a,b)=>b.ts-a.ts); if(SP.id!==id) return; SP.photos=L; spRenderPhotos(); }
    catch(e){ const b=$('#spPh'); if(b&&b.dataset.sid===id) b.innerHTML='<div class="err">Không tải được ảnh: '+esc(e.message||e)+'</div>'; } })();
};

<script>
/* ===================== TAB "ẢNH ĐIỂM DANH ONLINE" (độc lập, mọi nhân sự đều xem được) ===================== */
(function(){ S.P.px={month:mk(new Date()),classId:'',q:''};
  if(!NAV.some(n=>n[0]==='photos')){ const i=NAV.findIndex(n=>n[0]==='att'); NAV.splice(i+1,0,['photos',ic('camera'),'Ảnh điểm danh']); } })();

async function pxZip(id){ const o=S.onl[id]||S.att[id]; if(!o) return;
  try{ toast('Đang chuẩn bị ảnh…'); await ensureZip(); const sn=await C('proofs').where('docId','==',id).get(), L=sn.docs.map(x=>x.data()).sort((a,b)=>a.ts-b.ts), z=new JSZip(), used={}, links=[], marks=o.marks||{}; let n=0;
    L.forEach(v=>{ const nm=(S.students[v.sid]||{}).name||v.sid, s=(marks[v.sid]||{}).s;
      if(v.img){ let fn=zslug(nm)+' · '+hm(v.ts)+' · '+(STL[s]||'chưa rõ'); used[fn]=(used[fn]||0)+1; if(used[fn]>1) fn+=' ('+used[fn]+')'; z.file(fn+'.jpg',v.img.replace(/^data:image\/\w+;base64,/,''),{base64:true}); n++; }
      else if(v.driveUrl) links.push(nm+' · '+hm(v.ts)+': '+v.driveUrl); });
    if(links.length) z.file('Ảnh trên Google Drive.txt',links.join('\r\n'));
    if(!n&&!links.length){ toast('Buổi này chưa có ảnh','err'); return; }
    const blob=await z.generateAsync({type:'blob',compression:'STORE'}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Ảnh điểm danh - '+zslug(o.title||sessClassNames(o),60)+' - '+fmtD(o.date).replace(/\//g,'-')+'.zip'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),20000);
    toast('Đã tải '+n+' ảnh','ok'); }catch(e){ toast('Lỗi: '+(e.message||e),'err'); } }

  '<div class="grid g2 mt16">'+(PXC.dl||'')+(isSA()?(PXC.clean||''):'')+'</div>'; };

const AI_WORKER="// Cloudflare Worker — máy chủ trung gian chấm bài AI (giấu API key, chỉ nhân sự đã duyệt mới gọi được)\nconst FB_KEY = 'AIzaSyDKYJ4yMJQ-vxKkMQR4rLDC01npMhWPIbE';\nconst DB = 'https://csdl-dl-nthh-default-rtdb.asia-southeast1.firebasedatabase.app';\nconst CORS = { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Headers': 'authorization,content-type', 'Access-Control-Allow-Methods': 'POST,OPTIONS' };\nconst J = (o, s) => new Response(JSON.stringify(o), { status: s || 200, headers: { ...CORS, 'content-type': 'application/json' } });\n\nexport default {\n  async fetch(req, env) {\n    if (req.method === 'OPTIONS') return new Response(null, { headers: CORS });\n    if (req.method !== 'POST') return J({ error: { message: 'Chỉ nhận POST' } }, 405);\n    const tok = (req.headers.get('authorization') || '').replace(/^Bearer /, '');\n    if (!tok) return J({ error: { message: 'Thiếu đăng nhập' } }, 401);\n    // 1. xác thực Firebase ID token\n    const lk = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=' + FB_KEY, {\n      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ idToken: tok }) });\n    if (!lk.ok) return J({ error: { message: 'Phiên đăng nhập không hợp lệ, hãy tải lại trang' } }, 401);\n    const uid = ((await lk.json()).users || [{}])[0].localId;\n    // 2. chỉ nhân sự đã được duyệt và còn hạn\n    const u = await (await fetch(DB + '/users/' + uid + '.json?auth=' + tok)).json();\n    if (!u || u.status !== 'active' || (u.expiresAt && u.expiresAt < Date.now()))\n      return J({ error: { message: 'Tài khoản chưa được duyệt hoặc đã hết hạn' } }, 403);\n    // 3. chuyển tiếp tới Anthropic bằng key bí mật\n    let b; try { b = await req.json(); } catch (e) { return J({ error: { message: 'Dữ liệu không hợp lệ' } }, 400); }\n    const r = await fetch('https://api.anthropic.com/v1/messages', {\n      method: 'POST',\n      headers: { 'content-type': 'application/json', 'x-api-key': env.ANTHROPIC_KEY, 'anthropic-version': '2023-06-01' },\n      body: JSON.stringify({ model: b.model || 'claude-sonnet-5-5', max_tokens: Math.min(b.max_tokens || 8000, 12000), system: b.system, messages: b.messages })\n    });\n    return new Response(await r.text(), { status: r.status, headers: { ...CORS, 'content-type': 'application/json' } });\n  }\n};\n";

(function(){ const i=NAV.findIndex(n=>n[0]==='scores'); if(!NAV.some(n=>n[0]==='grade')) NAV.splice(i+1,0,['grade',ic('clipboard'),'Chấm bài AI']); })();
let GCFG={key:'',model:'claude-sonnet-5-5',proxy:''}; try{ Object.assign(GCFG,JSON.parse(localStorage.getItem('geoai_cfg')||'{}')); }catch(e){}
const G={ready:false,dual:true,exam:{title:'',maxScore:20,note:'',date:'',classId:'',de:[],barem:[],rubric:null,rubrics:null,rubIdx:0,rubricOk:false},results:[],cur:{sid:'',name:'',pages:[],trans:null,cands:[],real:''},res:null,busy:'',msg:''};
const IDB={db:null,open(){ return this.db?Promise.resolve(this.db):new Promise((ok,no)=>{ const r=indexedDB.open('geoai',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{ this.db=r.result; ok(r.result); }; r.onerror=()=>no(r.error); }); },
  async get(k){ const d=await this.open(); return new Promise(ok=>{ const q=d.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>ok(q.result); q.onerror=()=>ok(undefined); }); },
  async set(k,v){ const d=await this.open(); return new Promise((ok,no)=>{ const t=d.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=ok; t.onerror=()=>no(t.error); }); } };
async function gLoad(){ try{ const e=await IDB.get('exam'), r=await IDB.get('results'); if(e) Object.assign(G.exam,e); try{ gRubSync(); }catch(x){} if(r) G.results=r; }catch(x){}
  try{ const v=(await rdb.ref('public/ai').get()).val(); if(v){ if(v.proxy) GCFG.proxy=v.proxy; if(v.model) GCFG.model=v.model; } }catch(x){} render(); }
const gSaveExam=()=>IDB.set('exam',G.exam).catch(()=>toast('Không lưu được dữ liệu đề vào trình duyệt','err'));
async function gSaveCfg(){ const k=val('gKey'); if(k) GCFG.key=k; GCFG.model=val('gModel')||'claude-sonnet-5-5'; if($('#gProxy')) GCFG.proxy=val('gProxy');
  if(GCFG.proxy&&!/^https:\/\//.test(GCFG.proxy)){ toast('Link máy chủ trung gian phải bắt đầu bằng https://','err'); return; }
  localStorage.setItem('geoai_cfg',JSON.stringify(GCFG)); if(isSA()){ try{ await rdb.ref('public/ai').set({proxy:GCFG.proxy||null,model:GCFG.model}); }catch(e){ toast('Không lưu chung được: '+e.message,'err'); } } toast('Đã lưu cấu hình','ok'); render(); }
function gField(f,v){ G.exam[f]=f==='maxScore'?(+v||20):v; if(f==='classId') render(); gSaveExam(); }
function fileToImg(f,max,q){ return new Promise((ok,no)=>{ const u=URL.createObjectURL(f),im=new Image(); im.onload=()=>{ const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas'); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg',q||.85).split(',')[1]); }; im.onerror=()=>no(new Error('Không đọc được ảnh')); im.src=u; }); }
const fileToB64=f=>new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=()=>no(r.error); r.readAsDataURL(f); });
async function gAdd(kind,inp){ const fs=[...inp.files]; inp.value=''; if(!fs.length) return;
  try{ for(const f of fs){ let it=null;
      if(f.type==='application/pdf'&&kind!=='pages'){ if(f.size>20*1048576){ toast('PDF "'+f.name+'" quá lớn (>20MB)','err'); continue; } it={t:'pdf',name:f.name,data:await fileToB64(f)}; }
      else if(/^image\//.test(f.type)) it={t:'img',name:f.name,data:await fileToImg(f,kind==='pages'?2200:1800,kind==='pages'?.9:.85)};
      if(!it) continue; if(kind==='pages'){ G.cur.pages.push(it); G.cur.trans=null; if(G.res) G.stale=true; } else { G.exam[kind].push(it); G.exam.rubric=null; G.exam.rubricOk=false; } }
    if(kind!=='pages') await gSaveExam(); render(); }catch(e){ toast('Lỗi: '+e.message,'err'); } }
function gDel(kind,i){ if(kind==='pages'){ G.cur.pages.splice(i,1); G.cur.trans=null; if(G.res) G.stale=true; } else { G.exam[kind].splice(i,1); G.exam.rubric=null; G.exam.rubricOk=false; gSaveExam(); } render(); }
const gBlocks=(list,label)=>{ const b=[{type:'text',text:label}]; list.forEach((it,i)=>{ if(it.t==='pdf') b.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:it.data}}); else { if(list.length>1) b.push({type:'text',text:'(trang '+(i+1)+')'}); b.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:it.data}}); } }); return b; };
async function gCall(content,system,maxTok){
  const body={model:GCFG.model||'claude-sonnet-5-5',max_tokens:maxTok||8000,system,messages:[{role:'user',content}]}; let r;
  if(GCFG.proxy){ const u=auth.currentUser; if(!u) throw new Error('Hết phiên đăng nhập, hãy tải lại trang'); const tok=await u.getIdToken(); r=await fetch(GCFG.proxy,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:JSON.stringify(body)}); }
  else { if(!GCFG.key) throw new Error('Chưa cấu hình AI: nhờ superadmin dán link máy chủ trung gian (hoặc nhập API key thử nghiệm) ở mục “Cấu hình AI”.'); r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':GCFG.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)}); }
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.error&&j.error.message)||('Lỗi HTTP '+r.status)); return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''); }
function gFixJson(t){ let o='',inS=false; for(let i=0;i<t.length;i++){ const c=t[i];
    if(!inS){ o+=c; if(c==='"') inS=true; continue; }
    if(c==='\\'){ const n=t[i+1]; if(n!==undefined&&'"\\/bfnrtu'.indexOf(n)>=0){ o+=c+n; i++; } else o+='\\\\'; continue; }
    if(c==='"'){ let j=i+1; while(j<t.length&&/\s/.test(t[j])) j++; const n=t[j]; if(n===undefined||n===','||n===':'||n==='}'||n===']'){ o+=c; inS=false; } else o+='\\"'; continue; }
    if(c==='\n'){ o+='\\n'; continue; } if(c==='\r') continue; if(c==='\t'){ o+='\\t'; continue; }
    o+=c; } return o; }
function gJson(t){ const a=t.indexOf('{'),b=t.lastIndexOf('}'); if(a<0||b<a) throw new Error('AI không trả về đúng định dạng. Hãy thử lại.'); const x=t.slice(a,b+1);
  try{ return JSON.parse(x); }catch(e1){ const f=gFixJson(x);
    try{ return JSON.parse(f); }catch(e2){ try{ return JSON.parse(f.replace(/,\s*([}\]])/g,'$1')); }catch(e3){ throw new Error('AI trả về dữ liệu bị lỗi định dạng ('+e1.message+').'); } } } }
async function gCallJson(c,sys,mx){ let last; for(let a=0;a<2;a++){ const t=await gCall(c,sys,mx); try{ return gJson(t); }catch(e){ last=e; if(!/định dạng/.test(e.message)) throw e; } } throw new Error((last&&last.message||'Lỗi dữ liệu')+' Đã tự thử 2 lần, hãy bấm chấm lại.'); }
const hasAI=()=>!!(GCFG.proxy||GCFG.key);
const G_SYS='Bạn là giáo viên Địa lí chuyên giàu kinh nghiệm, chấm bài thi học sinh giỏi/chuyên của Việt Nam, chấm công tâm, chặt chẽ và nhất quán. Khi chấm bài luôn bám sát hướng dẫn chấm và CHẤM CHẶT TAY: chỉ cho điểm phần thể hiện rõ ràng, đúng và đủ, không cho điểm theo cảm tính hay suy đoán. Luôn trả lời bằng tiếng Việt và CHỈ trả về một đối tượng JSON hợp lệ, không thêm chữ nào ngoài JSON.';

function gRubSync(){ const e=G.exam; if(!Array.isArray(e.rubrics)||!e.rubrics.length){ if(e.rubric&&e.rubric.cau) e.rubrics=[e.rubric]; else { e.rubrics=null; e.rubric=null; return; } }
  if(!(e.rubIdx>=0&&e.rubIdx<e.rubrics.length)) e.rubIdx=0; e.rubric=e.rubrics[e.rubIdx]; }
const gRubN=()=>(G.exam.rubrics||[]).length;
const gRubSumOf=r=>Math.round(((r&&r.cau)||[]).reduce((a,c)=>a+c.y.reduce((s,y)=>s+(+y.diem_toi_da||0),0),0)*100)/100;

QUY TRÌNH BẮT BUỘC: duyệt lần lượt TỪNG ý trong barem (${ids.length} ý, id: ${ids.join(', ')}). Với mỗi ý: tìm trong bài làm phần tương ứng, đối chiếu TỪNG nội dung cần đạt (từng số liệu, địa danh, khái niệm, mối quan hệ, mức độ yêu cầu), rồi cho điểm; không bỏ sót ý nào; ý không có trong bài làm thì cho 0 và ghi “không làm”.

NGUYÊN TẮC CHẤM CHẶT TAY:
1. Bám sát HDC và bậc điểm của HDC; không tự nâng điểm, không tự chia lại điểm khác HDC.
2. Chỉ cho điểm phần thể hiện RÕ RÀNG, ĐÚNG và ĐỦ trong bài. Không cho điểm vì “có thể học sinh hiểu”, vì viết dài/lan man, vì đúng chủ đề nhưng không đúng nội dung cần đạt, hoặc vì chỉ nêu tên mà thiếu giải thích khi HDC yêu cầu giải thích.
3. Ý có nhiều yếu tố: kiểm từng yếu tố; thiếu hoặc sai yếu tố nào thì trừ đúng phần điểm của yếu tố đó theo HDC; nếu HDC chỉ ghi điểm chung cho cả ý thì cho điểm theo tỉ lệ yếu tố đạt, làm tròn XUỐNG 0,25.
4. Sai/thiếu số liệu, địa danh, năm, đơn vị, khái niệm: không cho điểm phần đó và áp dụng quy định trừ điểm của HDC/lưu ý của giáo viên. Biểu đồ, bảng, lược đồ: kiểm tra loại biểu đồ, tên, trục, đơn vị, số liệu, chú giải, độ chính xác; thiếu thành phần nào thì trừ theo HDC.
5. Ý đúng khác đáp án chỉ được điểm khi HDC cho phép (“ý khác đúng”) hoặc đúng bản chất địa lí và đủ mức yêu cầu; phải ghi rõ trong da_dat; nếu không chắc thì cho mức thấp hơn và khong_chac=true.
6. Không bù điểm giữa các ý; không cho điểm một nội dung hai lần; nội dung đặt sai chỗ chỉ được điểm nếu HDC chấp nhận.
7. Lỗi chính tả/trình bày không bị trừ trừ khi lưu ý của giáo viên hoặc HDC nêu; nhưng diễn đạt sai nghĩa thì không được điểm ý đó.
8. Chữ khó đọc: không đoán; chỉ cho điểm phần đọc chắc chắn và đặt khong_chac=true.
9. Phân vân giữa hai mức điểm: chọn mức THẤP hơn, đặt khong_chac=true và nêu lý do ở mat_diem.
10. Điểm mỗi ý không vượt điểm tối đa và là bội số của 0,25. Phần mat_diem phải nêu cụ thể thiếu/sai gì so với đáp án.

QUY ĐỊNH VỀ trich_dan: phải chép lại nguyên văn và đầy đủ phần học sinh viết cho từng ý (từ chữ đầu đến chữ cuối của phần đó, giữ cả chỗ sai) để giáo viên đối chiếu; TUYỆT ĐỐI không viết tắt, không cắt bớt, không dùng “...” hay “…” để lược; nếu học sinh không làm ý đó thì ghi “(không có)”.

Trả về JSON: {"y":[{"id":"1.1","diem":number,"da_dat":"phần làm đúng","mat_diem":"lý do mất điểm cụ thể (để trống nếu đủ điểm)","trich_dan":"chép NGUYÊN VĂN, ĐẦY ĐỦ toàn bộ phần bài làm của học sinh ứng với ý này (không rút gọn, không dùng dấu ba chấm)","khong_chac":false}],"luu_y":[{"so":1,"ap_dung":"đã áp dụng ở ý nào / không liên quan"}],"nhan_xet_chung":"3-5 câu, khách quan, nêu cụ thể","diem_manh":["..."],"can_cai_thien":["..."],"can_giao_vien_xem_lai":["..."]}`; }

async function gGradeCall(ids){ const R=gRubCur(), sub={quy_dinh_chung:R.quy_dinh_chung||'',cau:R.cau.map(c=>({id:c.id,ten:c.ten,y:c.y.filter(y=>ids.includes(y.id))})).filter(c=>c.y.length)}, c=[];

  if(G.cur.pages.length) c.push(...gBlocks(G.cur.pages,'ẢNH BÀI LÀM GỐC (đối chiếu khi cần, nhất là biểu đồ, bảng, số liệu):'));

const rq=x=>Math.round(x*4)/4;
async function gGradeAll(){ const R=gRubCur(), ids=[]; R.cau.forEach(c=>c.y.forEach(y=>ids.push(y.id))); const n=G.dual?2:1;
  const rs=await Promise.allSettled(Array.from({length:n},()=>gGradeCall(ids))), runs=rs.filter(x=>x.status==='fulfilled').map(x=>x.value); if(!runs.length) throw rs[0].reason;
  const miss=ids.filter(id=>!runs.some(r=>r.map[id])); if(miss.length){ G.busy='Bước 3/3: Bổ sung '+miss.length+' ý AI chưa chấm…'; render(); try{ const extra=await gGradeCall(miss); runs.push(extra); }catch(e){} }
  const res=gMerge(runs); if(G.audit!==false){ try{ G.busy='Bước 3/3: Rà soát lại từng ý theo barem & lưu ý…'; render(); await gAudit(res); }catch(e){ res.can_giao_vien_xem_lai.push('Chưa rà soát lại được: '+(e.message||e)); } } return res; }
function gMerge(runs){ const R=gRubCur(), flags=[]; const res={ma:G.cur.ma||'',cau:[],nhan_xet_chung:runs[0].gen.nhan_xet_chung||'',luu_y:Array.isArray(runs[0].gen.luu_y)?runs[0].gen.luu_y:[],diem_manh:[],can_cai_thien:[],can_giao_vien_xem_lai:[]};
  runs.forEach(r=>['diem_manh','can_cai_thien','can_giao_vien_xem_lai'].forEach(k=>{ (Array.isArray(r.gen[k])?r.gen[k]:[]).forEach(x=>{ if(x&&!res[k].includes(x)) res[k].push(x); }); }));
  R.cau.forEach(c=>{ const cc={id:c.id,ten:c.ten,y:[]}; c.y.forEach(ry=>{ const fs=runs.map(r=>r.map[ry.id]).filter(Boolean), mx=ry.diem_toi_da;
    if(!fs.length){ cc.y.push({id:ry.id,noi_dung:ry.noi_dung,diem_toi_da:mx,diem:0,da_dat:'',mat_diem:'AI không trả về kết quả cho ý này — cần chấm tay.',trich_dan:'',khong_chac:true}); flags.push('Ý '+ry.id+': AI không chấm được, đang để 0 điểm.'); return; }
    const v=fs.map(f=>Math.max(0,Math.min(mx,+f.diem||0))), avg=Math.floor(v.reduce((a,b)=>a+b,0)/v.length*4+1e-6)/4, spread=Math.max(...v)-Math.min(...v), pick=fs.reduce((b,f,i)=>Math.abs(v[i]-avg)<Math.abs(v[fs.indexOf(b)]-avg)?f:b,fs[0]);
    if(spread>0.25) flags.push('Ý '+ry.id+': các lần chấm lệch nhau ('+v.join(' / ')+'), lấy trung bình làm tròn xuống '+avg+'.');
    cc.y.push({id:ry.id,noi_dung:ry.noi_dung,diem_toi_da:mx,diem:avg,da_dat:pick.da_dat||'',mat_diem:pick.mat_diem||'',trich_dan:gFull(pick.trich_dan||''),khong_chac:fs.some(f=>f.khong_chac)||spread>0.25}); }); res.cau.push(cc); });
  (G.cur.trans.khong_doc_duoc||[]).forEach(x=>flags.push('Chữ khó đọc: '+x)); res.can_giao_vien_xem_lai=flags.concat(res.can_giao_vien_xem_lai); gCalc(res); return res; }
function gFull(q){ q=String(q||'').trim(); if(!/\.\.\.|…/.test(q)) return q; try{ const T=((G.cur.trans&&G.cur.trans.bai_lam)||[]).map(p=>p.noi_dung||'').join('\n'); const head=q.split(/\.\.\.|…/)[0].replace(/^["“”'\s]+|["“”'\s]+$/g,''); if(head.length<6) return q; const i=T.indexOf(head); if(i<0) return q; let e=T.indexOf('\n',i); if(e<0) e=T.length; return T.slice(i,e).trim()||q; }catch(x){ return q; } }
function gCalc(r){ let t=0,m=0; (r.cau||[]).forEach(c=>{ let s=0,mm=0; (c.y||[]).forEach(y=>{ y.diem_toi_da=+y.diem_toi_da||0; y.diem=Math.max(0,Math.min(y.diem_toi_da,+y.diem||0)); s+=y.diem; mm+=y.diem_toi_da; }); c.diem=Math.round(s*100)/100; c.max=Math.round(mm*100)/100; t+=c.diem; m+=c.max; }); r.tong=Math.round(t*100)/100; r.max=Math.round(m*100)/100; }
async function gGradeFlow(skip){ const e=G.exam;
  if(!e.classId){ toast('Hãy chọn lớp tại trung tâm trước','err'); return; } if(!e.rubric||!e.rubricOk){ toast('Cần phân tích barem và tick xác nhận đã kiểm tra','err'); return; } if(!G.cur.pages.length){ toast('Hãy chụp/tải ảnh bài làm','err'); return; }
  G.msg=''; G.stale=false; if(!skip) G.res=null; try{
    if(!skip||!G.cur.trans){ G.busy='Bước 1/3: Đọc bài làm & nhận diện học sinh…'; render(); G.cur.trans=await gRead(); G.cur.sid=G.cur.presel||G.cur.sid||''; if(!G.cur.sid) G.cur.name=''; gIdent(); }
    G.needMa=false; if(!skip) G.cur.ma=''; { const ma=gResolveMa(); if((G.exam.rubrics||[]).length>1&&!ma){ G.needMa=true; G.busy=''; G.msg='Không xác định được mã đề của bài này (AI đọc được: “'+((G.cur.trans.thong_tin||{}).ma_de||'không thấy')+'”). Hãy chọn đúng mã đề của học sinh bên dưới rồi bấm “Chấm tiếp”.'; render(); return; } G.cur.ma=ma; }
    G.busy='Bước 2/3: Chấm từng ý'+(G.dual?' (chấm kép 2 lần để đối chiếu)':'')+'… (có thể mất 1–2 phút)'; render(); const r=await gGradeAll(); G.res=r; G.savedId=''; G.cur.real=''; }
  catch(x){ G.msg=x.message||String(x); } G.busy=''; render(); }

  const st=S.students[sid]; if(!(st.classIds||[]).includes(cid)&&!confirm('Học sinh '+st.name+' không thuộc lớp '+className(cid)+'. Vẫn lưu?')) return;
  let t=Object.values(S.tests).find(x=>x.classId===cid&&x.title===title); const tmax=t?(+t.max||10):(+G.exam.maxScore||10), sc=rq(r.max?r.tong/r.max*tmax:0), old=t&&t.scores&&t.scores[sid];
  if(!confirm('Lưu '+sc+'/'+tmax+' điểm cho '+st.name+(st.school?' ('+st.school+')':'')+'\nLớp: '+className(cid)+' · Bài: '+title+(old!=null?'\n⚠ Đã có điểm '+old+', sẽ bị ghi đè.':''))) return;

async function listModels(key){
  const r=await fetch(BASE+'/models?pageSize=200&key='+encodeURIComponent(key)), j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(errMsg(j,r.status));
  const ver=n=>{ const m=n.match(/gemini-(\d+(?:\.\d+)?)/); return m?parseFloat(m[1]):0; };
  const rank=n=>/lite/.test(n)?1:/pro/.test(n)?2:0;
  const l=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/^models\/gemini-/.test(m.name)&&!/(tts|image|audio|live|embed|robot|exp|latest|computer|vision|aqa|learnlm|thinking)/.test(m.name)).map(m=>m.name.replace('models/',''));

const PG={calls:[],T0:0};
const fmtT=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

const kindOf=c=>{ const t=c.filter(b=>b.type==='text').map(b=>b.text).join('\n'); return /Chuyển TOÀN BỘ hướng dẫn chấm|Liệt kê TẤT CẢ mã đề/.test(t)?'extract':/Nhiệm vụ: \(1\) đọc thông tin/.test(t)?'read':'grade'; };

  if(!G.busy){ PG.T0=0; return; } if(!PG.T0) PG.T0=Date.now();

  const now=Date.now(), tot=(now-PG.T0)/1000, act=PG.calls.filter(c=>!c.done), lines=[], pc=[];
  act.forEach((c,i)=>{ const s=(now-c.t0)/1000, pre=(act.length>1?'Lượt '+(i+1)+' · ':'')+KIND[c.kind][0]+' ['+c.model+']: '; let t,p;
    if(c.stage==='send'){ t=s<8?'đang gửi '+c.size+' MB lên Gemini…':'đã gửi xong, đang chờ Gemini bắt đầu trả lời… '+Math.round(s)+' giây (quá '+Math.round(c.lim/1000)+' giây app sẽ tự đổi cách gọi)'; p=Math.min(12,3+s*0.1); }

    else if(c.stage==='write'){ t='Gemini đang viết kết quả — đã nhận '+c.chars.toLocaleString('vi-VN')+' ký tự'; p=30+Math.min(65,c.chars/c.exp*65); }
    else { t=c.note||'đang chờ…'; p=5; }
    lines.push(esc(pre+t)); pc.push(p); });
  if(!act.length){ lines.push('Đang xử lý kết quả…'); pc.push(97); }
  d.innerHTML=lines.join('<br>')+'<br><span style="opacity:.75">Tổng thời gian: '+fmtT(tot)+'</span>';

/* ---- đọc luồng trả về của Gemini (SSE) ---- */
async function streamGem(model,key,body,call,ctl){
  const r=await fetch(BASE+'/models/'+model+':streamGenerateContent?alt=sse&key='+encodeURIComponent(key),{method:'POST',headers:{'content-type':'application/json'},body:body,signal:ctl.signal});
  if(!r.ok){ const j=await r.json().catch(()=>({})); return {ok:false,status:r.status,j:j}; }
  call.stage='think'; call.last=Date.now(); call.t0=Date.now();
  const rd=r.body.getReader(), dec=new TextDecoder(); let buf='',text='',fin='',block='';
  for(;;){ const o=await rd.read(); if(o.done) break; call.last=Date.now(); buf+=dec.decode(o.value,{stream:true}); let i;
    while((i=buf.indexOf('\n'))>=0){ const line=buf.slice(0,i).replace(/\r$/,''); buf=buf.slice(i+1); if(line.indexOf('data:')!==0) continue; const s=line.slice(5).trim(); if(!s||s==='[DONE]') continue;
      let j; try{ j=JSON.parse(s); }catch(e){ continue; }
      if(j.error) return {ok:false,status:j.error.code||500,j:j};
      if(j.promptFeedback&&j.promptFeedback.blockReason) block=j.promptFeedback.blockReason;
      const c=(j.candidates||[])[0]; if(c){ ((c.content&&c.content.parts)||[]).forEach(p=>{ if(p.text&&!p.thought){ text+=p.text; call.stage='write'; call.chars=text.length; } }); if(c.finishReason) fin=c.finishReason; } } }
  return {ok:true,text:text,fin:fin,block:block}; }
/* ---- chế độ chờ trọn gói (dự phòng khi stream bị đơ) ---- */
async function nonStream(model,key,body,call,ctl){
  call.stage='think'; call.last=Date.now(); call.t0=Date.now();
  const r=await fetch(BASE+'/models/'+model+':generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'content-type':'application/json'},body:body,signal:ctl.signal});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.error) return {ok:false,status:r.ok?(j.error.code||500):r.status,j:j};
  const c=(j.candidates||[])[0]||{}; let text='';
  ((c.content&&c.content.parts)||[]).forEach(p=>{ if(p.text&&!p.thought) text+=p.text; });
  call.chars=text.length;
  return {ok:true,text:text,fin:c.finishReason||'',block:(j.promptFeedback&&j.promptFeedback.blockReason)||''};
}
/* ---- gọi Gemini thay cho Claude ---- */
gCall=window.gCall=async function(content,system){
  const key=gemKey(); if(!key) throw new Error('Chưa có API key Gemini miễn phí. Vào mục “Cấu hình AI” ở cuối trang Chấm bài AI để dán key (lấy miễn phí tại aistudio.google.com/apikey).');
  const kind=kindOf(content), parts=content.map(b=>b.type==='text'?{text:b.text}:(b.type==='image'||b.type==='document')?{inlineData:{mimeType:b.source.media_type,data:b.source.data}}:null).filter(Boolean);
  const call={kind:kind,stage:'send',chars:0,exp:KIND[kind][1],size:'0',t0:Date.now(),last:Date.now(),note:'',done:false,stop:false,ctl:null,model:'',lim:0};
  PG.calls=PG.calls.filter(c=>!c.done); PG.calls.push(call);
  let model=gemModel(), think=true, switched=false, persist=false, ns=false, waits=0; const bad=new Set();
  const pickNext=async()=>{ let l=GEM.models; if(!l.length){ try{ l=await listModels(key); }catch(x){ l=[]; } }
    return [DEF].concat(l).concat(['gemini-flash-latest','gemini-flash-lite-latest']).find(m=>!bad.has(m)&&m!==model); };
  const hop=async(why,sticky)=>{ bad.add(model); const nx=await pickNext(); if(!nx) return false;
    call.stage='wait'; call.note='model '+model+' '+why+' — chuyển sang '+nx+'…'; model=nx; switched=true; if(sticky) persist=true; await wait(1200); return true; };
  const coolDown=async(msg)=>{ bad.clear(); call.stage='wait'; for(let s=15;s>0;s--){ if(call.stop) throw new Error('Đã dừng theo yêu cầu.'); call.note=msg+' — tự thử lại sau '+s+' giây…'; await wait(1000); } };
  const mk=()=>{ const gc={maxOutputTokens:24000,temperature:kind==='grade'?0:0.2,responseMimeType:'application/json'};
    if(think){ if(/gemini-2\.5/.test(model)) gc.thinkingConfig={thinkingBudget:kind==='grade'?4096:kind==='extract'?2048:0}; else if(/gemini-[3-9]/.test(model)) gc.thinkingConfig={thinkingLevel:kind==='grade'?'low':'minimal'}; }
    return JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:parts}],generationConfig:gc}); };
  try{
    for(let at=0;at<60;at++){
      call.model=model; call.lim=window.GEM_LIM||40000; const body=mk(); call.size=(body.length/1048576).toFixed(1); call.stage='send'; call.chars=0; call.t0=Date.now(); call.last=Date.now();
      const ctl=new AbortController(); call.ctl=ctl; let timedOut=false;
      const wd=setInterval(()=>{ if(Date.now()-call.last>(call.stage==='write'?60000:call.stage==='send'?call.lim:(ns?240000:150000))){ timedOut=true; ctl.abort(); } },2000);

        if(timedOut&&call.stage==='send'&&!ns){ ns=true; call.stage='wait'; call.note='chế độ stream không phản hồi — chuyển sang chế độ chờ trọn gói…'; await wait(800); continue; }
        if(timedOut&&(call.stage==='send'||ns)){ ns=false; if(await hop('không phản hồi',false)) continue; }
        if(timedOut) throw new Error('Gemini không phản hồi quá lâu. Hãy thử lại, hoặc giảm số trang/ảnh gửi lên.'); throw new Error('Mất kết nối khi gọi Gemini: '+(e.message||e)); }
      clearInterval(wd);
      if(res.ok){
        if(!res.text) throw new Error(res.block?'Gemini từ chối xử lý bài này ('+res.block+'). Hãy thử chụp lại ảnh rõ hơn.':'Gemini không trả về nội dung (lý do: '+(res.fin||'không rõ')+'). Hãy thử lại.');
        if(res.fin==='MAX_TOKENS') throw new Error('Kết quả quá dài nên bị cắt. Hãy thử lại hoặc chia nhỏ bài.');
        if(switched){ if(persist) lsSet('geoai_gmodel',model); toast('Model trước không dùng được, đã tự chuyển sang '+model,'ok'); } return res.text; }
      const msg=(res.j&&res.j.error&&res.j.error.message)||'';
