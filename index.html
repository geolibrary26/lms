<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
:root{--p:#0f766e;--p2:#115e59;--ps:#e6f4f2;--ink:#0f1f2e;--soft:#5b6b7a;--faint:#94a3b3;--line:#e2e8ee;--bg:#f4f7f9;--card:#fff;--red:#dc2626;--reds:#fee2e2;--grn:#16a34a;--grns:#dcfce7;--amb:#d97706;--ambs:#fef3c7;--blu:#2563eb;--blus:#dbeafe;--r:12px;--sh:0 1px 3px rgba(15,31,46,.08),0 4px 14px -6px rgba(15,31,46,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.hidden{display:none!important}
.muted{color:var(--soft)}.small{font-size:12px}.b{font-weight:700}.right{text-align:right}.center{text-align:center}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1}.between{justify-content:space-between}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
/* auth */
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#ecf8f6,#f4f7f9 60%)}
.authcard{width:100%;max-width:400px;background:#fff;border-radius:18px;box-shadow:0 20px 60px -20px rgba(15,118,110,.35);padding:34px 30px}
.authcard .logo{font-size:44px;text-align:center}
.authcard h1{text-align:center;font-size:21px;font-weight:800;margin-top:6px}
.authcard .sub{text-align:center;color:var(--soft);margin:4px 0 22px}
.field{margin-bottom:14px}.field label{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin-bottom:5px}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:9px;font-weight:600;font-size:13.5px;border:1.5px solid var(--line);background:#fff;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--p);color:var(--p2)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}.btn.pri:hover{background:var(--p2);color:#fff}
.btn.red{color:var(--red)}.btn.red:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px}.btn.full{width:100%;padding:11px}
.btn:disabled{opacity:.5;pointer-events:none}
.err{background:var(--reds);color:#991b1b;padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:12px}
.ok{background:var(--grns);color:#166534;padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:12px}
.link{color:var(--p);font-weight:600;cursor:pointer}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:236px;background:#0b2b2a;color:#d6ecea;padding:18px 12px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:.25s}
.side .brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.side .brand .lg{font-size:28px}.side .brand b{font-size:13.5px;line-height:1.25;color:#fff;display:block}.side .brand span{font-size:11px;opacity:.65}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-weight:600;color:#bcdcd8;width:100%;text-align:left;margin-bottom:2px}
.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:var(--p);color:#fff}.nav i{font-style:normal;width:20px;text-align:center}
.me{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12.5px}
.me b{color:#fff;display:block}
.main{flex:1;margin-left:236px;padding:22px 26px 60px;min-width:0}
.top{display:none;align-items:center;gap:10px;margin-bottom:14px}
.ham{font-size:22px;padding:4px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
@media(max-width:860px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}.main{margin-left:0;padding:14px 14px 60px}.top{display:flex}}
h2.pt{font-size:22px;font-weight:800;letter-spacing:-.02em}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.stat .v{font-size:26px;font-weight:800;margin-top:4px}.stat .l{color:var(--soft);font-size:12.5px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.pill-gray{background:#edf1f5;color:var(--soft)}.pill-grn{background:var(--grns);color:#166534}.pill-red{background:var(--reds);color:#991b1b}.pill-amber{background:var(--ambs);color:#92400e}.pill-blue{background:var(--blus);color:#1e40af}.pill-teal{background:var(--ps);color:var(--p2)}
.pill-live{background:#fde7ea;color:#c0263d}.pill-live::before{content:"";width:7px;height:7px;border-radius:50%;background:#d9314a;animation:pu 1.2s infinite}
@keyframes pu{50%{opacity:.3}}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);padding:9px 10px;border-bottom:2px solid var(--line);background:#fafcfd;position:sticky;top:0;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:#fafcfd}
.scroll{overflow:auto;max-height:70vh;border-radius:var(--r)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar .inp{width:auto;min-width:150px}
.mk{display:inline-flex;gap:4px;flex-wrap:wrap}
.mk button{padding:6px 11px;border-radius:8px;border:1.5px solid var(--line);font-weight:700;font-size:12.5px;background:#fff;color:var(--soft)}
.mk button:hover{border-color:var(--p)}
.mk button.P.on{background:var(--grn);border-color:var(--grn);color:#fff}.mk button.L.on{background:var(--amb);border-color:var(--amb);color:#fff}
.mk button.E.on{background:var(--blu);border-color:var(--blu);color:#fff}.mk button.A.on{background:var(--red);border-color:var(--red);color:#fff}
.cell{display:inline-flex;width:26px;height:26px;border-radius:7px;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.c-P{background:var(--grns);color:#166534}.c-L{background:var(--ambs);color:#92400e}.c-E{background:var(--blus);color:#1e40af}.c-A{background:var(--reds);color:#991b1b}.c-N{color:var(--faint)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ps);color:var(--p2);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.bar{height:8px;border-radius:8px;background:#edf1f5;overflow:hidden}.bar>div{height:100%;background:var(--p)}
.empty{padding:36px 10px;text-align:center;color:var(--soft)}
.sc{width:64px;padding:6px 8px;border:1.5px solid var(--line);border-radius:7px;text-align:center}.sc:focus{outline:none;border-color:var(--p)}
.moneyin{width:110px;padding:6px 8px;border:1.5px solid var(--line);border-radius:7px;text-align:right}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(7,19,34,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.md{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}.md.wide{max-width:760px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.mh h3{font-size:16px}
.x{font-size:24px;line-height:1;color:var(--soft);padding:0 6px}
.mb{padding:18px 20px;overflow:auto}.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}.mf:empty{display:none}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.cols2{grid-template-columns:1fr}}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.ti{background:#0f1f2e;color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--sh)}.ti.err{background:var(--red)}.ti.ok{background:var(--p)}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}
.sch{display:flex;gap:6px;margin-bottom:6px;align-items:center}.sch .inp{padding:7px 8px}
pre.code{background:#0f1f2e;color:#c9e7e3;padding:14px;border-radius:10px;overflow:auto;font-size:12px;max-height:300px}
/* join */
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.cam img{transform:none}
.cam .oval{position:absolute;inset:12% 24%;border:3px dashed rgba(255,255,255,.7);border-radius:50%}
.tick{width:70px;height:70px;border-radius:50%;background:var(--grns);color:var(--grn);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.thumbs img{width:100%;border-radius:8px;aspect-ratio:4/3;object-fit:cover}
.chart{display:flex;gap:14px;align-items:flex-end;height:140px;padding-top:8px}.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bb{width:100%;max-width:46px;background:#cfe8e5;border-radius:6px 6px 0 0;position:relative;display:flex;align-items:flex-end}.chart .bb>div{width:100%;background:var(--p);border-radius:6px 6px 0 0}
/* ===== THIẾT KẾ MỚI (navy · xanh) ===== */
:root{--p:#2563a8;--p2:#1a4a7a;--ps:#e8f0f8;--ink:#0f1a2a;--soft:#5a6b7d;--faint:#8a9aab;--line:#dce4ec;--bg:#f0f4f8;--red:#c0405a;--reds:#fde8ed;--grn:#1e8a5a;--grns:#e6f5ee;--amb:#c47a1a;--ambs:#fef3e2;--blu:#2563a8;--blus:#e8f0f8;--r:14px;--sh:0 1px 2px rgba(7,19,34,.05),0 8px 24px -10px rgba(7,19,34,.14)}
body{background:linear-gradient(180deg,#edf1f7 0,#f4f7fb 420px) fixed}
h2.pt{font-size:24px;letter-spacing:-.025em;color:#0f2137}
.svg-ic{flex:none;vertical-align:-.2em}
.side{width:256px;background:linear-gradient(190deg,#14304d,#0d2137 55%,#091827);border-right:1px solid rgba(255,255,255,.06)}
.main{margin-left:256px;max-width:none;padding:26px 34px 70px}
@media(max-width:860px){.main{margin-left:0;padding:14px 14px 70px}}
.brand{gap:12px;padding:2px 6px 18px}.brand b{font-size:14px}
.bm,.bl{width:42px;height:42px;border-radius:12px;flex:none}
.bm{display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#3b82c4,#2563a8);box-shadow:0 6px 16px -6px rgba(59,130,196,.8)}
.bl{object-fit:contain;background:#fff;padding:3px;display:block}
.nav{gap:12px;padding:11px 14px;border-radius:10px;color:#b8cce0;font-weight:500;font-size:13.5px;transition:.2s}
.nav .svg-ic{width:18px;height:18px}.nav i{display:flex;width:auto}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:linear-gradient(90deg,rgba(59,130,196,.35),rgba(59,130,196,.08));color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #60a5fa}
.me{border-top:1px solid rgba(255,255,255,.1)}.me span{color:#8fb0cc}
.lo{width:100%;background:transparent;color:#cfe0f0;border-color:rgba(255,255,255,.2)}.lo:hover{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.4)}
.ham{display:flex;border-radius:10px}
.card{border-radius:var(--r);border:1px solid #e3eaf1;box-shadow:var(--sh)}.card>.b{color:#0f2137}
.stat{display:flex;gap:14px;align-items:center}.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.si{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none}
.c1{background:#e8f0f8;color:#2563a8}.c2{background:#e6f5ee;color:#1e8a5a}.c3{background:#f0e8fa;color:#6b3fa0}.c4{background:#fef3e2;color:#c47a1a}
.btn{border-radius:9px;padding:9px 16px;gap:7px;box-shadow:0 1px 2px rgba(7,19,34,.05)}
.btn:hover{border-color:#3b82c4;background:#f8fafd;color:var(--p2);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,#2563a8,#1a4a7a);border-color:transparent;box-shadow:0 4px 14px -4px rgba(37,99,168,.5)}.btn.pri:hover{background:linear-gradient(135deg,#2e70bc,#2563a8);color:#fff}
.btn.red:hover{background:var(--reds)}.btn.sm{padding:6px 11px}
.inp:focus{border-color:#3b82c4;box-shadow:0 0 0 3px rgba(37,99,168,.18)}
.tbl th{background:#f6f9fc;font-size:11px}.tbl tbody tr:nth-child(even) td{background:#fafcfe}.tbl tr:hover td{background:#f0f6fc!important}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#14304d,#1a4a7a 60%,#2563a8);color:#fff;border-radius:20px;padding:24px 28px;margin-bottom:18px;box-shadow:0 18px 40px -20px rgba(20,48,77,.9)}
.hero:after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,.35),transparent 70%)}
.hero h2{font-size:24px;font-weight:800;letter-spacing:-.02em;position:relative}.hero .s{opacity:.85;margin-top:5px;position:relative}
.urow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.urow:last-child{border:0}
.avatar{overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fef3e2;color:#c47a1a;border-radius:99px;padding:5px 12px;font-weight:600;font-size:12.5px;margin:2px 4px 2px 0}
.lnk{cursor:pointer;color:var(--p)}.lnk:hover{text-decoration:underline}
.md{border-radius:18px;animation:pop .2s ease-out}@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.mh{background:#f8fafc;border-radius:18px 18px 0 0}
.lgp{width:68px;height:68px;border-radius:16px;background:#f0f4f8;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);flex:none}.lgp .bm,.lgp .bl{width:56px;height:56px}
.authwrap{background:radial-gradient(1200px 700px at 10% -20%,#1d3f63,#0f2137 45%,#071322)}
.authcard{border-radius:22px;box-shadow:0 30px 80px -24px rgba(0,0,0,.6)}
.authcard .logo{font-size:0;display:flex;justify-content:center;color:#2563a8}.authcard .logo .svg-ic{width:46px;height:46px}.authcard .logo .bm,.authcard .logo .bl{width:56px;height:56px}
.authcard .tick .svg-ic{width:36px;height:36px}
.btn.gbtn{font-size:15px;padding:12px;gap:10px}
.lgs{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:radial-gradient(1200px 700px at 0 -10%,#1d3f63,#0f2137 45%,#071322)}
.lgs-l{color:#fff;padding:56px 64px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.lgs-brand{display:flex;align-items:center;gap:14px;font-size:18px}
.lgs-l h2{font-size:38px;line-height:1.15;font-weight:800;letter-spacing:-.03em}
.lgs-f{display:grid;gap:14px;color:#b8cce0}.lgs-f .row{gap:12px}.lgs-f .svg-ic{color:#60a5fa}
.lgs-r{display:flex;align-items:center;justify-content:center;padding:24px}
@media(min-width:861px){.lgs-r .logo{display:none}}
@media(max-width:860px){.lgs{grid-template-columns:1fr}.lgs-l{display:none}}
/* ===== TRANG VÀO LỚP ===== */
.authcard .logo .bm,.authcard .logo .bl{width:84px;height:84px;border-radius:22px}.authcard .logo .bm .svg-ic{width:42px;height:42px}
.lgs-brand .bm,.lgs-brand .bl{width:56px;height:56px;border-radius:16px}
.jw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 700px at 10% -20%,#1d3f63,#0f2137 45%,#071322)}
.jc{width:100%;max-width:480px;background:#fff;border-radius:24px;padding:34px 30px 22px;box-shadow:0 30px 80px -24px rgba(0,0,0,.6)}
.jc h1{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:14px}
.jc .sub{text-align:center;color:var(--soft);margin:6px 0 18px;line-height:1.7}
.jl{display:flex;justify-content:center}.jl .bl,.jl .bm{width:112px;height:112px;border-radius:28px}.jl .bm .svg-ic{width:56px;height:56px}
.jl .bl{padding:6px;border:1px solid var(--line);box-shadow:0 10px 28px -10px rgba(7,19,34,.3)}
.jf{text-align:center;font-size:11.5px;color:var(--faint);margin-top:20px}
.jst{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 22px}
.jst>div{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--faint)}
.jst span{width:24px;height:24px;border-radius:50%;background:#edf1f5;display:flex;align-items:center;justify-content:center;font-size:12px}
.jst .on{color:var(--p2)}.jst .on span{background:var(--p);color:#fff}.jst .dn{color:var(--grn)}.jst .dn span{background:var(--grn);color:#fff}
.jst i{width:28px;height:2px;background:var(--line)}
.jq{text-align:center;font-size:18px;font-weight:800;margin-bottom:4px}
.jsr{position:relative}.jsr .svg-ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--faint)}
.jsr .inp{padding:14px 14px 14px 46px;font-size:16px;border-radius:12px}
.jr{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.jri{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;background:#fff;border-bottom:1px solid var(--line);transition:.15s}
.jri b{flex:1}.jri .svg-ic{color:var(--faint)}.jri:hover{background:#f0f6fc}.jri:last-child{border:0}
.jas{display:flex;align-items:center;gap:12px;background:#f0f6fc;border:1px solid #cfe0f0;border-radius:12px;padding:12px 14px;margin-bottom:16px}
.dob{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:10px}.dob .inp{text-align:center;font-size:18px;font-weight:700;padding:12px 6px}
.warn{background:var(--ambs);color:#92400e;padding:10px 12px;border-radius:10px}
/* ===== GIAO DIỆN v3: bố cục rộng, gộp lớp, ảnh vào lớp ===== */
.main{max-width:none}
.nowrap{white-space:nowrap}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}

/* Gộp / gỡ gộp lớp cho một buổi (lớp chính + các lớp được gộp). Dùng chung cho buổi trực tiếp và buổi online. */
async function applyMerge(pid,date,list){
  list=Array.from(new Set(list||[])).filter(x=>x&&x!==pid&&S.classes[x]);
  const id=pid+'_'+date, snap=await C('attendance').where('date','==',date).get(), docs={};
  snap.docs.forEach(x=>{ docs[x.id]=Object.assign({id:x.id},x.data()); });
  const cur=docs[id]||{}, old=cur.merged||[];
  if(!list.length&&!old.length) return;
  const add=list.filter(x=>!old.includes(x)), rem=old.filter(x=>!list.includes(x)), all=Object.values(docs);
  const host=all.find(d=>d.id!==id&&(d.merged||[]).includes(pid));
  if(host) throw new Error('Lớp '+className(pid)+' đang được gộp vào buổi của lớp '+className(host.classId)+' ngày này. Hãy mở buổi đó để chỉnh sửa.');
  const moves={};
  for(const cid of add){
    if(all.find(d=>d.id!==id&&(d.merged||[]).includes(cid))) throw new Error('Lớp '+className(cid)+' đã được gộp vào một buổi khác trong ngày này.');
    const own=docs[cid+'_'+date];
    if(own){ if(own.online) throw new Error('Lớp '+className(cid)+' đang có buổi online riêng ngày này. Hãy huỷ buổi đó trước khi gộp.'); moves[cid]=own; }
  }
  await C('attendance').doc(id).set({classId:pid,date,merged:list.length?list:FV.delete()},{merge:true});
  const cm=cur.marks||{};
  for(const cid of add){ const own=moves[cid]; if(!own) continue; const mm={};
    Object.entries(own.marks||{}).forEach(([sid,m])=>{ if(!cm[sid]) mm['marks.'+sid]=m; });
    if(Object.keys(mm).length) await C('attendance').doc(id).update(mm);
    await C('attendance').doc(cid+'_'+date).delete(); try{ await C('links').doc(cid+'_'+date).set({redirect:id}); }catch(e){} }
  for(const cid of rem){ try{ await C('links').doc(cid+'_'+date).delete(); }catch(e){} const stay=[pid].concat(list), mm={}, del={};
    Object.entries(cur.marks||{}).forEach(([sid,m])=>{ const st=S.students[sid]; if(st&&(st.classIds||[]).includes(cid)&&!stay.some(x=>(st.classIds||[]).includes(x))){ mm[sid]=m; del['marks.'+sid]=FV.delete(); } });
    if(Object.keys(mm).length){ await C('attendance').doc(cid+'_'+date).set({classId:cid,date,marks:mm},{merge:true}); await C('attendance').doc(id).update(del); } }
  if(!list.length){ const f=(await C('attendance').doc(id).get()).data()||{}; if(!f.online&&!Object.keys(f.marks||{}).length) await C('attendance').doc(id).delete(); }
  try{ log((list.length?'Gộp lớp ':'Huỷ gộp lớp ')+className(pid)+(list.length?' + '+list.map(className).join(' + '):'')+' ngày '+fmtD(date)); }catch(e){}
}

  try{ await applyMerge(d.classId,d.date,[]); toast('Đã huỷ gộp lớp','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); } }

   '<div class="mgnote">'+ic('info',16)+'<div>Học sinh của các lớp được gộp sẽ cùng nằm trong <b>một danh sách điểm danh</b>. Chuyên cần vẫn tính riêng cho từng lớp. Muốn học chung <b>online</b>, hãy dùng nút “Tạo buổi online” — học sinh hai lớp vào chung một link.</div></div>',

function vAtt(){
  const cls=activeClasses(); if(!cls.length) return pageHead('Điểm danh','Ghi nhận chuyên cần theo từng buổi học')+'<div class="mt16">'+noClass()+'</div>';
  const p=S.P.att; if(!p.classId||!S.classes[p.classId]) p.classId=cls[0].id; if(!p.date) p.date=dk(new Date());
  ensureAtt(p.date.slice(0,7));
  const {d,id,pc,marks,studs}=attCtx(), merged=isMerged(d), cnt={P:0,L:0,E:0,A:0};
  studs.forEach(s=>{ const m=marks[s.id]; if(m&&cnt[m.s]!=null) cnt[m.s]++; });
  const unm=studs.length-cnt.P-cnt.L-cnt.E-cnt.A, pct=studs.length?Math.round((studs.length-unm)/studs.length*100):0;
  const act='<button class="btn" onclick="mergeModal(\''+pc+'\',\''+p.date+'\')">'+ic('layers')+' '+(merged?'Sửa gộp lớp':'Gộp lớp')+'</button><button class="btn pri" onclick="editSession(\''+(d.online?id:'')+'\',\''+pc+'\',\''+p.date+'\')">'+ic('video')+' '+(d.online?'Sửa buổi online':'Tạo buổi online')+'</button>';
  const mini=(l,v,c)=>'<div class="mini '+c+'"><b>'+v+'</b><span>'+l+'</span></div>';
  return pageHead('Điểm danh',wdOf(p.date)+', '+fmtD(p.date)+' · '+(merged?sessClassNames(d):esc(className(p.classId))),act)+
  '<div class="toolbar tbcard"><select class="inp" onchange="setP(\'att\',\'classId\',this.value)">'+classOpts(p.classId)+'</select><button class="btn" onclick="shiftDate(-1)">'+ic('arrowL')+'</button><input class="inp" type="date" value="'+p.date+'" onchange="setP(\'att\',\'date\',this.value)"><button class="btn" onclick="shiftDate(1)">'+ic('arrowR')+'</button><button class="btn" onclick="setP(\'att\',\'date\',dk(new Date()))">Hôm nay</button></div>'+
  (merged?'<div class="mgbanner">'+ic('layers',22)+'<div class="grow"><b>Buổi học gộp · '+studs.length+' học sinh</b><div class="small" style="margin-top:4px">'+ctags(d)+(p.classId!==d.classId?' · điểm danh chung trong buổi của lớp chính <b>'+esc(className(d.classId))+'</b>':'')+'</div></div><button class="btn sm" onclick="mergeModal(\''+pc+'\',\''+p.date+'\')">Sửa</button><button class="btn sm red" onclick="unmergeSession(\''+id+'\')">Huỷ gộp</button></div>':'')+
  (d.online?'<div class="card mb12 linkcard"><span class="si c1">'+ic('video',20)+'</span><div class="grow"><b>Link vào lớp cho học sinh</b><div class="small muted" style="word-break:break-all">'+esc(joinLink(id))+'</div></div><span class="pill '+PH[phase(d)][1]+'">'+PH[phase(d)][0]+'</span><button class="btn sm" onclick="copyText(joinLink(\''+id+'\'))">'+ic('copy',14)+' Sao chép</button><button class="btn sm" onclick="openRoom(\''+id+'\')">'+ic('external',14)+' Mở phòng</button><button class="btn sm" onclick="viewProofs(\''+id+'\')">'+ic('camera',14)+' Ảnh vào lớp</button></div>':'')+
  '<div class="minis">'+mini('Sĩ số',studs.length,'')+mini('Có mặt',cnt.P,'g')+mini('Muộn',cnt.L,'a')+mini('Phép',cnt.E,'b')+mini('Vắng',cnt.A,'r')+mini('Chưa điểm danh',unm,'x')+'</div>'+
  '<div class="bar mb12"><div style="width:'+pct+'%"></div></div>'+
  '<div class="toolbar" style="margin-top:0"><div class="jsr" style="min-width:230px;flex:1;max-width:340px">'+ic('search',16)+'<input class="inp" style="padding:9px 12px 9px 40px;font-size:14px" placeholder="Tìm học sinh…" value="'+esc(p.q||'')+'" oninput="attSearch(this.value)"></div><select class="inp" onchange="setP(\'att\',\'f\',this.value)"><option value="">Mọi trạng thái</option><option value="none" '+(p.f==='none'?'selected':'')+'>Chưa điểm danh</option><option value="P" '+(p.f==='P'?'selected':'')+'>Có mặt</option><option value="L" '+(p.f==='L'?'selected':'')+'>Muộn</option><option value="E" '+(p.f==='E'?'selected':'')+'>Phép</option><option value="A" '+(p.f==='A'?'selected':'')+'>Vắng</option></select><span class="grow"></span><button class="btn pri" onclick="markAll()">'+ic('check')+' Tất cả có mặt</button></div>'+
  (studs.length?'<div class="card" style="padding:0"><div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Học sinh</th><th>Ngày sinh</th><th>Lớp</th><th>Trạng thái</th><th></th></tr></thead><tbody id="attRows">'+attRows()+'</tbody></table></div></div>':'<div class="card empty">Lớp chưa có học sinh. Vào mục Học sinh để thêm.</div>');
}
function shiftDate(n){ const p=S.P.att, d=new Date(p.date+'T00:00'); d.setDate(d.getDate()+n); p.date=dk(d); render(); }
async function mark(sid,s){
  const c=attCtx(), cur=c.marks[sid]||null, ref=C('attendance').doc(c.id), cid=c.d.id?c.pc:c.p.classId;
  try{
    if(cur&&cur.s===s){ await ref.update({['marks.'+sid]:FV.delete()}); return; }
    await ref.set({classId:cid,date:c.p.date,marks:{[sid]:{s,t:Date.now(),m:(cur&&cur.m==='online')?'online':'manual',by:S.profile.name}}},{merge:true});
  }catch(e){ toast('Lỗi: '+e.message,'err'); }
}
async function markAll(){
  const c=attCtx(), cid=c.d.id?c.pc:c.p.classId, mm={};
  c.studs.forEach(s=>{ if(!c.marks[s.id]) mm[s.id]={s:'P',t:Date.now(),m:'manual',by:S.profile.name}; });
  if(!Object.keys(mm).length){ toast('Mọi học sinh đã có trạng thái'); return; }
  try{ await C('attendance').doc(c.id).set({classId:cid,date:c.p.date,marks:mm},{merge:true}); toast('Đã đánh dấu có mặt cho học sinh chưa điểm danh','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); }
}

/* ===================== GỘP LỚP · TRANG QUẢN LÝ ===================== */
function vMerge(){
  const p=S.P.mg; if(!p.month) p.month=mk(new Date()); ensureAtt(p.month);
  const list=Object.values(sessAll()).filter(d=>isMerged(d)&&d.date.startsWith(p.month)).sort((a,b)=>(b.date+(b.start||'')).localeCompare(a.date+(a.start||'')));
  const act='<button class="btn" onclick="mergeModal(activeClasses()[0]?activeClasses()[0].id:\'\',dk(new Date()))">'+ic('users')+' Gộp học trực tiếp</button><button class="btn pri" onclick="newOnline()">'+ic('video')+' Gộp học online</button>';
  const cards=list.map(d=>{ const studs=sessionStudents(d), n=Object.keys(d.marks||{}).length, ok=Object.values(d.marks||{}).filter(m=>m.s==='P'||m.s==='L').length, online=!!d.online;
    return '<div class="card mgcard"><div class="row between"><span class="pill '+(online?PH[phase(d)][1]:'pill-teal')+'">'+(online?ic('video',12)+' Online · '+PH[phase(d)][0]:ic('users',12)+' Trực tiếp')+'</span><span class="small muted">'+wdOf(d.date)+', '+fmtD(d.date)+'</span></div>'+
    '<div class="mt12 mgrow">'+sessClassIds(d).map((c,i)=>(i?'<span class="plus">+</span>':'')+'<div class="mgcls"><b>'+esc(className(c))+'</b><span class="small muted">'+classStudents(c).length+' HS</span></div>').join('')+'</div>'+
    (online?'<div class="small muted mt8">'+esc(d.title||'')+' · '+d.start+'–'+d.end+'</div>':'')+
    '<div class="row between mt12 small"><span>Đã điểm danh <b>'+n+'/'+studs.length+'</b></span><span class="muted">có mặt '+ok+'</span></div><div class="bar mt8"><div style="width:'+(studs.length?Math.round(n/studs.length*100):0)+'%"></div></div>'+
    '<div class="row wrap mt12"><button class="btn sm pri" onclick="go(\'att\',{classId:\''+d.classId+'\',date:\''+d.date+'\'})">Điểm danh</button>'+(online?'<button class="btn sm" onclick="copyText(joinLink(\''+d.id+'\'))">'+ic('link',14)+' Link</button><button class="btn sm" onclick="viewProofs(\''+d.id+'\')">'+ic('camera',14)+' Ảnh</button><button class="btn sm" onclick="editSession(\''+d.id+'\',\''+d.classId+'\',\''+d.date+'\')">Sửa</button>':'<button class="btn sm" onclick="mergeModal(\''+d.classId+'\',\''+d.date+'\')">Sửa gộp</button>')+'<button class="btn sm red" onclick="unmergeSession(\''+d.id+'\')">Huỷ gộp</button></div></div>'; }).join('');
  return pageHead('Gộp lớp','Hai hay nhiều lớp cùng học chung một buổi — trực tiếp hoặc chung một lớp online',act)+
  '<div class="toolbar tbcard"><input class="inp" type="month" value="'+p.month+'" onchange="setP(\'mg\',\'month\',this.value)"><span class="small muted">'+list.length+' buổi gộp trong tháng</span></div>'+
  (list.length?'<div class="grid g3">'+cards+'</div>':'<div class="card empty"><div class="emptyic">'+ic('layers',34)+'</div><div class="b" style="font-size:16px;color:var(--ink)">Chưa có buổi gộp nào trong tháng này</div><div class="mt8" style="max-width:520px;margin:8px auto 0">Dùng khi hai lớp cùng học chung một buổi (ví dụ lớp nghỉ, dạy bù, ôn tập chung). Học sinh của các lớp sẽ nằm chung một danh sách điểm danh; chuyên cần vẫn tính riêng theo từng lớp.</div></div>');
}

/* ---- buổi online ---- */
async function editSession(id,classId,date){
  const d=id?(S.onl[id]||S.att[id]||{}):{}; let link={};
  if(id){ try{ const l=await C('links').doc(id).get(); link=l.data()||{}; }catch(e){} }
  const c=S.classes[classId]||{}, sch=(c.schedule||[]).find(x=>x.dow===new Date(date+'T00:00').getDay())||{};
  const ex=sessionFor(classId,date)||{}, sel=d.merged||ex.merged||[], dt=d.title||(sel.length?'Buổi học gộp '+[classId].concat(sel).map(className).join(' + '):'Buổi học '+(c.name||''));
  modal(id?'Sửa buổi online':'Tạo buổi học online',
   '<div class="field"><label>Lớp chính</label><select class="inp" id="ssClass" onchange="ssMgRefresh()" '+(id?'disabled':'')+'>'+classOpts(classId)+'</select></div>'+
   '<div class="field"><label>'+ic('layers',14)+' Gộp lớp — các lớp cùng học chung link này (tuỳ chọn)</label><div id="mgList" class="mgbox">'+mergeChecks(classId,sel)+'</div></div>'+
   '<div class="field"><label>Tiêu đề buổi học</label><input class="inp" id="ssTitle" value="'+esc(dt)+'"></div>'+
   '<div class="cols2"><div class="field"><label>Ngày</label><input class="inp" id="ssDate" type="date" value="'+date+'" '+(id?'disabled':'')+'></div><div></div><div class="field"><label>Bắt đầu</label><input class="inp" id="ssStart" type="time" value="'+(d.start||sch.start||'18:00')+'"></div><div class="field"><label>Kết thúc</label><input class="inp" id="ssEnd" type="time" value="'+(d.end||sch.end||'19:30')+'"></div></div>'+
   '<div class="field"><label>Link phòng học (Google Meet / Zoom / Teams…)</label><input class="inp" id="ssUrl" placeholder="https://meet.google.com/…" value="'+esc(link.url||c.onlineUrl||'')+'"></div>'+
   '<div class="cols2"><div class="field"><label>Mở điểm danh trước (phút)</label><input class="inp" id="ssEarly" type="number" value="'+(d.early!=null?d.early:(S.settings.early!=null?S.settings.early:15))+'"></div><div class="field"><label>Tính muộn sau (phút)</label><input class="inp" id="ssLate" type="number" value="'+(d.late!=null?d.late:(S.settings.late!=null?S.settings.late:10))+'"></div></div>'+
   '<div class="small muted">Học sinh vào bằng link, chọn tên, nhập ngày sinh + trường rồi đưa mặt vào camera. Hệ thống thấy có khuôn mặt là tự điểm danh và lưu ảnh để trợ giảng xem lại.</div>',
   (id?'<button class="btn red" onclick="delSession(\''+id+'\')">Huỷ buổi online</button>':'')+'<button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" onclick="saveSession(\''+id+'\')">Lưu</button>');
}
function ssMgRefresh(){ const b=$('#mgList'); if(b) b.innerHTML=mergeChecks($('#ssClass').value,[]); }
async function saveSession(oldId){
  const cid=val('ssClass')||($('#ssClass')&&$('#ssClass').value), date=val('ssDate'), url=val('ssUrl'), list=Array.from(document.querySelectorAll('.mgc:checked')).map(x=>x.value);
  if(!cid||!date){ toast('Thiếu lớp hoặc ngày','err'); return; }
  if(url && !/^https?:\/\//i.test(url)){ toast('Link phải bắt đầu bằng http(s)://','err'); return; }
  const id=cid+'_'+date;
  try{
    const host=sessionFor(cid,date); if(host&&host.id!==id&&(host.merged||[]).includes(cid)) throw new Error('Lớp này đang được gộp vào buổi của lớp '+className(host.classId)+' ngày này. Hãy chọn lớp đó làm lớp chính.');
    await applyMerge(cid,date,list);
    await C('attendance').doc(id).set({classId:cid,date,online:true,title:val('ssTitle'),start:val('ssStart'),end:val('ssEnd'),early:+val('ssEarly')||0,late:+val('ssLate')||0,createdBy:S.profile.name},{merge:true});
    await C('links').doc(id).set({url,platform:url?new URL(url).hostname.replace(/^www\./,''):''});
    closeModal(); toast('Đã lưu buổi online','ok'); if(S.view==='att'){ S.P.att.classId=cid; S.P.att.date=date; render(); }
  }catch(e){ toast(e.message||String(e),'err'); }
}
async function delSession(id){ if(!confirm('Huỷ buổi online này? (Dữ liệu điểm danh và ảnh của buổi sẽ bị xoá)')) return;
  try{ try{ const ps=await C('proofs').where('docId','==',id).get(); await Promise.all(ps.docs.map(x=>C('proofs').doc(x.id).delete())); }catch(e){}
    await C('attendance').doc(id).delete(); await C('links').doc(id).delete(); closeModal(); toast('Đã huỷ','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); } }
async function openRoom(id){ try{ const l=(await C('links').doc(id).get()).data()||{}; if(l.url) window.open(l.url,'_blank','noopener'); else toast('Chưa có link phòng học — bấm Sửa để thêm','err'); }catch(e){ toast('Lỗi: '+e.message,'err'); } }

/* ===================== LỚP ONLINE ===================== */
const joinedN=o=>Object.values(o.marks||{}).filter(m=>m.m==='online').length;
function onlCard(o){ const ph=phase(o), tot=sessionStudents(o).length, n=joinedN(o), pct=tot?Math.round(n/tot*100):0;
  return '<div class="card oc ph-'+ph+'"><div class="row between"><span class="pill '+PH[ph][1]+'">'+PH[ph][0]+'</span><span class="small muted">'+wdOf(o.date)+', '+fmtD(o.date)+'</span></div>'+
  '<div class="b mt8" style="font-size:16px;letter-spacing:-.01em">'+esc(o.title||'Buổi online')+'</div>'+
  '<div class="small muted mt8 row wrap" style="gap:6px">'+ic('clock',13)+' '+o.start+'–'+o.end+' '+(isMerged(o)?'<span class="ctag mg">'+ic('layers',11)+' Gộp</span> ':'')+ctags(o)+'</div>'+
  '<div class="row between mt12 small"><span>Đã vào lớp <b>'+n+'/'+tot+'</b></span><b>'+pct+'%</b></div><div class="bar mt8"><div style="width:'+pct+'%"></div></div>'+
  '<div class="row wrap mt12"><button class="btn sm" onclick="copyText(joinLink(\''+o.id+'\'))">'+ic('link',14)+' Link</button><button class="btn sm" onclick="openRoom(\''+o.id+'\')">'+ic('external',14)+' Mở phòng</button><button class="btn sm" onclick="go(\'att\',{classId:\''+o.classId+'\',date:\''+o.date+'\'})">Điểm danh</button><button class="btn sm" onclick="viewProofs(\''+o.id+'\')">'+ic('camera',14)+' Ảnh</button><button class="btn sm" onclick="exportSession(\''+o.id+'\')">'+ic('download',14)+' Excel</button><button class="btn sm" onclick="editSession(\''+o.id+'\',\''+o.classId+'\',\''+o.date+'\')">Sửa</button></div></div>'; }
function onlList(){ const p=S.P.onl, q=norm(p.q||''), all=Object.values(S.onl);
  const act=all.filter(o=>phase(o)!=='ended').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)), done=all.filter(o=>phase(o)==='ended').sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
  let list=p.tab==='ended'?done:p.tab==='all'?all.sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)):act;
  if(q) list=list.filter(o=>norm((o.title||'')+' '+sessClassNames(o)).includes(q));
  return list.length?'<div class="grid g3">'+list.map(onlCard).join('')+'</div>':'<div class="card empty"><div class="emptyic">'+ic('video',34)+'</div>'+(all.length?'Không có buổi nào phù hợp.':'Chưa có buổi online nào. Bấm “Tạo buổi online” để bắt đầu.')+'</div>'; }
function onlSearch(v){ S.P.onl.q=v; const b=$('#onlList'); if(b) b.innerHTML=onlList(); }
function vOnline(){
  const p=S.P.onl, all=Object.values(S.onl), td=dk(new Date()), done=all.filter(o=>phase(o)==='ended'), up=all.filter(o=>phase(o)!=='ended');
  let rate=0,n=0; done.forEach(o=>{ const t=sessionStudents(o).length; if(t){ rate+=joinedN(o)/t; n++; } });
  const stat=(l,v,x,i,c)=>'<div class="card stat"><span class="si '+c+'">'+ic(i,22)+'</span><div><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(x?'<div class="small muted">'+x+'</div>':'')+'</div></div>';
  const tab=(k,l,c)=>'<button class="'+(p.tab===k?'on':'')+'" onclick="setP(\'onl\',\'tab\',\''+k+'\')">'+l+' <span>'+c+'</span></button>';
  return pageHead('Lớp học online','Học sinh vào bằng link, không cần đăng nhập — chọn tên, nhập ngày sinh & trường, đưa mặt vào camera để tự động điểm danh.','<button class="btn" onclick="go(\'merge\')">'+ic('layers')+' Gộp lớp</button><button class="btn pri" onclick="newOnline()">'+ic('plus',16)+' Tạo buổi online</button>')+
  '<div class="grid g4 mb16">'+stat('Hôm nay',all.filter(o=>o.date===td).length,'buổi online','calendar','c1')+stat('Đang diễn ra',all.filter(o=>phase(o)==='live').length,'','video','c2')+stat('Buổi gộp lớp',all.filter(isMerged).length,'','layers','c3')+stat('Tỉ lệ vào lớp TB',n?Math.round(rate/n*100)+'%':'—','các buổi đã kết thúc','userCheck','c4')+'</div>'+
  '<div class="toolbar" style="margin-top:0"><div class="seg">'+tab('active','Sắp tới & đang diễn ra',up.length)+tab('ended','Đã kết thúc',done.length)+tab('all','Tất cả',all.length)+'</div><span class="grow"></span><div class="jsr" style="min-width:220px;max-width:300px">'+ic('search',16)+'<input class="inp" style="padding:9px 12px 9px 40px;font-size:14px" placeholder="Tìm buổi học…" value="'+esc(p.q||'')+'" oninput="onlSearch(this.value)"></div></div>'+
  '<div id="onlList">'+onlList()+'</div>';
}
function newOnline(){ const c=activeClasses(); if(!c.length){ toast('Hãy tạo lớp trước','err'); return; } editSession('',c[0].id,dk(new Date())); }
function exportSession(id){ const o=S.onl[id]||S.att[id]; if(!o) return; const st={P:'Có mặt',L:'Muộn',E:'Có phép',A:'Vắng'}, rows=[['STT','Họ tên','Lớp','Trạng thái','Giờ vào lớp','Hình thức']];
  sessionStudents(o).forEach((s,i)=>{ const m=(o.marks||{})[s.id]; rows.push([i+1,s.name,stuTags(s,o).join(', '),m?st[m.s]:'Chưa điểm danh',m&&m.t?fmtHM(m.t):'',m?(m.m==='online'?'Tự điểm danh (online)':'Trợ giảng'):'']); });
  exportXlsx('Online_'+(o.title||'buoi')+'_'+o.date,rows); }

/* ---- Ảnh học sinh vào lớp online ---- */
let PX={};
function lightbox(src,cap,sid){ const e=document.createElement('div'); e.className='lb'; e.onclick=ev=>{ if(ev.target===e||ev.target.classList.contains('lbx')) e.remove(); };
  e.innerHTML='<button class="lbx" aria-label="Đóng">'+ic('x',22)+'</button><img src="'+src+'" alt=""><div class="cap">'+esc(cap||'')+'</div>'+(sid?'<button class="btn sm" onclick="dlPx(\''+sid+'\')">'+ic('download',14)+' Tải ảnh</button>':''); document.body.appendChild(e); }

function vScores(){
  const cls=activeClasses(); if(!cls.length) return '<h2 class="pt">Điểm số</h2><div class="mt16">'+noClass()+'</div>';
  const p=S.P.sc; if(!p.classId||!S.classes[p.classId]) p.classId=cls[0].id;
  const tests=Object.values(S.tests).filter(t=>t.classId===p.classId).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||0)-(b.createdAt||0)), studs=classStudents(p.classId);
  const avg=sid=>{ let s=0,w=0; tests.forEach(t=>{ const v=(t.scores||{})[sid]; if(v!=null&&v!==''){ const wt=+t.weight||1; s+=v/(+t.max||10)*10*wt; w+=wt; } }); return w?s/w:null; };
  const rank=a=>a==null?'':a>=8?'Giỏi':a>=6.5?'Khá':a>=5?'Trung bình':'Yếu';
  const rows=studs.map((s,i)=>{ const a=avg(s.id); return '<tr><td>'+(i+1)+'</td><td class="nowrap"><b>'+esc(s.name)+'</b></td>'+tests.map(t=>'<td class="center"><input class="sc" type="number" step="0.05" min="0" max="'+(t.max||10)+'" value="'+(((t.scores||{})[s.id])!=null?(t.scores||{})[s.id]:'')+'" onchange="saveScore(\''+t.id+'\',\''+s.id+'\',this)"></td>').join('')+'<td class="center"><b>'+(a==null?'—':a.toFixed(2))+'</b></td><td class="center small muted">'+rank(a)+'</td></tr>'; }).join('');
  const tavg=tests.map(t=>{ const v=Object.values(t.scores||{}).filter(x=>x!=null&&x!==''); return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):'—'; });
  return '<div class="row between wrap"><h2 class="pt">Điểm số</h2><div class="row"><button class="btn" onclick="exportScores()">'+ic('download')+' Excel</button><button class="btn pri" onclick="editTest()">+ Thêm bài kiểm tra</button></div></div><div class="toolbar"><select class="inp" onchange="setP(\'sc\',\'classId\',this.value)">'+classOpts(p.classId)+'</select><span class="small muted">Điểm trung bình quy về thang 10, có tính hệ số</span></div>'+
  (tests.length&&studs.length?'<div class="card" style="padding:0"><div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Học sinh</th>'+tests.map(t=>'<th class="center" style="cursor:pointer" onclick="editTest(\''+t.id+'\')" title="Sửa bài">'+esc(t.title)+'<div class="small muted" style="text-transform:none;font-weight:500">'+fmtD(t.date)+' · /'+(t.max||10)+' · hs'+(t.weight||1)+'</div></th>').join('')+'<th class="center">TB</th><th class="center">Xếp loại</th></tr></thead><tbody>'+rows+'<tr><td></td><td class="b small muted">TB lớp</td>'+tavg.map(v=>'<td class="center small b">'+v+'</td>').join('')+'<td></td><td></td></tr></tbody></table></div></div>':'<div class="card empty">'+(studs.length?'Chưa có bài kiểm tra. Bấm “Thêm bài kiểm tra” để tạo cột điểm.':'Lớp chưa có học sinh.')+'</div>');
}
function editTest(id){
  const t=id?S.tests[id]:{date:dk(new Date()),max:10,weight:1};
  modal(id?'Sửa bài kiểm tra':'Thêm bài kiểm tra','<div class="field"><label>Tên bài</label><input class="inp" id="tTitle" value="'+esc(t.title||'')+'" placeholder="VD: 15 phút số 1"></div><div class="cols2"><div class="field"><label>Ngày</label><input class="inp" id="tDate" type="date" value="'+t.date+'"></div><div class="field"><label>Thang điểm</label><input class="inp" id="tMax" type="number" value="'+(t.max||10)+'"></div><div class="field"><label>Hệ số</label><input class="inp" id="tW" type="number" step="0.5" value="'+(t.weight||1)+'"></div></div>',
   (id?'<button class="btn red" onclick="delTest(\''+id+'\')">Xoá bài</button>':'')+'<button class="btn" onclick="closeModal()">Huỷ</button><button class="btn pri" onclick="saveTest(\''+(id||'')+'\')">Lưu</button>');
}
async function saveTest(id){ const title=val('tTitle'); if(!title){ toast('Nhập tên bài','err'); return; } const data={classId:S.P.sc.classId,title,date:val('tDate'),max:+val('tMax')||10,weight:+val('tW')||1}; if(!id) data.createdAt=Date.now();
  try{ await C('tests').doc(id||uid()).set(data,{merge:true}); closeModal(); toast('Đã lưu','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); } }
async function delTest(id){ if(!confirm('Xoá bài kiểm tra và toàn bộ điểm?')) return; try{ await C('tests').doc(id).delete(); closeModal(); }catch(e){ toast('Lỗi: '+e.message,'err'); } }
async function saveScore(tid,sid,el){
  const t=S.tests[tid], v=el.value.trim(); let n=v===''?null:parseFloat(v);
  if(n!=null&&(isNaN(n)||n<0||n>(t.max||10))){ toast('Điểm phải từ 0 đến '+(t.max||10),'err'); el.value=((t.scores||{})[sid])!=null?t.scores[sid]:''; return; }
  try{ await C('tests').doc(tid).update({['scores.'+sid]:n==null?FV.delete():n}); }catch(e){ toast('Lỗi: '+e.message,'err'); }
}
function exportScores(){ const p=S.P.sc, tests=Object.values(S.tests).filter(t=>t.classId===p.classId).sort((a,b)=>(a.date||'').localeCompare(b.date||'')); const rows=[['Họ tên'].concat(tests.map(t=>t.title+' ('+fmtD(t.date)+')'),['TB'])];
  classStudents(p.classId).forEach(s=>{ let a=0,w=0; const r=[s.name]; tests.forEach(t=>{ const v=(t.scores||{})[s.id]; r.push(v!=null?v:''); if(v!=null){ const wt=+t.weight||1; a+=v/(+t.max||10)*10*wt; w+=wt; } }); r.push(w?+(a/w).toFixed(2):''); rows.push(r); }); exportXlsx('Diem_'+className(p.classId),rows); }

/* ===================== HỌC PHÍ ===================== */
const defaultDue = st => (st.classIds||[]).reduce((a,id)=>a+(+(S.classes[id]&&S.classes[id].fee)||0),0);
function feeOf(sid,m){ const f=S.fees[sid+'_'+m], st=S.students[sid]||{}; return { due:f&&f.due!=null?+f.due:defaultDue(st), paid:f?+f.paid||0:0, note:f&&f.note||'', paidAt:f&&f.paidAt||null, has:!!f }; }
function vFees(){
  const p=S.P.fee, m=S.feeMonth; ensureFees(m);
  let studs=Object.values(S.students).filter(s=>s.active!==false).sort(byName); if(p.classId) studs=studs.filter(s=>(s.classIds||[]).includes(p.classId)); const q=norm(p.q||''); if(q) studs=studs.filter(s=>norm(s.name).includes(q));
  let due=0,paid=0,debtN=0; const rows=studs.map((s,i)=>{ const f=feeOf(s.id,m); due+=f.due; paid+=Math.min(f.paid,f.due); const full=f.due>0&&f.paid>=f.due; if(f.due>0&&!full) debtN++;
    const st=f.due===0?'<span class="pill pill-gray">Miễn</span>':full?'<span class="pill pill-grn">Đã đóng</span>':f.paid>0?'<span class="pill pill-amber">Đóng một phần</span>':'<span class="pill pill-red">Chưa đóng</span>';
    return '<tr><td>'+(i+1)+'</td><td><b>'+esc(s.name)+'</b></td><td class="small">'+(s.classIds||[]).map(className).map(esc).join(', ')+'</td><td class="right"><input class="moneyin" type="number" step="10000" value="'+f.due+'" onchange="saveFee(\''+s.id+'\',\'due\',this.value)"></td><td class="right"><input class="moneyin" type="number" step="10000" value="'+f.paid+'" onchange="saveFee(\''+s.id+'\',\'paid\',this.value)"></td><td>'+st+'</td><td class="small muted">'+(f.paidAt?fmtD(dk(new Date(f.paidAt))):'')+'</td><td><input class="inp" style="padding:6px 8px;min-width:120px" value="'+esc(f.note)+'" placeholder="Ghi chú" onchange="saveFee(\''+s.id+'\',\'note\',this.value)"></td><td>'+(full||f.due===0?'':'<button class="btn sm pri" onclick="payFull(\''+s.id+'\')">Đóng đủ</button>')+'</td></tr>'; }).join('');
  // trend
  const [y,mo]=m.split('-').map(Number), all=Object.values(S.students).filter(s=>s.active!==false); const months=[]; for(let i=5;i>=0;i--) months.push(mk(new Date(y,mo-1-i,1)));
  const tr=months.map(mm=>{ let d=0,pd=0; all.forEach(s=>{ const f=feeOf(s.id,mm); d+=f.due; pd+=Math.min(f.paid,f.due); }); return {mm,d,pd}; }), mx=Math.max.apply(null,tr.map(x=>x.d).concat([1]));
  return '<div class="row between wrap"><h2 class="pt">Học phí</h2><button class="btn" onclick="exportFees()">'+ic('download')+' Xuất Excel</button></div><div class="toolbar"><input class="inp" type="month" value="'+m+'" onchange="S.feeMonth=this.value;render()"><select class="inp" onchange="setP(\'fee\',\'classId\',this.value)">'+classOpts(p.classId,true)+'</select><input class="inp" placeholder="Tìm học sinh…" value="'+esc(p.q||'')+'" oninput="S.P.fee.q=this.value;clearTimeout(window._fq);window._fq=setTimeout(render,250)"></div>'+
  '<div class="grid g4 mb16"><div class="card stat"><div class="l">Phải thu</div><div class="v">'+money(due)+'</div></div><div class="card stat"><div class="l">Đã thu</div><div class="v" style="color:var(--grn)">'+money(paid)+'</div></div><div class="card stat"><div class="l">Còn thiếu</div><div class="v" style="color:var(--red)">'+money(due-paid)+'</div></div><div class="card stat"><div class="l">Tỉ lệ thu · HS còn nợ</div><div class="v">'+(due?Math.round(paid/due*100):0)+'% <span class="small muted">· '+debtN+' HS</span></div></div></div>'+
  '<div class="card mb16"><div class="b">Thu học phí 6 tháng gần nhất</div><div class="chart">'+tr.map(x=>'<div class="col"><div class="small b">'+(x.pd?Math.round(x.pd/1000)+'k':'')+'</div><div class="bb" style="height:'+Math.max(4,Math.round(x.d/mx*90))+'px"><div style="height:'+(x.d?Math.round(x.pd/x.d*100):0)+'%"></div></div><div class="small muted">'+x.mm.slice(5)+'/'+x.mm.slice(2,4)+'</div></div>').join('')+'</div><div class="small muted">Cột nhạt: phải thu · cột đậm: đã thu</div></div>'+
  (studs.length?'<div class="card" style="padding:0"><div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Học sinh</th><th>Lớp</th><th class="right">Phải đóng</th><th class="right">Đã đóng</th><th>Trạng thái</th><th>Ngày đóng</th><th>Ghi chú</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>':'<div class="card empty">Không có học sinh.</div>');
}
async function saveFee(sid,field,v){
  const m=S.feeMonth, f=feeOf(sid,m), patch={studentId:sid,month:m}; if(!f.has) patch.due=f.due;
  if(field==='note') patch.note=v; else { const n=Math.max(0,parseFloat(v)||0); patch[field]=n; if(field==='paid'){ patch.paidAt=n>0?(f.paidAt||Date.now()):null; if(!f.has) patch.due=f.due; } }
  try{ await C('fees').doc(sid+'_'+m).set(patch,{merge:true}); }catch(e){ toast('Lỗi: '+e.message,'err'); }
}
function payFull(sid){ const f=feeOf(sid,S.feeMonth); saveFee(sid,'paid',f.due); }
function exportFees(){ const m=S.feeMonth, p=S.P.fee; let studs=Object.values(S.students).filter(s=>s.active!==false).sort(byName); if(p.classId) studs=studs.filter(s=>(s.classIds||[]).includes(p.classId)); const rows=[['Họ tên','Lớp','Phải đóng','Đã đóng','Còn thiếu','Ngày đóng','Ghi chú']]; studs.forEach(s=>{ const f=feeOf(s.id,m); rows.push([s.name,(s.classIds||[]).map(className).join(', '),f.due,f.paid,Math.max(0,f.due-f.paid),f.paidAt?fmtD(dk(new Date(f.paidAt))):'',f.note]); }); exportXlsx('HocPhi_'+m,rows); }

/* ===================== CÀI ĐẶT ===================== */
const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{d}/documents {
    function staff(){ return request.auth != null &&
      get(/databases/$(d)/documents/users/$(request.auth.uid)).data.status == 'active'; }
    match /users/{u} {
      allow read: if request.auth != null && (request.auth.uid == u || staff());
      allow create: if request.auth != null && request.auth.uid == u &&
        (request.resource.data.status == 'pending' || !exists(/databases/$(d)/documents/settings/main));
      allow update, delete: if staff();
    }
    match /settings/{id} {
      allow read: if request.auth != null;
      allow create: if request.auth != null && id == 'main';
      allow update, delete: if staff();
    }
    // Phần học sinh truy cập không cần đăng nhập (trang vào lớp online)
    match /classes/{id}    { allow read: if true; allow write: if staff(); }
    match /links/{id}      { allow read: if true; allow write: if staff(); }
    match /roster/{id} {
      allow read: if true; allow write: if staff();
      allow update: if request.resource.data.diff(resource.data).affectedKeys().hasOnly(['face','faceAt'])
                    && !('face' in resource.data);
    }
    match /attendance/{id} {
      allow read: if true; allow write: if staff();
      allow update: if request.resource.data.diff(resource.data).affectedKeys().hasOnly(['marks']);
    }
    match /proofs/{id}     { allow create: if true; allow read, write: if staff(); }
    // Mọi dữ liệu khác (students, tests, fees...) chỉ nhân sự được duyệt
    match /{c}/{id}        { allow read, write: if staff(); }
  }
}`;
function vSettings(){
  const st=S.settings||{}, owner=S.profile.owner, users=Object.values(S.users).sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||(a.name||'').localeCompare(b.name||'','vi'));
  return '<h2 class="pt">Cài đặt</h2><div class="grid g2 mt16"><div class="card"><div class="b mb12">Thông số hệ thống</div><div class="cols2"><div class="field"><label>Mở điểm danh trước (phút)</label><input class="inp" id="stEarly" type="number" value="'+(st.early!=null?st.early:15)+'"></div><div class="field"><label>Tính muộn sau (phút)</label><input class="inp" id="stLate" type="number" value="'+(st.late!=null?st.late:10)+'"></div></div><button class="btn pri" onclick="saveSettings()">Lưu cài đặt</button></div>'+
  '<div class="card"><div class="b mb12">Nhân sự (trợ giảng & giảng viên)</div>'+users.map(u=>'<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><b>'+esc(u.name)+'</b> '+(u.owner?'<span class="pill pill-teal">Chủ quản</span>':'')+'<div class="small muted">'+esc(u.role||'')+' · '+esc(u.email||'')+'</div></div><div class="row">'+(u.status==='pending'?'<span class="pill pill-amber">Chờ duyệt</span>':u.status==='disabled'?'<span class="pill pill-red">Đã khoá</span>':'<span class="pill pill-grn">Hoạt động</span>')+(owner&&!u.owner?(u.status==='active'?'<button class="btn sm red" onclick="setUserStatus(\''+u.id+'\',\'disabled\')">Khoá</button>':'<button class="btn sm pri" onclick="setUserStatus(\''+u.id+'\',\'active\')">Duyệt</button>'):'')+'</div></div>').join('')+'<div class="small muted mt12">Trợ giảng và giảng viên đã được duyệt đều có quyền quản trị: điểm danh, quản lí điểm, học phí.</div></div></div>'+
  '<div class="card mt16"><div class="b">Thiết lập Firebase (làm một lần)</div><ol class="small muted" style="margin:10px 0 10px 18px;line-height:1.8"><li>Firebase Console '+ic('arrowR')+' <b>Authentication</b> '+ic('arrowR')+' bật <b>Email/Password</b>; thêm tên miền website vào <i>Authorized domains</i>.</li><li><b>Firestore Database</b> '+ic('arrowR')+' tạo database (chế độ production).</li><li>Tab <b>Rules</b> '+ic('arrowR')+' dán đoạn bên dưới '+ic('arrowR')+' Publish.</li><li>Người đăng ký đầu tiên tự thành Chủ quản; những người sau cần được duyệt tại đây.</li></ol><div class="row between mb12"><span class="small b">Firestore Rules</span><button class="btn sm" onclick="copyText(RULES)">Sao chép</button></div><pre class="code">'+esc(RULES)+'</pre></div>';
}
async function saveSettings(){ try{ await C('settings').doc('main').set({early:+val('stEarly')||0,late:+val('stLate')||0},{merge:true}); toast('Đã lưu','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); } }
async function setUserStatus(id,s){ try{ await C('users').doc(id).update({status:s}); toast('Đã cập nhật','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); } }

/* ===================== TRANG HỌC SINH VÀO LỚP ONLINE (không đăng nhập) ===================== */
const J = { id:null, doc:null, cls:null, roster:[], sid:null, step:1, stream:null, tries:0, lock:0, link:null, busy:false, msg:'', msgKind:'' };
function jShell(inner){ $('#app').innerHTML='<div class="authwrap"><div class="authcard" style="max-width:460px">'+inner+'</div></div>'; }
function jErr(t){ jShell('<div class="center"><div class="logo">'+ic('frown')+'</div><h1>'+esc(t)+'</h1></div>'); }
async function bootJoin(){
  J.id=JOIN; jShell('<div class="center muted">Đang tải lớp học…</div>');
  try{
    const d=await C('attendance').doc(J.id).get(); if(!d.exists||!d.data().online) return jErr('Không tìm thấy lớp online');
    J.doc=d.data(); J.cids=[J.doc.classId].concat(J.doc.merged||[]);
    const cs=await Promise.all(J.cids.map(c=>C('classes').doc(c).get())); J.cnames=cs.map(x=>(x.data()||{}).name||'—'); J.cls={name:J.cnames.join(' + ')};
    const r=await C('roster').get(); J.roster=r.docs.map(x=>Object.assign({id:x.id},x.data())).filter(x=>x.active!==false&&(x.classIds||[]).some(c=>J.cids.includes(c))).sort(byName);
    renderJoin(); setInterval(()=>{ if(J.step===1) renderJoin(true); },30000);
  }catch(e){ jErr('Không tải được: '+(e.code==='permission-denied'?'chưa cấu hình quyền truy cập':e.message)); }
}
const jCls=s=>(s.classIds||[]).filter(c=>(J.cids||[]).includes(c)).map(c=>J.cnames[J.cids.indexOf(c)]).join(', ');
function jHead(){ const d=J.doc, ph=phase(d); return '<div class="logo">'+brandMark()+'</div><h1>'+esc(d.title||'Lớp học online')+'</h1><div class="sub">'+esc(J.cls.name||'')+' · '+fmtD(d.date)+' · '+d.start+'–'+d.end+'<br><span class="pill '+PH[ph][1]+'" style="margin-top:8px">'+PH[ph][0]+'</span></div>'; }
function renderJoin(soft){
  if(soft && document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName)) return;
  const d=J.doc, ph=phase(d); if(J.step===1||J.step===2) { /* check phase */ }
  if(J.step===3) return;
  if(ph==='upcoming'){ const t=new Date(times(d).s.getTime()-(d.early!=null?d.early:15)*60000); jShell(jHead()+'<div class="err" style="background:var(--ambs);color:#92400e">Chưa đến giờ. Điểm danh mở lúc <b>'+fmtHM(t)+'</b>.</div>'); return; }
  if(ph==='ended'){ jShell(jHead()+'<div class="err">Buổi học đã kết thúc.</div>'); return; }
  if(J.step===1){
    jShell(jHead()+'<div id="jmsg"></div><div class="field"><label>Họ và tên của em</label><select class="inp" id="jName"><option value="">— Chọn tên —</option>'+J.roster.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')+'</select></div><div class="field"><label>Ngày sinh</label><input class="inp" id="jDob" type="date"></div><div class="field"><label>Trường đang học</label><input class="inp" id="jSchool" placeholder="VD: THCS Nguyễn Tất Thành"></div><button class="btn pri full" onclick="jVerifyInfo()">Tiếp tục</button><div class="small muted center mt12">Bước tiếp theo: chụp khuôn mặt để điểm danh.</div>'); return;
  }
  if(J.step===2){
    jShell(jHead()+'<div class="b mb12 center">Xin chào '+esc((J.roster.find(x=>x.id===J.sid)||{}).name)+'</div><div class="cam" id="jCam"><video id="jv" autoplay playsinline muted></video><div class="oval"></div></div><div id="jmsg" class="mt12">'+(J.msg?'<div class="'+(J.msgKind||'err')+'">'+J.msg+'</div>':'')+'</div><button class="btn pri full mt8" id="jShot" onclick="jCapture()" disabled>'+ic('camera')+' Chụp & điểm danh</button><button class="btn full mt8" onclick="J.step=1;jStop();renderJoin()">'+ic('arrowL')+' Quay lại</button>');
    jStartCam(); return;
  }
}
function jStop(){ if(J.timer){ clearInterval(J.timer); J.timer=null; } if(J.stream){ J.stream.getTracks().forEach(t=>t.stop()); J.stream=null; } }
async function jStartCam(){
  try{ jStop(); J.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1080}},audio:false}); const v=$('#jv'); if(!v) return; v.srcObject=J.stream; v.play().catch(()=>{}); const b=$('#jShot'); if(b) b.disabled=false; const mm0=$('#jmsg'); if(mm0&&mm0.querySelector('.jcode')) mm0.innerHTML='';
    const cam=$('#jCam'); if(cam) cam.insertAdjacentHTML('beforeend','<div class="fbadge" id="jFace">Đang tìm khuôn mặt…</div>');
    J.hits=0; ensureFaceApi().then(()=>{ if(J.stream) J.timer=setInterval(jTick,800); }).catch(()=>{ const f=$('#jFace'); if(f) f.textContent='Bấm “Chụp & điểm danh”'; });
  }catch(e){ jCamFail(e); }
}
async function jTick(){
  const v=$('#jv'); if(!v||!v.videoWidth||J.busy||J.step!==2||J.ticking) return; J.ticking=true;
  try{ const r=await faceapi.detectAllFaces(v,faceOpts()), f=$('#jFace'), o=document.querySelector('.cam .oval');
    if(r.length){ J.hits++; if(f){ f.textContent='Đã nhận diện khuôn mặt ✓'; f.className='fbadge ok'; } if(o) o.classList.add('ok'); if(J.hits>=3){ J.ticking=false; jCapture(true); return; } }
    else{ J.hits=0; if(f){ f.textContent='Đang tìm khuôn mặt… hãy nhìn thẳng vào camera'; f.className='fbadge'; } if(o) o.classList.remove('ok'); }
  }catch(e){}
  J.ticking=false;
}
function jFail(t){ J.tries++; if(J.tries>=6){ J.lock=Date.now()+60000; J.tries=0; } return t; }
async function jVerifyInfo(){
  const m=$('#jmsg'), say=t=>{ m.innerHTML='<div class="err">'+t+'</div>'; };
  if(Date.now()<J.lock){ say('Nhập sai quá nhiều lần, chờ '+Math.ceil((J.lock-Date.now())/1000)+' giây.'); return; }
  const sid=$('#jName').value, dob=$('#jDob').value, school=$('#jSchool').value.trim();
  if(!sid||!dob||!school){ say('Vui lòng chọn tên, nhập ngày sinh và trường.'); return; }
  const st=J.roster.find(x=>x.id===sid); if(!st.vhash){ say('Học sinh này chưa có thông tin ngày sinh/trường trong hệ thống. Hãy báo trợ giảng.'); return; }
  const h=await vhash(sid,dob,school); if(h!==st.vhash){ say(jFail('Thông tin chưa đúng. Kiểm tra lại ngày sinh và trường.')); return; }
  J.sid=sid; J.step=2; J.msg=''; J.tries=0; renderJoin();
}
async function jCapture(auto){
  const v=$('#jv'); if(!v||!v.videoWidth){ if(!auto) toast('Camera chưa sẵn sàng','err'); return; }
  if(J.busy) return; J.busy=true; const btn=$('#jShot'); if(btn) btn.disabled=true; const say=(t,k)=>{ const m=$('#jmsg'); if(m) m.innerHTML='<div class="'+(k||'err')+'">'+t+'</div>'; };
  const cv=document.createElement('canvas'); cv.width=v.videoWidth; cv.height=v.videoHeight; cv.getContext('2d').drawImage(v,0,0); let image=cv.toDataURL('image/jpeg',0.92);
  say('Đang kiểm tra khuôn mặt…','ok'); let flag='';
  try{
    // Chỉ cần dò thấy có khuôn mặt là chấp nhận (không đối chiếu danh tính)
    let n=null; try{ await ensureFaceApi(); n=(await faceapi.detectAllFaces(cv,faceOpts())).length; }catch(e){ n=null; flag='model_unavailable'; }
    if(n===0){ say('Chưa thấy khuôn mặt. Hãy nhìn thẳng vào camera, đủ sáng và không che mặt.'); if(btn) btn.disabled=false; J.busy=false; J.hits=0; return; }
    const ref=C('attendance').doc(J.id), cur=await ref.get(), old=((cur.data()||{}).marks||{})[J.sid], ts=Date.now(), late=ts>times(J.doc).s.getTime()+(J.doc.late!=null?J.doc.late:10)*60000;
    if(((cur.data()||{}).revoked||{})[J.sid]){ jStop(); J.step=3; J.busy=false; jShell('<div class="center"><div class="logo">'+ic('alert')+'</div><h1>Điểm danh đã bị thu hồi</h1><div class="sub">Trợ giảng đã thu hồi điểm danh của em ở buổi này. Hãy liên hệ trợ giảng để được điểm danh lại.</div></div>'); return; }
    if(!(old&&(old.s==='P'||old.s==='L'))){ const mark={s:late?'L':'P',t:ts,m:'online'}; if(flag) mark.f=flag; await ref.update({['marks.'+J.sid]:mark}); }
    try{ await C('proofs').doc(J.id+'_'+J.sid).set({docId:J.id,sid:J.sid,img:image,ts,flag:flag||null}); }catch(e){}
    let link=null; try{ link=(await C('links').doc(J.id).get()).data(); }catch(e){}
    jStop(); J.step=3; const st=J.roster.find(x=>x.id===J.sid);
    jShell('<div class="center"><div class="tick">'+ic('check')+'</div><h1>Điểm danh thành công</h1><div class="sub">'+esc(st.name)+' · '+fmtHM(ts)+(late?' (muộn)':'')+'</div>'+(link&&link.url?'<a class="btn pri full" target="_blank" rel="noopener" href="'+esc(link.url)+'" style="text-decoration:none">'+ic('video')+' Vào phòng học</a>':'<div class="err" style="background:var(--ambs);color:#92400e">Giảng viên chưa cập nhật link phòng học.</div>')+'</div>');
  }catch(e){ say('Lỗi: '+esc(e.message||e)); if(btn) btn.disabled=false; }
  J.busy=false;
}

      if(su){ await C('settings').doc('main').set({centerName:BR.name,faceThreshold:0.5,early:15,late:10,createdAt:Date.now()},{merge:true}); await rdb.ref('public/brand').set({name:BR.name}); }

function renderJoin(soft){

  const f=['jD','jMo','jY'].map(i=>document.getElementById(i)),L=[2,2,4];
  f.forEach((e,i)=>{ e.oninput=()=>{ e.value=e.value.replace(/\D/g,'').slice(0,L[i]); if(i<2&&e.value.length===1&&+e.value>[3,1][i]) e.value='0'+e.value; if(i<2&&e.value.length===2) f[i+1].focus(); else if(i===2&&e.value.length===4) $('#jSchool').focus(); }; e.onkeydown=ev=>{ if(ev.key==='Backspace'&&!e.value&&i>0) f[i-1].focus(); }; });
  f[0].focus();
}
function jSearch(v){ const q=norm(v),b=$('#jRes'); if(!q){ b.innerHTML=''; return; }
  const r=J.roster.filter(s=>norm(s.name).includes(q)).slice(0,6);
  b.innerHTML=r.length?'<div class="jr">'+r.map(s=>'<button class="jri" onclick="J.pick=\''+s.id+'\';renderJoin()"><span class="avatar">'+esc(givenName(s.name).charAt(0))+'</span><b>'+esc(s.name)+'</b>'+(J.cids&&J.cids.length>1?'<span class=\"small muted\">'+esc(jCls(s))+'</span>':'')+ic('arrowR')+'</button>').join('')+'</div>':'<div class="empty small">Không tìm thấy tên này. Kiểm tra lại chính tả hoặc báo trợ giảng.</div>'; }
async function jVerifyInfo(){ const m=$('#jmsg'),say=t=>{ m.innerHTML='<div class="err">'+t+'</div>'; };
  if(Date.now()<J.lock){ say('Nhập sai quá nhiều lần, chờ '+Math.ceil((J.lock-Date.now())/1000)+' giây.'); return; }
  const sid=J.pick,dd=+val('jD'),mo=+val('jMo'),yy=+val('jY'),school=val('jSchool');
  const zero=dd===0&&mo===0&&yy===0; if(!(zero||(dd>=1&&dd<=31&&mo>=1&&mo<=12&&yy>=1980&&yy<=new Date().getFullYear()))||!school){ say('Vui lòng nhập đủ ngày, tháng, năm sinh hợp lệ và tên trường.'); return; }
  const st=J.roster.find(x=>x.id===sid); if(!st.vhash){ say('Học sinh này chưa có ngày sinh/trường trong hệ thống. Hãy báo trợ giảng.'); return; }
  if(await vhash(sid,zero?'0000-00-00':yy+'-'+pad(mo)+'-'+pad(dd),school)!==st.vhash){ say(jFail('Thông tin chưa đúng. Kiểm tra lại ngày sinh và trường.')); return; }
  J.sid=sid; J.step=2; J.msg=''; J.tries=0; renderJoin(); }

   '<div class="cols2"><div class="field"><label>Mở điểm danh trước (phút)</label><input class="inp" id="ssEarly" type="number" value="'+(d.early!=null?d.early:(S.settings.early!=null?S.settings.early:15))+'"></div><div class="field"><label>Tính muộn sau (phút)</label><input class="inp" id="ssLate" type="number" value="'+(d.late!=null?d.late:(S.settings.late!=null?S.settings.late:10))+'"></div></div>'+

async function ssMove(oldId,cid,r,list,base,url){ const newId=cid+'_'+r.date, old=S.att[oldId]||S.onl[oldId]||{}, oldDate=old.date||oldId.slice(cid.length+1);

  const host=sessionFor(cid,r.date); if(host&&host.id!==newId&&(host.merged||[]).includes(cid)) throw new Error('Lớp này đang được gộp vào buổi của lớp '+className(host.classId)+' ngày này. Hãy chọn lớp đó làm lớp chính.');
  const marks=old.marks||{}, onM={}, keepM={}; Object.keys(marks).forEach(k=>{ (marks[k].m==='online'?onM:keepM)[k]=marks[k]; });

async function saveSession(oldId){
  const cid=val('ssClass')||($('#ssClass')&&$('#ssClass').value), url=val('ssUrl'), list=Array.from(document.querySelectorAll('.mgc:checked')).map(x=>x.value), rows=ssRead().filter(r=>r.date);

  if(rows.some(r=>!r.start||!r.end||r.end<=r.start)){ toast('Giờ kết thúc phải sau giờ bắt đầu','err'); return; }
  if(new Set(rows.map(r=>r.date)).size!==rows.length){ toast('Mỗi ngày chỉ có một buổi online của lớp','err'); return; }
  if(url&&!/^https?:\/\//i.test(url)){ toast('Link phải bắt đầu bằng http(s)://','err'); return; }

window.vOnline=vOnline=function(){ const p=S.P.onl, all=Object.values(S.onl), td=dk(new Date()), gs=groups(), up=gs.filter(g=>g.live), dn=gs.filter(g=>!g.live), done=all.filter(o=>phase(o)==='ended'); let rate=0,n=0; done.forEach(o=>{ const t=sessionStudents(o).length; if(t){ rate+=joinedN(o)/t; n++; } });

/* ---- tạo / sửa: cả đợt trong một cửa sổ ---- */
window.ssRows=ssRows=function(a){ return a.map((d,i)=>'<div class="row" style="gap:6px;margin-bottom:6px"><input class="inp ssD" type="date" data-id="'+(d.id||'')+'" value="'+d.date+'" style="flex:1"><input class="inp ssS" type="time" value="'+d.start+'" style="width:112px"><input class="inp ssE" type="time" value="'+d.end+'" style="width:112px">'+(a.length>1?'<button class="btn sm red" onclick="ssDelRow('+i+')">✕</button>':'')+'</div>').join(''); };

   '<details class="mt8"><summary class="small link" style="cursor:pointer">Thêm nhanh nhiều ngày theo lịch tuần</summary><div class="cols2 mt8"><div class="field"><label>Từ ngày</label><input class="inp" id="ssGF" type="date"></div><div class="field"><label>Đến ngày</label><input class="inp" id="ssGT" type="date"></div><div class="field"><label>Bắt đầu</label><input class="inp" id="ssGS" type="time" value="18:00"></div><div class="field"><label>Kết thúc</label><input class="inp" id="ssGE" type="time" value="19:30"></div></div><div class="row wrap" style="gap:10px">'+[1,2,3,4,5,6,0].map(w=>'<label class="chk"><input type="checkbox" class="ssW" value="'+w+'"> '+(w?'T'+(w+1):'CN')+'</label>').join('')+'</div><button class="btn sm mt8" onclick="ssGen()">Thêm các ngày này</button></details></div>'+
   '<div class="field"><label>Link phòng học (Google Meet / Zoom / Teams…)</label><input class="inp" id="ssUrl" placeholder="https://meet.google.com/…" value="'+esc(link.url||c.onlineUrl||'')+'"></div>'+
   '<div class="cols2"><div class="field"><label>Mở điểm danh trước (phút)</label><input class="inp" id="ssEarly" type="number" value="'+(f.early!=null?f.early:(S.settings.early!=null?S.settings.early:15))+'"></div><div class="field"><label>Tính muộn sau (phút)</label><input class="inp" id="ssLate" type="number" value="'+(f.late!=null?f.late:(S.settings.late!=null?S.settings.late:10))+'"></div></div>'+
   '<div class="small muted">Link vào lớp không chứa ngày: dù học nhiều ngày, học sinh chỉ dùng 1 link duy nhất. Mỗi ngày học sinh mở lại link cũ, hệ thống tự mở điểm danh đúng buổi của ngày đó. (Khác với lớp online cố định đặt trong Sửa lớp học.)</div>',
   (key?'<button class="btn red" onclick="delSeries(\''+key+'\')">Huỷ cả đợt</button>':'')+'<button class="btn" onclick="closeModal()">Đóng</button><button class="btn pri" id="srSave" onclick="saveSeries(\''+key+'\')">Lưu</button>'); };
window.saveSeries=async function(key){
  const cid=val('ssClass')||($('#ssClass')&&$('#ssClass').value), url=val('ssUrl'), list=Array.from(document.querySelectorAll('.mgc:checked')).map(x=>x.value), rows=ssRead().filter(r=>r.date);
  if(!cid||!rows.length){ toast('Thiếu lớp hoặc ngày','err'); return; }
  if(rows.some(r=>!r.start||!r.end||r.end<=r.start)){ toast('Giờ kết thúc phải sau giờ bắt đầu','err'); return; }
  if(new Set(rows.map(r=>r.date)).size!==rows.length){ toast('Mỗi ngày chỉ có một buổi online của lớp','err'); return; }
  if(url&&!/^https?:\/\//i.test(url)){ toast('Link phải bắt đầu bằng http(s)://','err'); return; }
  const code=key||rnd(), base={title:val('ssTitle'),early:+val('ssEarly')||0,late:+val('ssLate')||0,series:code}, old=key?grpDays(key):[], keep=new Set(rows.map(r=>r.id).filter(Boolean)), b=$('#srSave'); if(b) b.disabled=true;
  try{
    for(const r of rows){ const id=cid+'_'+r.date, ex=S.onl[id]; if(ex&&ex.id!==r.id) throw new Error('Ngày '+fmtD(r.date)+' đã có buổi online khác của lớp này');
      const host=sessionFor(cid,r.date); if(host&&host.id!==id&&(host.merged||[]).includes(cid)) throw new Error('Lớp này đang được gộp vào buổi của lớp '+className(host.classId)+' ngày '+fmtD(r.date)+'. Hãy chọn lớp đó làm lớp chính.'); }
    for(const d of old){ if(keep.has(d.id)) continue;
      await applyMerge(d.classId,d.date,[]); try{ const ps=await C('proofs').where('docId','==',d.id).get(); await Promise.all(ps.docs.map(x=>C('proofs').doc(x.id).delete())); }catch(e){}
      await C('attendance').doc(d.id).delete(); if(d.id!==code) await C('links').doc(d.id).delete(); }
    for(const r of rows){ const id=cid+'_'+r.date, od=r.id&&S.onl[r.id];
      if(od&&r.id!==id){ await ssMove(r.id,cid,r,list,base,url); continue; }
      await applyMerge(cid,r.date,list);
      await C('attendance').doc(id).set(Object.assign({classId:cid,date:r.date,online:true,start:r.start,end:r.end,createdBy:(od&&od.createdBy)||S.profile.name},base),{merge:true}); }
    const plat=ssPlat(url), dmap={}; for(const r of rows){ const id=cid+'_'+r.date; await C('links').doc(id).set({url,platform:plat,series:code}); dmap[r.date]={id,s:r.start,e:r.end}; }
    await C('links').doc(code).set({series:true,url,platform:plat,classId:cid,early:base.early,d:dmap});
    try{ log((key?'sửa':'tạo')+' đợt học online '+className(cid)+' ('+rows.length+' buổi)'); }catch(e){}
    closeModal(); if(!key) copyText(baseUrl()+'?join='+encodeURIComponent(code)); toast(rows.length>1?'Đã lưu đợt online '+rows.length+' buổi — 1 link chung':'Đã lưu buổi online','ok');
    if(S.view==='att'){ S.P.att.classId=cid; S.P.att.date=rows[0].date; render(); }
  }catch(e){ toast(e.message||String(e),'err'); if(b) b.disabled=false; } };
window.delSeries=async function(key){ const days=grpDays(key); if(!days.length) return;
  if(!confirm('Huỷ cả đợt học online'+(days.length>1?' ('+days.length+' buổi)':'')+'? Điểm danh và ảnh của các buổi sẽ bị xoá.')) return;
  try{ for(const d of days){ await applyMerge(d.classId,d.date,[]); try{ const ps=await C('proofs').where('docId','==',d.id).get(); await Promise.all(ps.docs.map(x=>C('proofs').doc(x.id).delete())); }catch(e){}
      await C('attendance').doc(d.id).delete(); await C('links').doc(d.id).delete(); }
    await C('links').doc(key).delete(); closeModal(); toast('Đã huỷ','ok'); }catch(e){ toast('Lỗi: '+e.message,'err'); } };
window.delSession=delSession=function(id){ const d=S.onl[id]; return delSeries(d?keyOf(d):id); };
/* ---- trang học sinh vào lớp: link không ngày, tự chọn buổi của hôm nay ---- */
const _jl0=jLegacyLoad;
async function serLoad(lk){ const ds=Object.keys(lk.d||{}).sort(); if(!ds.length) return null;
  const pk=ds.find(k=>phase({date:k,start:lk.d[k].s,end:lk.d[k].e,early:lk.early})!=='ended')||ds[ds.length-1], id=lk.d[pk].id; if(J.id===id&&J.doc) return false;
  const d=await C('attendance').doc(id).get(); if(!d.exists||!d.data().online) return null;
  J.id=id; J.doc=d.data(); J.cids=[J.doc.classId].concat(J.doc.merged||[]); await jLoadRoster(); return true; }
window.jLegacyLoad=jLegacyLoad=async function(){ let lk=null; try{ lk=(await C('links').doc(JOIN).get()).data(); }catch(e){}
  if(!(lk&&lk.d)) return _jl0();
  J.series=JOIN; if(await serLoad(lk)===null) return jErr('Không tìm thấy lớp online'); renderJoin();
  setInterval(async()=>{ if(J.step!==1) return; try{ const l=(await C('links').doc(JOIN).get()).data(); if(l&&l.d&&await serLoad(l)) renderJoin(); else if(J.step===1) renderJoin(true); }catch(e){} },30000); };
})();

<script>
/* ===================== MÃ LOG-IN: điểm danh không cần camera ===================== */
S.codes={};
(function(){ const i=NAV.findIndex(n=>n[0]==='online'); NAV.splice(i>=0?i+1:NAV.length-1,0,['codes',ic('lock'),'Mã log-in']); })();

/* ---------- phía học sinh ---------- */
function jCodeBox(){
  return '<div class="jcode"><div class="jct">'+ic('lock',16)+' Nhập Mã Log-in</div><div class="small muted mb8">Mã do trợ giảng cung cấp. Hãy liên hệ trợ giảng để lấy Log-in Code.</div><div id="jcmsg"></div><input class="inp" id="jCode" placeholder="NHẬP MÃ LOG-IN" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" onkeydown="if(event.key===\'Enter\')jCodeCheckin()"><button class="btn pri full mt8" id="jCodeBtn" onclick="jCodeCheckin()">'+ic('check',16)+' Xác nhận</button></div>';
}
function jCamFail(e){
  const m=$('#jmsg'); if(!m) return;
  const keep=($('#jCode')||{}).value||'', nm=(e&&e.name)||'';
  const noApi=!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  let t='Không mở được camera. Hãy cho phép quyền camera (trang cần chạy trên https).';
  if(nm==='NotFoundError'||nm==='DevicesNotFoundError'||nm==='OverconstrainedError') t='Không tìm thấy camera trên thiết bị này.';
  else if(nm==='NotReadableError'||nm==='TrackStartError') t='Camera đang được ứng dụng khác sử dụng. Hãy tắt ứng dụng đó rồi thử lại.';
  else if(noApi||window.isSecureContext===false) t='Trình duyệt này không mở được camera (trang cần chạy trên https). Hãy mở link bằng Chrome hoặc Safari.';
  m.innerHTML='<div class="err">'+t+'</div>'+
    '<button class="btn full" id="jRetry" onclick="jRetryCam()">'+ic('refresh',16)+' Xin lại quyền camera</button>'+
    '<div class="jtip mt8">Nếu trình duyệt không hỏi lại: nhấn biểu tượng ổ khoá cạnh thanh địa chỉ → chọn <b>Cho phép Camera</b>, rồi bấm nút trên. Nếu bạn đang truy cập trên Zalo/Facebook, hãy mở bằng Chrome hoặc Safari.</div>'+jCodeBox();
  const c=$('#jCode'); if(c&&keep) c.value=keep;
  const sh=$('#jShot'); if(sh) sh.disabled=true;
  try{ if(navigator.permissions&&navigator.permissions.query&&!J.pq){ navigator.permissions.query({name:'camera'}).then(p=>{ J.pq=p; p.onchange=()=>{ if(p.state==='granted'&&J.step===2&&!J.stream) jStartCam(); }; }).catch(()=>{}); } }catch(x){}
}
async function jRetryCam(){
  const b=$('#jRetry'); if(b){ b.disabled=true; b.innerHTML=ic('refresh',16)+' Đang xin quyền…'; }
  await jStartCam();
  const b2=$('#jRetry'); if(b2){ b2.disabled=false; b2.innerHTML=ic('refresh',16)+' Xin lại quyền camera'; }
}
function jRoomUrl(){ return J.fx?Promise.resolve((J.cl||{}).onlineUrl):C('links').doc(J.id).get().then(d=>(d.data()||{}).url).catch(()=>null); }
async function jCodeCheckin(){
  const inp=$('#jCode'), btn=$('#jCodeBtn'), say=(t,k)=>{ const x=$('#jcmsg'); if(x) x.innerHTML='<div class="'+(k||'err')+'">'+t+'</div>'; };
  if(J.busy||!inp) return;
  if(Date.now()<J.lock){ say('Nhập sai quá nhiều lần, chờ '+Math.ceil((J.lock-Date.now())/1000)+' giây.'); return; }
  const code=(inp.value||'').toUpperCase().replace(/\s+/g,'');
  if(!code){ say('Vui lòng nhập mã log-in.'); return; }
  if(!/^[A-Z0-9_-]{3,32}$/.test(code)){ say(jFail('Mã không đúng. Hãy kiểm tra lại.')); return; }
  J.busy=true; if(btn) btn.disabled=true; say('Đang kiểm tra mã…','ok');
  try{
    const cd=(await C('logincodes').doc(code).get()).data(), st=J.roster.find(x=>x.id===J.sid);
    if(!cd||cd.active===false){ say(jFail('Mã không đúng hoặc đã bị tắt.')); return; }
    if(cd.exp&&cd.exp<Date.now()){ say('Mã này đã hết hạn.'); return; }
    if(cd.max>0&&(cd.used||0)>=cd.max){ say('Mã này đã hết lượt sử dụng.'); return; }
    const cc=((st&&st.classIds)||[]).find(k=>(J.cids||[]).includes(k)&&(cd.classes||{})[k]===true);
    if(!cc){ say('Mã này không dùng cho lớp của em.'); return; }
    const ref=rdb.ref('attendance/'+J.id), cur=(await ref.get()).val(), ts=Date.now(), late=ts>times(J.doc).s.getTime()+(J.doc.late!=null?J.doc.late:10)*60000;
    if(((cur||{}).revoked||{})[J.sid]) return jBlocked();
    const old=((cur||{}).marks||{})[J.sid];
    if(old&&(old.s==='P'||old.s==='L')){ jDone(old.t||ts,old.s==='L',await jRoomUrl()); return; }
    if(J.fx&&!cur){ await ref.child('classId').set(J.cid); await ref.child('date').set(J.date); }
    const mark={s:late?'L':'P',t:ts,m:'online',cd:code,cc:cc}; if(J.fx) mark.rm=J.cid;
    const up={}; up['attendance/'+J.id+'/marks/'+J.sid]=mark; up['logincodes/'+code+'/used']=(cd.used||0)+1;
    try{ await rdb.ref().update(up); }
    catch(e){ say(/permission/i.test((e&&e.message)||'')?'Không điểm danh được: mã có thể vừa hết lượt hoặc hết hạn. Hãy thử lại hoặc báo trợ giảng.':'Lỗi: '+esc(e.message||e)); return; }
    try{ await C('proofs').doc(J.id+'_'+J.sid).set({docId:J.id,sid:J.sid,img:'',ts,flag:'code',cd:code}); }catch(e){}
    jDone(ts,late,await jRoomUrl());
  }catch(e){ say('Lỗi: '+esc(e.message||e)); }
  finally{ J.busy=false; if(btn) btn.disabled=false; }
}

function codeState(c){ if(c.active===false) return ['Đã tắt','pill-gray']; if(c.exp&&c.exp<Date.now()) return ['Hết hạn','pill-red']; if(c.max>0&&(c.used||0)>=c.max) return ['Hết lượt','pill-amber']; return ['Đang hoạt động','pill-grn']; }
const fmtDT=ts=>fmtD(dk(new Date(ts)))+' '+fmtHM(ts);
function vCodes(){
